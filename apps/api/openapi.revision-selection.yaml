openapi: 3.1.0
info:
  title: EVAVO Art Studio Repaired Family Revision Selection API
  version: 0.1.0
  description: >-
    Compile-only contracts for converting two or more fully verified repaired
    sprite-family revisions into one later candidate-selection job. HTTP routes
    do not read artifacts, compare images, select candidates, promote masters or
    update approved references.
servers:
  - url: http://127.0.0.1:4100
    description: Local standalone Art Studio control plane
security: []
tags:
  - name: Revision Selection Bridge
paths:
  /v1/repair-revision-selection-protocol:
    get:
      tags: [Revision Selection Bridge]
      operationId: getRepairedFamilyRevisionSelectionProtocol
      summary: Describe the revision-selection evidence boundary
      responses:
        "200":
          description: Revision-selection bridge protocol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionSelectionProtocol"
  /v1/repair-revision-selections/validate:
    post:
      tags: [Revision Selection Bridge]
      operationId: validateRepairedFamilyRevisionSelection
      summary: Validate one revision-selection bridge request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionSelectionRequest"
      responses:
        "200":
          description: Normalized bridge request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedRevisionSelectionRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/repair-revision-selections/compile:
    post:
      tags: [Revision Selection Bridge]
      operationId: compileRepairedFamilyRevisionSelectionJob
      summary: Compile immutable revision evidence into a durable bridge job
      description: >-
        The later capability-scoped worker verifies every revision, candidate,
        reference, source manifest and full family result before it emits bridge
        evidence and a separate art.candidate.select job. This route does not
        access the artifact store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionSelectionRequest"
      responses:
        "200":
          description: Normalized request and durable bridge job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledRevisionSelectionJob"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  schemas:
    ArtifactId:
      type: string
      pattern: "^artifact_[a-f0-9]{64}$"
    SelectionProfile:
      type: string
      enum: [sprite-identity, sprite-motion, environment, ui, custom]
    SelectionPolicy:
      type: object
      required: [profile]
      additionalProperties: true
      properties:
        profile:
          $ref: "#/components/schemas/SelectionProfile"
        allowAutomaticSelection:
          type: boolean
          default: false
        maximumTranslationPixels:
          type: integer
          minimum: 0
          maximum: 64
        maximumEdgeDistancePixels:
          type: number
          minimum: 1
          maximum: 256
        minimumOverallScore:
          type: number
          minimum: 0
          maximum: 1
        minimumWinnerMargin:
          type: number
          minimum: 0
          maximum: 1
        metrics:
          type: array
          items:
            type: object
            additionalProperties: true
        externalEvidence:
          type: array
          items:
            type: object
            additionalProperties: true
    RevisionSelectionRequest:
      type: object
      required: [schemaVersion, bridgeId, revisionEvidenceArtifactIds]
      additionalProperties: false
      properties:
        schemaVersion:
          const: "1.0"
        bridgeId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        revisionEvidenceArtifactIds:
          type: array
          minItems: 2
          maxItems: 32
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ArtifactId"
        externalEvidenceArtifactIds:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ArtifactId"
        policy:
          $ref: "#/components/schemas/SelectionPolicy"
        metadata: true
    NormalizedRevisionSelectionRequest:
      allOf:
        - $ref: "#/components/schemas/RevisionSelectionRequest"
        - type: object
          required:
            - protocolVersion
            - externalEvidenceArtifactIds
            - policy
          properties:
            protocolVersion:
              const: "2026-07-30.1"
    RuntimeJob:
      type: object
      required:
        - queue
        - kind
        - idempotencyKey
        - payload
        - inputArtifacts
        - requiredCapabilities
      additionalProperties: true
      properties:
        queue:
          const: selection
        kind:
          const: art.repair.prepare-revision-selection
        idempotencyKey:
          type: string
        payload:
          $ref: "#/components/schemas/NormalizedRevisionSelectionRequest"
        inputArtifacts:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ArtifactId"
        requiredCapabilities:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - repair.revision-selection
              - artifacts.store
              - evidence.bundle
          example:
            - repair.revision-selection
            - artifacts.store
            - evidence.bundle
        maximumAttempts:
          const: 1
        leaseDurationMs:
          type: integer
          minimum: 1000
        timeoutMs:
          type: integer
          minimum: 1000
    CompiledRevisionSelectionJob:
      type: object
      required:
        - schemaVersion
        - request
        - requestSha256
        - executionMode
        - runtimeJob
      properties:
        schemaVersion:
          const: "1.0"
        request:
          $ref: "#/components/schemas/NormalizedRevisionSelectionRequest"
        requestSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        executionMode:
          const: durable-worker-or-deliberate-local-run
        runtimeJob:
          $ref: "#/components/schemas/RuntimeJob"
    RevisionSelectionProtocol:
      type: object
      required:
        - schemaVersion
        - protocolVersion
        - input
        - enforcedSelectionPolicy
        - durablePreparationJob
        - laterRankingJob
        - rules
      properties:
        schemaVersion:
          const: "1.0"
        protocolVersion:
          const: "2026-07-30.1"
        input:
          type: object
        enforcedSelectionPolicy:
          type: object
        durablePreparationJob:
          const: art.repair.prepare-revision-selection
        laterRankingJob:
          const: art.candidate.select
        rules:
          type: array
          items: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: true
  responses:
    ValidationError:
      description: Invalid revision-selection bridge request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
