openapi: 3.1.0
info:
  title: EVAVO Art Studio Layered Sprite Family API
  version: 0.1.0
  description: >-
    Compile-only contracts for validating layered sprite-family manifests and
    creating durable verification jobs. HTTP handlers do not read image
    artifacts, reconstruct frames, execute providers, update approved
    references, or perform atlas delivery.
servers:
  - url: http://127.0.0.1:4100
    description: Local standalone Art Studio control plane
security: []
tags:
  - name: Sprite Families
paths:
  /v1/sprite-family-protocol:
    get:
      tags: [Sprite Families]
      operationId: getSpriteFamilyProtocol
      summary: List layer roles, source policies, blend modes, and verification rules
      responses:
        "200":
          description: Layered sprite-family protocol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpriteFamilyProtocol"
  /v1/sprite-families/validate:
    post:
      tags: [Sprite Families]
      operationId: validateSpriteFamilyManifest
      summary: Validate and normalize one layered sprite-family manifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpriteFamilyManifest"
      responses:
        "200":
          description: Normalized manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedSpriteFamilyManifest"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/sprite-families/compile:
    post:
      tags: [Sprite Families]
      operationId: compileSpriteFamilyVerificationJob
      summary: Compile a manifest into a capability-scoped durable worker job
      description: >-
        Every layer and declared composite artifact is copied into
        inputArtifacts. The worker later verifies immutable hashes, declared
        occlusion, layer registration, composite parity, identity continuity,
        adjacent frames, and loop closure. This route is durable-worker-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpriteFamilyManifest"
      responses:
        "200":
          description: Normalized manifest and durable verification job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledSpriteFamilyJob"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  schemas:
    ArtifactId:
      type: string
      pattern: "^artifact_[a-f0-9]{64}$"
    Point:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x: { type: number }
        y: { type: number }
    SpriteLayerRole:
      type: string
      enum:
        - identity-core
        - costume
        - hair
        - shadow
        - equipment
        - weapon
        - effect
        - emission
        - normal
        - collision
        - occlusion
        - guide
    SpriteLayerSourcePolicy:
      type: string
      enum:
        - per-frame
        - linked-cel
        - static-family
        - engine-sidecar
        - guide-only
    SpriteLayerBlendMode:
      type: string
      enum: [normal, add, multiply, screen]
    SpriteLayerDefinition:
      type: object
      required: [id, role, sourcePolicy, zIndex]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        role:
          $ref: "#/components/schemas/SpriteLayerRole"
        sourcePolicy:
          $ref: "#/components/schemas/SpriteLayerSourcePolicy"
        required: { type: boolean }
        contributesToComposite: { type: boolean }
        contributesToIdentity: { type: boolean }
        mustRemainSeparate: { type: boolean }
        zIndex:
          type: integer
          minimum: -10000
          maximum: 10000
        blendMode:
          $ref: "#/components/schemas/SpriteLayerBlendMode"
        minimumVisibleFraction:
          type: number
          minimum: 0
          maximum: 1
        registrationTolerancePixels:
          type: number
          minimum: 0
          maximum: 256
        allowedOccludedBy:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
        occludes:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
    SpriteFrameLayer:
      type: object
      required: [layerId, artifactId]
      additionalProperties: false
      properties:
        layerId: { type: string }
        artifactId:
          $ref: "#/components/schemas/ArtifactId"
        offset:
          $ref: "#/components/schemas/Point"
        opacity:
          type: number
          minimum: 0
          maximum: 1
        linkedFromFrameId: { type: string }
        variantId: { type: string }
    SpriteFamilyFrame:
      type: object
      required:
        - id
        - animation
        - direction
        - frameIndex
        - globalFrameIndex
        - durationMs
        - pivot
        - layers
      additionalProperties: false
      properties:
        id: { type: string }
        animation: { type: string }
        direction: { type: string }
        frameIndex:
          type: integer
          minimum: 0
        globalFrameIndex:
          type: integer
          minimum: 0
        durationMs:
          type: number
          exclusiveMinimum: 0
        pivot:
          $ref: "#/components/schemas/Point"
        baseline: { type: number }
        groundContact: { type: boolean }
        layers:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/SpriteFrameLayer"
        declaredCompositeArtifactId:
          $ref: "#/components/schemas/ArtifactId"
        intentionalDuplicateOf: { type: string }
    SpriteFamilyPolicy:
      type: object
      required: [identityReferenceFrameId]
      additionalProperties: false
      properties:
        identityReferenceFrameId: { type: string }
        requireDeclaredComposite:
          type: boolean
          default: true
        requireReferenceLineage:
          type: boolean
          default: true
        requireQualityPassed:
          type: boolean
          default: true
        alphaVisibleThreshold:
          type: integer
          minimum: 1
          maximum: 255
        maximumInputBytes:
          type: integer
          minimum: 1024
          maximum: 536870912
        maximumPixels:
          type: integer
          minimum: 1
          maximum: 67108864
        maximumFrames:
          type: integer
          minimum: 1
          maximum: 4096
        decodeConcurrency:
          type: integer
          minimum: 1
          maximum: 16
        maximumTranslationPixels:
          type: integer
          minimum: 0
          maximum: 64
        maximumEdgeDistancePixels:
          type: number
          exclusiveMinimum: 0
          maximum: 256
        pivotTolerancePixels:
          type: number
          minimum: 0
          maximum: 128
        baselineTolerancePixels:
          type: number
          minimum: 0
          maximum: 128
        groundContactTolerancePixels:
          type: number
          minimum: 0
          maximum: 128
        minimumCanonicalVisibleAreaSimilarity:
          type: number
          minimum: 0
          maximum: 1
        minimumCanonicalPaletteSimilarity:
          type: number
          minimum: 0
          maximum: 1
        minimumCanonicalCentroidSimilarity:
          type: number
          minimum: 0
          maximum: 1
        minimumAdjacentVisibleAreaSimilarity:
          type: number
          minimum: 0
          maximum: 1
        minimumAdjacentPaletteSimilarity:
          type: number
          minimum: 0
          maximum: 1
        minimumAdjacentCentroidSimilarity:
          type: number
          minimum: 0
          maximum: 1
        minimumLoopClosureSimilarity:
          type: number
          minimum: 0
          maximum: 1
        compositeChannelTolerance:
          type: integer
          minimum: 0
          maximum: 255
        maximumCompositeMeanError:
          type: number
          minimum: 0
          maximum: 255
        maximumCompositeMismatchFraction:
          type: number
          minimum: 0
          maximum: 1
    SpriteFamilyManifest:
      type: object
      required:
        - schemaVersion
        - familyId
        - canvas
        - layerDefinitions
        - frames
        - policy
      additionalProperties: false
      properties:
        schemaVersion:
          const: "1.0"
        familyId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        canvas:
          type: object
          required: [width, height]
          additionalProperties: false
          properties:
            width:
              type: integer
              minimum: 1
              maximum: 8192
            height:
              type: integer
              minimum: 1
              maximum: 8192
        layerDefinitions:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/SpriteLayerDefinition"
        frames:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            $ref: "#/components/schemas/SpriteFamilyFrame"
        policy:
          $ref: "#/components/schemas/SpriteFamilyPolicy"
        metadata: true
    NormalizedSpriteFamilyManifest:
      allOf:
        - $ref: "#/components/schemas/SpriteFamilyManifest"
        - type: object
          required: [protocolVersion]
          properties:
            protocolVersion:
              const: "2026-07-30.1"
    RuntimeJob:
      type: object
      required:
        - queue
        - kind
        - idempotencyKey
        - payload
        - inputArtifacts
        - requiredCapabilities
      additionalProperties: true
      properties:
        queue:
          const: selection
        kind:
          const: sprite.family.verify
        idempotencyKey:
          type: string
        payload:
          $ref: "#/components/schemas/NormalizedSpriteFamilyManifest"
        inputArtifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ArtifactId"
        requiredCapabilities:
          type: array
          minItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - sprite.family.verify
              - media.layer-compose
              - selection.compare
              - evidence.bundle
          example:
            - sprite.family.verify
            - media.layer-compose
            - selection.compare
            - evidence.bundle
        maximumAttempts:
          type: integer
          minimum: 1
        leaseDurationMs:
          type: integer
          minimum: 1000
        timeoutMs:
          type: integer
          minimum: 1000
    CompiledSpriteFamilyJob:
      type: object
      required:
        - schemaVersion
        - manifest
        - manifestSha256
        - executionMode
        - runtimeJob
      properties:
        schemaVersion:
          const: "1.0"
        manifest:
          $ref: "#/components/schemas/NormalizedSpriteFamilyManifest"
        manifestSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        executionMode:
          const: durable-worker-only
        runtimeJob:
          $ref: "#/components/schemas/RuntimeJob"
    SpriteFamilyProtocol:
      type: object
      required:
        - schemaVersion
        - protocolVersion
        - layerRoles
        - sourcePolicies
        - blendModes
        - rules
      properties:
        schemaVersion:
          const: "1.0"
        protocolVersion:
          const: "2026-07-30.1"
        layerRoles:
          type: array
          items:
            $ref: "#/components/schemas/SpriteLayerRole"
        sourcePolicies:
          type: array
          items:
            $ref: "#/components/schemas/SpriteLayerSourcePolicy"
        blendModes:
          type: array
          items:
            $ref: "#/components/schemas/SpriteLayerBlendMode"
        rules:
          type: array
          items: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: true
  responses:
    ValidationError:
      description: Invalid layered sprite-family manifest
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
