name: Godot 4.7.1 Character Profile

on:
  push:
    branches:
      - "upgrade/godot-4-7-1-character-profile"
    paths:
      - "packages/art-direction/src/**"
      - "packages/art-direction/test/**"
      - "apps/cli/src/**"
      - ".github/workflows/godot-4-7-1-character-profile.yml"
  pull_request:
    paths:
      - "packages/art-direction/src/**"
      - "packages/art-direction/test/**"
      - "apps/cli/src/**"
      - ".github/workflows/godot-4-7-1-character-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-4-7-1-character-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Typecheck Art Direction
        run: pnpm --filter @evavo/art-direction typecheck

      - name: Build and test Art Direction
        run: pnpm --filter @evavo/art-direction test

      - name: Build domain dependency closure
        run: pnpm run build:domain

      - name: Build general Art Studio CLI
        run: pnpm --filter @evavo/art-studio-cli build

      - name: Prove validation leaves source clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          STATUS="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "${STATUS}" ]; then
            printf 'Unexpected validation byproducts:\n%s\n' "${STATUS}" >&2
            exit 1
          fi
