name: Rally 2.5D Engine Smoke Art Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-25d-engine-smoke-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Run deterministic Engine Smoke tests
        run: node --test scripts/game-art-production/rally-25d-engine-smoke-jobs.test.mjs
      - name: Compile and independently verify the provider job session
        shell: bash
        run: |
          set -euo pipefail
          session="${RUNNER_TEMP}/engine-smoke-session.json"
          node scripts/game-art-production/rally-25d-engine-smoke-jobs.mjs compile config/game-art-production/vfx/engine-smoke-production-v1.json "${session}"
          node scripts/game-art-production/rally-25d-engine-smoke-jobs.mjs verify config/game-art-production/vfx/engine-smoke-production-v1.json "${session}"
      - name: Confirm source stayed clean
        run: git diff --exit-code
