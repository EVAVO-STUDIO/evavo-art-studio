name: EVA dense-motion work-order validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eva-dense-motion-work-order.yml"
      - "scripts/project-art/eva-dense-motion-work-order-data.mjs"
      - "scripts/project-art/eva-dense-motion-work-order-common.mjs"
      - "scripts/project-art/eva-dense-motion-work-order.mjs"
      - "scripts/compile-project-art-eva-dense-motion-work-order.mjs"
      - "scripts/check-project-art-eva-dense-motion-work-order.mjs"
      - "scripts/test-project-art-eva-dense-motion-work-order.mjs"
      - "scripts/project-art/eva-dense-motion-release-evidence.mjs"
      - "scripts/compile-project-art-eva-dense-motion-release-evidence.mjs"
      - "scripts/test-project-art-eva-dense-motion-release-evidence.mjs"
      - "scripts/project-art/avatar-final-pass-provider-candidate-png.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/avatar-sequence-common.mjs"
      - "scripts/compile-project-art-avatar-sequence.mjs"
      - "scripts/compile-project-art-loop-closure.mjs"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_WORK_ORDER.md"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_RELEASE_EVIDENCE.md"
  pull_request:
    paths:
      - ".github/workflows/eva-dense-motion-work-order.yml"
      - "scripts/project-art/eva-dense-motion-work-order-data.mjs"
      - "scripts/project-art/eva-dense-motion-work-order-common.mjs"
      - "scripts/project-art/eva-dense-motion-work-order.mjs"
      - "scripts/compile-project-art-eva-dense-motion-work-order.mjs"
      - "scripts/check-project-art-eva-dense-motion-work-order.mjs"
      - "scripts/test-project-art-eva-dense-motion-work-order.mjs"
      - "scripts/project-art/eva-dense-motion-release-evidence.mjs"
      - "scripts/compile-project-art-eva-dense-motion-release-evidence.mjs"
      - "scripts/test-project-art-eva-dense-motion-release-evidence.mjs"
      - "scripts/project-art/avatar-final-pass-provider-candidate-png.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/avatar-sequence-common.mjs"
      - "scripts/compile-project-art-avatar-sequence.mjs"
      - "scripts/compile-project-art-loop-closure.mjs"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_WORK_ORDER.md"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_RELEASE_EVIDENCE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-motion-work-order-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify EVA dense-motion work-order and release-evidence boundaries
        run: node scripts/check-project-art-eva-dense-motion-work-order.mjs

      - name: Verify validation leaves the repository clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
