name: Project Art Top Hat Real Provider Preflight

on:
  pull_request:
    paths:
      - "scripts/run-project-art-top-hat-real-provider-campaign.mjs"
      - "scripts/project-art/top-hat-pose-slot-production.mjs"
      - "scripts/project-art/top-hat-pose-slot-provider-*.mjs"
      - "scripts/run-project-art-top-hat-pose-*.mjs"
      - "scripts/test-project-art-top-hat-pose-*.mjs"
      - "scripts/test-project-art-top-hat-anchor-source-truth.mjs"
      - "config/production/top-hat-pose-bank-provider-human-authorization-v1.json"
      - ".github/workflows/project-art-top-hat-real-provider-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-art-top-hat-real-provider-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact provider dependency closure
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-worker build
          pnpm --filter @evavo/art-studio-worker typecheck

      - name: Verify passive six-slot source and authorization truth
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run-project-art-top-hat-real-provider-campaign.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import {
            TOP_HAT_ADMITTED_BODY_ANCHORS,
            TOP_HAT_POSE_SLOT_RUNTIME_PIN,
          } from './scripts/project-art/top-hat-pose-slot-production.mjs';
          import {
            createProjectArtTopHatPoseSlotProviderPackageRequest,
            compileProjectArtTopHatPoseSlotProviderPackage,
          } from './scripts/project-art/top-hat-pose-slot-provider-package.mjs';

          const authorization = JSON.parse(
            readFileSync(
              './config/production/top-hat-pose-bank-provider-human-authorization-v1.json',
              'utf8',
            ),
          );
          if (
            authorization.schema !== 'evavo.project-art-top-hat-real-provider-human-authorization.v1' ||
            authorization.actorClass !== 'human' ||
            authorization.maximumProviderCalls !== 6 ||
            authorization.providerAdapterId !== 'openai-gpt-image' ||
            authorization.model !== 'gpt-image-1' ||
            authorization.candidateApprovalGranted !== false ||
            authorization.publicationGranted !== false ||
            authorization.runtimeActivationGranted !== false
          ) throw new Error('Top Hat human authorization contract drifted.');

          const expectedRepository = 'EVAVO-STUDIO/evavo-avatar-runtime';
          const expectedCommit = '524066fc95fee329e1a20f7c9aa7d805d94c8cc8';
          const expectedTree = 'db8af48a71f1a2708c99f5cea220c7e7dd324e84';
          const expectedHashes = [
            '92cb290246a7629024dcb7768f4119f6a139d9c9f59e3d0545563e1f5b35575a',
            '476ff3c1ca56e1f4ec622b94abfebf35a94b593a388177b3d9b3bce9347ed9a5',
            'bd64eba4f22fd2d524ee7eb1826b2cc9cc9723cff5a764e36946d568b8cfd358',
          ];
          if (
            TOP_HAT_POSE_SLOT_RUNTIME_PIN.repository !== expectedRepository ||
            TOP_HAT_POSE_SLOT_RUNTIME_PIN.commit !== expectedCommit ||
            TOP_HAT_POSE_SLOT_RUNTIME_PIN.tree !== expectedTree ||
            TOP_HAT_ADMITTED_BODY_ANCHORS.length !== 3 ||
            TOP_HAT_ADMITTED_BODY_ANCHORS.some((anchor, index) =>
              anchor.repository !== expectedRepository ||
              anchor.commit !== expectedCommit ||
              anchor.tree !== expectedTree ||
              anchor.sha256 !== expectedHashes[index] ||
              anchor.width !== 1024 ||
              anchor.height !== 1536 ||
              anchor.pixelFormat !== 'rgba8-straight' ||
              anchor.approvalStatus !== 'approved-production-anchor'
            )
          ) throw new Error('Top Hat admitted Runtime anchor contract drifted.');

          const request = createProjectArtTopHatPoseSlotProviderPackageRequest();
          const packageValue = compileProjectArtTopHatPoseSlotProviderPackage(request);
          if (
            packageValue.counts.jobs !== 6 ||
            packageValue.counts.maximumProviderCalls !== 6 ||
            packageValue.counts.candidatesPerJob !== 1 ||
            packageValue.providerExecutionPerformed !== false ||
            packageValue.candidateApprovalPerformed !== false ||
            packageValue.poseSlotsFilled !== false ||
            packageValue.runtimeActivationPerformed !== false
          ) throw new Error('Top Hat passive provider package contract drifted.');
          NODE

      - name: Run guarded provider and six-slot campaign regressions
        run: |
          node --test scripts/test-project-art-top-hat-anchor-source-truth.mjs
          node --test scripts/test-project-art-top-hat-pose-slot-production.mjs
          node --test scripts/test-project-art-top-hat-pose-slot-provider-package.mjs
          node --test scripts/test-project-art-top-hat-pose-slot-provider-execution.mjs
          node --test scripts/test-project-art-top-hat-pose-bank-provider-campaign.mjs

      - name: Verify review-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "candidateApprovalPerformed: false" scripts/run-project-art-top-hat-real-provider-campaign.mjs
          grep -F "publicationPerformed: false" scripts/run-project-art-top-hat-real-provider-campaign.mjs
          grep -F "runtimeActivationPerformed: false" scripts/run-project-art-top-hat-real-provider-campaign.mjs
          ! grep -F "candidateApprovalPerformed: true" scripts/run-project-art-top-hat-real-provider-campaign.mjs
          ! grep -F "publicationPerformed: true" scripts/run-project-art-top-hat-real-provider-campaign.mjs
          ! grep -F "runtimeActivationPerformed: true" scripts/run-project-art-top-hat-real-provider-campaign.mjs

      - name: Prove preflight changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find packages apps -type d -name dist -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
