name: Pixel Font Studio universal styles

on:
  pull_request:
    paths:
      - "tools/pixel_font_universal.py"
      - "tools/pixel_font_universal_engine.py"
      - "tools/pixel_font_universal/**"
      - "tools/check_pixel_font_universal.py"
      - "tools/pixel_font_v2/__init__.py"
      - "scripts/pixel-font-studio-universal-mcp.mjs"
      - "scripts/check-pixel-font-studio-universal-mcp.mjs"
      - "config/pixel-font-style-profiles.v1.json"
      - "config/mcp.pixel-font-studio-universal.example.json"
      - "examples/pixel-font-universal/**"
      - "docs/PIXEL_FONT_STUDIO_UNIVERSAL_STYLES.md"
      - "requirements/pixel-font-universal.txt"
      - ".github/workflows/pixel-font-studio-universal.yml"
  push:
    branches: [main]
    paths:
      - "tools/pixel_font_universal.py"
      - "tools/pixel_font_universal_engine.py"
      - "tools/pixel_font_universal/**"
      - "tools/check_pixel_font_universal.py"
      - "tools/pixel_font_v2/__init__.py"
      - "scripts/pixel-font-studio-universal-mcp.mjs"
      - "scripts/check-pixel-font-studio-universal-mcp.mjs"
      - "config/pixel-font-style-profiles.v1.json"
      - "config/mcp.pixel-font-studio-universal.example.json"
      - "examples/pixel-font-universal/**"
      - "docs/PIXEL_FONT_STUDIO_UNIVERSAL_STYLES.md"
      - "requirements/pixel-font-universal.txt"
      - ".github/workflows/pixel-font-studio-universal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-font-universal-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1577836800"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: "pip"
          cache-dependency-path: requirements/pixel-font-universal.txt

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact scalable-font convenience backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-universal.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Compile Python and check MCP syntax
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m py_compile \
            tools/pixel_font_universal.py \
            tools/pixel_font_universal_engine.py \
            tools/check_pixel_font_universal.py \
            tools/pixel_font_v2/__init__.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q \
            tools/pixel_font_universal
          node --check scripts/pixel-font-studio-universal-mcp.mjs
          node --check scripts/check-pixel-font-studio-universal-mcp.mjs

      - name: Prove Pixel Font Studio v2 compatibility export
        run: |
          set -euo pipefail
          python tools/pixel_font_studio_v2.py catalog > "$RUNNER_TEMP/pixel-font-v2-catalog.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pixel-font-v2-catalog.json").read_text(
                  encoding="utf-8"
              )
          )
          assert catalog["toolVersion"] == "2.2.0", catalog
          PY

      - name: Run all-source, all-operation and all-packer adversarial checks
        run: python tools/check_pixel_font_universal.py

      - name: Run bounded ChatGPT and Claude MCP checks
        run: node scripts/check-pixel-font-studio-universal-mcp.mjs

      - name: Exercise public CLI and example contracts
        run: |
          set -euo pipefail
          python tools/pixel_font_universal.py catalog
          for face in examples/pixel-font-universal/*.face.json; do
            python tools/pixel_font_universal.py validate-face --face "$face"
          done
          for profile in examples/pixel-font-universal/*.profile.json; do
            python tools/pixel_font_universal.py validate-profile --profile "$profile"
          done

      - name: Upload machine-readable check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixel-font-universal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: universal-pixel-font-check-report.json

      - name: Prove source tree remains clean
        run: |
          set -euo pipefail
          rm -f universal-pixel-font-check-report.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
