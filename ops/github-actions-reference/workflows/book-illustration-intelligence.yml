name: Book Illustration Intelligence

on:
  push:
    branches:
      - main
      - agent/book-print-illustration-intelligence-20260805
      - agent/book-candidate-set-quality-20260806
    paths:
      - ".github/workflows/book-illustration-intelligence.yml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "packages/contracts/src/book-illustration-intelligence.ts"
      - "packages/contracts/src/book-art-candidate-set*.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-illustration-intelligence*.test.mjs"
      - "packages/contracts/test/book-art-candidate-set.test.mjs"
      - "scripts/evavo-art-book-illustration-cli.mjs"
      - "scripts/check-book-illustration-intelligence.mjs"
      - "docs/book-illustration-intelligence.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/book-illustration-intelligence.yml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "packages/contracts/src/book-illustration-intelligence.ts"
      - "packages/contracts/src/book-art-candidate-set*.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-illustration-intelligence*.test.mjs"
      - "packages/contracts/test/book-art-candidate-set.test.mjs"
      - "scripts/evavo-art-book-illustration-cli.mjs"
      - "scripts/check-book-illustration-intelligence.mjs"
      - "docs/book-illustration-intelligence.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-illustration-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt
      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install FFmpeg media tools
        run: bash scripts/bootstrap-ci-media-tools.sh
      - name: Install dependency graph
        run: pnpm install --frozen-lockfile
      - name: Check permanent contract authority
        run: node scripts/check-book-illustration-intelligence.mjs
      - name: Build and run illustration intelligence attacks
        run: |
          pnpm --filter @evavo/art-contracts build
          node --test \
            packages/contracts/test/book-illustration-intelligence.test.mjs \
            packages/contracts/test/book-illustration-intelligence-cli.test.mjs \
            packages/contracts/test/book-art-candidate-set.test.mjs
      - name: Run complete Art Studio verification
        run: pnpm check
      - name: Verify immutable lockfile and prove clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "Detected out-of-band source drift after verification:"
            printf '%s\n' "$status"
            echo "Tracked diff summary:"
            git diff --stat
            echo "Tracked diff:"
            git diff --no-ext-diff --text
            exit 1
          fi
          git diff --exit-code
