name: Mobile app asset contract

on:
  push:
    branches: [main]
    paths:
      - "config/mobile-app-asset-capability-v1.json"
      - "schemas/mobile-app-asset-plan.schema.json"
      - "scripts/compile-mobile-app-asset-plan.mjs"
      - "scripts/test-mobile-app-asset-plan.mjs"
      - "docs/MOBILE_APP_ASSET_WORKFLOW.md"
      - ".claude/commands/evavo-mobile-app-assets.md"
      - ".github/workflows/mobile-app-asset-contract.yml"
  pull_request:
    paths:
      - "config/mobile-app-asset-capability-v1.json"
      - "schemas/mobile-app-asset-plan.schema.json"
      - "scripts/compile-mobile-app-asset-plan.mjs"
      - "scripts/test-mobile-app-asset-plan.mjs"
      - "docs/MOBILE_APP_ASSET_WORKFLOW.md"
      - ".claude/commands/evavo-mobile-app-assets.md"
      - ".github/workflows/mobile-app-asset-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-app-asset-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Validate context, candidate and authority contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/compile-mobile-app-asset-plan.mjs
          node --check scripts/test-mobile-app-asset-plan.mjs
          node --test scripts/test-mobile-app-asset-plan.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("config/mobile-app-asset-capability-v1.json","utf8")); JSON.parse(require("node:fs").readFileSync("schemas/mobile-app-asset-plan.schema.json","utf8"))'

      - name: Confirm validation changed no repository source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
