name: Book Art Docs Release Receiver

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-art-docs-release.yml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "packages/contracts/src/book-production-docs-release.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-production-docs-release.test.mjs"
      - "packages/book-art-runtime/package.json"
      - "packages/book-art-runtime/src/docs-release.ts"
      - "packages/book-art-runtime/test/docs-release.test.mjs"
      - "apps/api/src/book-art-api.ts"
      - "apps/api/openapi.book-art-docs-release.yaml"
      - "apps/api/test/book-art-docs-release-api.test.mjs"
      - "apps/api/test/book-art-docs-release-openapi-contract.test.mjs"
      - "apps/cli/src/book-art-commands.ts"
      - "apps/cli/test/book-art-docs-release-cli.test.mjs"
      - "apps/mcp/src/book-art-tools.ts"
      - "apps/mcp/test/book-art-tools-contract.test.mjs"
      - "scripts/check-book-art-docs-release.mjs"
      - "docs/book-art-docs-release.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/book-art-docs-release.yml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "packages/contracts/src/book-production-docs-release.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-production-docs-release.test.mjs"
      - "packages/book-art-runtime/package.json"
      - "packages/book-art-runtime/src/docs-release.ts"
      - "packages/book-art-runtime/test/docs-release.test.mjs"
      - "apps/api/src/book-art-api.ts"
      - "apps/api/openapi.book-art-docs-release.yaml"
      - "apps/api/test/book-art-docs-release-api.test.mjs"
      - "apps/api/test/book-art-docs-release-openapi-contract.test.mjs"
      - "apps/cli/src/book-art-commands.ts"
      - "apps/cli/test/book-art-docs-release-cli.test.mjs"
      - "apps/mcp/src/book-art-tools.ts"
      - "apps/mcp/test/book-art-tools-contract.test.mjs"
      - "scripts/check-book-art-docs-release.mjs"
      - "docs/book-art-docs-release.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-art-docs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install FFmpeg media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Verify Docs release authority and surface boundary
        run: node scripts/check-book-art-docs-release.mjs

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run Book Art contract attacks
        run: pnpm --filter @evavo/art-contracts test

      - name: Run shared Docs release runtime attacks
        run: pnpm --filter @evavo/art-book-runtime test

      - name: Run Docs release REST and OpenAPI attacks
        run: pnpm --filter @evavo/art-studio-api test

      - name: Run Docs release CLI attacks
        run: pnpm --filter @evavo/art-studio-cli test

      - name: Run Docs release MCP contract attacks
        run: pnpm --filter @evavo/art-studio-mcp test

      - name: Run complete repository validation
        run: pnpm check

      - name: Verify immutable lockfile and clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
