name: Character Identity Master Planner

on:
  push:
    branches: [main]
    paths:
      - "scripts/character-identity-master-plan.mjs"
      - "scripts/test-character-identity-master-plan.mjs"
      - ".github/workflows/character-identity-master-planner.yml"
  pull_request:
    paths:
      - "scripts/character-identity-master-plan.mjs"
      - "scripts/test-character-identity-master-plan.mjs"
      - ".github/workflows/character-identity-master-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-identity-master-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Identity planner / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check planner syntax
        run: node --check scripts/character-identity-master-plan.mjs
      - name: Run planner contracts
        run: node --test scripts/test-character-identity-master-plan.mjs
