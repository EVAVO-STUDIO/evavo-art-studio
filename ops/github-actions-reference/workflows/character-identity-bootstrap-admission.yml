name: Character Identity Bootstrap Admission

on:
  push:
    branches: [main]
    paths:
      - "scripts/character-identity-master-plan.mjs"
      - "scripts/test-character-identity-master-plan.mjs"
      - "scripts/character-identity-bootstrap-admission.mjs"
      - "scripts/test-character-identity-bootstrap-admission.mjs"
      - ".github/workflows/character-identity-bootstrap-admission.yml"
  pull_request:
    paths:
      - "scripts/character-identity-master-plan.mjs"
      - "scripts/test-character-identity-master-plan.mjs"
      - "scripts/character-identity-bootstrap-admission.mjs"
      - "scripts/test-character-identity-bootstrap-admission.mjs"
      - ".github/workflows/character-identity-bootstrap-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-identity-bootstrap-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Identity bootstrap planner / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Syntax-check planners
        run: node --check scripts/character-identity-master-plan.mjs && node --check scripts/character-identity-bootstrap-admission.mjs
      - name: Run identity-master planner tests
        run: node --test scripts/test-character-identity-master-plan.mjs
      - name: Run bootstrap-admission planner tests
        run: node --test scripts/test-character-identity-bootstrap-admission.mjs
      - name: Confirm validation changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
