name: Sprite motion topology

on:
  pull_request:
    paths:
      - "packages/sprite-planner/src/motion-topology.ts"
      - "packages/sprite-planner/src/index.ts"
      - "packages/sprite-planner/test/motion-topology.test.mjs"
      - "packages/sprite-supervisor/src/automatic-motion-topology.ts"
      - "packages/sprite-supervisor/src/automatic-compiler.ts"
      - "packages/sprite-supervisor/src/automatic-types.ts"
      - "packages/sprite-supervisor/src/automatic-protocol.ts"
      - "packages/sprite-supervisor/src/automatic-mirror-drafts.ts"
      - "packages/sprite-supervisor/src/automatic-mirror-family.ts"
      - "packages/sprite-supervisor/test/automatic-workflow.test.mjs"
      - "packages/sprite-supervisor/test/deterministic-mirroring.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "docs/SPRITE_MOTION_TOPOLOGY.md"
      - ".github/workflows/sprite-motion-topology.yml"
  push:
    branches:
      - main
    paths:
      - "packages/sprite-planner/src/motion-topology.ts"
      - "packages/sprite-planner/src/index.ts"
      - "packages/sprite-planner/test/motion-topology.test.mjs"
      - "packages/sprite-supervisor/src/automatic-motion-topology.ts"
      - "packages/sprite-supervisor/src/automatic-compiler.ts"
      - "packages/sprite-supervisor/src/automatic-types.ts"
      - "packages/sprite-supervisor/src/automatic-protocol.ts"
      - "packages/sprite-supervisor/src/automatic-mirror-drafts.ts"
      - "packages/sprite-supervisor/src/automatic-mirror-family.ts"
      - "packages/sprite-supervisor/test/automatic-workflow.test.mjs"
      - "packages/sprite-supervisor/test/deterministic-mirroring.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "docs/SPRITE_MOTION_TOPOLOGY.md"
      - ".github/workflows/sprite-motion-topology.yml"

permissions:
  contents: read

concurrency:
  group: sprite-motion-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify audio media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build sprite planner dependency
        run: pnpm --filter @evavo/art-direction build

      - name: Type-check sprite planner
        run: pnpm --filter @evavo/art-sprite-planner typecheck

      - name: Run sprite planner and motion topology tests
        run: pnpm --filter @evavo/art-sprite-planner test

      - name: Build sprite supervisor dependency closure
        run: pnpm --filter @evavo/art-sprite-supervisor... build

      - name: Type-check exact automatic supervisor integration
        run: pnpm --filter @evavo/art-sprite-supervisor typecheck

      - name: Run automatic supervisor motion regressions
        run: >-
          node --test
          packages/sprite-supervisor/test/automatic-workflow.test.mjs
          packages/sprite-supervisor/test/deterministic-mirroring.test.mjs

      - name: Verify permanent source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'export * from "./motion-topology.js";' packages/sprite-planner/src/index.ts
          grep -F 'SPRITE_MOTION_TOPOLOGY_PROTOCOL_VERSION = "2026-08-07.2"' packages/sprite-planner/src/motion-topology.ts
          grep -F 'SPRITE_MOTION_SOURCE_PLAN_HASH_MISMATCH' packages/sprite-planner/src/motion-topology.ts
          grep -F 'SPRITE_MOTION_ISOMETRIC_DIRECTION_COUNT_INVALID' packages/sprite-planner/src/motion-topology.ts
          grep -F 'semantic phases' packages/sprite-planner/src/motion-topology.ts
          grep -F 'providerCalled: false' packages/sprite-planner/src/motion-topology.ts
          grep -F 'targetRepositoryMutated: false' packages/sprite-planner/src/motion-topology.ts
          grep -F 'publicationPerformed: false' packages/sprite-planner/src/motion-topology.ts
          grep -F 'compileAutomaticSpriteMotionTopology' packages/sprite-supervisor/src/automatic-compiler.ts
          grep -F 'semantic-phase-grounded-only' packages/sprite-supervisor/src/automatic-compiler.ts
          grep -F 'motionTopologySha256' packages/sprite-supervisor/src/automatic-mirror-drafts.ts
          grep -F 'AUTOMATIC_SPRITE_WORKFLOW_PROTOCOL_VERSION =' packages/sprite-supervisor/src/automatic-types.ts

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
