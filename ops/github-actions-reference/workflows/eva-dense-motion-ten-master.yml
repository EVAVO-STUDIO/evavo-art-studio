name: EVA dense-motion ten-master contract

on:
  pull_request:
    paths:
      - "scripts/project-art/eva-dense-motion-ten-master-program.mjs"
      - "scripts/compile-project-art-eva-dense-motion-ten-master.mjs"
      - "scripts/test-project-art-eva-dense-motion-ten-master.mjs"
      - "scripts/project-art/eva-dense-motion-work-order*.mjs"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_TEN_MASTER_PROGRAM.md"
      - ".github/workflows/eva-dense-motion-ten-master.yml"
  push:
    branches: [main]
    paths:
      - "scripts/project-art/eva-dense-motion-ten-master-program.mjs"
      - "scripts/compile-project-art-eva-dense-motion-ten-master.mjs"
      - "scripts/test-project-art-eva-dense-motion-ten-master.mjs"
      - "scripts/project-art/eva-dense-motion-work-order*.mjs"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_TEN_MASTER_PROGRAM.md"
      - ".github/workflows/eva-dense-motion-ten-master.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-motion-ten-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Syntax-check EVA ten-master surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/project-art/eva-dense-motion-ten-master-program.mjs
          node --check scripts/compile-project-art-eva-dense-motion-ten-master.mjs
          node --check scripts/test-project-art-eva-dense-motion-ten-master.mjs

      - name: Run EVA ten-master contract regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-project-art-eva-dense-motion-ten-master.mjs

      - name: Re-run legacy EVA work-order contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-project-art-eva-dense-motion-work-order.mjs

      - name: Confirm validation changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
