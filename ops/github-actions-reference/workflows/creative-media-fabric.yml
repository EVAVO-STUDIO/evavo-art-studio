name: Creative Media Fabric contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-media-fabric-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Verify shared handoff contract and studio profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Run deterministic networkless self-test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-creative-media-fabric.mjs --self-test
