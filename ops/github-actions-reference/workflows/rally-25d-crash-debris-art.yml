name: Rally 2.5D Crash Debris Art Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-crash-debris-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Run focused deterministic tests
        run: node --test scripts/game-art-production/rally-25d-crash-debris-jobs.test.mjs
      - name: Compile and independently verify provider session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-crash-debris-jobs.mjs compile \
            config/game-art-production/vfx/crash-debris-production-v1.json \
            --output "${RUNNER_TEMP}/crash-debris.session.json" \
            > "${RUNNER_TEMP}/crash-debris.stdout.json"
          node scripts/game-art-production/rally-25d-crash-debris-jobs.mjs verify \
            "${RUNNER_TEMP}/crash-debris.session.json" \
            | tee "${RUNNER_TEMP}/crash-debris.verify.json"
          grep -F '"jobs": 12' "${RUNNER_TEMP}/crash-debris.verify.json"
          grep -F '"responseJobs": 6' "${RUNNER_TEMP}/crash-debris.verify.json"
          grep -F '"spriteJobs": 4' "${RUNNER_TEMP}/crash-debris.verify.json"
          grep -F '"providerExecution": false' "${RUNNER_TEMP}/crash-debris.verify.json"
          grep -F '"downstream3DReady": false' "${RUNNER_TEMP}/crash-debris.verify.json"
      - name: Prove source remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crash-debris-art-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crash-debris.session.json
            ${{ runner.temp }}/crash-debris.verify.json
          if-no-files-found: warn
          retention-days: 7
