name: EVA dense-motion source materialization static guard

on:
  pull_request:
    paths:
      - "config/eva-dense-motion-source-materialization-capability-v1.json"
      - "docs/eva-dense-motion-source-materialization.md"
      - "scripts/check-project-art-eva-dense-motion-source-materialization.mjs"
      - "scripts/test-project-art-eva-dense-motion-source-materialization-static-guard.mjs"
      - ".github/workflows/eva-dense-motion-source-materialization-static-guard.yml"
  push:
    branches: [main]
    paths:
      - "config/eva-dense-motion-source-materialization-capability-v1.json"
      - "docs/eva-dense-motion-source-materialization.md"
      - "scripts/check-project-art-eva-dense-motion-source-materialization.mjs"
      - "scripts/test-project-art-eva-dense-motion-source-materialization-static-guard.mjs"
      - ".github/workflows/eva-dense-motion-source-materialization-static-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-source-static-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Run source materialization static guard
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-project-art-eva-dense-motion-source-materialization.mjs
          node --test scripts/test-project-art-eva-dense-motion-source-materialization-static-guard.mjs

      - name: Confirm validation changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
