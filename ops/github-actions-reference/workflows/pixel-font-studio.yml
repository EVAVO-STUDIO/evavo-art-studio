name: Pixel Font Studio

on:
  pull_request:
    paths:
      - "scripts/pixel-font/**"
      - "scripts/pixel-font-studio.mjs"
      - "scripts/pixel-font-studio-mcp.mjs"
      - "scripts/build-brass-brine-pixel-font-family.mjs"
      - "scripts/pixel-font-studio.test.mjs"
      - "scripts/pixel-font-brass-brine.test.mjs"
      - "scripts/check-pixel-font-studio.mjs"
      - "scripts/pixel-font-studio-v2-mcp.mjs"
      - "scripts/check-pixel-font-studio-v2.mjs"
      - "scripts/integrate-pixel-font-studio-v2.mjs"
      - "tools/pixel_font_studio_v2.py"
      - "tools/pixel_font_v2/**"
      - "config/pixel-font-studio.v1.json"
      - "config/pixel-font-studio.v2.json"
      - "config/pixel-font-family.example.v1.json"
      - "config/pixel-font-family.brass-brine.v1.json"
      - "config/mcp.pixel-font-studio.windows.example.json"
      - "config/mcp.pixel-font-studio-v2.example.json"
      - "config/pixel-font-families/chess-lord-v2/**"
      - "docs/PIXEL_FONT_STUDIO.md"
      - "docs/BRASS_BRINE_PIXEL_FONT_FAMILY.md"
      - "docs/PIXEL_FONT_STUDIO_V2.md"
      - "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md"
      - "requirements/pixel-font-studio-v2.txt"
      - "evavo.reliability.json"
      - "package.json"
      - ".github/workflows/pixel-font-studio.yml"
      - ".github/workflows/pixel-font-studio-v2.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/pixel-font/**"
      - "scripts/pixel-font-studio.mjs"
      - "scripts/pixel-font-studio-mcp.mjs"
      - "scripts/build-brass-brine-pixel-font-family.mjs"
      - "scripts/pixel-font-studio.test.mjs"
      - "scripts/pixel-font-brass-brine.test.mjs"
      - "scripts/check-pixel-font-studio.mjs"
      - "scripts/pixel-font-studio-v2-mcp.mjs"
      - "scripts/check-pixel-font-studio-v2.mjs"
      - "scripts/integrate-pixel-font-studio-v2.mjs"
      - "tools/pixel_font_studio_v2.py"
      - "tools/pixel_font_v2/**"
      - "config/pixel-font-studio.v1.json"
      - "config/pixel-font-studio.v2.json"
      - "config/pixel-font-family.example.v1.json"
      - "config/pixel-font-family.brass-brine.v1.json"
      - "config/mcp.pixel-font-studio.windows.example.json"
      - "config/mcp.pixel-font-studio-v2.example.json"
      - "config/pixel-font-families/chess-lord-v2/**"
      - "docs/PIXEL_FONT_STUDIO.md"
      - "docs/BRASS_BRINE_PIXEL_FONT_FAMILY.md"
      - "docs/PIXEL_FONT_STUDIO_V2.md"
      - "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md"
      - "requirements/pixel-font-studio-v2.txt"
      - "evavo.reliability.json"
      - "package.json"
      - ".github/workflows/pixel-font-studio.yml"
      - ".github/workflows/pixel-font-studio-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-font-studio-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1577836800"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Route Python bytecode to runner-temporary storage
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/pixel-font-python-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"

      - name: Install exact Pixel Font Studio v2 TTF dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pixel Font Studio
        run: pnpm run pixel-font:check

      - name: Build exact Brass & Brine production family
        run: |
          set -euo pipefail
          node scripts/build-brass-brine-pixel-font-family.mjs \
            --output "$RUNNER_TEMP/brass-brine-pixel-font" \
            --plan-output "$RUNNER_TEMP/brass-brine-pixel-font.plan.json"

      - name: Upload exact generated Brass & Brine family
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brass-brine-pixel-font-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/brass-brine-pixel-font/**
            ${{ runner.temp }}/brass-brine-pixel-font.plan.json

      - name: Prove source tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          case "${PYTHONPYCACHEPREFIX:-}" in
            "${RUNNER_TEMP}"/*) ;;
            *)
              echo "PYTHONPYCACHEPREFIX must stay inside RUNNER_TEMP." >&2
              exit 1
              ;;
          esac
          PYTHON_CACHE_RESIDUE="$(
            find tools \
              \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) \
              -print -quit
          )"
          if [[ -n "${PYTHON_CACHE_RESIDUE}" ]]; then
            echo "Python cache residue found in source: ${PYTHON_CACHE_RESIDUE}" >&2
            exit 1
          fi
          git diff --exit-code
          SOURCE_STATUS="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "${SOURCE_STATUS}" ]]; then
            printf '%s\n' "${SOURCE_STATUS}" >&2
            exit 1
          fi
