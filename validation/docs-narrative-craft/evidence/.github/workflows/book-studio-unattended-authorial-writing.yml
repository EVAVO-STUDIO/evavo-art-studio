name: Book Studio Unattended Authorial Writing

on:
  push:
    branches:
      - main
      - agent/book-unattended-authorial-automation-20260805
    paths: &authorial_paths
      - ".github/workflows/book-studio-unattended-authorial-writing.yml"
      - "packages/core/src/book-studio-authorial-writing-bridge-types.ts"
      - "packages/core/src/book-studio-authorial-writing-bridge.ts"
      - "packages/core/src/book-studio-narrative-craft.ts"
      - "packages/core/src/book-studio-unattended-production.ts"
      - "packages/core/src/book-studio-unattended-authorial-writing.ts"
      - "packages/core/src/index.ts"
      - "packages/core/test/book-studio-unattended-production.test.mjs"
      - "packages/core/test/book-studio-authorial-intelligence.test.mjs"
      - "packages/core/test/book-studio-unattended-authorial-writing.test.mjs"
      - "apps/web/src/lib/book-studio-writing-candidate-service.ts"
      - "apps/web/src/lib/book-studio-unattended-authorial-writing-service.ts"
      - "apps/web/src/app/api/v1/book-studio/unattended-production/authorial-writing/route.ts"
      - "apps/web/scripts/docs-suite-api-client.mjs"
      - "apps/web/scripts/evavo-docs-book-unattended-authorial-writing-cli.mjs"
      - "apps/web/scripts/evavo-docs-book-unattended-authorial-writing-mcp.mjs"
      - "apps/web/scripts/test-book-studio-unattended-authorial-writing-adapters.mjs"
      - "scripts/check-book-studio-narrative-craft.mjs"
      - "scripts/check-book-studio-authorial-intelligence.mjs"
      - "scripts/check-book-studio-unattended-production.mjs"
      - "scripts/check-book-studio-unattended-authorial-writing.mjs"
      - "docs/migrations/book-studio/BOOK_STUDIO_UNATTENDED_AUTHORIAL_WRITING.md"
  pull_request:
    branches: [main]
    paths: *authorial_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-studio-unattended-authorial-writing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use repository Node.js runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify permanent authorial and unattended authority boundaries
        run: |
          node scripts/check-book-studio-narrative-craft.mjs
          node scripts/check-book-studio-authorial-intelligence.mjs
          node scripts/check-book-studio-unattended-production.mjs
          node scripts/check-book-studio-unattended-authorial-writing.mjs

      - name: Install exact workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Run strict core and web TypeScript
        run: |
          corepack pnpm --filter @evavo-docs/core typecheck
          corepack pnpm --filter @evavo-docs/web typecheck

      - name: Run planning authorial bridge and coordinator attacks
        run: >-
          npm exec --yes --package=tsx@4.20.3 -- tsx --test
          packages/core/test/book-studio-unattended-production.test.mjs
          packages/core/test/book-studio-authorial-intelligence.test.mjs
          packages/core/test/book-studio-unattended-authorial-writing.test.mjs

      - name: Run CLI and dual-era MCP transport attacks
        run: node --test apps/web/scripts/test-book-studio-unattended-authorial-writing-adapters.mjs

      - name: Run complete repository verification
        run: corepack pnpm verify

      - name: Build complete production workspace
        run: corepack pnpm build

      - name: Prove exact tracked source remained clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
