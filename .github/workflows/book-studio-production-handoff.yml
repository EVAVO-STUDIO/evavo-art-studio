name: Book Studio Production Handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-studio-production-handoff.yml"
      - "packages/contracts/package.json"
      - "packages/contracts/src/book-production.ts"
      - "packages/contracts/src/book-production-profile.ts"
      - "packages/contracts/src/book-production-docs-release.ts"
      - "packages/contracts/src/book-production-legacy-illustration-plan.ts"
      - "packages/contracts/src/book-production-legacy-compat.ts"
      - "packages/contracts/src/book-production-legacy-state-import.ts"
      - "packages/contracts/src/book-production-legacy-state-import-safe.ts"
      - "packages/contracts/src/book-production-legacy-state-batch.ts"
      - "packages/contracts/src/book-production-legacy-state-batch-safe.ts"
      - "packages/contracts/src/book-production-promotion-adapter.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-production*.test.mjs"
      - "pnpm-lock.yaml"
      - "docs/BOOK_STUDIO_AND_ART_MIGRATION_AUTHORITY.v2.json"
      - "docs/book-studio-production-handoff.md"
      - "docs/book-art-immutable-promotion-receipts.md"
      - "scripts/check-book-studio-production-handoff.mjs"
      - "scripts/check-book-illustration-plan-parity.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/book-studio-production-handoff.yml"
      - "packages/contracts/package.json"
      - "packages/contracts/src/book-production.ts"
      - "packages/contracts/src/book-production-profile.ts"
      - "packages/contracts/src/book-production-docs-release.ts"
      - "packages/contracts/src/book-production-legacy-illustration-plan.ts"
      - "packages/contracts/src/book-production-legacy-compat.ts"
      - "packages/contracts/src/book-production-legacy-state-import.ts"
      - "packages/contracts/src/book-production-legacy-state-import-safe.ts"
      - "packages/contracts/src/book-production-legacy-state-batch.ts"
      - "packages/contracts/src/book-production-legacy-state-batch-safe.ts"
      - "packages/contracts/src/book-production-promotion-adapter.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-production*.test.mjs"
      - "pnpm-lock.yaml"
      - "docs/BOOK_STUDIO_AND_ART_MIGRATION_AUTHORITY.v2.json"
      - "docs/book-studio-production-handoff.md"
      - "docs/book-art-immutable-promotion-receipts.md"
      - "scripts/check-book-studio-production-handoff.mjs"
      - "scripts/check-book-illustration-plan-parity.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-studio-production-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Use governed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact frozen contract compiler
        run: pnpm install --frozen-lockfile --filter @evavo/art-contracts...

      - name: Verify migration authority
        run: node scripts/check-book-studio-production-handoff.mjs

      - name: Verify Book Illustration parity boundary
        run: node scripts/check-book-illustration-plan-parity.mjs

      - name: Compile dependency-light Book Art contracts
        run: |
          rm -rf packages/contracts/dist
          mkdir -p packages/contracts/dist
          pnpm --filter @evavo/art-contracts exec tsc \
            --target ES2022 \
            --lib ES2022,DOM,DOM.Iterable \
            --module NodeNext \
            --moduleResolution NodeNext \
            --strict \
            --noUncheckedIndexedAccess \
            --exactOptionalPropertyTypes \
            --skipLibCheck \
            --outDir packages/contracts/dist \
            packages/contracts/src/book-production.ts \
            packages/contracts/src/book-production-profile.ts \
            packages/contracts/src/book-production-docs-release.ts \
            packages/contracts/src/book-production-legacy-illustration-plan.ts \
            packages/contracts/src/book-production-legacy-compat.ts \
            packages/contracts/src/book-production-legacy-state-import.ts \
            packages/contracts/src/book-production-legacy-state-import-safe.ts \
            packages/contracts/src/book-production-legacy-state-batch.ts \
            packages/contracts/src/book-production-legacy-state-batch-safe.ts \
            packages/contracts/src/book-production-promotion-adapter.ts
          printf '%s\n' \
            'export * from "./book-production.js";' \
            'export * from "./book-production-profile.js";' \
            'export * from "./book-production-docs-release.js";' \
            'export * from "./book-production-legacy-illustration-plan.js";' \
            'export * from "./book-production-legacy-compat.js";' \
            'export * from "./book-production-legacy-state-import-safe.js";' \
            'export * from "./book-production-legacy-state-batch-safe.js";' \
            'export * from "./book-production-promotion-adapter.js";' \
            > packages/contracts/dist/index.js

      - name: Run Book Art contract, production-profile, Docs-release, illustration-parity, legacy-state, batch and immutable-promotion attacks
        run: node --test packages/contracts/test/book-production*.test.mjs

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/contracts/dist
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
