name: Book Art Provider Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-art-provider-runtime.yml"
      - "apps/worker/package.json"
      - "apps/worker/tsconfig.json"
      - "apps/worker/src/book-art-provider-jobs.ts"
      - "apps/worker/src/index.ts"
      - "apps/worker/src/provider-handlers.ts"
      - "apps/worker/test/book-art-provider-jobs.test.mjs"
      - "packages/contracts/src/book-production.ts"
      - "packages/contracts/src/book-production-profile.ts"
      - "packages/contracts/src/index.ts"
      - "packages/providers/src/orchestrator.ts"
      - "packages/providers/src/registry.ts"
      - "packages/providers/src/validation.ts"
      - "packages/runtime/src/local-repository.ts"
      - "packages/runtime/src/normalize.ts"
      - "packages/runtime/src/worker.ts"
      - "docs/BOOK_STUDIO_AND_ART_MIGRATION_AUTHORITY.v2.json"
      - "docs/book-art-provider-runtime.md"
      - "docs/book-studio-production-handoff.md"
      - "scripts/check-book-art-provider-runtime.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/book-art-provider-runtime.yml"
      - "apps/worker/package.json"
      - "apps/worker/tsconfig.json"
      - "apps/worker/src/book-art-provider-jobs.ts"
      - "apps/worker/src/index.ts"
      - "apps/worker/src/provider-handlers.ts"
      - "apps/worker/test/book-art-provider-jobs.test.mjs"
      - "packages/contracts/src/book-production.ts"
      - "packages/contracts/src/book-production-profile.ts"
      - "packages/contracts/src/index.ts"
      - "packages/providers/src/orchestrator.ts"
      - "packages/providers/src/registry.ts"
      - "packages/providers/src/validation.ts"
      - "packages/runtime/src/local-repository.ts"
      - "packages/runtime/src/normalize.ts"
      - "packages/runtime/src/worker.ts"
      - "docs/BOOK_STUDIO_AND_ART_MIGRATION_AUTHORITY.v2.json"
      - "docs/book-art-provider-runtime.md"
      - "docs/book-studio-production-handoff.md"
      - "scripts/check-book-art-provider-runtime.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-art-provider-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Verify Book Art provider runtime authority boundary
        run: node scripts/check-book-art-provider-runtime.mjs

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run worker and Book Art provider runtime regressions
        run: pnpm --filter @evavo/art-studio-worker test

      - name: Remove generated lockfile and verify clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"
