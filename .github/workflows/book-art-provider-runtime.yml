permissions:
  contents: read

concurrency:
  group: book-art-provider-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install FFmpeg media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Verify Book Art provider runtime, inspection, parity and legacy-byte authority
        run: |
          node scripts/check-book-art-provider-runtime.mjs
          node scripts/check-book-art-provider-inspection.mjs
          node scripts/check-book-art-provider-parity.mjs
          node scripts/check-book-art-legacy-registration.mjs

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run shared Book Art runtime regressions
        run: pnpm --filter @evavo/art-book-runtime test

      - name: Run worker provider execution, inspection and parity regressions
        run: pnpm --filter @evavo/art-studio-worker test

      - name: Run Book Art REST regressions
        run: pnpm --filter @evavo/art-studio-api test

      - name: Run Book Art CLI regressions
        run: pnpm --filter @evavo/art-studio-cli test

      - name: Run Book Art MCP contract regressions
        run: pnpm --filter @evavo/art-studio-mcp test

      - name: Run complete repository validation
        run: pnpm check

      - name: Remove bounded validation scratch and verify clean exact source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf examples/legacy-book-artwork-registration/artifacts
          test ! -e examples/legacy-book-artwork-registration/artifacts
          if ! git diff --exit-code; then
            echo "::error title=Dirty exact source::Tracked files changed during validation"
            exit 1
          fi
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            while IFS= read -r line; do
              echo "::error title=Dirty exact source::$line"
            done <<< "$status"
            exit 1
          fi
