name: Isolate repository-toolchain file writes

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v8-20260805]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 3de1fe91db5b2067de478303666a8a6bf1f51485
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach refs/remotes/origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run adversarial test with source workflow writable
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/workflows/ci.yml | tee /tmp/ci-before-writable.sha
          node scripts/test-repository-toolchain.mjs
          sha256sum .github/workflows/ci.yml | tee /tmp/ci-after-writable.sha
          diff -u /tmp/ci-before-writable.sha /tmp/ci-after-writable.sha
          git diff --exit-code -- .github/workflows/ci.yml
      - name: Run adversarial test with source workflow read-only
        shell: bash
        run: |
          set -euo pipefail
          chmod 0444 .github/workflows/ci.yml
          sha256sum .github/workflows/ci.yml | tee /tmp/ci-before-readonly.sha
          node scripts/test-repository-toolchain.mjs
          sha256sum .github/workflows/ci.yml | tee /tmp/ci-after-readonly.sha
          diff -u /tmp/ci-before-readonly.sha /tmp/ci-after-readonly.sha
          git diff --exit-code -- .github/workflows/ci.yml
