name: Apply runtime submission integrity patch

on:
  push:
    branches:
      - agent/runtime-submission-input-integrity-20260808
    paths:
      - ".agent/runtime-submission-integrity.part-*"
      - ".github/workflows/agent-apply-runtime-submission-integrity.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-runtime-submission-integrity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/runtime-submission-input-integrity-20260808
          fetch-depth: 0

      - name: Assemble and apply exact source transformation
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent/runtime-submission-integrity.part-00 \
            .agent/runtime-submission-integrity.part-01 \
            .agent/runtime-submission-integrity.part-02 \
            > /tmp/apply-runtime-submission-integrity.py
          python -m py_compile /tmp/apply-runtime-submission-integrity.py
          python /tmp/apply-runtime-submission-integrity.py
          grep -F 'snapshotRuntimeJobSubmission' packages/runtime/src/normalize.ts
          grep -F 'const retryPolicy = normalizeRetryPolicy' packages/runtime/src/normalize.ts
          ! grep -F 'input.retryPolicy?.baseDelayMs' packages/runtime/src/normalize.ts
          git diff --check

      - name: Commit exact source and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent/runtime-submission-integrity.part-00 \
            .agent/runtime-submission-integrity.part-01 \
            .agent/runtime-submission-integrity.part-02 \
            .github/workflows/agent-apply-runtime-submission-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/normalize.ts
          git add -u .agent .github/workflows/agent-apply-runtime-submission-integrity.yml
          git diff --cached --check
          git commit -m "fix(runtime): snapshot job submissions"
          git push origin HEAD:agent/runtime-submission-input-integrity-20260808
