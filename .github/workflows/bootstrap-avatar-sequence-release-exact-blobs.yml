name: Bootstrap avatar sequence release exact blobs

on:
  push:
    branches:
      - agent/avatar-sequence-release-core-transfer-20260813
    paths:
      - .github/workflows/bootstrap-avatar-sequence-release-exact-blobs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-avatar-sequence-release-exact-blobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify archive and create exact Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, lzma, os, stat, tarfile, urllib.request
          from pathlib import PurePosixPath

          REPOSITORY = 'EVAVO-STUDIO/evavo-art-studio'
          ARCHIVE_BLOB_SHA = 'f3c72c1f4d623cf9d4549538407bc856895ed626'
          ARCHIVE_SHA256 = '08c4d045cef7d5677f2c2bf858ae7104c063fee21434b1975bad5c1109e980d7'
          EXPECTED = {
              '.github/workflows/artist-workspace-agent-suite.yml': {
                  'sha256': '2f99de050dbc33e7ca2fee5c7d2af8765ea9a62e3859c09a82f86b0498bdf7d9',
                  'git_sha': '53562583b4c65ad80e8be9243b47495d10ca50e5',
              },
              'scripts/project-art/avatar-sequence-release-fixture.mjs': {
                  'sha256': 'b249b8b9aa064a44c8a90990fb87e0c61848b8e5a55d4e51993addd5c6e5fd39',
                  'git_sha': '1726536a6f583d72a72193760c24a1771d4a7fe8',
              },
              'scripts/test-project-art-avatar-sequence-release-mcp.mjs': {
                  'sha256': '2bca9b6474c8cf8f08ae2bb3ed7289e321f306ccea267ec67905c6ede500e268',
                  'git_sha': 'e1a04626634e7c624968447a6828060632e6860c',
              },
              'scripts/test-project-art-avatar-sequence-release.mjs': {
                  'sha256': 'c8262edbb6dd94cceed76f1233370958c36d8bd2c39cabcec50bd91ce1abb964',
                  'git_sha': '557cd37c68723121e0699cc25a31d86baa5f77c0',
              },
          }

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'evavo-avatar-sequence-release-exact-blobs/1',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{REPOSITORY}/git/blobs/{ARCHIVE_BLOB_SHA}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              record = json.load(response)
          if record.get('sha') != ARCHIVE_BLOB_SHA or record.get('encoding') != 'base64' or record.get('truncated') is True:
              raise SystemExit('archive Git blob identity is incomplete or mismatched')
          archive = base64.b64decode(record['content'], validate=False)
          if hashlib.sha256(archive).hexdigest() != ARCHIVE_SHA256:
              raise SystemExit('archive SHA-256 mismatch')

          payloads = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as bundle:
              for member in bundle.getmembers():
                  name = member.name[2:] if member.name.startswith('./') else member.name
                  if name in ('', '.'):
                      if not member.isdir():
                          raise SystemExit('archive root must be a directory')
                      continue
                  posix = PurePosixPath(name)
                  if posix.is_absolute() or '..' in posix.parts or '\\' in name or '\x00' in name:
                      raise SystemExit(f'unsafe member: {name}')
                  if member.isdir():
                      continue
                  if name in payloads or not member.isfile() or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'invalid member: {name}')
                  if stat.S_IMODE(member.mode) & 0o022:
                      raise SystemExit(f'unsafe mode: {name}')
                  stream = bundle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'unreadable member: {name}')
                  payloads[name] = stream.read()

          manifest_bytes = payloads.pop('.evavo-transfer-manifest.json', None)
          if manifest_bytes is None:
              raise SystemExit('manifest is missing')
          manifest = json.loads(manifest_bytes.decode('utf-8'))
          if manifest.get('schema') != 'evavo.avatar-sequence-release-exact-transfer.v1':
              raise SystemExit('manifest schema is invalid')
          if set(payloads) != set(EXPECTED) or manifest.get('files') != {path: value['sha256'] for path, value in EXPECTED.items()}:
              raise SystemExit('manifest path or hash set is invalid')

          for path, expected in sorted(EXPECTED.items()):
              data = payloads[path]
              if hashlib.sha256(data).hexdigest() != expected['sha256']:
                  raise SystemExit(f'payload SHA-256 mismatch: {path}')
              actual_git_sha = hashlib.sha1(f'blob {len(data)}'.encode() + b'\x00' + data).hexdigest()
              if actual_git_sha != expected['git_sha']:
                  raise SystemExit(f'local Git blob identity mismatch: {path}')
              body = json.dumps({
                  'content': base64.b64encode(data).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              create = urllib.request.Request(
                  f'https://api.github.com/repos/{REPOSITORY}/git/blobs',
                  headers={**headers, 'Content-Type': 'application/json'},
                  data=body,
                  method='POST',
              )
              with urllib.request.urlopen(create, timeout=30) as response:
                  created = json.load(response)
              if created.get('sha') != expected['git_sha']:
                  raise SystemExit(f'created Git blob identity mismatch: {path}: {created.get("sha")}')
              print(f'CREATED_EXACT_BLOB {path} {created["sha"]}')
          PY
