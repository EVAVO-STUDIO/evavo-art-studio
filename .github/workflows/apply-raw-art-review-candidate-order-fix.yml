name: Apply RAW ART review candidate-order fixture correction

on:
  push:
    branches:
      - agent/raw-art-provider-review-repair-20260809
    paths:
      - ".github/workflows/apply-raw-art-review-candidate-order-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-raw-art-review-candidate-order-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact correction source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply descriptor-index candidate ordering correction
        shell: bash
        env:
          EXPECTED_PARENT: e65c3508564c9570d2f3b4ee91457286d81e0cd6
          EXPECTED_BLOB: 09ad8e9fc0c5f069f9998ed2515d6dc530bd27af
          WORKFLOW_PATH: .github/workflows/apply-raw-art-review-candidate-order-fix.yml
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/raw-art-provider-review-repair-20260809"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = "${WORKFLOW_PATH}"

          python3 - <<'PY'
          from pathlib import Path

          target = Path('scripts/check-raw-art-provider-review.mjs')
          source = target.read_text()
          old = """    const job = execution.jobs[0];
              const candidates = job.outputArtifacts
                .filter((entry) => entry.artifactRole === 'provider-candidate');
              assert.equal(candidates.length, 7);

              const artifacts = new LocalArtifactStore({ root: artifactRoot });
              const maskBytes = await artifacts.read(candidates[2].artifactId);
          """
          new = """    const job = execution.jobs[0];
              const candidateOutputs = job.outputArtifacts
                .filter((entry) => entry.artifactRole === 'provider-candidate');
              assert.equal(candidateOutputs.length, 7);

              const artifacts = new LocalArtifactStore({ root: artifactRoot });
              const candidates = [];
              for (const output of candidateOutputs) {
                const descriptor = await artifacts.get(output.artifactId);
                assert.ok(descriptor);
                const candidateIndex = Number(descriptor.labels.candidateIndex);
                assert.ok(Number.isSafeInteger(candidateIndex));
                candidates.push({ ...output, candidateIndex });
              }
              candidates.sort((left, right) => left.candidateIndex - right.candidateIndex);
              assert.deepEqual(
                candidates.map((entry) => entry.candidateIndex),
                [1, 2, 3, 4, 5, 6, 7],
              );

              const maskBytes = await artifacts.read(candidates[2].artifactId);
          """
          old_decisions = """    const decisions = [
                reviewCandidate(candidates[0], 1, 'keep'),
                reviewCandidate(candidates[1], 2, 'edit'),
                reviewCandidate(candidates[2], 3, 'edit', mask.artifactId),
                reviewCandidate(candidates[3], 4, 'recreate'),
                reviewCandidate(candidates[4], 5, 'generate-variation'),
                reviewCandidate(candidates[5], 6, 'reference-only'),
                reviewCandidate(candidates[6], 7, 'reject'),
              ];
          """
          new_decisions = """    const decisions = [
                reviewCandidate(candidates[0], candidates[0].candidateIndex, 'keep'),
                reviewCandidate(candidates[1], candidates[1].candidateIndex, 'edit'),
                reviewCandidate(
                  candidates[2],
                  candidates[2].candidateIndex,
                  'edit',
                  mask.artifactId,
                ),
                reviewCandidate(candidates[3], candidates[3].candidateIndex, 'recreate'),
                reviewCandidate(
                  candidates[4],
                  candidates[4].candidateIndex,
                  'generate-variation',
                ),
                reviewCandidate(
                  candidates[5],
                  candidates[5].candidateIndex,
                  'reference-only',
                ),
                reviewCandidate(candidates[6], candidates[6].candidateIndex, 'reject'),
              ];
          """
          if source.count(old) != 1 or source.count(old_decisions) != 1:
              raise SystemExit('exact candidate-order fixture source was not found once')
          target.write_text(source.replace(old, new).replace(old_decisions, new_decisions))
          PY

          node --check scripts/check-raw-art-provider-review.mjs
          test "$(git hash-object scripts/check-raw-art-provider-review.mjs)" = "${EXPECTED_BLOB}"
          git rm "${WORKFLOW_PATH}"
          test "$(git diff --name-only)" = $'scripts/check-raw-art-provider-review.mjs\n.github/workflows/apply-raw-art-review-candidate-order-fix.yml' || \
            test "$(git diff --name-only)" = $'.github/workflows/apply-raw-art-review-candidate-order-fix.yml\nscripts/check-raw-art-provider-review.mjs'

          git config user.name "EVAVO Studio Automation"
          git config user.email "evavo.studio@gmail.com"
          git add scripts/check-raw-art-provider-review.mjs
          git commit -m "test(raw-art): bind review fixtures by candidate index"
          git push origin HEAD:agent/raw-art-provider-review-repair-20260809
