name: Agent Apply Book Art Runtime

on:
  push:
    branches:
      - agent/book-art-provider-runtime-20260802
    paths:
      - ".github/workflows/agent-apply-book-art-runtime.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-book-art-runtime
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'EVAVO-STUDIO/evavo-art-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact branch boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/agent/book-art-provider-runtime-20260802" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse HEAD^)" == "cbab56259169a0446b7467b87b47cbba80706c42" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Apply checksum-bound reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/book-art-runtime.patch.gz.b64" <<'PATCH64'

PATCH64
          base64 --decode "${RUNNER_TEMP}/book-art-runtime.patch.gz.b64" > "${RUNNER_TEMP}/book-art-runtime.patch.gz"
          printf '%s  %s\n' \
            '19db27d71db95bbb09ea6655eb496241e8603791177632238ad97fa4e0f0d622' \
            "${RUNNER_TEMP}/book-art-runtime.patch.gz" | sha256sum --check
          gzip --decompress --stdout "${RUNNER_TEMP}/book-art-runtime.patch.gz" > "${RUNNER_TEMP}/book-art-runtime.patch"
          git apply --check "${RUNNER_TEMP}/book-art-runtime.patch"
          git apply --index "${RUNNER_TEMP}/book-art-runtime.patch"
          rm -f .github/workflows/agent-apply-book-art-runtime.yml
          git add -A

      - name: Verify exact final source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-book-art-provider-runtime.mjs
          node scripts/check-book-studio-production-handoff.mjs
          node scripts/check-book-illustration-plan-parity.mjs
          node --check scripts/check-book-art-provider-runtime.mjs
          node --check apps/worker/test/book-art-provider-jobs.test.mjs
          git diff --cached --check
          [[ "$(git write-tree)" == "28d46750a360ec203608231fadb84bc419da7c50" ]]
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'PATHS'
.github/workflows/agent-apply-book-art-runtime.yml
.github/workflows/book-art-provider-runtime.yml
apps/worker/package.json
apps/worker/src/book-art-provider-jobs.ts
apps/worker/src/index.ts
apps/worker/test/book-art-provider-jobs.test.mjs
apps/worker/tsconfig.json
docs/book-art-provider-runtime.md
docs/book-studio-production-handoff.md
scripts/check-book-art-provider-runtime.mjs
PATHS
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          sort "${RUNNER_TEMP}/expected-paths.txt" -o "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"

      - name: Commit and push exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(book-art): complete durable provider shadow runtime'
          git push origin HEAD:refs/heads/agent/book-art-provider-runtime-20260802
