name: Agent Diagnose Book Art Legacy Byte Registration

on:
  pull_request:
    branches:
      - agent/book-art-legacy-byte-registration-20260803
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-diagnose-book-art-legacy-byte-registration
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/book-art-legacy-byte-registration-20260803
      WORKFLOW_FILE: agent-apply-book-art-legacy-byte-registration.yml
      EXPECTED_SHA: a06aa4ca6b3c01641f14378a5b50c6f59988bac9
    steps:
      - name: Check out exact observed feature head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact observer scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SHA}" ]]
          git fetch --no-tags --prune origin \
            +refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "${EXPECTED_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Report exact bootstrap result and bounded failure tail
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${TARGET_BRANCH}&event=push&per_page=30" \
              --jq ".workflow_runs[] | select(.head_sha == \"${EXPECTED_SHA}\") | .id" \
              | head -n 1
          )"
          [[ -n "${run_id}" ]] || { echo 'Exact bootstrap workflow run was not found.' >&2; exit 1; }
          echo "bootstrap_run_id=${run_id}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{status,conclusion,head_sha,event,run_attempt,created_at,updated_at}'
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion,steps:[.steps[] | {number,name,status,conclusion}]}'
          conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
          if [[ "${conclusion}" != 'success' ]]; then
            echo '--- bounded failed-log tail ---'
            gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 \
              | tail -n 220
            exit 1
          fi
