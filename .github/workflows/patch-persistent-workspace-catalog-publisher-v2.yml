name: Temporary patch persistent workspace catalog publisher v2

on:
  push:
    branches:
      - automation/publish-persistent-workspace-catalog-20260812
    paths:
      - ".github/workflows/patch-persistent-workspace-catalog-publisher-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch exact untracked-file scope audit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");const p=".github/workflows/publish-persistent-workspace-catalog-v3.yml";const s=fs.readFileSync(p,"utf8");const a="          node scripts/check-persistent-artist-workspace-catalog.mjs\n          node scripts/check-artist-workspace-agent-suite.mjs\n          git diff --check\n";const b="          node scripts/check-persistent-artist-workspace-catalog.mjs\n          node scripts/check-artist-workspace-agent-suite.mjs\n          git add -N -- .github/workflows/persistent-artist-workspace-catalog.yml config/mcp.persistent-artist-workspace-catalog.windows.example.json docs/PERSISTENT_ARTIST_WORKSPACE_CATALOG.md scripts/check-persistent-artist-workspace-catalog.mjs scripts/persistent-artist-workspace-catalog.mjs scripts/project-art/persistent-workspace-catalog.mjs scripts/test-persistent-artist-workspace-catalog.mjs scripts/test-project-art-workspace-catalog-mcp.mjs tools/project_art_workspace_catalog_mcp.mjs\n          git diff --check\n";if(s.split(a).length!==2)throw new Error("publisher scope anchor is not unique");fs.writeFileSync(p,s.replace(a,b),"utf8");'
          rm -f .github/workflows/patch-persistent-workspace-catalog-publisher.yml
          rm -f .github/workflows/patch-persistent-workspace-catalog-publisher-v2.yml
          git diff --check
          git config user.name EVAVO-STUDIO
          git config user.email evavo.studio@gmail.com
          git add -A -- .github/workflows/publish-persistent-workspace-catalog-v3.yml .github/workflows/patch-persistent-workspace-catalog-publisher.yml .github/workflows/patch-persistent-workspace-catalog-publisher-v2.yml
          git commit -m "fix(release): include new catalog paths in scope audit"
          git push origin HEAD:automation/publish-persistent-workspace-catalog-20260812
