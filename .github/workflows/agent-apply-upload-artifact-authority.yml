name: Agent apply upload artifact authority

on:
  push:
    branches:
      - agent/upgrade-upload-artifact-node24
    paths:
      - agent-patches/upload-artifact-node24-authority.patch
      - .github/workflows/agent-apply-upload-artifact-authority.yml

permissions:
  contents: write

concurrency:
  group: agent-upload-artifact-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor == 'EVAVO-STUDIO'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Apply, validate and publish authority update
        shell: bash
        env:
          PATCH_PATH: agent-patches/upload-artifact-node24-authority.patch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/upgrade-upload-artifact-node24"
          git apply --check --whitespace=error-all "${PATCH_PATH}"
          git apply --whitespace=error-all "${PATCH_PATH}"

          node scripts/check-repository-toolchain.mjs --skip-runtime
          node scripts/test-repository-toolchain.mjs
          git diff --check
          git diff --exit-code -- "${PATCH_PATH}" .github/workflows/agent-apply-upload-artifact-authority.yml

          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add scripts/check-repository-toolchain.mjs scripts/test-repository-toolchain.mjs
          git commit -m "fix(ci): update upload action authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
