name: Temporary Top Hat Six-Pose Provider Execution

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-top-hat-real-provider-execution.yml"

permissions:
  contents: read

concurrency:
  group: temporary-top-hat-six-pose-provider-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CROSS_REPO_TOKEN: ${{ secrets.EVAVO_REPOSITORY_TOKEN || secrets.EVAVO_PIXEL_FONT_REPOSITORY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAVO_ART_OPENAI_IMAGE_MODEL: gpt-image-1
      EVAVO_ART_OPENAI_IMAGE_MODELS: gpt-image-1
      EVAVO_ART_PROVIDER_MAX_RESPONSE_BYTES: "134217728"
      TOP_HAT_PINNED_RUNTIME_COMMIT: 524066fc95fee329e1a20f7c9aa7d805d94c8cc8
      TOP_HAT_PINNED_RUNTIME_ROOT: .top-hat-pinned-avatar-runtime
    steps:
      - name: Check out exact internal PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the reviewed provider and cross-repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CROSS_REPO_TOKEN:-}"
          test -n "${OPENAI_API_KEY:-}"

      - name: Check out the exact admitted Avatar Runtime anchor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EVAVO-STUDIO/evavo-avatar-runtime
          ref: ${{ env.TOP_HAT_PINNED_RUNTIME_COMMIT }}
          token: ${{ secrets.EVAVO_REPOSITORY_TOKEN || secrets.EVAVO_PIXEL_FONT_REPOSITORY_TOKEN }}
          path: ${{ env.TOP_HAT_PINNED_RUNTIME_ROOT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and verify the three approved 1024 by 1536 anchors
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assets/top-hat-man
          mkdir -p assets/top-hat-man/candidates
          install -m 0600 \
            "${TOP_HAT_PINNED_RUNTIME_ROOT}/assets/top-hat-man/candidates/top-hat-man-full-body-master-v5.alpha.png" \
            assets/top-hat-man/candidates/top-hat-man-full-body-master-v5.alpha.png
          install -m 0600 \
            "${TOP_HAT_PINNED_RUNTIME_ROOT}/assets/top-hat-man/candidates/top-hat-man-idle-breathe-apex-v1.alpha.png" \
            assets/top-hat-man/candidates/top-hat-man-idle-breathe-apex-v1.alpha.png
          install -m 0600 \
            "${TOP_HAT_PINNED_RUNTIME_ROOT}/assets/top-hat-man/candidates/top-hat-man-idle-breathe-exhale-v1.alpha.png" \
            assets/top-hat-man/candidates/top-hat-man-idle-breathe-exhale-v1.alpha.png
          cat > "${RUNNER_TEMP}/top-hat-anchor-sha256.txt" <<'HASHES'
          92cb290246a7629024dcb7768f4119f6a139d9c9f59e3d0545563e1f5b35575a  assets/top-hat-man/candidates/top-hat-man-full-body-master-v5.alpha.png
          476ff3c1ca56e1f4ec622b94abfebf35a94b593a388177b3d9b3bce9347ed9a5  assets/top-hat-man/candidates/top-hat-man-idle-breathe-apex-v1.alpha.png
          bd64eba4f22fd2d524ee7eb1826b2cc9cc9723cff5a764e36946d568b8cfd358  assets/top-hat-man/candidates/top-hat-man-idle-breathe-exhale-v1.alpha.png
          HASHES
          sha256sum --check --strict "${RUNNER_TEMP}/top-hat-anchor-sha256.txt"
          test "$(stat -c '%s' assets/top-hat-man/candidates/top-hat-man-full-body-master-v5.alpha.png)" = "647297"
          test "$(stat -c '%s' assets/top-hat-man/candidates/top-hat-man-idle-breathe-apex-v1.alpha.png)" = "626064"
          test "$(stat -c '%s' assets/top-hat-man/candidates/top-hat-man-idle-breathe-exhale-v1.alpha.png)" = "627093"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build the exact provider dependency closure
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-worker build
          pnpm --filter @evavo/art-studio-worker typecheck

      - name: Execute exactly six unapproved Top Hat candidates
        shell: bash
        run: |
          set -euo pipefail
          WORK_ROOT="${RUNNER_TEMP}/top-hat-real-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/run-project-art-top-hat-real-provider-campaign.mjs run \
            --authorization-record "${GITHUB_WORKSPACE}/config/production/top-hat-pose-bank-provider-human-authorization-v1.json" \
            --work-root "${WORK_ROOT}" \
            | tee "${RUNNER_TEMP}/top-hat-real-provider-result.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(
            readFileSync(process.env.RUNNER_TEMP + '/top-hat-real-provider-result.json', 'utf8'),
          );
          if (
            result.status !== 'succeeded-awaiting-human-frame-review' ||
            result.exportManifest?.counts?.candidates !== 6 ||
            result.exportManifest?.counts?.approved !== 0 ||
            result.candidateApprovalPerformed !== false ||
            result.publicationPerformed !== false ||
            result.runtimeActivationPerformed !== false
          ) throw new Error('Top Hat execution escaped its review-only boundary.');
          NODE

      - name: Upload the six candidates and immutable execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: top-hat-six-pose-review-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/top-hat-real-provider-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/top-hat-real-provider-result.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Prove the provider run changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/top-hat-man "${TOP_HAT_PINNED_RUNTIME_ROOT}"
          find packages apps -type d -name dist -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
