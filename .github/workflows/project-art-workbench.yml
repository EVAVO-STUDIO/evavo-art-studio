name: Project art workbench

on:
  pull_request:
    paths:
      - "scripts/project-art/**"
      - "scripts/compile-project-art-intelligence.mjs"
      - "scripts/compile-project-art-sandbox.mjs"
      - "scripts/compile-project-art-intake.mjs"
      - "scripts/compile-project-art-atlas.mjs"
      - "scripts/compile-reference-derived-image-plan.mjs"
      - "scripts/stage-reference-derived-artifacts.mjs"
      - "scripts/compile-project-art-loop-closure.mjs"
      - "scripts/check-project-art-loop-closure.mjs"
      - "scripts/test-project-art-loop-closure.mjs"
      - "scripts/check-project-art-workbench.mjs"
      - "scripts/test-project-art-workbench.mjs"
      - "scripts/test-project-art-workspace-mcp.mjs"
      - "scripts/check-project-art-intake.mjs"
      - "scripts/test-project-art-intake.mjs"
      - "tools/run_project_art_sandbox.py"
      - "tools/run_project_art_loop_closure.py"
      - "tools/run_project_art_intake.py"
      - "tools/project_art_intake_*.py"
      - "tools/build_project_art_atlas.py"
      - "tools/project_art_atlas_*.py"
      - "tools/project_art_workspace_mcp.mjs"
      - "config/project-art-operations.v1.json"
      - "config/mcp.project-art-workspace.windows.example.json"
      - "docs/PROJECT_ART_WORKBENCH.md"
      - "docs/PROJECT_ART_LOOP_CLOSURE.md"
      - "docs/PROJECT_ART_CHAT_INTAKE_AND_ATLASES.md"
      - "package.json"
      - "requirements-image-pipeline.txt"
      - ".github/workflows/project-art-workbench.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/project-art/**"
      - "scripts/compile-project-art-intelligence.mjs"
      - "scripts/compile-project-art-sandbox.mjs"
      - "scripts/compile-project-art-intake.mjs"
      - "scripts/compile-project-art-atlas.mjs"
      - "scripts/compile-reference-derived-image-plan.mjs"
      - "scripts/stage-reference-derived-artifacts.mjs"
      - "scripts/compile-project-art-loop-closure.mjs"
      - "scripts/check-project-art-loop-closure.mjs"
      - "scripts/test-project-art-loop-closure.mjs"
      - "scripts/check-project-art-workbench.mjs"
      - "scripts/test-project-art-workbench.mjs"
      - "scripts/test-project-art-workspace-mcp.mjs"
      - "scripts/check-project-art-intake.mjs"
      - "scripts/test-project-art-intake.mjs"
      - "tools/run_project_art_sandbox.py"
      - "tools/run_project_art_loop_closure.py"
      - "tools/run_project_art_intake.py"
      - "tools/project_art_intake_*.py"
      - "tools/build_project_art_atlas.py"
      - "tools/project_art_atlas_*.py"
      - "tools/project_art_workspace_mcp.mjs"
      - "config/project-art-operations.v1.json"
      - "config/mcp.project-art-workspace.windows.example.json"
      - "docs/PROJECT_ART_WORKBENCH.md"
      - "docs/PROJECT_ART_LOOP_CLOSURE.md"
      - "docs/PROJECT_ART_CHAT_INTAKE_AND_ATLASES.md"
      - "package.json"
      - "requirements-image-pipeline.txt"
      - ".github/workflows/project-art-workbench.yml"

permissions:
  contents: read

concurrency:
  group: project-art-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route Python bytecode outside the repository
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/project-art-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Verify exact Python image toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" == "3.13.5" ]]
          [[ "$(python -c 'import PIL; print(PIL.__version__)')" == "12.2.0" ]]

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Bootstrap real media tools with bounded fallback
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact artifact and provider implementations
        run: pnpm run build:domain

      - name: Verify project-art contracts and static authority boundary
        run: node scripts/check-project-art-workbench.mjs

      - name: Run final-to-first loop-closure adversary
        env:
          PROJECT_ART_REQUIRE_PILLOW: "1"
          PROJECT_ART_REQUIRE_PROVIDER_VALIDATION: "1"
        run: pnpm run project-art:loop:check

      - name: Run image, sheet, sequence, artifact, and provider regressions
        env:
          PROJECT_ART_REQUIRE_PILLOW: "1"
          PROJECT_ART_REQUIRE_PROVIDER_VALIDATION: "1"
        run: node scripts/test-project-art-workbench.mjs

      - name: Run callable project-art workspace MCP regressions
        env:
          PROJECT_ART_REQUIRE_PILLOW: "1"
          PROJECT_ART_REQUIRE_PROVIDER_VALIDATION: "1"
        run: node scripts/test-project-art-workspace-mcp.mjs

      - name: Verify chat intake, storage handoff, atlas and MCP contracts
        run: node scripts/check-project-art-intake.mjs

      - name: Run exact intake and variable-atlas regressions
        env:
          PROJECT_ART_REQUIRE_PILLOW: "1"
        run: node scripts/test-project-art-intake.mjs

      - name: Verify permanent authority assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'evavo.project-art-intelligence.v1' scripts/project-art/intelligence.mjs
          grep -F 'wholeRunAtomicPublication: true' scripts/project-art/sandbox.mjs
          grep -F 'requiresFreshExecutionAuthorization: true' scripts/project-art/reference-derived.mjs
          grep -F 'independentApprovalPerformed: false' scripts/project-art/reference-derived.mjs
          grep -F 'evavo.project-art-loop-closure-plan.v1' scripts/compile-project-art-loop-closure.mjs
          grep -F 'PROJECT_ART_LOOP_CLOSURE_REQUEST_BYTES_MISMATCH' scripts/compile-project-art-loop-closure.mjs
          grep -F 'sourceHashesRevalidatedAfterExecution' tools/run_project_art_loop_closure.py
          grep -F '"targetRepositoryMutation": False' tools/run_project_art_loop_closure.py
          grep -F 'evavo.project-art-intake-plan.v1' scripts/project-art/intake-contract.mjs
          grep -F 'evavo.storage-art-ingest-request.v1' tools/project_art_intake_contract.py
          grep -F 'evavo.project-art-atlas-plan.v1' scripts/project-art/atlas-contract.mjs
          grep -F 'evavo.project-art-godot-region-map.v1' tools/project_art_atlas_execution.py
          grep -F 'evavo.project-art-workspace-capabilities.v1' tools/project_art_workspace_mcp.mjs
          grep -F 'evavo_art_run_sandbox' tools/project_art_workspace_mcp.mjs
          grep -F 'evavo_art_compile_reference_plan' tools/project_art_workspace_mcp.mjs
          grep -F 'EVAVO_ART_WORKSPACE_MCP_ALLOW_WRITE' tools/project_art_workspace_mcp.mjs
          grep -F 'shell: false' tools/project_art_workspace_mcp.mjs
          grep -F 'bytesFlowThroughMcp: false' tools/project_art_workspace_mcp.mjs
          grep -F 'credentialsForwardedToSubprocess: false' tools/project_art_workspace_mcp.mjs
          grep -F 'rawCommandOutputReturned: false' tools/project_art_workspace_mcp.mjs
          grep -F 'contains a symbolic-link component' tools/project_art_workspace_mcp.mjs
          grep -F '"providerExecution": False' tools/run_project_art_sandbox.py
          grep -F '"targetRepositoryMutation": False' tools/run_project_art_sandbox.py
          grep -F '"repositoryMutation": False' tools/project_art_intake_execution.py
          grep -F '"repositoryMutation": False' tools/project_art_atlas_execution.py
          ! grep -F 'candidateApproval: true' scripts/project-art/reference-derived.mjs
          ! grep -F 'candidatePromotion: true' scripts/project-art/reference-derived.mjs
          ! grep -F 'forcePush: true' scripts/project-art/reference-derived.mjs
          ! grep -F 'git push' tools/run_project_art_sandbox.py
          ! grep -F 'git push' tools/run_project_art_loop_closure.py
          ! grep -F 'git push' tools/run_project_art_intake.py
          ! grep -F 'git push' tools/build_project_art_atlas.py
          ! grep -F 'candidateApproval: true' tools/project_art_workspace_mcp.mjs
          ! grep -F 'candidatePromotion: true' tools/project_art_workspace_mcp.mjs
          ! grep -F 'forcePush: true' tools/project_art_workspace_mcp.mjs
          ! grep -F 'git push' tools/project_art_workspace_mcp.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/__pycache__
          test -z "$(find tools scripts -type f -name '*.pyc' -print -quit)"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
