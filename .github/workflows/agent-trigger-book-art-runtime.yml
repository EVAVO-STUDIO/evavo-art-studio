name: Agent Trigger Book Art Runtime Landing

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-trigger-book-art-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  land:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/book-art-provider-runtime-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact branch boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ "$(git rev-parse HEAD^)" == "b44b2778ba5585ab91fd23667d3b658dc6f4542c" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Extract and apply checksum-bound reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          expected = '19db27d71db95bbb09ea6655eb496241e8603791177632238ad97fa4e0f0d622'
          source = Path('.github/workflows/agent-apply-book-art-runtime.yml').read_text(encoding='utf-8')
          start = source.index('H4sI')
          end = source.index('\nPATCH64', start)
          payload = ''.join(source[start:end].split())

          def verified(candidate: str):
              try:
                  decoded = base64.b64decode(candidate, validate=True)
              except Exception:
                  return None
              return decoded if hashlib.sha256(decoded).hexdigest() == expected else None

          decoded = verified(payload)
          if decoded is None:
              for index in range(len(payload)):
                  decoded = verified(payload[:index] + payload[index + 1:])
                  if decoded is not None:
                      print(f'Removed one checksum-proven transport character at offset {index}.')
                      break
          if decoded is None:
              raise SystemExit('Embedded Book Art runtime patch cannot be reconciled to its reviewed SHA-256.')
          Path(os.environ['RUNNER_TEMP'], 'book-art-runtime.patch.gz').write_bytes(decoded)
          PY
          printf '%s  %s\n' \
            '19db27d71db95bbb09ea6655eb496241e8603791177632238ad97fa4e0f0d622' \
            "${RUNNER_TEMP}/book-art-runtime.patch.gz" | sha256sum --check
          gzip --decompress --stdout "${RUNNER_TEMP}/book-art-runtime.patch.gz" > "${RUNNER_TEMP}/book-art-runtime.patch"
          git apply --check "${RUNNER_TEMP}/book-art-runtime.patch"
          git apply --index "${RUNNER_TEMP}/book-art-runtime.patch"
          git rm -f \
            .github/workflows/agent-apply-book-art-runtime.yml \
            .github/workflows/agent-trigger-book-art-runtime.yml
          git add -A

      - name: Verify exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-book-art-provider-runtime.mjs
          node scripts/check-book-studio-production-handoff.mjs
          node scripts/check-book-illustration-plan-parity.mjs
          node --check scripts/check-book-art-provider-runtime.mjs
          node --check apps/worker/test/book-art-provider-jobs.test.mjs
          git diff --cached --check
          [[ "$(git write-tree)" == "28d46750a360ec203608231fadb84bc419da7c50" ]]

      - name: Commit and push exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(book-art): complete durable provider shadow runtime'
          git push origin HEAD:refs/heads/agent/book-art-provider-runtime-20260802
