name: Agent Trigger Book Art Runtime Landing

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: agent-trigger-book-art-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  land:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/book-art-provider-runtime-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact branch boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ "$(git rev-parse HEAD^)" == "447dc9e09744146f25d91f44f11458e906c91a90" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Reconstruct and apply checksum-bound reviewed patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          expected_sha = '19db27d71db95bbb09ea6655eb496241e8603791177632238ad97fa4e0f0d622'
          request = Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments?per_page=100",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urlopen(request, timeout=30) as response:
              comments = json.load(response)

          parts = []
          for part in range(1, 6):
              marker = f'BOOK_ART_RUNTIME_PATCH_PART_{part}_OF_5\n'
              matches = [
                  comment.get('body', '')[len(marker):].strip()
                  for comment in comments
                  if comment.get('body', '').startswith(marker)
              ]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one transport comment for part {part}; found {len(matches)}.')
              parts.append(matches[0])

          payload = ''.join(parts)
          if len(payload) != 14632:
              raise SystemExit(f'Book Art runtime transport length mismatch: {len(payload)}.')
          decoded = base64.b64decode(payload, validate=True)
          if len(decoded) != 10974:
              raise SystemExit(f'Book Art runtime gzip length mismatch: {len(decoded)}.')
          if hashlib.sha256(decoded).hexdigest() != expected_sha:
              raise SystemExit('Book Art runtime gzip SHA-256 mismatch.')
          Path(os.environ['RUNNER_TEMP'], 'book-art-runtime.patch.gz').write_bytes(decoded)
          PY
          printf '%s  %s\n' \
            '19db27d71db95bbb09ea6655eb496241e8603791177632238ad97fa4e0f0d622' \
            "${RUNNER_TEMP}/book-art-runtime.patch.gz" | sha256sum --check
          gzip --decompress --stdout "${RUNNER_TEMP}/book-art-runtime.patch.gz" > "${RUNNER_TEMP}/book-art-runtime.patch"
          git apply --check "${RUNNER_TEMP}/book-art-runtime.patch"
          git apply --index "${RUNNER_TEMP}/book-art-runtime.patch"
          git rm -f \
            .github/workflows/agent-apply-book-art-runtime.yml \
            .github/workflows/agent-trigger-book-art-runtime.yml
          git add -A

      - name: Verify exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-book-art-provider-runtime.mjs
          node scripts/check-book-studio-production-handoff.mjs
          node scripts/check-book-illustration-plan-parity.mjs
          node --check scripts/check-book-art-provider-runtime.mjs
          node --check apps/worker/test/book-art-provider-jobs.test.mjs
          git diff --cached --check
          [[ "$(git write-tree)" == "28d46750a360ec203608231fadb84bc419da7c50" ]]

      - name: Commit and push exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(book-art): complete durable provider shadow runtime'
          git push origin HEAD:refs/heads/agent/book-art-provider-runtime-20260802
