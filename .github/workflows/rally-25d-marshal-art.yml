name: Rally 2.5D Marshal Art Contract
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rally-25d-marshal-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Test deterministic marshal jobs
        run: node --test scripts/game-art-production/rally-25d-marshal-jobs.test.mjs
      - name: Compile and verify marshal session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-marshal-jobs.mjs compile \
            config/game-art-production/characters/marshal-production-v1.json \
            --output "${RUNNER_TEMP}/marshal.session.json" > "${RUNNER_TEMP}/marshal.stdout.json"
          node scripts/game-art-production/rally-25d-marshal-jobs.mjs verify \
            "${RUNNER_TEMP}/marshal.session.json" | tee "${RUNNER_TEMP}/marshal.verify.json"
          grep -F '"schema": "evavo.rally-marshal-provider-job-session.v1"' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"jobs": 13' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"images": 13' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"modelingJobs": 3' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"animationJobs": 5' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"animationClips": 5' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"providerExecution": false' "${RUNNER_TEMP}/marshal.session.json"
          grep -F '"downstream3DReady": false' "${RUNNER_TEMP}/marshal.session.json"
      - name: Prove source remains clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
