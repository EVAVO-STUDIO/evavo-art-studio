name: Project Art Top Hat Pose Bank Candidate Materialization Campaign

on:
  pull_request:
    paths:
      - "packages/artifacts/src/**"
      - "packages/media/src/**"
      - "packages/providers/src/**"
      - "scripts/project-art/avatar-final-pass-provider-candidate-*.mjs"
      - "scripts/project-art/avatar-final-pass-provider-runtime-*.mjs"
      - "scripts/project-art/top-hat-pose-slot-provider-runtime-*.mjs"
      - "scripts/project-art/top-hat-pose-slot-candidate-admission-*.mjs"
      - "scripts/project-art/top-hat-pose-bank-provider-campaign.mjs"
      - "scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs"
      - "scripts/run-project-art-top-hat-pose-bank-provider-campaign.mjs"
      - "scripts/run-project-art-top-hat-pose-bank-candidate-materialization-campaign.mjs"
      - "scripts/test-project-art-top-hat-pose-bank-candidate-materialization-*.mjs"
      - "docs/PROJECT_ART_TOP_HAT_POSE_BANK_CANDIDATE_MATERIALIZATION_CAMPAIGN.md"
      - ".github/workflows/project-art-top-hat-pose-bank-candidate-materialization-campaign.yml"
  push:
    branches: [main]
    paths:
      - "packages/artifacts/src/**"
      - "packages/media/src/**"
      - "packages/providers/src/**"
      - "scripts/project-art/avatar-final-pass-provider-candidate-*.mjs"
      - "scripts/project-art/avatar-final-pass-provider-runtime-*.mjs"
      - "scripts/project-art/top-hat-pose-slot-provider-runtime-*.mjs"
      - "scripts/project-art/top-hat-pose-slot-candidate-admission-*.mjs"
      - "scripts/project-art/top-hat-pose-bank-provider-campaign.mjs"
      - "scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs"
      - "scripts/run-project-art-top-hat-pose-bank-provider-campaign.mjs"
      - "scripts/run-project-art-top-hat-pose-bank-candidate-materialization-campaign.mjs"
      - "scripts/test-project-art-top-hat-pose-bank-candidate-materialization-*.mjs"
      - "docs/PROJECT_ART_TOP_HAT_POSE_BANK_CANDIDATE_MATERIALIZATION_CAMPAIGN.md"
      - ".github/workflows/project-art-top-hat-pose-bank-candidate-materialization-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-art-top-hat-pose-bank-candidate-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact materialization dependency closure
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-media build
          pnpm --filter @evavo/art-providers build

      - name: Run six-slot candidate materialization regressions
        run: node --test scripts/test-project-art-top-hat-pose-bank-candidate-materialization-*.mjs

      - name: Import production CLI without execution
        run: node -e "import('./scripts/run-project-art-top-hat-pose-bank-candidate-materialization-campaign.mjs')"

      - name: Verify materialization authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "preflightAllSlotsBeforeFirstWrite: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "stopOnFirstFailure: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "createOnlyCandidateBundles: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "providerExecution: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "candidateMaterialization: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "creativeReview: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "candidateApproval: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "candidatePromotion: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "poseSlotFilling: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "sequenceRelease: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "publication: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          grep -F "runtimeActivation: false" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          ! grep -F "admitProjectArtTopHatPoseSlotCandidate" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          ! grep -F "candidateApproval: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          ! grep -F "publication: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs
          ! grep -F "runtimeActivation: true" scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
