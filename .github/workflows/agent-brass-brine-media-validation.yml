name: Agent Brass and Brine media validation

on:
  push:
    branches:
      - agent/brass-brine-media-plan-20260804
  pull_request:
    paths:
      - ".github/workflows/agent-brass-brine-media-validation.yml"
      - "packages/delivery-optimizer/**"
      - "docs/delivery-image-optimization.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-brass-brine-media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install review-first dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck delivery optimizer
        run: pnpm --filter @evavo/art-delivery-optimizer typecheck

      - name: Test delivery optimizer
        run: pnpm --filter @evavo/art-delivery-optimizer test

      - name: Verify source remains clean except generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
