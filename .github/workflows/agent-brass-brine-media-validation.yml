name: Agent Brass and Brine media validation

on:
  push:
    branches:
      - agent/brass-brine-media-plan-20260804
  pull_request:
    paths:
      - ".github/workflows/agent-brass-brine-media-validation.yml"
      - "packages/delivery-optimizer/**"
      - "docs/delivery-image-optimization.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-brass-brine-media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install review-first dependencies
        run: pnpm install --frozen-lockfile

      - name: Build delivery optimizer dependency closure
        run: pnpm --filter @evavo/art-delivery-optimizer... build

      - name: Typecheck delivery optimizer
        run: pnpm --filter @evavo/art-delivery-optimizer typecheck

      - name: Test delivery optimizer
        run: pnpm --filter @evavo/art-delivery-optimizer test

      - name: Verify source remains clean except generated outputs
        shell: bash
        run: |
          set -euo pipefail
          find packages -type d -name dist -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
