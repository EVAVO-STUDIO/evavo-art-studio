name: Agent Brass and Brine media validation

on:
  push:
    branches:
      - agent/brass-brine-media-plan-20260804
      - agent/brass-runtime-profiles-20260804
  pull_request:
    paths:
      - ".github/workflows/agent-brass-brine-media-validation.yml"
      - "packages/delivery-optimizer/**"
      - "docs/delivery-image-optimization.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-brass-brine-media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-optimizer:
    if: ${{ !contains(github.event.head_commit.message || '', '[webp-proof]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/brass-runtime-profiles-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact transparent-RGB evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if new in source:
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one repair anchor, found {count}")
              target.write_text(source.replace(old, new), encoding="utf-8", newline="\n")

          replace_exact(
              "packages/delivery-optimizer/src/types.ts",
              """  readonly comparedColourSamples: number;\n  readonly pixels: number;\n}""",
              """  readonly comparedColourSamples: number;\n  readonly pixels: number;\n  readonly transparentRgbComparedPixels: number;\n  readonly transparentRgbDifferingPixels: number;\n  readonly transparentRgbMaximumDifference: number;\n}""",
          )
          replace_exact(
              "packages/delivery-optimizer/src/raster.ts",
              """  let alphaAbsolute = 0;\n  let alphaMaximumDifference = 0;\n  const pixels = reference.byteLength / 4;\n""",
              """  let alphaAbsolute = 0;\n  let alphaMaximumDifference = 0;\n  const pixels = reference.byteLength / 4;\n  let transparentRgbComparedPixels = 0;\n  let transparentRgbDifferingPixels = 0;\n  let transparentRgbMaximumDifference = 0;\n""",
          )
          replace_exact(
              "packages/delivery-optimizer/src/raster.ts",
              """    const alphaDifference = Math.abs(referenceAlpha - candidateAlpha);\n    alphaAbsolute += alphaDifference;\n    alphaMaximumDifference = Math.max(alphaMaximumDifference, alphaDifference);\n    const weight = Math.max(referenceAlpha, candidateAlpha) / 255;\n""",
              """    const alphaDifference = Math.abs(referenceAlpha - candidateAlpha);\n    alphaAbsolute += alphaDifference;\n    alphaMaximumDifference = Math.max(alphaMaximumDifference, alphaDifference);\n    if (referenceAlpha === 0 && candidateAlpha === 0) {\n      transparentRgbComparedPixels += 1;\n      let pixelDiffers = false;\n      for (let channel = 0; channel < 3; channel += 1) {\n        const difference = Math.abs(\n          reference[offset + channel]! - candidate[offset + channel]!,\n        );\n        if (difference > 0) pixelDiffers = true;\n        transparentRgbMaximumDifference = Math.max(\n          transparentRgbMaximumDifference,\n          difference,\n        );\n      }\n      if (pixelDiffers) transparentRgbDifferingPixels += 1;\n    }\n    const weight = Math.max(referenceAlpha, candidateAlpha) / 255;\n""",
          )
          replace_exact(
              "packages/delivery-optimizer/src/raster.ts",
              """    comparedColourSamples: colourSamples,\n    pixels,\n  };\n}""",
              """    comparedColourSamples: colourSamples,\n    pixels,\n    transparentRgbComparedPixels,\n    transparentRgbDifferingPixels,\n    transparentRgbMaximumDifference,\n  };\n}""",
          )
          replace_exact(
              "packages/delivery-optimizer/src/encoding.ts",
              """      nearLossless:\n        candidate.lossless === true ? false : candidate.nearLossless,\n      smartSubsample: false,\n""",
              """      nearLossless:\n        candidate.lossless === true ? false : candidate.nearLossless,\n      exact: candidate.lossless === true,\n      smartSubsample: false,\n""",
          )
          replace_exact(
              "packages/delivery-optimizer/src/encoding.ts",
              """  if (\n    profile.transparencyPolicy === \"opaque\" &&\n    evidence.alpha.transparentPixels + evidence.alpha.partialPixels > 0\n  ) {\n    failures.push(\"opaque-profile-retained-transparency\");\n  }\n  return failures;\n}""",
              """  if (\n    profile.transparencyPolicy === \"opaque\" &&\n    evidence.alpha.transparentPixels + evidence.alpha.partialPixels > 0\n  ) {\n    failures.push(\"opaque-profile-retained-transparency\");\n  }\n  if (\n    profileId === \"godot-cutout-webp-1080p\" &&\n    evidence.format === \"webp\" &&\n    evidence.metrics.transparentRgbDifferingPixels > 0\n  ) {\n    failures.push(\"transparent-rgb-not-preserved\");\n  }\n  return failures;\n}""",
          )
          replace_exact(
              "packages/delivery-optimizer/src/optimizer.ts",
              """        : {\n            quality: encoding.quality,\n            nearLossless: encoding.nearLossless,\n          }),\n""",
              """        : {\n            quality: encoding.quality,\n            nearLossless: encoding.nearLossless,\n            lossless: encoding.lossless === true,\n          }),\n""",
          )
          PY

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install review-first dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build dependency closure
        run: pnpm --filter @evavo/art-delivery-optimizer... build

      - name: Typecheck delivery optimizer
        run: pnpm --filter @evavo/art-delivery-optimizer typecheck

      - name: Test delivery optimizer
        run: pnpm --filter @evavo/art-delivery-optimizer test

      - name: Commit only the proven source repair and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          find packages -type d -name dist -prune -exec rm -rf {} +
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/agent-brass-brine-media-validation.yml > .github/workflows/agent-brass-brine-media-validation.yml
          rm -f .github/workflows/repair-lossless-webp-proof.yml
          git diff --check
          git add \
            .github/workflows/agent-brass-brine-media-validation.yml \
            .github/workflows/repair-lossless-webp-proof.yml \
            packages/delivery-optimizer/src/types.ts \
            packages/delivery-optimizer/src/raster.ts \
            packages/delivery-optimizer/src/encoding.ts \
            packages/delivery-optimizer/src/optimizer.ts
          git config user.name "EVAVO Studio Automation"
          git config user.email "automation@evavo.invalid"
          git commit -m "fix(delivery): prove transparent RGB preservation [webp-proof]"
          git push origin HEAD:agent/brass-runtime-profiles-20260804
