name: Temporary exact provider source export

on:
  push:
    branches:
      - automation/source-export-20260828

permissions:
  contents: read

concurrency:
  group: art-studio-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify bounded source set
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/providers/src/adapters/openai-images.ts
          test -f packages/providers/test/providers.test.mjs
          test -f AGENTS.md
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Upload exact provider source set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: art-studio-provider-source-${{ github.sha }}
          path: |
            packages/providers/src/adapters/openai-images.ts
            packages/providers/src/adapters/openai-images-governed.ts
            packages/providers/test/providers.test.mjs
            packages/providers/package.json
            AGENTS.md
          if-no-files-found: error
          retention-days: 1
