name: Apply Book Art Promotion Adapter Patch

on:
  push:
    branches:
      - agent/book-art-promotion-receipt-20260802
    paths:
      - ".github/workflows/book-art-promotion-adapter-patch.yml"

permissions:
  contents: write

concurrency:
  group: book-art-promotion-adapter-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/book-art-promotion-receipt-20260802
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact ArrayBuffer-backed Web Crypto fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/contracts/src/book-production-promotion-adapter.ts")
          source = path.read_text(encoding="utf-8")
          old = '''async function sha256Bytes(value: Uint8Array): Promise<string> {
            const digest = await globalThis.crypto.subtle.digest("SHA-256", value);
            return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
          }'''
          new = '''async function sha256Bytes(value: Uint8Array): Promise<string> {
            const buffer = new ArrayBuffer(value.byteLength);
            new Uint8Array(buffer).set(value);
            const digest = await globalThis.crypto.subtle.digest("SHA-256", buffer);
            return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
          }'''
          if source.count(old) != 1:
              raise SystemExit("Expected exact sha256Bytes implementation was not found once.")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- packages/contracts/src/book-production-promotion-adapter.ts
      - name: Commit exact source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/book-production-promotion-adapter.ts
          git commit -m "fix(book-art): use ArrayBuffer-backed Web Crypto input"
          git push origin HEAD:agent/book-art-promotion-receipt-20260802
