name: Agent Cancel Superseded Exact Docs Book Art Brief

on:
  push:
    branches:
      - agent/exact-docs-book-art-brief-20260803

permissions:
  contents: read

concurrency:
  group: agent-complete-exact-docs-book-art-brief
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Supersede obsolete exact Docs receiver runs
        run: echo 'superseded exact Docs receiver validations cancelled'
