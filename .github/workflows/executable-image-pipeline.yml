name: Executable image pipeline

on:
  pull_request:
    paths:
      - "config/executable-image-pipeline.v1.json"
      - "requirements-image-pipeline.txt"
      - "tools/image_style_features.py"
      - "tools/build_image_style_reference_bank.py"
      - "tools/process_image_work_order.py"
      - "tools/process_image_work_order_system_drawing.ps1"
      - "tools/evaluate_image_candidate.py"
      - "tools/verify_executable_image_pipeline.py"
      - ".github/workflows/executable-image-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executable-image-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt
      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt
      - name: Verify exact Python image toolchain
        run: |
          python - <<'PY'
          import PIL
          import sys

          assert sys.version_info[:3] == (3, 13, 5), sys.version
          assert PIL.__version__ == "12.2.0", PIL.__version__
          PY
      - name: Compile Python sources
        run: python -m py_compile tools/image_style_features.py tools/build_image_style_reference_bank.py tools/process_image_work_order.py tools/evaluate_image_candidate.py tools/verify_executable_image_pipeline.py
      - name: Run executable and adversarial image checks
        run: python tools/verify_executable_image_pipeline.py
