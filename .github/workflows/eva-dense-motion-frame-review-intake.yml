name: EVA dense-motion named-human frame-review intake

on:
  pull_request:
    paths:
      - "scripts/project-art/eva-dense-motion-frame-review-intake.mjs"
      - "scripts/run-project-art-eva-dense-motion-frame-review-intake.mjs"
      - "scripts/test-project-art-eva-dense-motion-frame-review-intake.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-review-preflight.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-review-pinned.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/eva-dense-motion-mastering-campaign.mjs"
      - "scripts/project-art/eva-dense-motion-ten-master-program.mjs"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_FRAME_REVIEW_INTAKE.md"
      - ".github/workflows/eva-dense-motion-frame-review-intake.yml"
  push:
    branches: [main]
    paths:
      - "scripts/project-art/eva-dense-motion-frame-review-intake.mjs"
      - "scripts/run-project-art-eva-dense-motion-frame-review-intake.mjs"
      - "scripts/test-project-art-eva-dense-motion-frame-review-intake.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-review-preflight.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-review-pinned.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/eva-dense-motion-mastering-campaign.mjs"
      - "scripts/project-art/eva-dense-motion-ten-master-program.mjs"
      - "docs/PROJECT_ART_EVA_DENSE_MOTION_FRAME_REVIEW_INTAKE.md"
      - ".github/workflows/eva-dense-motion-frame-review-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-motion-frame-review-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Syntax-check review intake surface
        run: |
          node --check scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          node --check scripts/run-project-art-eva-dense-motion-frame-review-intake.mjs
          node --check scripts/test-project-art-eva-dense-motion-frame-review-intake.mjs

      - name: Run ten-frame human-review contract guard
        run: node scripts/test-project-art-eva-dense-motion-frame-review-intake.mjs

      - name: Verify no approval or release authority was introduced
        shell: bash
        run: |
          set -euo pipefail
          grep -F "allTenShadowReviewedBeforeFirstPersistentOutcome: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          grep -F "decisionsMustBeExternallyAuthoredNamedHumanEvidence: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          grep -F "automaticDecisionCreationAllowed: false" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          grep -F "exactDecisionFileShaPinnedAfterPreflight: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          grep -F "technicalInspectionsCreated: 0" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          grep -F "creativeApprovalsCreated: 0" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          ! grep -F "humanDecisionCreation: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          ! grep -F "candidatePromotion: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          ! grep -F "cloudinaryUpload: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          ! grep -F "sequenceRelease: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs
          ! grep -F "runtimeActivation: true" scripts/project-art/eva-dense-motion-frame-review-intake.mjs

      - name: Prove source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
