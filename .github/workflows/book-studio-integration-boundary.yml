name: Book Studio Integration Boundary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-studio-integration-boundary.yml"
      - "docs/book-studio-integration-boundary.md"
      - "docs/book-studio-integration-boundary.json"
      - "scripts/check-book-studio-integration-boundary.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/book-studio-integration-boundary.yml"
      - "docs/book-studio-integration-boundary.md"
      - "docs/book-studio-integration-boundary.json"
      - "scripts/check-book-studio-integration-boundary.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-studio-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Verify integration boundary
        run: node scripts/check-book-studio-integration-boundary.mjs
