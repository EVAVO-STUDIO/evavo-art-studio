name: Book Studio Integration Boundary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-studio-integration-boundary.yml"
      - "docs/book-studio-integration-boundary.md"
      - "docs/book-studio-integration-boundary.json"
      - "scripts/check-book-studio-integration-boundary.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/book-studio-integration-boundary.yml"
      - "docs/book-studio-integration-boundary.md"
      - "docs/book-studio-integration-boundary.json"
      - "scripts/check-book-studio-integration-boundary.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-studio-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Verify integration boundary
        run: node scripts/check-book-studio-integration-boundary.mjs
