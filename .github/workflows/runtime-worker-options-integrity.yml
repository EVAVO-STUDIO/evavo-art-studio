name: Runtime worker option integrity

on:
  pull_request:
    paths:
      - "packages/runtime/src/normalize.ts"
      - "packages/runtime/src/worker.ts"
      - "packages/runtime/test/worker-options-integrity-security.test.mjs"
      - "scripts/check-provider-runtime-capability-profiles.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-worker-options-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "packages/runtime/src/normalize.ts"
      - "packages/runtime/src/worker.ts"
      - "packages/runtime/test/worker-options-integrity-security.test.mjs"
      - "scripts/check-provider-runtime-capability-profiles.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-worker-options-integrity.yml"

permissions:
  contents: read

concurrency:
  group: runtime-worker-options-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check runtime worker dependencies
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-runtime build
          pnpm --filter @evavo/art-runtime typecheck

      - name: Run worker configuration and persistence regressions
        run: >-
          node --test
          packages/runtime/test/runtime.test.mjs
          packages/runtime/test/redrive-policy.test.mjs
          packages/runtime/test/journal-integrity-security.test.mjs
          packages/runtime/test/submission-integrity-security.test.mjs
          packages/runtime/test/worker-options-integrity-security.test.mjs

      - name: Verify permanent runtime worker option contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const source = runtimeInputRecord(input, "Worker descriptor", code);' packages/runtime/src/normalize.ts
          grep -F 'const queuesInput = readRuntimeInput(source, "queues", "worker", code);' packages/runtime/src/normalize.ts
          grep -F 'snapshotRuntimeWorkerOptions' packages/runtime/src/worker.ts
          grep -F 'snapshotHandlers' packages/runtime/src/worker.ts
          grep -F 'runtime worker descriptors are snapshotted once before scheduling' packages/runtime/test/worker-options-integrity-security.test.mjs
          grep -F 'runtime worker options bind execution to one immutable handler snapshot' packages/runtime/test/worker-options-integrity-security.test.mjs
          grep -F 'hostile runtime worker options fail closed without leaking errors' packages/runtime/test/worker-options-integrity-security.test.mjs
          grep -F 'Runtime worker capability profiles must be bound through the immutable option snapshot.' scripts/check-provider-runtime-capability-profiles.mjs
          ! grep -F 'input.queues === undefined' packages/runtime/src/normalize.ts
          ! grep -F '...options,' packages/runtime/src/worker.ts
          node scripts/check-provider-runtime-capability-profiles.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
