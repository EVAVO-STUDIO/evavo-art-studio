name: Project Art Review Studio

on:
  pull_request:
    paths:
      - "scripts/project-art/review-studio.mjs"
      - "scripts/compile-project-art-review.mjs"
      - "scripts/build-project-art-review.mjs"
      - "scripts/finalize-project-art-review.mjs"
      - "scripts/check-project-art-review.mjs"
      - "scripts/test-project-art-review.mjs"
      - "tools/project_art_review_mcp.mjs"
      - "config/mcp.project-art-review.windows.example.json"
      - "docs/PROJECT_ART_REVIEW_STUDIO.md"
      - "package.json"
      - "requirements-image-pipeline.txt"
      - ".github/workflows/project-art-review-studio.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/project-art/review-studio.mjs"
      - "scripts/compile-project-art-review.mjs"
      - "scripts/build-project-art-review.mjs"
      - "scripts/finalize-project-art-review.mjs"
      - "scripts/check-project-art-review.mjs"
      - "scripts/test-project-art-review.mjs"
      - "tools/project_art_review_mcp.mjs"
      - "config/mcp.project-art-review.windows.example.json"
      - "docs/PROJECT_ART_REVIEW_STUDIO.md"
      - "package.json"
      - "requirements-image-pipeline.txt"
      - ".github/workflows/project-art-review-studio.yml"

permissions:
  contents: read

concurrency:
  group: project-art-review-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route Python bytecode outside the repository
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/project-art-review-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Verify exact Python image toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" == "3.13.5" ]]
          [[ "$(python -c 'import PIL; print(PIL.__version__)')" == "12.2.0" ]]

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Bootstrap real media tools with bounded fallback
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify Project Art Review Studio contracts and attacks
        run: pnpm run project-art:review:check

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/__pycache__
          test -z "$(find tools scripts -type f -name '*.pyc' -print -quit)"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
