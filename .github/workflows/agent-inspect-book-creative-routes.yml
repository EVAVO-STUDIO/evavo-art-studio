name: Agent Inspect Book Creative Routes

on:
  push:
    branches:
      - agent/book-creative-direction-final-20260807
    paths:
      - ".github/workflows/agent-inspect-book-creative-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Print bounded selector context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('packages/contracts/src/book-creative-direction.ts').read_text(encoding='utf-8')
          needles = [
              'environmental_pressure',
              '.slice(0,input.routeCount)',
              '.slice(0, input.routeCount)',
              'routeSeeds',
              'selectRoutes',
          ]
          seen = set()
          for needle in needles:
              start = 0
              while True:
                  index = text.find(needle, start)
                  if index < 0:
                      break
                  key = (max(0, index - 1200), min(len(text), index + 1800))
                  if key not in seen:
                      seen.add(key)
                      print(f'--- {needle} @ {index} ---')
                      print(text[key[0]:key[1]])
                  start = index + len(needle)
          print(f'FILE_LENGTH={len(text)}')
          PY
