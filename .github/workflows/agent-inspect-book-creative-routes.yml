name: Agent Fix Book Creative Route Diversity

on:
  push:
    branches:
      - agent/book-creative-direction-final-20260807
    paths:
      - ".github/workflows/agent-inspect-book-creative-routes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-fix-book-creative-route-diversity
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preserve setting evidence in the core route set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/contracts/src/book-creative-direction.ts")
          text = path.read_text(encoding="utf-8")
          route_start = text.find('x.push(seed("environmental_pressure"')
          route_end = text.find('"relational_tension"', route_start)
          if route_start < 0 or route_end < 0 or route_end <= route_start:
              raise SystemExit("environmental-pressure route boundary was not found")
          segment = text[route_start:route_end]
          pattern = re.compile(r'(safe\(scene\)\s*,\s*)94(\s*\)\))')
          matches = list(pattern.finditer(segment))
          if len(matches) != 1:
              raise SystemExit(
                  f"environmental-pressure priority matched {len(matches)} times instead of once"
              )
          segment = pattern.sub(r'\g<1>99\g<2>', segment, count=1)
          path.write_text(
              text[:route_start] + segment + text[route_end:],
              encoding="utf-8",
              newline="\n",
          )
          PY
          git diff --check

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Run contracts build, tests and strict typecheck
        run: |
          pnpm --filter @evavo/art-contracts test
          pnpm --filter @evavo/art-contracts typecheck

      - name: Remove diagnostic carrier and publish verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-inspect-book-creative-routes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/book-creative-direction.ts \
            .github/workflows/agent-inspect-book-creative-routes.yml
          git diff --cached --check
          git commit -m "fix(book-art): preserve environmental concept coverage"
          git push origin HEAD:refs/heads/agent/book-creative-direction-final-20260807
