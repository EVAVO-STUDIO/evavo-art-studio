name: Agent Fix Book Creative Route Diversity

on:
  push:
    branches:
      - agent/book-creative-direction-final-20260807
    paths:
      - ".github/workflows/agent-inspect-book-creative-routes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-fix-book-creative-route-diversity
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preserve setting evidence in the core route set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/contracts/src/book-creative-direction.ts")
          text = path.read_text(encoding="utf-8")
          old = 'marks,!scene||safe(scene),94));if(a)'
          new = 'marks,!scene||safe(scene),99));if(a)'
          if text.count(old) != 1:
              raise SystemExit(
                  "environmental-pressure route priority patch did not match exactly once"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Run contracts build, tests and strict typecheck
        run: |
          pnpm --filter @evavo/art-contracts test
          pnpm --filter @evavo/art-contracts typecheck

      - name: Remove diagnostic carrier and publish verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-inspect-book-creative-routes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/book-creative-direction.ts \
            .github/workflows/agent-inspect-book-creative-routes.yml
          git diff --cached --check
          git commit -m "fix(book-art): preserve environmental concept coverage"
          git push origin HEAD:refs/heads/agent/book-creative-direction-final-20260807
