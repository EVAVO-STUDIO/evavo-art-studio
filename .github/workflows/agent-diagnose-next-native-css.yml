name: Agent Diagnose Next Native CSS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-diagnose-next-native-css-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/diagnose-next-native-css-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact workflow-only boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ "$(git rev-parse HEAD^)" == "5d13b9c24d21c5277ea111c99c6e6aa4bc064055" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/agent-diagnose-next-native-css.yml"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Inspect exact Next native module contracts
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          next_package="$(find node_modules/.pnpm -path '*/node_modules/next/package.json' -print -quit)"
          test -n "${next_package}"
          next_dir="$(dirname "${next_package}")"
          lightning_package="${next_dir}/dist/compiled/lightningcss/package.json"
          oxide_package="${next_dir}/dist/compiled/@tailwindcss/oxide/package.json"
          test -f "${lightning_package}"
          test -f "${oxide_package}"
          next_version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "${next_package}")"
          lightning_version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "${lightning_package}")"
          oxide_version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "${oxide_package}")"
          printf 'next_dir=%s\nnext_version=%s\nlightning_version=%s\noxide_version=%s\n' \
            "${next_dir}" "${next_version}" "${lightning_version}" "${oxide_version}"
          printf 'next_dir=%s\n' "${next_dir}" >> "${GITHUB_OUTPUT}"
          printf 'lightning_version=%s\n' "${lightning_version}" >> "${GITHUB_OUTPUT}"
          printf 'oxide_version=%s\n' "${oxide_version}" >> "${GITHUB_OUTPUT}"
          echo '--- lightningcss package ---'
          cat "${lightning_package}"
          echo '--- oxide package ---'
          cat "${oxide_package}"
          echo '--- native require sites ---'
          grep -R -n -E 'lightningcss\.linux-x64-gnu|lightningcss-linux-x64-gnu' \
            "${next_dir}/dist/compiled/lightningcss" "${next_dir}/dist/compiled" | head -20 || true
          grep -R -n -E 'tailwindcss-oxide\.linux-x64-gnu|oxide-linux-x64-gnu' \
            "${next_dir}/dist/compiled/@tailwindcss/oxide" "${next_dir}/dist/compiled" | head -20 || true
          echo '--- installed native candidates before repair ---'
          find node_modules/.pnpm -maxdepth 2 -type d \
            \( -name '*lightningcss*linux*x64*gnu*' -o -name '*oxide*linux*x64*gnu*' \) -print || true
          find "${next_dir}/dist/compiled" -type f \( -name '*lightningcss*.node' -o -name '*oxide*.node' \) -print || true

      - name: Install exact native binaries in an isolated prefix
        shell: bash
        env:
          LIGHTNING_VERSION: ${{ steps.inspect.outputs.lightning_version }}
          OXIDE_VERSION: ${{ steps.inspect.outputs.oxide_version }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/native-css"
          mkdir -p "${RUNNER_TEMP}/native-css"
          npm install \
            --prefix "${RUNNER_TEMP}/native-css" \
            --ignore-scripts \
            --no-package-lock \
            --no-audit \
            --no-fund \
            "lightningcss-linux-x64-gnu@${LIGHTNING_VERSION}" \
            "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VERSION}"
          find "${RUNNER_TEMP}/native-css/node_modules" -type f -name '*.node' -print -exec sha256sum {} \;

      - name: Place exact binaries at Next compiled-module require paths
        shell: bash
        env:
          NEXT_DIR: ${{ steps.inspect.outputs.next_dir }}
        run: |
          set -euo pipefail
          lightning_source="${RUNNER_TEMP}/native-css/node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node"
          oxide_source="${RUNNER_TEMP}/native-css/node_modules/@tailwindcss/oxide-linux-x64-gnu/tailwindcss-oxide.linux-x64-gnu.node"
          test -f "${lightning_source}"
          test -f "${oxide_source}"
          lightning_target="${NEXT_DIR}/dist/compiled/lightningcss.linux-x64-gnu.node"
          oxide_target="${NEXT_DIR}/dist/compiled/@tailwindcss/oxide/tailwindcss-oxide.linux-x64-gnu.node"
          install -m 0644 "${lightning_source}" "${lightning_target}"
          install -m 0644 "${oxide_source}" "${oxide_target}"
          sha256sum "${lightning_target}" "${oxide_target}"

      - name: Prove exact web production build
        run: pnpm --filter @evavo/art-studio-web build

      - name: Restore repository cleanliness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
