name: Agent Diagnose Next Native CSS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-diagnose-next-native-css-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/diagnose-next-native-css-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact workflow-only revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ "$(git rev-parse HEAD^)" == "5dd42caff4423ec4e07c8b9a04a36647fdaf9445" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/agent-diagnose-next-native-css.yml"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Inspect installed Next compiled loader paths
        shell: bash
        run: |
          set -euo pipefail
          next_package="$(find node_modules/.pnpm -path '*/node_modules/next/package.json' -print -quit)"
          test -n "${next_package}"
          next_dir="$(dirname "${next_package}")"
          next_version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "${next_package}")"
          printf 'next_dir=%s\nnext_version=%s\n' "${next_dir}" "${next_version}"
          [[ "${next_version}" == "16.2.12" ]]
          find "${next_dir}/dist" -type f | grep -E 'lightningcss|tailwindcss|oxide' | head -100 || true
          grep -R -n -E 'lightningcss-linux-x64-gnu|lightningcss\.linux-x64-gnu|oxide-linux-x64-gnu|tailwindcss-oxide\.linux-x64-gnu' \
            "${next_dir}/dist" | head -100 || true

      - name: Install exact official Linux native packages in isolation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/native-css"
          mkdir -p "${RUNNER_TEMP}/native-css"
          npm install \
            --prefix "${RUNNER_TEMP}/native-css" \
            --ignore-scripts \
            --no-package-lock \
            --no-audit \
            --no-fund \
            'lightningcss-linux-x64-gnu@1.30.2' \
            '@tailwindcss/oxide-linux-x64-gnu@4.1.18'
          test -f "${RUNNER_TEMP}/native-css/node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node"
          test -f "${RUNNER_TEMP}/native-css/node_modules/@tailwindcss/oxide-linux-x64-gnu/tailwindcss-oxide.linux-x64-gnu.node"
          find "${RUNNER_TEMP}/native-css/node_modules" -type f -name '*.node' -print -exec sha256sum {} \;

      - name: Expose exact native packages through normal Node resolution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/@tailwindcss
          ln -sfn \
            "${RUNNER_TEMP}/native-css/node_modules/lightningcss-linux-x64-gnu" \
            node_modules/lightningcss-linux-x64-gnu
          ln -sfn \
            "${RUNNER_TEMP}/native-css/node_modules/@tailwindcss/oxide-linux-x64-gnu" \
            node_modules/@tailwindcss/oxide-linux-x64-gnu
          NODE_PATH="${PWD}/node_modules" node -e "require('lightningcss-linux-x64-gnu'); require('@tailwindcss/oxide-linux-x64-gnu'); console.log('native-css-modules=loaded')"

      - name: Prove exact web production build
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: pnpm --filter @evavo/art-studio-web build

      - name: Restore repository cleanliness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          rm -rf apps/web/.next
          git clean -fdX
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
