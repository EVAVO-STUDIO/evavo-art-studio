name: Temporary apply Pixel Font optional backend fix

on:
  push:
    branches:
      - automation/apply-pixel-font-optional-backend-20260811-v2

permissions:
  contents: write

concurrency:
  group: temporary-apply-pixel-font-optional-backend
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/persistent-artist-mastering-motion-v3-20260811
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ddb016a263f1e31dbda06a17ba76fecb8e1c2c96"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Apply exact optional backend contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          script = root / "scripts/check-pixel-font-studio-v2.mjs"
          text = script.read_text(encoding="utf-8")

          replacements = [
              (
                  '''const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const python = process.env.EVAVO_PIXEL_FONT_PYTHON || (process.platform === "win32" ? "python" : "python3");
          const tool = path.join(root, "tools", "pixel_font_studio_v2.py");
          ''',
                  '''const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const python = process.env.EVAVO_PIXEL_FONT_PYTHON || (process.platform === "win32" ? "python" : "python3");
          const fontToolsRequirement = process.env.EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS?.trim();
          assert.ok(
            fontToolsRequirement === undefined ||
              fontToolsRequirement === "" ||
              fontToolsRequirement === "0" ||
              fontToolsRequirement === "1",
            "EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS must be 0 or 1 when supplied",
          );
          const requireFontTools = fontToolsRequirement === "1";
          const expectedFontToolsVersion = "4.63.0";
          const tool = path.join(root, "tools", "pixel_font_studio_v2.py");
          ''',
              ),
              (
                  '''run(process.execPath, ["--check", path.join(root, "scripts", "pixel-font-studio-v2-mcp.mjs")]);
          run(process.execPath, ["--check", path.join(root, "scripts", "integrate-pixel-font-studio-v2.mjs")]);

          const packagePath = path.join(root, "package.json");
          ''',
                  '''run(process.execPath, ["--check", path.join(root, "scripts", "pixel-font-studio-v2-mcp.mjs")]);
          run(process.execPath, ["--check", path.join(root, "scripts", "integrate-pixel-font-studio-v2.mjs")]);
          const dedicatedWorkflowSource = await readFile(
            path.join(root, ".github", "workflows", "pixel-font-studio-v2.yml"),
            "utf8",
          );
          assert.match(
            dedicatedWorkflowSource,
            /EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS:\\s*["']1["']/u,
            "the dedicated Pixel Font Studio v2 workflow must require the exact fontTools backend",
          );

          const packagePath = path.join(root, "package.json");
          ''',
              ),
              (
                  '''assert.equal(q.glyph.height >= 7, true);

          stage("building and validating deterministic family A");
          ''',
                  '''assert.equal(q.glyph.height >= 7, true);

          stage("checking optional fontTools backend");
          const fontToolsProbe = execute(python, [
            "-c",
            "import fontTools; print(fontTools.__version__)",
          ]);
          const observedFontToolsVersion =
            fontToolsProbe.status === 0 ? fontToolsProbe.stdout.trim() : null;
          const fontToolsReady = observedFontToolsVersion === expectedFontToolsVersion;
          if (requireFontTools && !fontToolsReady) {
            if (temporary) await rm(workspace, { recursive: true, force: true });
            throw new Error(
              `EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS=1 requires fontTools ${expectedFontToolsVersion}; observed ${observedFontToolsVersion ?? "unavailable"}.`,
            );
          }

          if (!fontToolsReady) {
            stage("skipping optional fontTools-backed build verification");
            const optionalBackendReport = {
              schema: "evavo.pixel-font-studio-v2-check.v1",
              toolVersion: "2.2.0",
              familyId: audit.familyId,
              faceCount: audit.faces.length,
              glyphsPerFace: audit.faces.map((item) => item.glyphCount),
              kerningPairsPerFace: audit.faces.map((item) => item.kerningPairCount),
              duplicateGroups: audit.faces.map((item) => item.duplicateGroups.length),
              pairCollisionChecks: audit.faces.map((item) => item.collisionChecks),
              optionalBackends: {
                fontTools: {
                  required: false,
                  status: "skipped",
                  expectedVersion: expectedFontToolsVersion,
                  observedVersion: observedFontToolsVersion,
                  reason:
                    observedFontToolsVersion === null
                      ? "fontTools is not installed in this workflow"
                      : "the installed fontTools version is not the pinned reproducible backend",
                },
              },
              status: "passed",
            };
            await writeFile(
              path.join(workspace, "check-report.json"),
              `${JSON.stringify(optionalBackendReport, null, 2)}\\n`,
              "utf8",
            );
            console.log("EVAVO Pixel Font Studio v2 structural checks passed.");
            console.log(`- workspace: ${workspace}`);
            console.log("- source inventory, syntax, contract, catalog and independent face audits passed");
            console.log(
              `- optional TTF/build verification skipped because fontTools ${expectedFontToolsVersion} is unavailable in this workflow`,
            );
            console.log(
              "- the dedicated Pixel Font Studio v2 workflow requires the exact backend and still runs the complete build, reproducibility, MCP and Godot suite",
            );
            if (temporary) await rm(workspace, { recursive: true, force: true });
          } else {
            stage("building and validating deterministic family A");
          ''',
              ),
              (
                  '''if (temporary) {
            await rm(workspace, { recursive: true, force: true });
          }
          ''',
                  '''if (temporary) {
            await rm(workspace, { recursive: true, force: true });
          }
          }
          ''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one script replacement anchor, found {text.count(old)}")
              text = text.replace(old, new, 1)
          script.write_text(text, encoding="utf-8")

          workflow = root / ".github/workflows/pixel-font-studio-v2.yml"
          workflow_text = workflow.read_text(encoding="utf-8")
          old = '''        env:
                    EVAVO_PIXEL_FONT_GODOT: ${{ runner.temp }}/godot/Godot_v4.6.2-stable_linux.x86_64
                    EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-studio-v2-check
          '''
          new = '''        env:
                    EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS: "1"
                    EVAVO_PIXEL_FONT_GODOT: ${{ runner.temp }}/godot/Godot_v4.6.2-stable_linux.x86_64
                    EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-studio-v2-check
          '''
          if workflow_text.count(old) != 1:
              raise SystemExit(f"expected exactly one workflow replacement anchor, found {workflow_text.count(old)}")
          workflow.write_text(workflow_text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate optional and strict backend behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-pixel-font-studio-v2.mjs
          python -m venv --without-pip "$RUNNER_TEMP/no-fonttools"
          rm -rf "$RUNNER_TEMP/pixel-font-optional-report" "$RUNNER_TEMP/pixel-font-strict-missing"
          EVAVO_PIXEL_FONT_PYTHON="$RUNNER_TEMP/no-fonttools/bin/python" \
          EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS=0 \
          EVAVO_PIXEL_FONT_CHECK_OUTPUT="$RUNNER_TEMP/pixel-font-optional-report" \
            node scripts/check-pixel-font-studio-v2.mjs
          grep -F '"status": "skipped"' "$RUNNER_TEMP/pixel-font-optional-report/check-report.json"
          grep -F '"expectedVersion": "4.63.0"' "$RUNNER_TEMP/pixel-font-optional-report/check-report.json"

          set +e
          EVAVO_PIXEL_FONT_PYTHON="$RUNNER_TEMP/no-fonttools/bin/python" \
          EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS=1 \
          EVAVO_PIXEL_FONT_CHECK_OUTPUT="$RUNNER_TEMP/pixel-font-strict-missing" \
            node scripts/check-pixel-font-studio-v2.mjs >"$RUNNER_TEMP/strict-missing.log" 2>&1
          strict_status=$?
          set -e
          test "$strict_status" -ne 0
          grep -F 'EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS=1 requires fontTools 4.63.0; observed unavailable.' "$RUNNER_TEMP/strict-missing.log"

      - name: Install exact fontTools backend and run complete suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          test "$(python -c 'import fontTools; print(fontTools.__version__)')" = "4.63.0"
          EVAVO_PIXEL_FONT_REQUIRE_FONTTOOLS=1 \
          EVAVO_PIXEL_FONT_PYTHON=python \
            node scripts/check-pixel-font-studio-v2.mjs

      - name: Verify exact two-file scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            ".github/workflows/pixel-font-studio-v2.yml"
            "scripts/check-pixel-font-studio-v2.mjs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -vE '^( M|M ) (\.github/workflows/pixel-font-studio-v2\.yml|scripts/check-pixel-font-studio-v2\.mjs)$' || true)"

      - name: Commit and push exact repair without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ddb016a263f1e31dbda06a17ba76fecb8e1c2c96"
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add .github/workflows/pixel-font-studio-v2.yml scripts/check-pixel-font-studio-v2.mjs
          git commit -m "fix(pixel-font): gate optional fontTools backend"
          git push origin HEAD:refs/heads/agent/persistent-artist-mastering-motion-v3-20260811
          git rev-parse HEAD
