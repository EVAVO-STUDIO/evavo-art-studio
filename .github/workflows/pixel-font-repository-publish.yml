name: Publish pixel fonts to an EVAVO repository

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Reviewed Art Studio repository-delivery job path
        required: true
        type: string
      target_repository:
        description: Target owner/repository
        required: true
        type: string
      target_branch:
        description: Exact target base branch
        required: true
        default: main
        type: string
      expected_target_head:
        description: Exact 40-character target branch SHA
        required: true
        type: string
      publish_mode:
        description: Safe branch publication or explicitly allowlisted direct main
        required: true
        default: branch
        type: choice
        options:
          - branch
          - direct-main
      publish_branch:
        description: Branch name when publish_mode is branch
        required: false
        type: string
      confirmation:
        description: Type PUBLISH to authorize target checkout mutation and normal push
        required: true
        type: string
  workflow_call:
    inputs:
      job_path:
        required: true
        type: string
      target_repository:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      expected_target_head:
        required: true
        type: string
      publish_mode:
        required: true
        type: string
      publish_branch:
        required: false
        type: string
      confirmation:
        required: true
        type: string
    secrets:
      repository_token:
        required: false
      EVAVO_PIXEL_FONT_REPOSITORY_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: pixel-font-publish-${{ inputs.target_repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1577836800"
  TARGET_TOKEN: ${{ secrets.repository_token || secrets.EVAVO_PIXEL_FONT_REPOSITORY_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require explicit publication confirmation and token
        id: guard
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_TARGET_HEAD: ${{ inputs.expected_target_head }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLISH"
          test -n "$TARGET_TOKEN"
          [[ "$EXPECTED_TARGET_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$PUBLISH_MODE" = "branch" -o "$PUBLISH_MODE" = "direct-main"
          target_slug="$TARGET_REPOSITORY"
          echo "target_slug=${target_slug//\//-}" >> "$GITHUB_OUTPUT"

      - name: Check out exact Art Studio automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: art-studio
          persist-credentials: false

      - name: Check out exact target repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.expected_target_head }}
          token: ${{ secrets.repository_token || secrets.EVAVO_PIXEL_FONT_REPOSITORY_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: "pip"
          cache-dependency-path: art-studio/requirements/pixel-font-universal.txt

      - name: Install exact font compiler dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r art-studio/requirements/pixel-font-universal.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Verify target identity and configure commit author
        shell: bash
        env:
          EXPECTED_TARGET_HEAD: ${{ inputs.expected_target_head }}
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"
          git -C target config user.name "EVAVO Pixel Font Delivery"
          git -C target config user.email "evavo.studio@gmail.com"

      - name: Compile, install, validate, commit and normally push
        shell: bash
        env:
          EXPECTED_TARGET_HEAD: ${{ inputs.expected_target_head }}
          JOB_PATH: ${{ inputs.job_path }}
          PUBLISH_BRANCH: ${{ inputs.publish_branch }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          job="$GITHUB_WORKSPACE/art-studio/$JOB_PATH"
          art_root="$GITHUB_WORKSPACE/art-studio"
          case "$(realpath "$job")" in
            "$art_root"/*) ;;
            *) echo "job_path escapes Art Studio" >&2; exit 2 ;;
          esac
          args=(
            run
            --job "$job"
            --target-root "$GITHUB_WORKSPACE/target"
            --allowlist "$art_root/config/pixel-font-repository-allowlist.v1.json"
            --expected-head "$EXPECTED_TARGET_HEAD"
            --repository "$TARGET_REPOSITORY"
            --branch "$TARGET_BRANCH"
            --publish-mode "$PUBLISH_MODE"
            --confirm-publish
          )
          if test -n "$PUBLISH_BRANCH"; then
            args+=(--publish-branch "$PUBLISH_BRANCH")
          fi
          node "$art_root/scripts/pixel-font-repository-delivery.mjs" "${args[@]}" \
            | tee "$RUNNER_TEMP/pixel-font-repository-publication.json"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"

      - name: Retain exact publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixel-font-publication-${{ steps.guard.outputs.target_slug }}-${{ inputs.expected_target_head }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/pixel-font-repository-publication.json
