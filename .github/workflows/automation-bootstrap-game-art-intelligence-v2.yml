name: Bootstrap sealed Game Art Intelligence v2

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v2-20260805]

permissions:
  contents: write

concurrency:
  group: bootstrap-game-art-intelligence-v2-20260805
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: 5b08bdab285f7e28fd5d4fc2cc3d7d6fb4984ab0
      TARGET_BRANCH: agent/game-art-intelligence-20260805
      PAYLOAD_ROOT: .github/automation/game-art-intelligence-v2
      ARCHIVE_SHA256: b571a8e0936d8dcb25185f5942f763774e0964b5adead29d280451fc7aa68c37
      PATCH_SHA256: f7c5541dfac45f31736cb98c3b47f2d6f982960ac6850a4666bbc085bee833f3
    steps:
      - name: Check out exact bootstrap source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover and verify sealed patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find "$PAYLOAD_ROOT" -maxdepth 1 -type f -name 'chunk-*.b64' -printf '%f\n' | LC_ALL=C sort)
          test "${#chunks[@]}" -eq 24
          for index in $(seq 0 23); do printf -v expected 'chunk-%03d.b64' "$index"; test "${chunks[$index]}" = "$expected"; done
          cat "${chunks[@]/#/$PAYLOAD_ROOT/}" > /tmp/game-art-intelligence.patch.gz.b64
          base64 --decode /tmp/game-art-intelligence.patch.gz.b64 > /tmp/game-art-intelligence.patch.gz
          printf '%s  %s\n' "$ARCHIVE_SHA256" /tmp/game-art-intelligence.patch.gz | sha256sum -c -
          gzip --decompress --stdout /tmp/game-art-intelligence.patch.gz > /tmp/game-art-intelligence.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/game-art-intelligence.patch | sha256sum -c -

      - name: Verify exact refs and apply one commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_MAIN_SHA"
          git config user.name "EVAVO Automation"
          git config user.email "evavo-automation@users.noreply.github.com"
          git switch --force-create "$TARGET_BRANCH" refs/remotes/origin/main
          git am --whitespace=error-all /tmp/game-art-intelligence.patch
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git log -1 --format=%s)" = "feat(game-art): add project-wide production intelligence"
          git diff --check HEAD^ HEAD
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'PATHS'
          .github/workflows/game-art-intelligence.yml
          apps/mcp/package.json
          apps/mcp/src/game-intelligence.ts
          apps/mcp/test/game-art-intelligence-mcp.test.mjs
          apps/mcp/tsconfig.json
          docs/game-art-intelligence.md
          package.json
          packages/game-art-intelligence/package.json
          packages/game-art-intelligence/src/adaptive.ts
          packages/game-art-intelligence/src/canonical.ts
          packages/game-art-intelligence/src/catalogue.ts
          packages/game-art-intelligence/src/compiler.ts
          packages/game-art-intelligence/src/geometry-palette.ts
          packages/game-art-intelligence/src/index.ts
          packages/game-art-intelligence/src/types.ts
          packages/game-art-intelligence/test/game-art-intelligence.test.mjs
          packages/game-art-intelligence/tsconfig.json
          scripts/check-game-art-intelligence.mjs
          PATHS
          LC_ALL=C sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          node --check scripts/check-game-art-intelligence.mjs
          node scripts/check-game-art-intelligence.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > /tmp/feature-sha.txt

      - name: Push exact feature commit
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_MAIN_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$(cat /tmp/feature-sha.txt)"

      - name: Write receipt
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("/tmp/game-art-intelligence-bootstrap.json", `${JSON.stringify({schemaVersion:"1.0",receiptType:"evavo-game-art-intelligence-bootstrap",repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,expectedMainSha:process.env.EXPECTED_MAIN_SHA,targetBranch:process.env.TARGET_BRANCH,featureSha:fs.readFileSync("/tmp/feature-sha.txt","utf8").trim(),archiveSha256:process.env.ARCHIVE_SHA256,patchSha256:process.env.PATCH_SHA256,changedPaths:fs.readFileSync("/tmp/actual-paths.txt","utf8").trim().split("\n"),exactParentVerified:true,exactPathScopeVerified:true,permanentCheckerPassed:true,providerCalled:false,runtimeJobSubmitted:false,targetRepositoryMutated:false,selectionPerformed:false,promotionPerformed:false,publicationPerformed:false},null,2)}\n`,{mode:0o600});
          NODE

      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-art-intelligence-bootstrap-${{ github.run_id }}
          path: /tmp/game-art-intelligence-bootstrap.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Delete disposable bootstrap branch
        if: success()
        shell: bash
        run: git push origin --delete "$GITHUB_REF_NAME" || echo "::warning::bootstrap cleanup deferred"
