name: Agent Complete Exact Docs Book Art Brief

on:
  push:
    branches:
      - agent/exact-docs-book-art-brief-20260803

permissions:
  contents: write

concurrency:
  group: agent-complete-exact-docs-book-art-brief
  cancel-in-progress: true

jobs:
  complete:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.ref == 'refs/heads/agent/exact-docs-book-art-brief-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact branch and clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git merge-base origin/main HEAD)" == "c3712705ddcf16fe46395182de11d706f8d5c51d" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Apply exact receiver verification
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/contracts/test/book-production-legacy-illustration-plan.test.mjs')
          source = path.read_text(encoding='utf-8')
          token = '  fingerprintBookArtBrief,\n'
          if token not in source:
              anchor = '  BOOK_ART_HANDOFF_CONTRACT,\n'
              if source.count(anchor) != 1:
                  raise SystemExit('Expected one legacy illustration import anchor.')
              path.write_text(source.replace(anchor, anchor + token, 1), encoding='utf-8')
          PY
          python .github/scripts/complete-exact-docs-book-art-brief.py
          git diff --check
          if git diff --quiet; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
            mapfile -t changed < <(git diff --name-only)
            [[ "${#changed[@]}" -eq 14 ]]
          fi

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install FFmpeg media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Build complete Art Studio domain
        run: pnpm run build:domain

      - name: Run exact Book Art regressions
        run: |
          pnpm --filter @evavo/art-contracts test
          pnpm --filter @evavo/art-book-runtime test
          pnpm --filter @evavo/art-studio-worker test
          pnpm --filter @evavo/art-studio-api test
          pnpm --filter @evavo/art-studio-cli test
          pnpm --filter @evavo/art-studio-mcp test

      - name: Run complete repository validation
        run: pnpm check

      - name: Commit and push validated source
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --check
          git add \
            packages/contracts/src/book-production-profile.ts \
            packages/contracts/test/book-production-profile.test.mjs \
            packages/contracts/test/book-production-legacy-illustration-plan.test.mjs \
            packages/book-art-runtime/test/runtime.test.mjs \
            packages/book-art-runtime/test/parity.test.mjs \
            apps/worker/test/book-art-provider-jobs.test.mjs \
            apps/worker/test/book-art-provider-inspection.test.mjs \
            apps/worker/test/book-art-provider-parity.test.mjs \
            apps/api/test/book-art-api.test.mjs \
            apps/api/test/book-art-api-inspection.test.mjs \
            apps/api/test/book-art-api-parity.test.mjs \
            apps/cli/test/book-art-cli.test.mjs \
            apps/cli/test/book-art-cli-inspection.test.mjs \
            apps/cli/test/book-art-cli-parity.test.mjs
          git diff --cached --check
          [[ "$(git diff --cached --name-only | wc -l)" -eq 14 ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(book-art): verify exact Docs briefs before runtime'
          git push origin HEAD:refs/heads/agent/exact-docs-book-art-brief-20260803

      - name: Verify clean generated state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --check
