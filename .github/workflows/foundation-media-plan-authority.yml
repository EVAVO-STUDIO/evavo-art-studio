name: Foundation Media Plan Authority

on:
  push:
    branches: [main]
    paths: &foundation_media_paths
      - ".github/workflows/foundation-media-plan-authority.yml"
      - "scripts/compile-foundation-media-plan.mjs"
      - "scripts/test-foundation-media-plan.mjs"
      - "scripts/check-foundation-media-plan.mjs"
      - "docs/foundation-kit-media-production.md"
      - "examples/foundation-kit-media-plan-request.json"
      - "package.json"
  pull_request:
    paths: *foundation_media_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-media-plan-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Validate Foundation media-plan authority
        run: node scripts/check-foundation-media-plan.mjs

      - name: Prove exact source remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Write bounded authority receipt
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const receipt = {
            schemaVersion: "1.0",
            receiptType: "evavo-foundation-media-plan-authority",
            repository: "EVAVO-STUDIO/evavo-art-studio",
            commitSha: process.env.VALIDATED_SHA,
            workflowRunId: process.env.VALIDATION_RUN_ID,
            workflowRunAttempt: process.env.VALIDATION_ATTEMPT,
            ref: process.env.VALIDATION_REF,
            toolchain: { node: "22.14.0" },
            verified: [
              "repository-and-audit-root-binding",
              "descriptor-bound-authority-reads",
              "symlink-path-rejection",
              "canonical-audit-row-identities",
              "all-member-runtime-collision-blocking",
              "windows-reserved-name-blocking",
              "target-repository-output-isolation",
              "truthful-create-only-mutation-receipt",
              "strict-and-planning-mode-regressions",
              "clean-exact-source"
            ],
            providerCalled: false,
            targetRepositoryMutated: false,
            deletionPerformed: false,
            selectionPerformed: false,
            promotionPerformed: false,
            publicationPerformed: false
          };
          fs.writeFileSync(
            "/tmp/evavo-foundation-media-plan-authority.json",
            `${JSON.stringify(receipt, null, 2)}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Upload bounded authority receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-media-plan-authority-${{ github.sha }}
          path: /tmp/evavo-foundation-media-plan-authority.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
