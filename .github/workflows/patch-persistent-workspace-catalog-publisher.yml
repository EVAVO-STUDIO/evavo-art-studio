name: Temporary patch persistent workspace catalog publisher

on:
  push:
    branches:
      - automation/publish-persistent-workspace-catalog-20260812
    paths:
      - ".github/workflows/patch-persistent-workspace-catalog-publisher.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch exact untracked-file scope audit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/publish-persistent-workspace-catalog-v3.yml')
          source = path.read_text(encoding='utf-8')
          anchor = """          node scripts/check-persistent-artist-workspace-catalog.mjs
          node scripts/check-artist-workspace-agent-suite.mjs
          git diff --check
"""
          replacement = """          node scripts/check-persistent-artist-workspace-catalog.mjs
          node scripts/check-artist-workspace-agent-suite.mjs
          git add -N -- \\
            .github/workflows/persistent-artist-workspace-catalog.yml \\
            config/mcp.persistent-artist-workspace-catalog.windows.example.json \\
            docs/PERSISTENT_ARTIST_WORKSPACE_CATALOG.md \\
            scripts/check-persistent-artist-workspace-catalog.mjs \\
            scripts/persistent-artist-workspace-catalog.mjs \\
            scripts/project-art/persistent-workspace-catalog.mjs \\
            scripts/test-persistent-artist-workspace-catalog.mjs \\
            scripts/test-project-art-workspace-catalog-mcp.mjs \\
            tools/project_art_workspace_catalog_mcp.mjs
          git diff --check
"""
          if source.count(anchor) != 1:
              raise SystemExit(f'publisher anchor count was {source.count(anchor)}, expected 1')
          path.write_text(source.replace(anchor, replacement), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/patch-persistent-workspace-catalog-publisher.yml
          git diff --check
          git config user.name EVAVO-STUDIO
          git config user.email evavo.studio@gmail.com
          git add -A -- .github/workflows/publish-persistent-workspace-catalog-v3.yml .github/workflows/patch-persistent-workspace-catalog-publisher.yml
          git commit -m "fix(release): include new catalog paths in scope audit"
          git push origin HEAD:automation/publish-persistent-workspace-catalog-20260812
