name: EVA dense-motion reviewed frame evidence

on:
  pull_request:
    paths:
      - "scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs"
      - "scripts/run-project-art-eva-dense-motion-reviewed-frame-evidence.mjs"
      - "scripts/test-project-art-eva-dense-motion-reviewed-frame-evidence.mjs"
      - "scripts/project-art/eva-dense-motion-frame-review-intake.mjs"
      - "scripts/project-art/eva-dense-motion-candidate-assurance.mjs"
      - "scripts/project-art/eva-dense-motion-mastering-campaign.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/png-structure-v1.mjs"
      - ".github/workflows/eva-dense-motion-reviewed-frame-evidence.yml"
  push:
    branches: [main]
    paths:
      - "scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs"
      - "scripts/run-project-art-eva-dense-motion-reviewed-frame-evidence.mjs"
      - "scripts/test-project-art-eva-dense-motion-reviewed-frame-evidence.mjs"
      - "scripts/project-art/eva-dense-motion-frame-review-intake.mjs"
      - "scripts/project-art/eva-dense-motion-candidate-assurance.mjs"
      - "scripts/project-art/eva-dense-motion-mastering-campaign.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/png-structure-v1.mjs"
      - ".github/workflows/eva-dense-motion-reviewed-frame-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-reviewed-frame-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Syntax-check reviewed-frame evidence surface
        run: |
          node --check scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          node --check scripts/run-project-art-eva-dense-motion-reviewed-frame-evidence.mjs
          node --check scripts/test-project-art-eva-dense-motion-reviewed-frame-evidence.mjs

      - name: Run reviewed-frame evidence contract guard
        run: node scripts/test-project-art-eva-dense-motion-reviewed-frame-evidence.mjs

      - name: Verify authority remains closed
        shell: bash
        run: |
          set -euo pipefail
          grep -F "allTenNamedHumanApprovalsRequired: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          grep -F "twoIndependentCandidateInspectorsRequired: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          grep -F "creativeApprovalEvidenceDerivedOnlyFromHumanApproval: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          grep -F "automaticDecisionCreationAllowed: false" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          grep -F "humanDecisionsCreated: 0" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          grep -F "automaticCreativeDecisionsMade: 0" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          ! grep -F "humanDecisionCreation: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          ! grep -F "automaticCreativeDecision: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          ! grep -F "cloudinaryUpload: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          ! grep -F "sequenceRelease: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs
          ! grep -F "runtimeActivation: true" scripts/project-art/eva-dense-motion-reviewed-frame-evidence.mjs

      - name: Prove source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
