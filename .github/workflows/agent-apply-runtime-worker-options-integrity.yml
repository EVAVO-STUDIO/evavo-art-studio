name: Apply runtime worker option integrity patch

on:
  push:
    branches:
      - agent/runtime-worker-options-integrity-20260808
    paths:
      - ".agent/apply-runtime-worker-options-integrity.py"
      - ".github/workflows/agent-apply-runtime-worker-options-integrity.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-runtime-worker-options-integrity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/runtime-worker-options-integrity-20260808
          fetch-depth: 0

      - name: Apply exact runtime worker option transformation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .agent/apply-runtime-worker-options-integrity.py
          python .agent/apply-runtime-worker-options-integrity.py
          grep -F 'const source = runtimeInputRecord(input, "Worker descriptor", code);' packages/runtime/src/normalize.ts
          grep -F 'snapshotRuntimeWorkerOptions' packages/runtime/src/worker.ts
          grep -F 'snapshotHandlers' packages/runtime/src/worker.ts
          ! grep -F 'input.queues === undefined' packages/runtime/src/normalize.ts
          ! grep -F '...options,' packages/runtime/src/worker.ts
          git diff --check

      - name: Commit production source and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent/apply-runtime-worker-options-integrity.py \
            .github/workflows/agent-apply-runtime-worker-options-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/normalize.ts packages/runtime/src/worker.ts
          git add -u .agent .github/workflows/agent-apply-runtime-worker-options-integrity.yml
          git diff --cached --check
          git commit -m "fix(runtime): bind worker options to immutable snapshots"
          git push origin HEAD:agent/runtime-worker-options-integrity-20260808
