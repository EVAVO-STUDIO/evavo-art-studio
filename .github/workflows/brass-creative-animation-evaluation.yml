name: Brass creative and animation evaluation

on:
  pull_request:
    paths:
      - "config/brass-creative-evaluation.v1.json"
      - "requirements-image-pipeline.txt"
      - "tools/brass_creative_evaluation.py"
      - "tools/evaluate_brass_creative_candidate.py"
      - "tools/evaluate_brass_animation_sequence.py"
      - "tools/verify_brass_creative_evaluation.py"
      - "docs/BRASS_CREATIVE_ANIMATION_EVALUATION.md"
      - ".github/workflows/brass-creative-animation-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brass-creative-animation-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt
      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt
      - name: Verify exact Python image toolchain
        run: |
          python - <<'PY'
          import PIL
          import sys

          assert sys.version_info[:3] == (3, 13, 5), sys.version
          assert PIL.__version__ == "12.2.0", PIL.__version__
          PY
      - name: Compile Brass creative evaluation sources
        run: >-
          python -m py_compile
          tools/brass_creative_evaluation.py
          tools/evaluate_brass_creative_candidate.py
          tools/evaluate_brass_animation_sequence.py
          tools/verify_brass_creative_evaluation.py
      - name: Run exact-byte and create-only adversarial verification
        run: python tools/verify_brass_creative_evaluation.py
