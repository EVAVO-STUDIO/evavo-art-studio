name: Brass creative and animation evaluation

on:
  pull_request:
    paths:
      - "config/brass-creative-evaluation.v1.json"
      - "tools/brass_creative_evaluation.py"
      - "tools/evaluate_brass_creative_candidate.py"
      - "tools/evaluate_brass_animation_sequence.py"
      - "tools/verify_brass_creative_evaluation.py"
      - "docs/BRASS_CREATIVE_ANIMATION_EVALUATION.md"
      - ".github/workflows/brass-creative-animation-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - run: >-
          python -m py_compile
          tools/brass_creative_evaluation.py
          tools/evaluate_brass_creative_candidate.py
          tools/evaluate_brass_animation_sequence.py
          tools/verify_brass_creative_evaluation.py
      - run: python tools/verify_brass_creative_evaluation.py
