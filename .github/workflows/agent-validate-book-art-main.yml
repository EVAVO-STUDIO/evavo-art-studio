name: Agent Validate Exact Book Art Main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: agent-validate-book-art-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-exact-main:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/validate-book-art-main-8ae94d8-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_MAIN_SHA: 8ae94d8fe3d7e1133d36c95c8847264611112d71
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact production commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact current main and clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_MAIN_SHA}" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "${EXPECTED_MAIN_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "b5d4962085ff7efd7bde251851aca13098b5d211" ]]

      - name: Install FFmpeg media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Verify repository and Book Art authority boundaries
        run: |
          node scripts/check-repository-toolchain.mjs
          node scripts/test-repository-toolchain.mjs
          node scripts/check-book-art-provider-runtime.mjs
          node scripts/check-book-studio-production-handoff.mjs
          node scripts/check-book-illustration-plan-parity.mjs

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Re-prove exact clean production tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          rm -rf apps/web/.next
          git clean -fdX
          git diff --exit-code
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_MAIN_SHA}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "b5d4962085ff7efd7bde251851aca13098b5d211" ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep '^??' || true)"

      - name: Reconfirm main was not superseded
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "${EXPECTED_MAIN_SHA}" ]]
