name: Validate Docs Authorial Mirror

on:
  push:
    branches:
      - validation/docs-narrative-craft-20260804
    paths:
      - ".github/workflows/validate-docs-authorial-mirror.yml"
      - "validation/docs-narrative-craft/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-docs-authorial-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out self-contained validation mirror
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run exact unattended authorial validation
        id: validation
        env:
          VALIDATION_RECEIPT_TMP: ${{ runner.temp }}/docs-unattended-authorial-validation.json
        run: bash validation/docs-narrative-craft/run-unattended-authorial-validation-current.sh

      - name: Persist hosted validation receipt
        if: always() && github.event_name == 'push'
        env:
          VALIDATION_RECEIPT_TMP: ${{ runner.temp }}/docs-unattended-authorial-validation.json
        shell: bash
        run: |
          set -euo pipefail
          receipt="validation-results/docs-unattended-authorial-validation.json"
          mkdir -p "$(dirname "$receipt")"
          if [[ -f "$VALIDATION_RECEIPT_TMP" ]]; then
            cp "$VALIDATION_RECEIPT_TMP" "$receipt"
          else
            node - "$receipt" <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.argv[2], `${JSON.stringify({
            outputKind: "evavo_art_docs_unattended_authorial_validation_receipt",
            schemaVersion: 1,
            conclusion: "failure",
            failedStage: "runner_setup",
            completedStages: [],
            workflowRunId: process.env.GITHUB_RUN_ID ?? "unknown",
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT ?? "unknown",
            testedValidationHead: process.env.GITHUB_SHA ?? "unknown",
            docsFeatureHead: "6509256a38b9968f74e922a005d54102840fd83c",
            docsBaseHead: "626bcd3af1bc1b1ffb92e28661e62069ed181951",
            providerCallPerformed: false,
            canonicalManuscriptMutationPerformed: false,
            automaticCanonicalAdmissionAllowed: false,
            artStudioProductionSourceChanged: null,
            publicationPerformed: false,
          }, null, 2)}\n`, "utf8");
          NODE
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$receipt"
          if ! git diff --cached --quiet; then
            conclusion="$(node -p "JSON.parse(require('fs').readFileSync('$receipt','utf8')).conclusion")"
            git commit -m "test(validation): record unattended authorial ${conclusion}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          node -e "const r=JSON.parse(require('fs').readFileSync('$receipt','utf8')); if(r.conclusion!=='success') process.exit(1)"
