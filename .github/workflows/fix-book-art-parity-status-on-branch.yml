name: Fix Book Art parity mismatch precedence

on:
  pull_request:
    branches:
      - agent/book-art-shadow-parity-20260803

permissions:
  contents: write

concurrency:
  group: fix-book-art-parity-status
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact parity candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/book-art-shadow-parity-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact PR base candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_BASE_SHA}" ]]

      - name: Apply exact mismatch-precedence correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one block, found {count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          def replace_regex_once(
              path: Path,
              pattern: str,
              replacement: str,
              label: str,
          ) -> None:
              source = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"{label}: expected one block, found {count}")
              path.write_text(updated, encoding="utf-8")

          parity = Path("packages/book-art-runtime/src/parity.ts")
          replace_regex_once(
              parity,
              r'''  const status: BookArtProviderShadowParityStatus = incomplete\n\s+\? "incomplete"\n\s+: mismatches\.length\n\s+\? "mismatched"\n\s+: "matched";''',
              '''  const status: BookArtProviderShadowParityStatus = mismatches.length
            ? "mismatched"
            : incomplete
              ? "incomplete"
              : "matched";''',
              "parity mismatch precedence",
          )

          tests = Path("packages/book-art-runtime/test/parity.test.mjs")
          marker = 'test("Website parity observation fingerprint fails closed after request tampering", async () => {'
          regression = '''test("structural request drift remains mismatched before either runtime submits", async () => {
            const compiled = await compilation();
            const root = await mkdtemp(path.join(os.tmpdir(), "evavo-book-art-parity-drift-"));
            try {
              const observation = notSubmittedObservation(compiled.plan);
              const { observationFingerprintSha256: _discarded, ...unsigned } = observation;
              const changed = {
                ...unsigned,
                normalizedProviderRequestSha256: "f".repeat(64),
              };
              const result = await compareBookArtProviderShadowParity(
                compiled,
                {
                  ...changed,
                  observationFingerprintSha256:
                    fingerprintWebsiteBookArtProviderShadowObservation(changed),
                },
                {
                  runtime: new LocalRuntimeRepository({ root: path.join(root, "runtime") }),
                  artifacts: new LocalArtifactStore({ root: path.join(root, "artifacts") }),
                },
              );
              assert.equal(result.status, "mismatched");
              assert.equal(result.comparison.normalizedProviderRequestMatched, false);
              assert.ok(
                result.mismatches.some((entry) =>
                  entry.includes("normalized provider-request fingerprints differ"),
                ),
              );
              assert.equal(result.cutoverEligible, false);
            } finally {
              await rm(root, { recursive: true, force: true });
            }
          });

          '''
          replace_once(tests, marker, regression + marker, "pre-submission mismatch regression")
          PY
          git diff --check

      - name: Set up pinned toolchain
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Validate exact correction
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm run build:domain
          pnpm --filter @evavo/art-book-runtime test
          node scripts/check-book-art-provider-parity.mjs
          rm -f pnpm-lock.yaml
          git diff --check

      - name: Commit and push two-file correction
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 2 ]]
          printf '%s\n' "${changed[@]}" | grep -Fx 'packages/book-art-runtime/src/parity.ts'
          printf '%s\n' "${changed[@]}" | grep -Fx 'packages/book-art-runtime/test/parity.test.mjs'
          git config user.name "EVAVO validation automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            packages/book-art-runtime/src/parity.ts \
            packages/book-art-runtime/test/parity.test.mjs
          git commit -m "fix(book-art): keep structural drift mismatched"
          git push origin HEAD:agent/book-art-shadow-parity-20260803
