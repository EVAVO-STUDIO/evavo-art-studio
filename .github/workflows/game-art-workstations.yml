name: Optional Game Art workstation validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-art-workstations-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out the exact requested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact image dependency
        run: python -m pip install --disable-pip-version-check pillow==12.2.0

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run bounded local-first contracts
        run: node scripts/local-quality-gate.mjs quick

      - name: Run workstation regressions
        run: >-
          python scripts/test-image-workstation.py -v
          && python scripts/test-sprite-sheet-segmenter.py -v
          && python scripts/test-sprite-workstation.py -v
          && node scripts/test-pixel-art-candidate-audit.mjs
          && node scripts/test-game-art-workstation-mcp.mjs
          && node scripts/test-project-art-workspace-root-policy.mjs
          && node scripts/check-game-art-automation-fabric.mjs
          && node scripts/check-games94-production-profile.mjs

      - name: Confirm validation changed no tracked source
        if: always()
        run: git diff --check
