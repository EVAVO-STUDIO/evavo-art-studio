name: Game Art Workstations

on:
  push:
    branches: [main]
    paths:
      - "tools/image_workstation.py"
      - "tools/sprite_workstation.py"
      - "scripts/test-image-workstation.py"
      - "scripts/test-sprite-workstation.py"
      - "scripts/audit-pixel-art-candidate.mjs"
      - "scripts/test-pixel-art-candidate-audit.mjs"
      - "config/image-processing-recipes.v1.json"
      - "evavo.tasks.json"
      - ".github/workflows/game-art-workstations.yml"
  pull_request:
    paths:
      - "tools/image_workstation.py"
      - "tools/sprite_workstation.py"
      - "scripts/test-image-workstation.py"
      - "scripts/test-sprite-workstation.py"
      - "scripts/audit-pixel-art-candidate.mjs"
      - "scripts/test-pixel-art-candidate-audit.mjs"
      - "config/image-processing-recipes.v1.json"
      - "evavo.tasks.json"
      - ".github/workflows/game-art-workstations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python -m py_compile tools/image_workstation.py tools/sprite_workstation.py scripts/test-image-workstation.py scripts/test-sprite-workstation.py
      - run: python scripts/test-image-workstation.py -v
      - run: python scripts/test-sprite-workstation.py -v
      - run: node scripts/test-pixel-art-candidate-audit.mjs
      - run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python -m py_compile tools/image_workstation.py tools/sprite_workstation.py scripts/test-image-workstation.py scripts/test-sprite-workstation.py
      - run: python scripts/test-image-workstation.py -v
      - run: python scripts/test-sprite-workstation.py -v
      - run: node scripts/test-pixel-art-candidate-audit.mjs
      - shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Dirty = git status --porcelain=v1 --untracked-files=all
          if ($Dirty) { throw "Validation changed repository source: $Dirty" }
