name: Temporary repair mastering optional Pillow contract

on:
  push:
    branches:
      - automation/repair-mastering-optional-pillow-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FEATURE_BRANCH: agent/persistent-artist-mastering-motion-v3-20260811
      EXPECTED_FEATURE_HEAD: d8bf32f40a9f124e639cdc24d21c31dcd67b6ee2
      PATCH_SHA256: 252bcc8dcb0e8d265db5739f938005d6764b55633086a3d9689b090bd16c8aac
      PATCH_B64_SHA256: 6e111fce18f33ac508f6280c9384bf244309409d53383c842bd22bdb434e0719
    steps:
      - name: Check out exact repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact repair patch
        shell: bash
        run: |
          set -euo pipefail
          TRANSFER=.evavo-transfer/mastering-optional-pillow/patch.b64
          echo "${PATCH_B64_SHA256}  ${TRANSFER}" | sha256sum --check --strict
          base64 --decode "${TRANSFER}" > "${RUNNER_TEMP}/repair.patch"
          echo "${PATCH_SHA256}  ${RUNNER_TEMP}/repair.patch" | sha256sum --check --strict

      - name: Check out exact pull-request head and apply repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${FEATURE_BRANCH})" = "${EXPECTED_FEATURE_HEAD}"
          git switch --detach "${EXPECTED_FEATURE_HEAD}"
          git apply --check "${RUNNER_TEMP}/repair.patch"
          git apply "${RUNNER_TEMP}/repair.patch"
          git diff --check
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          printf '%s\n' \
            scripts/check-project-art-mastering-and-motion.mjs \
            scripts/test-project-art-mastering-and-motion.mjs \
            | sort > "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify optional-backend and strict-backend behavior without Python
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          EMPTY_PATH="${RUNNER_TEMP}/no-python-path"
          mkdir -p "${EMPTY_PATH}"
          env -i PATH="${EMPTY_PATH}" HOME="${HOME}" PROJECT_ART_REQUIRE_PILLOW=0 \
            "${NODE_BIN}" scripts/test-project-art-mastering-and-motion.mjs \
            > "${RUNNER_TEMP}/optional.out"
          grep -F 'Project Art mastering and motion runtime regressions skipped: Pillow unavailable; the dedicated Project Art workflow requires the exact backend.' \
            "${RUNNER_TEMP}/optional.out"
          if env -i PATH="${EMPTY_PATH}" HOME="${HOME}" PROJECT_ART_REQUIRE_PILLOW=1 \
            "${NODE_BIN}" scripts/test-project-art-mastering-and-motion.mjs \
            > "${RUNNER_TEMP}/strict.out" 2>&1; then
            echo 'Strict Pillow requirement unexpectedly passed without Python.' >&2
            exit 1
          fi
          grep -F 'PROJECT_ART_REQUIRE_PILLOW=1 but no Python 3 executable with Pillow was found.' \
            "${RUNNER_TEMP}/strict.out"
          node scripts/check-project-art-mastering-and-motion.mjs

      - name: Route Python bytecode outside the repository
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/mastering-optional-pillow-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact Pillow backend and run strict mastering regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt
          test "$(python -c 'import PIL; print(PIL.__version__)')" = "12.2.0"
          PROJECT_ART_REQUIRE_PILLOW=1 node scripts/test-project-art-mastering-and-motion.mjs
          node scripts/check-project-art-mastering-and-motion.mjs

      - name: Commit and publish exact repair without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EVAVO-STUDIO
          git config user.email evavo.studio@gmail.com
          git add \
            scripts/check-project-art-mastering-and-motion.mjs \
            scripts/test-project-art-mastering-and-motion.mjs
          git commit -m 'fix(project-art): make Pillow runtime gate explicit'
          test "$(git rev-parse HEAD^)" = "${EXPECTED_FEATURE_HEAD}"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "${RUNNER_TEMP}/committed-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/committed-paths.txt"
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          git fetch origin "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/${FEATURE_BRANCH})"
          printf '{\n  "schema": "evavo.mastering-optional-pillow-repair-receipt.v1",\n  "previousHead": "%s",\n  "repairedHead": "%s",\n  "patchSha256": "%s",\n  "strictPillowGate": "passed",\n  "optionalPillowGate": "passed",\n  "forcePush": false\n}\n' \
            "${EXPECTED_FEATURE_HEAD}" "$(git rev-parse HEAD)" "${PATCH_SHA256}" \
            > "${RUNNER_TEMP}/repair-receipt.json"

      - name: Upload bounded repair receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mastering-optional-pillow-repair-receipt
          path: ${{ runner.temp }}/repair-receipt.json
          if-no-files-found: error
          retention-days: 14
