name: Project Art Top Hat Pose Candidate Admission

on:
  push:
    branches: [main]
    paths:
      - "scripts/project-art/top-hat-pose-slot-candidate-admission*.mjs"
      - "scripts/test-project-art-top-hat-pose-slot-candidate-admission*.mjs"
      - "scripts/write-project-art-top-hat-pose-slot-candidate-admission.mjs"
      - "docs/PROJECT_ART_TOP_HAT_POSE_SLOT_CANDIDATE_ADMISSION.md"
      - ".github/workflows/project-art-top-hat-pose-candidate-admission.yml"
  pull_request:
    paths:
      - "scripts/project-art/top-hat-pose-slot-candidate-admission*.mjs"
      - "scripts/test-project-art/top-hat-pose-slot-candidate-admission*.mjs"
      - "scripts/write-project-art-top-hat-pose-slot-candidate-admission.mjs"
      - "docs/PROJECT_ART_TOP_HAT_POSE_SLOT_CANDIDATE_ADMISSION.md"
      - ".github/workflows/project-art-top-hat-pose-candidate-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-art-top-hat-pose-candidate-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Verify candidate-admission syntax and contracts
        run: |
          node --check scripts/project-art/top-hat-pose-slot-candidate-admission-foundation.mjs
          node --check scripts/project-art/top-hat-pose-slot-candidate-admission-materialization.mjs
          node --check scripts/project-art/top-hat-pose-slot-candidate-admission-review.mjs
          node --check scripts/project-art/top-hat-pose-slot-candidate-admission-compile.mjs
          node --check scripts/project-art/top-hat-pose-slot-candidate-admission.mjs
          node --check scripts/project-art/top-hat-pose-slot-candidate-admission-fixture.mjs
          node --check scripts/write-project-art-top-hat-pose-slot-candidate-admission.mjs
          node --test scripts/test-project-art-top-hat-pose-slot-candidate-admission.mjs
          node --test scripts/test-project-art-top-hat-pose-slot-candidate-admission-writer.mjs
      - name: Write bounded passive capabilities evidence
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/top-hat-pose-slot-candidate-admission.capabilities.json
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { projectArtTopHatPoseSlotCandidateAdmissionCapabilities } from "./scripts/project-art/top-hat-pose-slot-candidate-admission.mjs";
            writeFileSync(process.env.EVIDENCE_PATH, `${JSON.stringify(projectArtTopHatPoseSlotCandidateAdmissionCapabilities(), null, 2)}\n`, { mode: 0o600 });
          '
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));' "$EVIDENCE_PATH"
          sha256sum "$EVIDENCE_PATH"
      - name: Upload bounded passive evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: top-hat-pose-candidate-admission-${{ github.sha }}
          path: ${{ runner.temp }}/top-hat-pose-slot-candidate-admission.capabilities.json
          if-no-files-found: error
          retention-days: 14
