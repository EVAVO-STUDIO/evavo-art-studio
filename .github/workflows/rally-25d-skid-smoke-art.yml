name: Rally 2.5D Skid Smoke Art Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-25d-skid-smoke-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Test deterministic Skid Smoke jobs
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/game-art-production/rally-25d-skid-smoke-jobs.test.mjs \
            | tee "${RUNNER_TEMP}/skid-smoke-tests.log"
      - name: Compile and verify provider session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-skid-smoke-jobs.mjs compile \
            config/game-art-production/vfx/skid-smoke-production-v1.json \
            --output "${RUNNER_TEMP}/skid-smoke.session.json" \
            > "${RUNNER_TEMP}/skid-smoke.stdout.json"
          node scripts/game-art-production/rally-25d-skid-smoke-jobs.mjs verify \
            "${RUNNER_TEMP}/skid-smoke.session.json" \
            | tee "${RUNNER_TEMP}/skid-smoke.verify.json"
          grep -F '"schema": "evavo.rally-skid-smoke-provider-job-session.v1"' "${RUNNER_TEMP}/skid-smoke.session.json"
          grep -F '"jobs": 10' "${RUNNER_TEMP}/skid-smoke.session.json"
          grep -F '"images": 10' "${RUNNER_TEMP}/skid-smoke.session.json"
          grep -F '"responseJobs": 5' "${RUNNER_TEMP}/skid-smoke.session.json"
          grep -F '"spriteJobs": 3' "${RUNNER_TEMP}/skid-smoke.session.json"
          grep -F '"providerExecution": false' "${RUNNER_TEMP}/skid-smoke.session.json"
          grep -F '"downstream3DReady": false' "${RUNNER_TEMP}/skid-smoke.session.json"
      - name: Prove source remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: skid-smoke-art-${{ github.sha }}
          path: |
            ${{ runner.temp }}/skid-smoke-tests.log
            ${{ runner.temp }}/skid-smoke.session.json
            ${{ runner.temp }}/skid-smoke.verify.json
          if-no-files-found: warn
          retention-days: 7
