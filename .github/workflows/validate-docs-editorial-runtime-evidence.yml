name: Validate Docs Editorial Runtime Evidence Exact Source

on:
  push:
    branches:
      - validation/docs-editorial-runtime-evidence-20260807
    paths:
      - ".github/workflows/validate-docs-editorial-runtime-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-editorial-runtime-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCS_SOURCE_REPOSITORY: EVAVO-STUDIO/evavo-docs-suite
  DOCS_SOURCE_SHA: 51a9bb1f0a02bc27c0c0239d106ff7f254432eb2
  DOCS_BASE_SHA: c880df972da9aba30e5adad9dec838e83e7a1a82

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out disposable Art validation host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact Docs feature commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.DOCS_SOURCE_REPOSITORY }}
          ref: ${{ env.DOCS_SOURCE_SHA }}
          path: docs-source
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact Docs source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C docs-source rev-parse HEAD)"
          test "$actual" = "$DOCS_SOURCE_SHA"
          printf '%s\n' "docs-source=$actual" "docs-base=$DOCS_BASE_SHA"

      - name: Use exact Docs Node.js runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: docs-source/.nvmrc
          package-manager-cache: false

      - name: Run permanent editorial authority checks
        working-directory: docs-source
        run: |
          node scripts/check-book-studio-unattended-editorial-consensus.mjs
          node scripts/check-book-studio-unattended-editorial-consensus-integrity.mjs

      - name: Install exact workspace
        working-directory: docs-source
        run: corepack pnpm install --frozen-lockfile

      - name: Run strict core and web TypeScript
        working-directory: docs-source
        run: |
          corepack pnpm --filter @evavo-docs/core typecheck
          corepack pnpm --filter @evavo-docs/web typecheck

      - name: Run consensus integrity runtime-evidence and tamper attacks
        working-directory: docs-source
        run: >-
          npm exec --yes --package=tsx@4.20.3 -- tsx --test
          packages/core/test/book-studio-unattended-editorial-consensus.test.mjs
          packages/core/test/book-studio-unattended-editorial-consensus-integrity.test.mjs
          packages/core/test/book-studio-unattended-editorial-consensus-runtime-evidence.test.mjs

      - name: Run complete repository verification
        working-directory: docs-source
        run: corepack pnpm verify

      - name: Build complete production workspace
        working-directory: docs-source
        run: corepack pnpm build

      - name: Prove exact Docs source remained clean
        working-directory: docs-source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Prove no Art Studio production source changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          merge_base="$(git merge-base HEAD origin/main)"
          unexpected="$(git diff --name-only "$merge_base" HEAD | grep -Ev '^\.github/workflows/validate-docs-editorial-runtime-evidence\.yml$' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Record validation boundary
        run: |
          printf '%s\n' \
            'validation=exact-docs-editorial-runtime-evidence-source' \
            "docs-source=${DOCS_SOURCE_SHA}" \
            "docs-base=${DOCS_BASE_SHA}" \
            'strict-core-and-web-typescript=true' \
            'duplicate-assignment-executions-allowed=false' \
            'runtime-result-revalidation-required=true' \
            'immutable-reviewer-payload-binding-required=true' \
            'provider-authentication-claimed=false' \
            'provider-call-performed=false' \
            'canonical-manuscript-mutation-performed=false' \
            'automatic-canonical-admission-allowed=false' \
            'art-studio-production-source-changed=false' \
            'publication-performed=false'
