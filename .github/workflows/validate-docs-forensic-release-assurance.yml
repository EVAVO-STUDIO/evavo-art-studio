name: Validate Docs Editorial Consensus Core

on:
  push:
    branches:
      - validation/docs-forensic-release-assurance-20260806
    paths:
      - ".github/workflows/validate-docs-forensic-release-assurance.yml"
      - "validation/docs-editorial-consensus/**"
      - "validation/docs-narrative-craft/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-editorial-consensus-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out disposable validation host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate exact current editorial consensus core
        run: bash validation/docs-editorial-consensus/run-core-validation-current.sh

      - name: Prove validation-only Art Studio scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          merge_base="$(git merge-base HEAD origin/main)"
          test "$merge_base" = "$(git rev-parse origin/main)"
          unexpected="$(git diff --name-only "$merge_base" HEAD | grep -Ev '^(\.github/workflows/validate-docs-forensic-release-assurance\.yml|validation/docs-editorial-consensus/|validation/docs-narrative-craft/)' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Record exact validation boundary
        run: |
          printf '%s\n' \
            'validation=byte-pinned-docs-editorial-consensus-core' \
            'docs-source=c880df972da9aba30e5adad9dec838e83e7a1a82' \
            'docs-main-parent=039f390d6a5e721f33efe2da5209a8d269635c64' \
            'consensus-core-blob=4b340d331ea40cf1a1958b38f08cbdd4ce987331' \
            'integrity-core-blob=34ac230e9e6486ed13e310cecaced272630bba54' \
            'strict-typescript=true' \
            'consensus-and-integrity-attacks=true' \
            'candidate-self-review-allowed=false' \
            'provider-fallback-allowed=false' \
            'canonical-manuscript-mutation-performed=false' \
            'automatic-canonical-admission-allowed=false' \
            'publication-performed=false'
