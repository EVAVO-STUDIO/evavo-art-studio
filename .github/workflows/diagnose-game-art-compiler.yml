name: Diagnose strict Game Art compiler merge

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v3-20260805]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 308a368263f74d7bafca6f11abcd982a1f213759
      PAYLOAD_ROOT: .github/automation/game-art-intelligence-v2
      ARCHIVE_SHA256: b571a8e0936d8dcb25185f5942f763774e0964b5adead29d280451fc7aa68c37
      PATCH_SHA256: f7c5541dfac45f31736cb98c3b47f2d6f982960ac6850a4666bbc085bee833f3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover exact source and print affected merge
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find "$PAYLOAD_ROOT" -maxdepth 1 -type f -name 'chunk-*.b64' -printf '%f\n' | LC_ALL=C sort)
          test "${#chunks[@]}" -eq 24
          : > /tmp/game-art-intelligence.patch.gz.b64
          for chunk in "${chunks[@]}"; do cat "$PAYLOAD_ROOT/$chunk" >> /tmp/game-art-intelligence.patch.gz.b64; done
          base64 --decode /tmp/game-art-intelligence.patch.gz.b64 > /tmp/game-art-intelligence.patch.gz
          printf '%s  %s\n' "$ARCHIVE_SHA256" /tmp/game-art-intelligence.patch.gz | sha256sum -c -
          gzip --decompress --stdout /tmp/game-art-intelligence.patch.gz > /tmp/game-art-intelligence.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/game-art-intelligence.patch | sha256sum -c -
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git config user.name "EVAVO Diagnostic"
          git config user.email "evavo-diagnostic@users.noreply.github.com"
          git switch --force-create diagnostic refs/remotes/origin/main
          git am --3way /tmp/game-art-intelligence.patch
          echo '--- compiler.ts lines 105-165 ---'
          nl -ba packages/game-art-intelligence/src/compiler.ts | sed -n '105,165p'
          echo '--- related input types ---'
          grep -R -n -A30 -B5 'interface ArtDirectionCameraInput\|type ArtDirectionCameraInput\|interface ArtDirectionAntiGenericInput\|type ArtDirectionAntiGenericInput' packages/art-direction/src packages/game-art-intelligence/src || true
