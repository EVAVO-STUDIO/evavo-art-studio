name: Promote current official action releases

on:
  push:
    branches:
      - fix/current-official-action-releases-20260817
    paths:
      - ".github/workflows/official-action-release-codemod-evidence.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: promote-current-official-action-releases
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact promotion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify exact bounded promotion source
        shell: bash
        env:
          REVIEW_HEAD_SHA: dbb611ebfb305666dccd43cdc815bbc6afa071d8
          REVIEW_BASE_SHA: aeedc119a98a49f8f9500e3e3f47432969506105
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/fix/current-official-action-releases-20260817"
          test "$(git rev-parse HEAD^)" = "${REVIEW_HEAD_SHA}"
          test "$(git rev-parse HEAD^^)" = "${REVIEW_BASE_SHA}"
          git merge-base --is-ancestor "${REVIEW_BASE_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          mapfile -t OBSERVED < <(
            git diff --name-only "${REVIEW_BASE_SHA}" HEAD -- | LC_ALL=C sort
          )
          EXPECTED=(
            ".github/workflows/official-action-release-codemod-evidence.yml"
            "scripts/apply-current-official-action-releases.mjs"
            "scripts/test-ci-media-tool-official-action-releases.mjs"
          )
          test "${#OBSERVED[@]}" -eq "${#EXPECTED[@]}"
          diff -u \
            <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${OBSERVED[@]}")
          git diff --check "${REVIEW_BASE_SHA}" HEAD --

      - name: Materialize and verify exact reviewed rewrite
        shell: bash
        env:
          REVIEW_BASE_SHA: aeedc119a98a49f8f9500e3e3f47432969506105
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="${RUNNER_TEMP}/official-action-release-promotion"
          mkdir -p "${EVIDENCE_ROOT}"

          node scripts/apply-current-official-action-releases.mjs \
            --manifest "${EVIDENCE_ROOT}/manifest.json" \
            > "${EVIDENCE_ROOT}/manifest.stdout.json"

          rm -f \
            .github/workflows/official-action-release-codemod-evidence.yml \
            scripts/apply-current-official-action-releases.mjs

          node --test scripts/test-ci-media-tool-*.mjs
          git diff --check "${REVIEW_BASE_SHA}" --

          MANIFEST_PATH="${EVIDENCE_ROOT}/manifest.json" \
          REVIEW_BASE_SHA="${REVIEW_BASE_SHA}" \
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import {
            existsSync,
            lstatSync,
            readFileSync,
          } from "node:fs";

          const manifest = JSON.parse(
            readFileSync(process.env.MANIFEST_PATH, "utf8"),
          );
          assert.equal(manifest.schema, "evavo.ci-official-action-rewrite.v1");
          assert.equal(manifest.changedFiles, 79);
          assert.equal(manifest.files.length, 79);
          assert.deepEqual(manifest.totals, {
            "actions/checkout": 79,
            "actions/setup-node": 74,
            "pnpm/action-setup": 36,
            "actions/upload-artifact": 22,
            "actions/setup-python": 38,
            "governed-test-setup-python": 1,
          });

          const uniquePaths = new Set(manifest.files.map((entry) => entry.path));
          assert.equal(uniquePaths.size, manifest.files.length);
          assert.equal(
            manifest.files.filter((entry) =>
              entry.path.startsWith(".github/workflows/"),
            ).length,
            78,
          );

          for (const entry of manifest.files) {
            assert.equal(lstatSync(entry.path).isSymbolicLink(), false, entry.path);
            const digest = createHash("sha256")
              .update(readFileSync(entry.path))
              .digest("hex");
            assert.equal(digest, entry.afterSha256, entry.path);
          }

          assert.equal(
            existsSync(
              ".github/workflows/official-action-release-codemod-evidence.yml",
            ),
            false,
          );
          assert.equal(
            existsSync("scripts/apply-current-official-action-releases.mjs"),
            false,
          );

          const observed = execFileSync(
            "git",
            ["diff", "--name-only", process.env.REVIEW_BASE_SHA, "--"],
            { encoding: "utf8" },
          )
            .trim()
            .split(/\r?\n/u)
            .filter(Boolean)
            .sort();
          const expected = [
            ...manifest.files.map((entry) => entry.path),
            "scripts/test-ci-media-tool-official-action-releases.mjs",
          ].sort();
          assert.deepEqual(observed, expected);
          NODE

      - name: Commit exact promoted workflow set
        id: commit
        shell: bash
        env:
          REVIEW_BASE_SHA: aeedc119a98a49f8f9500e3e3f47432969506105
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check

          STAGED_COUNT="$(
            git diff --cached --name-only "${REVIEW_BASE_SHA}" -- \
              | sed '/^$/d' \
              | wc -l \
              | tr -d ' '
          )"
          test "${STAGED_COUNT}" = "80"

          git commit \
            -m "build(ci): promote current official action releases" \
            -m "Apply the exact SHA-bound 79-file rewrite validated by the review-only codemod evidence, migrate pnpm/action-setup to the signed pnpm/setup successor, retain the permanent fail-closed release scanner, and remove the two temporary promotion files."

          PROMOTED_SHA="$(git rev-parse HEAD)"
          echo "promoted_sha=${PROMOTED_SHA}" >> "${GITHUB_OUTPUT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Push only the exact PR branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTED_SHA: ${{ steps.commit.outputs.promoted_sha }}
        run: |
          set -euo pipefail
          BRANCH="fix/current-official-action-releases-20260817"
          REMOTE_BEFORE="$(
            git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}'
          )"
          test "${REMOTE_BEFORE}" = "${GITHUB_SHA}"

          AUTHORIZATION="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0
          )"
          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTHORIZATION}" \
            push origin "HEAD:refs/heads/${BRANCH}"

          REMOTE_AFTER="$(
            git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}'
          )"
          test "${REMOTE_AFTER}" = "${PROMOTED_SHA}"

          {
            echo "### Official action release promotion"
            echo
            echo "- Promoted commit: \`${PROMOTED_SHA}\`"
            echo "- Exact rewritten files: 79"
            echo "- Final PR files: 80"
            echo "- Temporary promotion files removed: 2"
            echo "- Source branch only; main was not mutated"
          } >> "${GITHUB_STEP_SUMMARY}"
