name: Project Art avatar sequence mastering

on:
  pull_request:
    paths:
      - "scripts/compile-project-art-avatar-sequence.mjs"
      - "scripts/project-art/avatar-sequence-common.mjs"
      - "scripts/project-art/avatar-sequence-filesystem.mjs"
      - "scripts/project-art/avatar-sequence-contract.mjs"
      - "scripts/check-project-art-avatar-sequence.mjs"
      - "scripts/test-project-art-avatar-sequence.mjs"
      - "scripts/test-project-art-avatar-sequence-mcp.mjs"
      - "scripts/compile-project-art-loop-closure.mjs"
      - "tools/project_art_avatar_sequence_mcp.mjs"
      - "docs/PROJECT_ART_AVATAR_SEQUENCE_MASTERING.md"
      - "config/mcp.project-art-avatar-sequence.windows.example.json"
      - ".github/workflows/project-art-avatar-sequence.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/compile-project-art-avatar-sequence.mjs"
      - "scripts/project-art/avatar-sequence-common.mjs"
      - "scripts/project-art/avatar-sequence-filesystem.mjs"
      - "scripts/project-art/avatar-sequence-contract.mjs"
      - "scripts/check-project-art-avatar-sequence.mjs"
      - "scripts/test-project-art-avatar-sequence.mjs"
      - "scripts/test-project-art-avatar-sequence-mcp.mjs"
      - "scripts/compile-project-art-loop-closure.mjs"
      - "tools/project_art_avatar_sequence_mcp.mjs"
      - "docs/PROJECT_ART_AVATAR_SEQUENCE_MASTERING.md"
      - "config/mcp.project-art-avatar-sequence.windows.example.json"
      - ".github/workflows/project-art-avatar-sequence.yml"

permissions:
  contents: read

concurrency:
  group: project-art-avatar-sequence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Run syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/compile-project-art-avatar-sequence.mjs
          node --check scripts/project-art/avatar-sequence-common.mjs
          node --check scripts/project-art/avatar-sequence-filesystem.mjs
          node --check scripts/project-art/avatar-sequence-contract.mjs
          node --check scripts/check-project-art-avatar-sequence.mjs
          node --check scripts/test-project-art-avatar-sequence.mjs
          node --check scripts/test-project-art-avatar-sequence-mcp.mjs
          node --check tools/project_art_avatar_sequence_mcp.mjs

      - name: Verify exact static contract and workflow boundary
        run: node scripts/check-project-art-avatar-sequence.mjs

      - name: Run explicit-assignment and source-identity adversaries
        run: node scripts/test-project-art-avatar-sequence.mjs

      - name: Run callable MCP boundary adversaries
        run: node scripts/test-project-art-avatar-sequence-mcp.mjs

      - name: Recheck downstream final-to-first compiler contract
        run: node scripts/check-project-art-loop-closure.mjs

      - name: Verify permanent false-authority assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'evavo.project-art-avatar-sequence-request.v1' scripts/project-art/avatar-sequence-common.mjs
          grep -F 'evavo.project-art-avatar-sequence-mastering-plan.v1' scripts/project-art/avatar-sequence-common.mjs
          grep -F 'evavo_avatar_sequence_pack_v2' scripts/project-art/avatar-sequence-common.mjs
          grep -F "assignmentMode !== 'owner-declared-only'" scripts/compile-project-art-avatar-sequence.mjs
          grep -F 'semanticInferencePerformed: false' scripts/compile-project-art-avatar-sequence.mjs
          grep -F 'timestampOrderingUsedAsSemantics: false' scripts/compile-project-art-avatar-sequence.mjs
          grep -F 'workspaceFilePlanRequest' scripts/compile-project-art-avatar-sequence.mjs
          grep -F 'runtimeActivationAllowed: false' scripts/compile-project-art-avatar-sequence.mjs
          grep -F 'evavo.project-art-loop-closure-request.v1' scripts/project-art/avatar-sequence-common.mjs
          grep -F 'bytesFlowThroughMcp: false' tools/project_art_avatar_sequence_mcp.mjs
          grep -F 'credentialsForwardedToSubprocess: false' tools/project_art_avatar_sequence_mcp.mjs
          grep -F 'shell: false' tools/project_art_avatar_sequence_mcp.mjs
          ! grep -F 'providerExecution: true' scripts/compile-project-art-avatar-sequence.mjs
          ! grep -F 'targetRepositoryMutation: true' scripts/compile-project-art-avatar-sequence.mjs
          ! grep -F 'git push' scripts/compile-project-art-avatar-sequence.mjs
          ! grep -F 'git push' tools/project_art_avatar_sequence_mcp.mjs

      - name: Prove source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
