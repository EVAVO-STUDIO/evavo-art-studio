name: Validate Docs Art Plan Adapter

on:
  push:
    branches:
      - automation/validate-docs-art-plan-20260804
  pull_request:
    branches: [main]
    paths:
      - 'validation/docs-art-plan/**'
      - '.github/workflows/validate-docs-art-plan-adapter.yml'

permissions:
  contents: read

concurrency:
  group: validate-docs-art-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact validation commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install exact Art Studio dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build the actual Art Studio contracts receiver
        run: pnpm --filter @evavo/art-contracts build

      - name: Compile mirrored Docs Suite source under strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/docs-art-plan/node_modules/server-only
          printf '%s\n' 'module.exports = {};' > validation/docs-art-plan/node_modules/server-only/index.js
          pnpm exec tsc -p validation/docs-art-plan/tsconfig.json

      - name: Run permanent Docs migration authority checker
        working-directory: validation/docs-art-plan
        run: node scripts/check-book-studio-art-plan-translation.mjs

      - name: Run exact Docs-to-Art cross-repository parity and transport attacks
        run: node --test validation/docs-art-plan/test/runtime.mjs

      - name: Run exact CLI and MCP regressions
        run: node --test validation/docs-art-plan/apps/web/test/book-studio-art-plan-translation-cli-mcp.test.mjs

      - name: Verify executable JavaScript syntax
        run: |
          node --check validation/docs-art-plan/apps/web/scripts/docs-suite-api-client.mjs
          node --check validation/docs-art-plan/apps/web/scripts/evavo-docs-book-cli.mjs
          node --check validation/docs-art-plan/apps/web/scripts/evavo-docs-book-mcp.mjs

      - name: Prove validation leaves no tracked source changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf validation/docs-art-plan/dist validation/docs-art-plan/node_modules
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
