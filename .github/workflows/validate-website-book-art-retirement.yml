name: Validate Website Book Art Retirement

on:
  push:
    branches:
      - automation/validate-website-retirement-crossrepo-20260804
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-website-book-art-retirement.yml"
      - "validation/website-book-art-retirement/**"

permissions:
  contents: read

concurrency:
  group: validate-website-book-art-retirement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact validation carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install review-first Art Studio dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Generate all 62 exact compatibility shims
        run: node validation/website-book-art-retirement/prepare.mjs

      - name: Compile the exact Website blob and every shim under strict TypeScript
        run: pnpm exec tsc -p validation/website-book-art-retirement/tsconfig.json

      - name: Attack every retired runtime export and verify signed receipts
        run: node validation/website-book-art-retirement/test.mjs

      - name: Verify validation source syntax
        run: |
          node --check validation/website-book-art-retirement/prepare.mjs
          node --check validation/website-book-art-retirement/test.mjs

      - name: Prove validation leaves no tracked source changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          rm -rf validation/website-book-art-retirement/generated
          rm -rf validation/website-book-art-retirement/dist
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
