name: Validate Docs Editorial Consensus Mirror

on:
  push:
    branches:
      - validation/docs-editorial-consensus-20260805
    paths:
      - ".github/workflows/validate-docs-editorial-consensus-mirror.yml"
      - "validation/docs-editorial-consensus/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-docs-editorial-consensus-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out disposable validation host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Reconstruct exact retained planner and editorial source
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/docs-editorial-consensus-mirror"
          rm -rf "$mirror"
          cp -R validation/docs-narrative-craft "$mirror"
          rm -rf "$mirror/node_modules"

          carrier="refs/remotes/origin/automation/validate-docs-book-unattended-production-20260804"
          git fetch --no-tags origin "+refs/heads/automation/validate-docs-book-unattended-production-20260804:$carrier"
          git show "$carrier:validation/docs-book-universal-readiness/packages/core/src/book-studio-project-contracts.ts" > "$mirror/src/book-studio-project-contracts.ts"
          git show "$carrier:validation/docs-book-universal-readiness/packages/core/src/book-studio-universal-readiness.ts" > "$mirror/src/book-studio-universal-readiness.ts"
          git show "$carrier:validation/docs-book-universal-readiness/packages/core/src/book-studio-universal-readiness-governance.ts" > "$mirror/src/book-studio-universal-readiness-governance.ts"

          encoded="$RUNNER_TEMP/docs-book-unattended-production.b64"
          archive="$RUNNER_TEMP/docs-book-unattended-production.tar.gz"
          overlay="$RUNNER_TEMP/docs-book-unattended-overlay"
          rm -rf "$encoded" "$archive" "$overlay"
          for part in {00..05}; do
            git show "$carrier:validation/docs-book-unattended-production-payload/part-$part.b64" >> "$encoded"
          done
          test "$(wc -c < "$encoded")" = "31376"
          test "$(sha256sum "$encoded" | cut -d' ' -f1)" = "a2559ebe10e04debf667f26a41117b967c19ac842b97d89164fd62d3cb8336f7"
          base64 --decode "$encoded" > "$archive"
          test "$(wc -c < "$archive")" = "23532"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "575bc289dc84444259bb3e86b1d96174fa3c07f26251004b718d1418b699e592"
          mkdir -p "$overlay"
          tar -xzf "$archive" -C "$overlay"
          cp "$overlay/packages/core/src/book-studio-unattended-production.ts" "$mirror/src/"

          cat validation/docs-editorial-consensus/payload/book-studio-unattended-editorial-consensus.ts.part-* > "$mirror/src/book-studio-unattended-editorial-consensus.ts"
          cat validation/docs-editorial-consensus/payload/book-studio-unattended-editorial-consensus.test.mjs.part-* > "$mirror/test/unattended-editorial-consensus.test.mjs"
          cp validation/docs-editorial-consensus/source/book-studio-unattended-editorial-consensus-integrity.ts "$mirror/src/"
          cp validation/docs-editorial-consensus/source/book-studio-unattended-editorial-consensus-integrity.test.mjs "$mirror/test/unattended-editorial-consensus-integrity.test.mjs"
          sed 's#../docs-narrative-craft/src/#./#g' validation/docs-editorial-consensus/source/book-studio-phrase-overlap-integrity.ts > "$mirror/src/book-studio-phrase-overlap-integrity.ts"
          printf 'MIRROR=%s\n' "$mirror" >> "$GITHUB_ENV"

      - name: Prove every exact reviewed core blob
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local relative="$1" expected="$2"
            local actual
            actual="$(git hash-object "$MIRROR/$relative")"
            printf '%s=%s\n' "$relative" "$actual"
            test "$actual" = "$expected"
          }
          check src/book-studio-project-contracts.ts fa5fd3bf4ceb314cb4926add4231d22cb82863d6
          check src/book-studio-universal-readiness.ts 3c348b4969d94f2e81a7a4e8e0f9c2399850e640
          check src/book-studio-universal-readiness-governance.ts aac0ff806dbfc41259b4925918a96103a5615489
          check src/book-studio-unattended-production.ts a680376b58addae4ffb6b8a9cdfcab361a2711e4
          check src/book-studio-unattended-editorial-consensus.ts 4b340d331ea40cf1a1958b38f08cbdd4ce987331
          check src/book-studio-unattended-editorial-consensus-integrity.ts 34ac7835c50ec62e718c1b1b7ce3dc3440d7872b
          check src/book-studio-phrase-overlap-integrity.ts 1fec55714b98e852d457a575691ae218af8b75a8
          check test/unattended-editorial-consensus.test.mjs 52860de647aa83d696aa60df7a738b06768f6ba5
          check test/unattended-editorial-consensus-integrity.test.mjs 68305e1d009e63763bdb68d8135a4a56f07a481e

      - name: Install validation-only compiler tools
        run: npm install --prefix "$MIRROR" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 @types/node@22 tsx@4.20.3

      - name: Run strict core TypeScript
        run: "$MIRROR/node_modules/.bin/tsc" -p "$MIRROR/tsconfig.json"

      - name: Run consensus dissent receipt and semantic-tamper attacks
        run: >-
          "$MIRROR/node_modules/.bin/tsx" --test
          "$MIRROR/test/unattended-editorial-consensus.test.mjs"
          "$MIRROR/test/unattended-editorial-consensus-integrity.test.mjs"

      - name: Prove no Art Studio production source changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          merge_base="$(git merge-base HEAD origin/main)"
          unexpected="$(git diff --name-only "$merge_base" HEAD | grep -Ev '^(\.github/workflows/validate-docs-editorial-consensus-(exact|mirror)\.yml|validation/docs-editorial-consensus/|validation-results/docs-editorial-consensus-core\.json)' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Persist core validation receipt
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          receipt="validation-results/docs-editorial-consensus-core.json"
          mkdir -p "$(dirname "$receipt")"
          conclusion="${{ job.status }}"
          cat > "$receipt" <<JSON
          {
            "outputKind": "evavo_art_docs_editorial_consensus_core_validation_receipt",
            "schemaVersion": 1,
            "conclusion": "$conclusion",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "testedValidationHead": "${GITHUB_SHA}",
            "docsFeatureHead": "e843e31442643057dca3de23c9b9ab10ded8d7e5",
            "docsBaseHead": "22a8bf0b49637c1da1033e95eba0d7a7d8889e06",
            "exactRetainedPlannerPayload": true,
            "exactReviewedCoreBlobs": true,
            "providerCallPerformed": false,
            "canonicalManuscriptMutationPerformed": false,
            "automaticCanonicalAdmissionAllowed": false,
            "artStudioProductionSourceChanged": false,
            "publicationPerformed": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$receipt"
          if ! git diff --cached --quiet; then
            git commit -m "test(validation): record editorial consensus core ${conclusion}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
