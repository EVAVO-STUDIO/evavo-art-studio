name: Transfer project art workbench source

on:
  push:
    branches:
      - agent/project-art-workbench-release-20260809
    paths:
      - .github/workflows/transfer-project-art-workbench.yml
      - carrier/project-art-release/**

permissions:
  contents: write

concurrency:
  group: transfer-project-art-workbench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'EVAVO-STUDIO/evavo-art-studio' && github.event.head_commit.message != 'feat(project-art): stage universal image workbench source'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.13.5

      - name: Verify carrier and extract exact source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/project-art-workbench-release-20260809"
          git merge-base --is-ancestor 05a4cb423befe2c32ca33bfafab95fcee0e2ead9 HEAD
          test "$(git status --porcelain)" = ""
          cat carrier/project-art-release/chunk-* | base64 --decode > "$RUNNER_TEMP/project-art-release.tar.gz"
          echo '78dbb2b945e6880893d241ae5a2a88fa44eaa2c117f6413a37442f7412b84777  '"$RUNNER_TEMP"'/project-art-release.tar.gz' | sha256sum --check
          cat > "$RUNNER_TEMP/archive-paths.expected" <<'EOF'
          .github/workflows/project-art-workbench.yml
          config/project-art-operations.v1.json
          docs/PROJECT_ART_WORKBENCH.md
          package.json
          scripts/check-project-art-workbench.mjs
          scripts/compile-project-art-intelligence.mjs
          scripts/compile-project-art-sandbox.mjs
          scripts/compile-reference-derived-image-plan.mjs
          scripts/project-art/common.mjs
          scripts/project-art/intelligence.mjs
          scripts/project-art/reference-derived.mjs
          scripts/project-art/sandbox.mjs
          scripts/stage-reference-derived-artifacts.mjs
          scripts/test-project-art-workbench.mjs
          tools/run_project_art_sandbox.py
          EOF
          tar -tzf "$RUNNER_TEMP/project-art-release.tar.gz" | sed 's#^\./##' | sed '/^$/d' | sort > "$RUNNER_TEMP/archive-paths.actual"
          sort "$RUNNER_TEMP/archive-paths.expected" > "$RUNNER_TEMP/archive-paths.expected.sorted"
          diff -u "$RUNNER_TEMP/archive-paths.expected.sorted" "$RUNNER_TEMP/archive-paths.actual"
          mkdir -p "$RUNNER_TEMP/project-art-release"
          tar -xzf "$RUNNER_TEMP/project-art-release.tar.gz" -C "$RUNNER_TEMP/project-art-release"
          rsync -a "$RUNNER_TEMP/project-art-release/" ./
          rm -rf carrier/project-art-release

      - name: Validate transferred workbench
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-image-pipeline.txt
          node scripts/check-project-art-workbench.mjs
          PROJECT_ART_REQUIRE_PILLOW=1 node scripts/test-project-art-workbench.mjs
          node --check scripts/project-art/common.mjs
          node --check scripts/project-art/intelligence.mjs
          node --check scripts/project-art/sandbox.mjs
          node --check scripts/project-art/reference-derived.mjs
          python -m py_compile tools/run_project_art_sandbox.py
          rm -rf tools/__pycache__

      - name: Publish non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/project-art-workbench.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(project-art): stage universal image workbench source'
          cat > "$RUNNER_TEMP/final-paths.expected" <<'EOF'
          .github/workflows/transfer-project-art-workbench.yml
          config/project-art-operations.v1.json
          docs/PROJECT_ART_WORKBENCH.md
          package.json
          scripts/check-project-art-workbench.mjs
          scripts/compile-project-art-intelligence.mjs
          scripts/compile-project-art-sandbox.mjs
          scripts/compile-reference-derived-image-plan.mjs
          scripts/project-art/common.mjs
          scripts/project-art/intelligence.mjs
          scripts/project-art/reference-derived.mjs
          scripts/project-art/sandbox.mjs
          scripts/stage-reference-derived-artifacts.mjs
          scripts/test-project-art-workbench.mjs
          tools/run_project_art_sandbox.py
          EOF
          git diff --name-only 05a4cb423befe2c32ca33bfafab95fcee0e2ead9...HEAD | sort > "$RUNNER_TEMP/final-paths.actual"
          sort "$RUNNER_TEMP/final-paths.expected" > "$RUNNER_TEMP/final-paths.expected.sorted"
          diff -u "$RUNNER_TEMP/final-paths.expected.sorted" "$RUNNER_TEMP/final-paths.actual"
          test "$(git status --porcelain)" = ""
          git push origin "HEAD:${GITHUB_REF_NAME}"
