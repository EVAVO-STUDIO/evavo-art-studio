name: Project Art avatar sequence bundle

on:
  pull_request:
    paths:
      - "scripts/project-art/avatar-sequence-bundle-common.mjs"
      - "scripts/project-art/avatar-sequence-bundle-fixture.mjs"
      - "scripts/write-project-art-avatar-sequence-bundle.mjs"
      - "scripts/check-project-art-avatar-sequence-bundle.mjs"
      - "scripts/test-project-art-avatar-sequence-bundle.mjs"
      - "scripts/test-project-art-avatar-sequence-bundle-mcp.mjs"
      - "tools/project_art_avatar_sequence_bundle_mcp.mjs"
      - "docs/PROJECT_ART_AVATAR_SEQUENCE_BUNDLES.md"
      - "config/mcp.project-art-avatar-sequence-bundle.windows.example.json"
      - ".github/workflows/project-art-avatar-sequence-bundle.yml"
      - "scripts/compile-project-art-avatar-sequence.mjs"
      - "scripts/check-project-art-avatar-sequence.mjs"
  push:
    branches:
      - main
    paths:
      - "scripts/project-art/avatar-sequence-bundle-common.mjs"
      - "scripts/project-art/avatar-sequence-bundle-fixture.mjs"
      - "scripts/write-project-art-avatar-sequence-bundle.mjs"
      - "scripts/check-project-art-avatar-sequence-bundle.mjs"
      - "scripts/test-project-art-avatar-sequence-bundle.mjs"
      - "scripts/test-project-art-avatar-sequence-bundle-mcp.mjs"
      - "tools/project_art_avatar_sequence_bundle_mcp.mjs"
      - "docs/PROJECT_ART_AVATAR_SEQUENCE_BUNDLES.md"
      - "config/mcp.project-art-avatar-sequence-bundle.windows.example.json"
      - ".github/workflows/project-art-avatar-sequence-bundle.yml"
      - "scripts/compile-project-art-avatar-sequence.mjs"
      - "scripts/check-project-art-avatar-sequence.mjs"

permissions:
  contents: read

concurrency:
  group: project-art-avatar-sequence-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Run syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/project-art/avatar-sequence-bundle-common.mjs
          node --check scripts/project-art/avatar-sequence-bundle-fixture.mjs
          node --check scripts/write-project-art-avatar-sequence-bundle.mjs
          node --check scripts/check-project-art-avatar-sequence-bundle.mjs
          node --check scripts/test-project-art-avatar-sequence-bundle.mjs
          node --check scripts/test-project-art-avatar-sequence-bundle-mcp.mjs
          node --check tools/project_art_avatar_sequence_bundle_mcp.mjs

      - name: Verify exact bundle contract and static authority boundary
        run: node scripts/check-project-art-avatar-sequence-bundle.mjs

      - name: Run atomic bundle writer adversaries
        run: node --test scripts/test-project-art-avatar-sequence-bundle.mjs

      - name: Run callable bundle MCP adversaries
        run: node scripts/test-project-art-avatar-sequence-bundle-mcp.mjs

      - name: Recheck upstream avatar-sequence compiler boundary
        run: node scripts/check-project-art-avatar-sequence.mjs

      - name: Verify permanent false-authority assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'evavo.project-art-avatar-sequence-bundle.v1' scripts/project-art/avatar-sequence-bundle-common.mjs
          grep -F 'sourcePlanRevalidatedBeforePublication: true' scripts/write-project-art-avatar-sequence-bundle.mjs
          grep -F 'wholeRunAtomicPublication: true' scripts/write-project-art-avatar-sequence-bundle.mjs
          grep -F 'runtimeActivationAllowed: false' scripts/write-project-art-avatar-sequence-bundle.mjs
          grep -F 'bytesFlowThroughMcp: false' tools/project_art_avatar_sequence_bundle_mcp.mjs
          grep -F 'credentialsForwardedToSubprocess: false' tools/project_art_avatar_sequence_bundle_mcp.mjs
          grep -F 'shell: false' tools/project_art_avatar_sequence_bundle_mcp.mjs
          ! grep -F 'providerExecution: true' scripts/write-project-art-avatar-sequence-bundle.mjs
          ! grep -F 'targetRepositoryMutation: true' scripts/write-project-art-avatar-sequence-bundle.mjs
          ! grep -F 'runtimeActivation: true' scripts/write-project-art-avatar-sequence-bundle.mjs
          ! grep -F 'git push' scripts/write-project-art-avatar-sequence-bundle.mjs
          ! grep -F 'git push' tools/project_art_avatar_sequence_bundle_mcp.mjs

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
