name: Temporary focused Art Studio repair assembly

on:
  push:
    branches:
      - automation/source-export-20260828

permissions:
  contents: write

concurrency:
  group: art-studio-focused-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded temporary branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "EVAVO-STUDIO/evavo-art-studio" ]]
          [[ "${GITHUB_REF}" == "refs/heads/automation/source-export-20260828" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Apply bounded provider repair and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --whitespace=error-all .automation/provider-fidelity.patch
          git apply --whitespace=error-all .automation/provider-fidelity.patch
          rm -f .automation/provider-fidelity.patch
          rmdir .automation 2>/dev/null || true
          rm -f .github/workflows/focused-repair-temp.yml
          rm -f .github/workflows/source-export-temp.yml
          grep -F 'const OPENAI_AUTOMATIC_HIGH_INPUT_FIDELITY_MODEL' packages/providers/src/adapters/openai-images.ts
          grep -F 'inputFidelity: inputFidelity?.evidence ?? null' packages/providers/src/adapters/openai-images.ts
          grep -F '"composite": true' packages/contracts/tsconfig.json
          node --check packages/providers/test/providers.test.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("packages/contracts/tsconfig.json", "utf8"))'
          expected="$(printf '%s\n' \
            .automation/provider-fidelity.patch \
            .github/workflows/focused-repair-temp.yml \
            .github/workflows/source-export-temp.yml \
            packages/providers/src/adapters/openai-images.ts \
            packages/providers/test/providers.test.mjs | sort)"
          actual="$(git diff --name-only | sort)"
          [[ "${actual}" == "${expected}" ]]
          [[ -z "$(git ls-files --others --exclude-standard)" ]]

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate contracts and project reference consumer
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @evavo/art-contracts test
          pnpm --filter @evavo/art-contracts typecheck
          pnpm --filter @evavo/art-repo-inspector test
          pnpm --filter @evavo/art-repo-inspector typecheck

      - name: Validate provider dependency graph and regression suite
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @evavo/art-providers... build
          pnpm --filter @evavo/art-providers test
          pnpm --filter @evavo/art-providers typecheck

      - name: Verify patch boundaries and immutable lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- pnpm-lock.yaml
          expected="$(printf '%s\n' \
            .automation/provider-fidelity.patch \
            .github/workflows/focused-repair-temp.yml \
            .github/workflows/source-export-temp.yml \
            packages/providers/src/adapters/openai-images.ts \
            packages/providers/test/providers.test.mjs | sort)"
          actual="$(git diff --name-only | sort)"
          [[ "${actual}" == "${expected}" ]]
          [[ -z "$(git ls-files --others --exclude-standard)" ]]

      - name: Publish exact validated candidate tree to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Art Studio automation"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          git commit -m "fix: align contract references and GPT Image 2 edits"
          git push origin HEAD:automation/source-export-20260828
