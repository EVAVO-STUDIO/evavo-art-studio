name: Agent Book Art Source Snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-book-art-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create tracked-source archive
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > agent-source-commit.txt
          git ls-files -z | tar --null --files-from=- -czf evavo-art-studio-source.tar.gz
          sha256sum evavo-art-studio-source.tar.gz > evavo-art-studio-source.tar.gz.sha256
      - name: Upload tracked-source archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-book-art-source-${{ github.sha }}
          path: |
            agent-source-commit.txt
            evavo-art-studio-source.tar.gz
            evavo-art-studio-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
