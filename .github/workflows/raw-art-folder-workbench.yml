name: RAW ART folder workbench

on:
  pull_request:
    paths:
      - "scripts/raw-art-folder-workbench.mjs"
      - "scripts/raw-art-folder/**"
      - "scripts/check-raw-art-folder-workbench.mjs"
      - "scripts/test-raw-art-folder-workbench.mjs"
      - "tools/raw_art_folder_mcp.mjs"
      - "docs/RAW_ART_FOLDER_WORKBENCH.md"
      - "config/mcp.raw-art-folder.windows.example.json"
      - "package.json"
      - ".github/workflows/raw-art-folder-workbench.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/raw-art-folder-workbench.mjs"
      - "scripts/raw-art-folder/**"
      - "scripts/check-raw-art-folder-workbench.mjs"
      - "scripts/test-raw-art-folder-workbench.mjs"
      - "tools/raw_art_folder_mcp.mjs"
      - "docs/RAW_ART_FOLDER_WORKBENCH.md"
      - "config/mcp.raw-art-folder.windows.example.json"
      - "package.json"
      - ".github/workflows/raw-art-folder-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raw-art-folder-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Parse RAW_ART folder tools
        run: |
          node --check scripts/raw-art-folder-workbench.mjs
          node --check scripts/raw-art-folder/lib.mjs
          node --check scripts/raw-art-folder/scan.mjs
          node --check scripts/raw-art-folder/plan.mjs
          node --check scripts/raw-art-folder/session.mjs
          node --check scripts/check-raw-art-folder-workbench.mjs
          node --check scripts/test-raw-art-folder-workbench.mjs
          node --check tools/raw_art_folder_mcp.mjs

      - name: Verify root command wiring
        run: |
          node -e 'const p=require("./package.json"); const s=p.scripts||{}; for (const k of ["raw-art:folder:scan","raw-art:folder:plan","raw-art:folder:materialize","raw-art:folder:verify","raw-art:folder:mcp","raw-art:folder:test","raw-art:folder:check"]) { if (!s[k]) throw new Error(`Missing ${k}`); } if (!s.check.includes("pnpm run raw-art:folder:check")) throw new Error("Root check does not include RAW_ART folder validation");'

      - name: Run exact contract and adversarial tests
        run: node scripts/check-raw-art-folder-workbench.mjs

      - name: Prove source remains clean
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
