name: Creative Media Fabric contract

on:
  push:
    branches: [main]
    paths:
      - 'contracts/creative-media-handoff-v1.schema.json'
      - 'config/creative-media-fabric-v1.json'
      - 'scripts/check-creative-media-fabric.mjs'
      - '.github/workflows/creative-media-fabric.yml'
  pull_request:
    paths:
      - 'contracts/creative-media-handoff-v1.schema.json'
      - 'config/creative-media-fabric-v1.json'
      - 'scripts/check-creative-media-fabric.mjs'
      - '.github/workflows/creative-media-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-media-fabric-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Verify shared handoff contract and studio profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Run deterministic networkless self-test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-creative-media-fabric.mjs --self-test
