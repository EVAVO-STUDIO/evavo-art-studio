name: Runtime control and transition input integrity

on:
  pull_request:
    paths:
      - "packages/runtime/src/local-repository.ts"
      - "packages/runtime/test/control-options-integrity-security.test.mjs"
      - "packages/runtime/test/transition-clock-integrity-security.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-control-options-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "packages/runtime/src/local-repository.ts"
      - "packages/runtime/test/control-options-integrity-security.test.mjs"
      - "packages/runtime/test/transition-clock-integrity-security.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-control-options-integrity.yml"

permissions:
  contents: read

concurrency:
  group: runtime-control-options-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check runtime control dependencies
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-runtime build
          pnpm --filter @evavo/art-runtime typecheck

      - name: Run runtime control, transition and persistence regressions
        run: >-
          node --test
          packages/runtime/test/runtime.test.mjs
          packages/runtime/test/redrive-policy.test.mjs
          packages/runtime/test/journal-integrity-security.test.mjs
          packages/runtime/test/submission-integrity-security.test.mjs
          packages/runtime/test/worker-options-integrity-security.test.mjs
          packages/runtime/test/control-options-integrity-security.test.mjs
          packages/runtime/test/claim-input-integrity-security.test.mjs
          packages/runtime/test/transition-clock-integrity-security.test.mjs

      - name: Verify permanent runtime control and transition contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'snapshotRuntimeControlOptions' packages/runtime/src/local-repository.ts
          grep -F 'snapshotRuntimeControlDate' packages/runtime/src/local-repository.ts
          grep -F 'RUNTIME_JOB_CONTROL_OPTIONS_INVALID' packages/runtime/src/local-repository.ts
          grep -F 'snapshotRuntimeTransitionClock' packages/runtime/src/local-repository.ts
          grep -F 'all journal-backed transition methods snapshot clocks before asynchronous work' packages/runtime/test/transition-clock-integrity-security.test.mjs
          grep -F 'claim clocks are captured before worker normalization can mutate them' packages/runtime/test/transition-clock-integrity-security.test.mjs
          grep -F 'post-call clock mutation cannot change submission or execution transitions' packages/runtime/test/transition-clock-integrity-security.test.mjs
          grep -F 'post-call clock mutation cannot change failure or recovery decisions' packages/runtime/test/transition-clock-integrity-security.test.mjs
          grep -F 'post-call clock mutation cannot change resume or redrive reconciliation' packages/runtime/test/transition-clock-integrity-security.test.mjs
          grep -F 'transition clocks fail closed and use intrinsic Date semantics' packages/runtime/test/transition-clock-integrity-security.test.mjs
          grep -F 'cancel and pause options are read exactly once before journal work' packages/runtime/test/control-options-integrity-security.test.mjs
          grep -F 'post-call mutation cannot escalate cooperative cancellation or advance unrelated jobs' packages/runtime/test/control-options-integrity-security.test.mjs
          grep -F 'post-call mutation cannot escalate cooperative pause' packages/runtime/test/control-options-integrity-security.test.mjs
          grep -F 'hostile and malformed control options fail closed without state changes' packages/runtime/test/control-options-integrity-security.test.mjs
          grep -F 'control clocks are copied through intrinsic Date semantics' packages/runtime/test/control-options-integrity-security.test.mjs
          ! grep -F 'options.force' packages/runtime/src/local-repository.ts
          ! grep -F 'const now = options.now ?? new Date();' packages/runtime/src/local-repository.ts

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
