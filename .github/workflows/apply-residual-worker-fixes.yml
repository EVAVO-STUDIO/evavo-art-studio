name: Apply exact Art Studio residual worker fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/fix-art-studio-full-validation-20260802
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "234e912bb8223f132d2d79205ee968e4fd8bdaa6" ]]

      - name: Install FFmpeg for media-backed validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Apply exact reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git show origin/automation/fix-residual-worker-234e912-20260802:.github/scripts/apply-residual-worker-fixes.py > /tmp/apply-residual-worker-fixes.py
          python /tmp/apply-residual-worker-fixes.py
          git diff --check
          git diff --stat

      - name: Run complete repository validation
        run: pnpm check

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 5 ]]
          printf '%s\n' "${changed[@]}" | grep -Fx 'apps/worker/src/sprite-supervisor-handlers.ts'
          printf '%s\n' "${changed[@]}" | grep -Fx 'apps/worker/test/candidate-finalization.test.mjs'
          printf '%s\n' "${changed[@]}" | grep -Fx 'apps/worker/test/deterministic-mirroring.test.mjs'
          printf '%s\n' "${changed[@]}" | grep -Fx 'apps/worker/test/mastering-worker.test.mjs'
          printf '%s\n' "${changed[@]}" | grep -Fx 'packages/sprite-supervisor/src/validation-core.ts'
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no | grep -vE '^( M|M ) (apps/worker/src/sprite-supervisor-handlers.ts|apps/worker/test/candidate-finalization.test.mjs|apps/worker/test/deterministic-mirroring.test.mjs|apps/worker/test/mastering-worker.test.mjs|packages/sprite-supervisor/src/validation-core.ts)$')"

      - name: Commit and push validated corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO validation automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            apps/worker/src/sprite-supervisor-handlers.ts \
            apps/worker/test/candidate-finalization.test.mjs \
            apps/worker/test/deterministic-mirroring.test.mjs \
            apps/worker/test/mastering-worker.test.mjs \
            packages/sprite-supervisor/src/validation-core.ts
          git commit -m "fix: complete Art Studio validation repair"
          git push origin HEAD:agent/fix-art-studio-full-validation-20260802
