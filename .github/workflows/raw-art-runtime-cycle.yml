name: RAW ART runtime cycle validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/execute-raw-art-runtime-cycle.mjs"
      - "scripts/check-raw-art-runtime-cycle.mjs"
      - "docs/RAW_ART_RUNTIME_CYCLE.md"
      - ".github/workflows/raw-art-runtime-cycle.yml"
  pull_request:
    paths:
      - "scripts/execute-raw-art-runtime-cycle.mjs"
      - "scripts/check-raw-art-runtime-cycle.mjs"
      - "docs/RAW_ART_RUNTIME_CYCLE.md"
      - ".github/workflows/raw-art-runtime-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raw-art-runtime-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Validate runtime-cycle authority
        run: node scripts/check-raw-art-runtime-cycle.mjs

      - name: Confirm validation made no source changes
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
