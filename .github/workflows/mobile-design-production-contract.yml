name: Mobile design production contract

on:
  pull_request:
    paths:
      - 'config/mobile/evavo-glasses.production-plan.json'
      - 'scripts/compile-mobile-app-asset-plan.mjs'
      - 'scripts/mobile-identity-contract.mjs'
      - 'scripts/mobile-identity-production.mjs'
      - 'scripts/compile-mobile-identity-provider-request.mjs'
      - 'scripts/compile-mobile-identity-execution-plan.mjs'
      - 'scripts/mobile-identity-provider-runtime.mjs'
      - 'scripts/mobile-identity-provider-runtime-entry.mjs'
      - 'scripts/run-mobile-identity-provider-plan.mjs'
      - 'scripts/test-mobile-design-production-contract.mjs'
      - 'scripts/test-mobile-identity-production.mjs'
      - 'scripts/test-mobile-identity-provider-request.mjs'
      - 'scripts/test-mobile-identity-execution-plan.mjs'
      - 'scripts/test-mobile-identity-provider-runtime-contract.mjs'
      - 'scripts/test-mobile-identity-provider-runner.mjs'
      - 'scripts/test-mobile-identity-focused.mjs'
      - 'evavo.tasks.json'
      - '.github/workflows/mobile-design-production-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/mobile/evavo-glasses.production-plan.json'
      - 'scripts/compile-mobile-app-asset-plan.mjs'
      - 'scripts/mobile-identity-contract.mjs'
      - 'scripts/mobile-identity-production.mjs'
      - 'scripts/compile-mobile-identity-provider-request.mjs'
      - 'scripts/compile-mobile-identity-execution-plan.mjs'
      - 'scripts/mobile-identity-provider-runtime.mjs'
      - 'scripts/mobile-identity-provider-runtime-entry.mjs'
      - 'scripts/run-mobile-identity-provider-plan.mjs'
      - 'scripts/test-mobile-design-production-contract.mjs'
      - 'scripts/test-mobile-identity-production.mjs'
      - 'scripts/test-mobile-identity-provider-request.mjs'
      - 'scripts/test-mobile-identity-execution-plan.mjs'
      - 'scripts/test-mobile-identity-provider-runtime-contract.mjs'
      - 'scripts/test-mobile-identity-provider-runner.mjs'
      - 'scripts/test-mobile-identity-focused.mjs'
      - 'evavo.tasks.json'
      - '.github/workflows/mobile-design-production-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-design-production-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Mobile design contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Check mobile identity compiler and runner syntax
        run: |
          node --check scripts/compile-mobile-app-asset-plan.mjs
          node --check scripts/mobile-identity-contract.mjs
          node --check scripts/mobile-identity-production.mjs
          node --check scripts/compile-mobile-identity-provider-request.mjs
          node --check scripts/compile-mobile-identity-execution-plan.mjs
          node --check scripts/mobile-identity-provider-runtime.mjs
          node --check scripts/mobile-identity-provider-runtime-entry.mjs
          node --check scripts/run-mobile-identity-provider-plan.mjs
          node --check scripts/test-mobile-identity-provider-runtime-contract.mjs
          node --check scripts/test-mobile-identity-provider-runner.mjs
          node --check scripts/test-mobile-identity-focused.mjs

      - name: Validate mobile design contract
        run: node --test scripts/test-mobile-design-production-contract.mjs

      - name: Validate complete raster-first identity chain
        run: node scripts/test-mobile-identity-focused.mjs

      - name: Verify tracked worker manifest targets the focused chain
        run: |
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('evavo.tasks.json','utf8'));const t=m.tasks?.['mobile-identity-focused'];if(!t||t.runtime!=='node-script'||t.entry!=='scripts/test-mobile-identity-focused.mjs'||t.network!=='disabled')process.exit(2);"

      - name: Verify checkout remained clean
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
