name: Capture current-main validation residue

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v7-20260805]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_MAIN_SHA: 3de1fe91db5b2067de478303666a8a6bf1f51485
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach refs/remotes/origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Run exact current-main validation and retain residue
        shell: bash
        run: |
          set -uo pipefail
          node scripts/check-repository-toolchain.mjs
          node scripts/test-repository-toolchain.mjs
          pnpm install --no-frozen-lockfile
          set +e
          pnpm check
          validation_status=$?
          set -e
          rm -f pnpm-lock.yaml
          echo "validation_status=${validation_status}"
          echo '--- git status ---'
          git status --short --untracked-files=all
          echo '--- tracked diff stat ---'
          git diff --stat
          echo '--- tracked diff ---'
          git diff -- . ':!pnpm-lock.yaml'
          echo '--- untracked files ---'
          git ls-files --others --exclude-standard
          test "$validation_status" -eq 0
