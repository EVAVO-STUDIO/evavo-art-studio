name: Locate forbidden workflow authority

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v7-20260805]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 3de1fe91db5b2067de478303666a8a6bf1f51485
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact current main permissions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach refs/remotes/origin/main
          echo '--- forbidden actions write declarations ---'
          grep -R -n -C8 -E '^[[:space:]]*actions:[[:space:]]*write[[:space:]]*$' .github/workflows || true
          echo '--- all write declarations ---'
          grep -R -n -C3 -E '^[[:space:]]*[a-z-]+:[[:space:]]*write[[:space:]]*$' .github/workflows || true
          echo '--- actions API use ---'
          grep -R -n -C5 -E 'actions/(runs|workflows)|gh (run|workflow)|rerun|cancel.*run|workflow_dispatch' \
            .github/workflows scripts packages apps || true
