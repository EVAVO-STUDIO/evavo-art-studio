name: Locate audio matrix timeout owner

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v7-20260805]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 308a368263f74d7bafca6f11abcd982a1f213759
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach refs/remotes/origin/main
          echo '--- audio matrix references ---'
          grep -R -n -E 'test-audio-matrix|audio format matrix|test:audio:matrix|audio.*matrix|matrix.*audio' \
            --exclude-dir=.git --exclude='*.map' . || true
          echo '--- every package test command ---'
          find . -name package.json -not -path '*/node_modules/*' -print0 |
            sort -z |
            xargs -0 -I{} node -e '
              const fs=require("node:fs");
              const p="{}";
              const j=JSON.parse(fs.readFileSync(p,"utf8"));
              if (j.scripts?.test) console.log(`${p}: ${j.scripts.test}`);
            '
