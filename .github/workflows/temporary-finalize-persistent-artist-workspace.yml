name: Temporary finalize persistent Artist Workspace release

on:
  push:
    branches:
      - automation/finalize-persistent-artist-workspace-20260811

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: temporary-finalize-persistent-artist-workspace-20260811
  cancel-in-progress: false

env:
  API_ROOT: https://api.github.com/repos/EVAVO-STUDIO/evavo-art-studio
  FEATURE_REF: agent/persistent-artist-workspace-20260811
  PUBLISHER_REF: automation/publish-persistent-artist-workspace-20260811
  EXPORT_REF: automation/export-art-studio-source-58c6311-artist-workspace
  PRIMARY_REF: automation/release-persistent-artist-workspace-20260811
  RECOVERY_REF: automation/recover-persistent-artist-workspace-20260811
  CONVERGE_REF: automation/converge-persistent-artist-workspace-20260811
  FINALIZER_REF: automation/finalize-persistent-artist-workspace-20260811
  RELEASE_TAG: persistent-artist-workspace-20260811

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact finalizer carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require merged release, full validation, and exact-main evidence
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          pr_number=''
          release_sha=''
          current_main=''
          exact_run_id=''
          artifact_id=''
          artifact_digest=''
          validation_gate_run_id=''
          validation_gate_name=''

          for attempt in $(seq 1 360); do
            current_main="$(curl -fsSL "${auth[@]}" "${API_ROOT}/git/ref/heads/main" | jq -r '.object.sha')"
            pulls="$(curl -fsSL "${auth[@]}" "${API_ROOT}/pulls?state=all&head=EVAVO-STUDIO:${FEATURE_REF}&base=main&per_page=10")"
            pr_number="$(jq -r '.[0].number // empty' <<<"${pulls}")"
            release_sha="$(jq -r '.[0].merge_commit_sha // empty' <<<"${pulls}")"
            merged_at="$(jq -r '.[0].merged_at // empty' <<<"${pulls}")"

            release_ok=false
            if [[ -n "${merged_at}" && "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              compare_status="$(curl -fsSL "${auth[@]}" "${API_ROOT}/compare/${release_sha}...${current_main}" | jq -r '.status')"
              case "${compare_status}" in identical|ahead) release_ok=true ;; esac
            fi

            runs="$(curl -fsSL "${auth[@]}" "${API_ROOT}/actions/runs?head_sha=${current_main}&per_page=100")"
            exact_run_id="$(jq -r '[.workflow_runs[] | select(.name == "Art Studio exact mainline validation" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${runs}")"
            project_art_id="$(jq -r '[.workflow_runs[] | select(.name == "Project art workbench" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${runs}")"

            validation_gate_run_id=''
            validation_gate_name=''
            if [[ -n "${project_art_id}" ]]; then
              validation_gate_run_id="${project_art_id}"
              validation_gate_name='Project art workbench'
            else
              for entry in \
                "${CONVERGE_REF}:Temporary converge persistent Artist Workspace release" \
                "${RECOVERY_REF}:Temporary recover persistent Artist Workspace release" \
                "${PRIMARY_REF}:Temporary release persistent Artist Workspace"
              do
                branch="${entry%%:*}"
                name="${entry#*:}"
                gate_runs="$(curl -fsSL "${auth[@]}" "${API_ROOT}/actions/runs?branch=${branch}&event=push&per_page=20")"
                gate_id="$(jq -r --arg n "${name}" '[.workflow_runs[] | select(.name == $n and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"${gate_runs}")"
                if [[ -n "${gate_id}" ]]; then
                  validation_gate_run_id="${gate_id}"
                  validation_gate_name="${name}"
                  break
                fi
              done
            fi

            if [[ "${release_ok}" == true && -n "${exact_run_id}" && -n "${validation_gate_run_id}" ]]; then
              expected_name="art-studio-validation-${current_main}"
              artifacts="$(curl -fsSL "${auth[@]}" "${API_ROOT}/actions/runs/${exact_run_id}/artifacts?per_page=100")"
              artifact_id="$(jq -r --arg n "${expected_name}" '.artifacts[] | select(.name == $n and .expired == false) | .id' <<<"${artifacts}" | head -1)"
              artifact_digest="$(jq -r --arg n "${expected_name}" '.artifacts[] | select(.name == $n and .expired == false) | .digest' <<<"${artifacts}" | head -1)"
              if [[ "${artifact_id}" =~ ^[0-9]+$ && "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
            fi
            sleep 5
          done

          test "${pr_number}" =~ ^[0-9]+$
          test "${release_sha}" =~ ^[0-9a-f]{40}$
          test "${current_main}" =~ ^[0-9a-f]{40}$
          test "${exact_run_id}" =~ ^[0-9]+$
          test "${validation_gate_run_id}" =~ ^[0-9]+$
          test "${artifact_id}" =~ ^[0-9]+$
          test "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$

          pr="$(curl -fsSL "${auth[@]}" "${API_ROOT}/pulls/${pr_number}")"
          test "$(jq -r '.merged' <<<"${pr}")" = true
          test "$(jq -r '.merge_commit_sha' <<<"${pr}")" = "${release_sha}"
          test "$(jq -r '.changed_files' <<<"${pr}")" = 17
          test "$(jq -r '.head.ref' <<<"${pr}")" = "${FEATURE_REF}"

          artifact="$(curl -fsSL "${auth[@]}" "${API_ROOT}/actions/artifacts/${artifact_id}")"
          test "$(jq -r '.workflow_run.id' <<<"${artifact}")" = "${exact_run_id}"
          test "$(jq -r '.workflow_run.head_branch' <<<"${artifact}")" = main
          test "$(jq -r '.workflow_run.head_sha' <<<"${artifact}")" = "${current_main}"
          test "$(jq -r '.digest' <<<"${artifact}")" = "${artifact_digest}"

          {
            echo "PR_NUMBER=${pr_number}"
            echo "RELEASE_SHA=${release_sha}"
            echo "CURRENT_MAIN_SHA=${current_main}"
            echo "EXACT_MAIN_RUN_ID=${exact_run_id}"
            echo "VALIDATION_GATE_RUN_ID=${validation_gate_run_id}"
            echo "VALIDATION_GATE_NAME=${validation_gate_name}"
            echo "VALIDATION_ARTIFACT_ID=${artifact_id}"
            echo "VALIDATION_ARTIFACT_DIGEST=${artifact_digest}"
          } >> "${GITHUB_ENV}"

      - name: Create or verify deterministic validated-release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          status="$(curl -sS -o /tmp/tag.json -w '%{http_code}' "${auth[@]}" "${API_ROOT}/git/ref/tags/${RELEASE_TAG}")"
          if [[ "${status}" == 404 ]]; then
            payload="$(jq -n --arg ref "refs/tags/${RELEASE_TAG}" --arg sha "${CURRENT_MAIN_SHA}" '{ref:$ref,sha:$sha}')"
            curl -fsSL -X POST "${auth[@]}" -d "${payload}" "${API_ROOT}/git/refs" > /tmp/tag.json
          else
            test "${status}" = 200
          fi
          test "$(jq -r '.object.sha' /tmp/tag.json)" = "${CURRENT_MAIN_SHA}"

      - name: Write final release receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const receipt = {
            schema: 'evavo.persistent-artist-workspace-final.v1',
            repository: 'EVAVO-STUDIO/evavo-art-studio',
            pullRequest: Number(process.env.PR_NUMBER),
            releaseSha: process.env.RELEASE_SHA,
            validatedCurrentMainSha: process.env.CURRENT_MAIN_SHA,
            validatedReleaseTag: process.env.RELEASE_TAG,
            validationGate: {
              name: process.env.VALIDATION_GATE_NAME,
              runId: Number(process.env.VALIDATION_GATE_RUN_ID),
            },
            exactMainRunId: Number(process.env.EXACT_MAIN_RUN_ID),
            validationArtifactId: Number(process.env.VALIDATION_ARTIFACT_ID),
            validationArtifactDigest: process.env.VALIDATION_ARTIFACT_DIGEST,
            changedFileCount: 17,
            lockfileChanged: false,
            validation: 'passed',
            currentMainContainsRelease: true,
            liveProviderRequest: false,
            candidateApproval: false,
            candidatePromotion: false,
            storageWrite: false,
            targetRepositoryMutation: false,
            deployment: false,
            publication: false,
            forcePush: false,
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'persistent-artist-workspace-final.json'), `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload final release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistent-artist-workspace-final-${{ env.CURRENT_MAIN_SHA }}
          path: ${{ runner.temp }}/persistent-artist-workspace-final.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove every temporary release ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          test "$(curl -fsSL "${auth[@]}" "${API_ROOT}/git/ref/heads/main" | jq -r '.object.sha')" = "${CURRENT_MAIN_SHA}"
          test "$(curl -fsSL "${auth[@]}" "${API_ROOT}/git/ref/tags/${RELEASE_TAG}" | jq -r '.object.sha')" = "${CURRENT_MAIN_SHA}"
          delete_ref() {
            local ref="$1" status
            status="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${API_ROOT}/git/ref/heads/${ref}")"
            [[ "${status}" == 404 ]] && return 0
            test "${status}" = 200
            status="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${auth[@]}" "${API_ROOT}/git/refs/heads/${ref}")"
            test "${status}" = 204
            for attempt in $(seq 1 30); do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${API_ROOT}/git/ref/heads/${ref}")"
              [[ "${status}" == 404 ]] && return 0
              sleep 1
            done
            return 1
          }
          delete_ref "${FEATURE_REF}"
          delete_ref "${PUBLISHER_REF}"
          delete_ref "${EXPORT_REF}"
          delete_ref "${PRIMARY_REF}"
          delete_ref "${RECOVERY_REF}"
          delete_ref "${CONVERGE_REF}"
          delete_ref "${FINALIZER_REF}"
