name: Recover project art transfer guard

on:
  push:
    branches:
      - agent/project-art-workbench-release-20260809
    paths:
      - .github/workflows/recover-project-art-transfer.yml

permissions:
  contents: write

concurrency:
  group: recover-project-art-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'EVAVO-STUDIO/evavo-art-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Correct guard and remove recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/project-art-workbench-release-20260809"
          git merge-base --is-ancestor ad582320ec414f9a1d7a08d34fc10ca68a62581b HEAD
          grep -F '05a4cb423befe2c32ca33bfafab95fcee0e2e2ead9...HEAD' .github/workflows/transfer-project-art-workbench.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/transfer-project-art-workbench.yml')
          text = path.read_text()
          old = '05a4cb423befe2c32ca33bfafab95fcee0e2e2ead9...HEAD'
          new = '05a4cb423befe2c32ca33bfafab95fcee0e2ead9...HEAD'
          if text.count(old) != 1:
              raise SystemExit('unexpected transfer guard occurrence count')
          path.write_text(text.replace(old, new))
          PY
          grep -F '05a4cb423befe2c32ca33bfafab95fcee0e2ead9...HEAD' .github/workflows/transfer-project-art-workbench.yml
          ! grep -F '05a4cb423befe2c32ca33bfafab95fcee0e2e2ead9...HEAD' .github/workflows/transfer-project-art-workbench.yml
          rm -f .github/workflows/recover-project-art-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore(project-art): correct transfer guard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
