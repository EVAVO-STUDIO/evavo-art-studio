name: Apply bounded mainline media bootstrap

on:
  push:
    branches:
      - agent/bounded-mainline-media-bootstrap-20260808
    paths:
      - ".agent/apply-bounded-mainline-media-bootstrap.py"
      - ".github/workflows/agent-apply-bounded-mainline-media-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-bounded-mainline-media-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/bounded-mainline-media-bootstrap-20260808
          fetch-depth: 0

      - name: Apply exact workflow and validation integration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .agent/apply-bounded-mainline-media-bootstrap.py
          python .agent/apply-bounded-mainline-media-bootstrap.py
          bash -n scripts/bootstrap-ci-media-tools.sh
          node --check scripts/test-ci-media-tool-bootstrap.mjs
          grep -F 'bash scripts/bootstrap-ci-media-tools.sh' .github/workflows/ci.yml
          ! grep -F 'sudo apt-get update' .github/workflows/ci.yml
          grep -F 'ci:media-tools:test' package.json
          git diff --check

      - name: Commit production source and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent/apply-bounded-mainline-media-bootstrap.py \
            .github/workflows/agent-apply-bounded-mainline-media-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml package.json
          git add -u .agent .github/workflows/agent-apply-bounded-mainline-media-bootstrap.yml
          git diff --cached --check
          git commit -m "fix(ci): bound mainline media bootstrap"
          git push origin HEAD:agent/bounded-mainline-media-bootstrap-20260808
