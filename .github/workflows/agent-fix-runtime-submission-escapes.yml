name: Fix runtime submission delimiter escapes

on:
  push:
    branches:
      - agent/runtime-submission-input-integrity-20260808
    paths:
      - ".github/workflows/agent-fix-runtime-submission-escapes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/runtime-submission-input-integrity-20260808
          fetch-depth: 0

      - name: Correct delimiter escapes and strengthen regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          normalize_path = Path("packages/runtime/src/normalize.ts")
          text = normalize_path.read_text(encoding="utf-8")
          replacements = [
              ('result.includes("\\\\0")', 'result.includes("\\0")'),
              ('normalizedValue.includes("\\\\0")', 'normalizedValue.includes("\\0")'),
              ('`${queue}\\\\0${idempotencyKey}`', '`${queue}\\0${idempotencyKey}`'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one delimiter match for {old!r}, found {count}")
              text = text.replace(old, new, 1)
          normalize_path.write_text(text, encoding="utf-8")

          test_path = Path("packages/runtime/test/submission-integrity-security.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          import_marker = 'import test from "node:test";\n\n'
          if tests.count(import_marker) != 1:
              raise RuntimeError("test import marker mismatch")
          tests = tests.replace(
              import_marker,
              import_marker + 'import { sha256 } from "@evavo/art-artifacts";\n\n',
              1,
          )
          next_marker = 'test("runtime job submission snapshots detach and freeze retained identity", () => {'
          if tests.count(next_marker) != 1:
              raise RuntimeError("test insertion marker mismatch")
          delimiter_test = '''test("derived runtime job IDs retain the canonical NUL delimiter", () => {
            const normalized = normalizeRuntimeJobSubmission(
              validSubmission({ id: undefined }),
            );
            assert.equal(
              normalized.spec.id,
              `job_${sha256("media\\0runtime-snapshot-1").slice(0, 40)}`,
            );
            assert.throws(
              () =>
                normalizeRuntimeJobSubmission(
                  validSubmission({ idempotencyKey: "invalid\\0key" }),
                ),
              (error) =>
                error instanceof RuntimeError &&
                error.code === "RUNTIME_JOB_SPEC_INVALID",
            );
          });

          '''
          tests = tests.replace(next_marker, delimiter_test + next_marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
          grep -F 'result.includes("\0")' packages/runtime/src/normalize.ts
          grep -F '`${queue}\0${idempotencyKey}`' packages/runtime/src/normalize.ts
          grep -F 'derived runtime job IDs retain the canonical NUL delimiter' packages/runtime/test/submission-integrity-security.test.mjs
          git diff --check

      - name: Commit correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-runtime-submission-escapes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/normalize.ts packages/runtime/test/submission-integrity-security.test.mjs
          git add -u .github/workflows/agent-fix-runtime-submission-escapes.yml
          git diff --cached --check
          git commit -m "test(runtime): preserve canonical submission delimiter"
          git push origin HEAD:agent/runtime-submission-input-integrity-20260808
