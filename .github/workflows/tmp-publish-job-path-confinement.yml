name: Temporary publish workspace job path confinement

on:
  push:
    branches:
      - agent/project-art-job-path-confinement-20260812
    paths:
      - ".github/workflows/tmp-publish-job-path-confinement.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact feature source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Apply exact path-confinement hardening
        run: |
          python3 .github/tmp-job-path-core.py
          python3 .github/tmp-job-path-aux.py

      - name: Validate focused resumable-job surface
        run: |
          node --check scripts/project-art/persistent-workspace-jobs.mjs
          node scripts/check-persistent-artist-workspace-jobs.mjs
          git diff --check

      - name: Commit clean product scope
        shell: bash
        run: |
          rm .github/workflows/tmp-publish-job-path-confinement.yml
          rm .github/tmp-job-path-core.py
          rm .github/tmp-job-path-aux.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/tmp-job-path-aux.py',
              '.github/tmp-job-path-core.py',
              '.github/workflows/tmp-publish-job-path-confinement.yml',
              'docs/PERSISTENT_ARTIST_WORKSPACE_JOBS.md',
              'scripts/check-persistent-artist-workspace-jobs.mjs',
              'scripts/project-art/persistent-workspace-jobs.mjs',
              'scripts/test-persistent-artist-workspace-jobs.mjs',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          paths = {line[3:] for line in lines}
          if paths != expected:
              raise SystemExit(f'unexpected publisher scope: {sorted(paths)}')
          PY
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          git commit -m "fix(project-art): revalidate workspace job path chains"
          git push origin HEAD:agent/project-art-job-path-confinement-20260812
