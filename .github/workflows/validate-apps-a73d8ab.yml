name: Validate exact Art Studio application repairs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-tests:
    name: test ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@evavo/art-studio-api"
          - "@evavo/art-studio-cli"
          - "@evavo/art-studio-worker"
    steps:
      - name: Check out exact validation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/apps-a73d8ab-20260802
          fetch-depth: 0
          persist-credentials: false
      - name: Prove direct candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "a73d8ab8757ba10358721a115ac23ef0db82a708" ]]
          mapfile -t changed < <(git diff --name-only a73d8ab8757ba10358721a115ac23ef0db82a708..HEAD)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == ".github/workflows/validate-apps-a73d8ab.yml" ]]
      - name: Install FFmpeg for media-backed tests
        if: matrix.package == '@evavo/art-studio-worker'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Build domain packages
        run: pnpm run build:domain
      - name: Run exact application suite
        run: pnpm --filter "${{ matrix.package }}" test
      - name: Remove generated lockfile and verify clean source
        if: always()
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"
