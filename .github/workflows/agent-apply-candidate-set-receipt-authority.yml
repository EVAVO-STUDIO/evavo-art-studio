name: Agent Apply Candidate Set Receipt Authority

on:
  push:
    branches:
      - agent/book-candidate-set-execution-evidence-20260806
    paths:
      - ".github/workflows/agent-apply-candidate-set-receipt-authority.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-candidate-set-receipt-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact execution-evidence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/book-candidate-set-execution-evidence-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Apply caller-authority removal
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-candidate-set-receipt-authority.patch
          git apply .github/agent-candidate-set-receipt-authority.patch
          git diff --check

      - name: Install exact workspace
        run: pnpm install --no-frozen-lockfile

      - name: Verify permanent execution authority boundary
        run: node scripts/check-book-art-candidate-set.mjs

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run durable execution-evidence attacks
        run: node --test packages/book-art-runtime/test/candidate-set-execution.test.mjs

      - name: Run strict Book runtime typecheck
        run: pnpm --filter @evavo/art-book-runtime typecheck

      - name: Commit verified runtime source
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git add -- packages/book-art-runtime/src/candidate-set-execution.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(book-art): rebuild execution receipt during consensus"
          git push origin HEAD:refs/heads/agent/book-candidate-set-execution-evidence-20260806
