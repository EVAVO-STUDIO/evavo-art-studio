name: Temporary Avatar Runtime PR 33 exact-head validation

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-avatar-runtime-pr33-validation.yml"

permissions:
  contents: read

concurrency:
  group: temporary-avatar-runtime-pr33-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} exact Runtime head
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.14.0"
          - "24"

    steps:
      - name: Check out exact Avatar Runtime candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EVAVO-STUDIO/evavo-avatar-runtime
          ref: d68875d5c089804847f730dd8ee54ac20b337345
          path: avatar-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Verify exact checkout and clean source
        working-directory: avatar-runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d68875d5c089804847f730dd8ee54ac20b337345"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --version
          npm --version

      - name: Syntax-check changed Runtime surfaces
        working-directory: avatar-runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/council-procedural-review-atlas.js
          node --check src/council-avatar-production-status.js
          node --check src/index.js
          node --check src/version-policy.js
          node --check scripts/check-version-policy.mjs
          node --check tests/council-procedural-review-atlas.test.mjs
          node --check tests/council-avatar-production-status.test.mjs
          node --check tests/version-policy.test.mjs

      - name: Run focused Council procedural review proof
        working-directory: avatar-runtime
        run: npm run check:council-procedural-review

      - name: Run complete Avatar Runtime validation
        working-directory: avatar-runtime
        run: npm run check

      - name: Verify package surface
        working-directory: avatar-runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > avatar-runtime-pack.json
          node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync("avatar-runtime-pack.json","utf8")); if (!Array.isArray(result)||result.length!==1) process.exit(1); const files=new Set(result[0].files.map((entry)=>entry.path)); for (const required of ["src/council-procedural-review-atlas.js","docs/COUNCIL_PROCEDURAL_REVIEW_RUNTIME.md"]) if (!files.has(required)) throw new Error(`missing package file: ${required}`);'
          rm avatar-runtime-pack.json

      - name: Prove exact source remains clean
        if: always()
        working-directory: avatar-runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f avatar-runtime-pack.json
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
