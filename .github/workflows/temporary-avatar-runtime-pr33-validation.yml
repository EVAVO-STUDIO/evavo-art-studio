name: Temporary Avatar Runtime PR 33 exact-blob validation

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-avatar-runtime-pr33-validation.yml"
      - "tmp/avatar-runtime-pr33/**"

permissions:
  contents: read

concurrency:
  group: temporary-avatar-runtime-pr33-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} exact Runtime blobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.14.0"
          - "24"

    steps:
      - name: Check out exact validation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Verify exact mirrored Runtime blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tmp/avatar-runtime-pr33/src/council-procedural-review-atlas.js)" = "4004eb1d5997f361bcf818918ea7092c5561b285"
          test "$(git hash-object tmp/avatar-runtime-pr33/tests/council-procedural-review-atlas.test.mjs)" = "a5d434c8532d706336b61fedd3e185a6cf019463"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --version
          npm --version

      - name: Syntax-check exact Runtime parser and proof
        shell: bash
        run: |
          set -euo pipefail
          node --check tmp/avatar-runtime-pr33/src/council-procedural-review-atlas.js
          node --check tmp/avatar-runtime-pr33/tests/council-procedural-review-atlas.test.mjs

      - name: Execute exact Council procedural review proof
        run: node --test tmp/avatar-runtime-pr33/tests/council-procedural-review-atlas.test.mjs

      - name: Prove validation changed no source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
