name: Sprite Supervisor Continuation Safety

on:
  push:
    branches:
      - main
      - agent/sprite-supervisor-continuation-safety-ready-20260804
    paths: &continuation_paths
      - ".github/workflows/sprite-supervisor-continuation-safety.yml"
      - "apps/worker/src/sprite-supervisor-guarded-handlers.ts"
      - "apps/worker/src/sprite-supervisor-handlers.ts"
      - "apps/worker/test/sprite-supervisor-continuation-recovery.test.mjs"
      - "apps/worker/test/sprite-supervisor-runtime.test.mjs"
      - "packages/sprite-supervisor/**"
      - "packages/runtime/**"
      - "packages/artifacts/**"
      - "docs/restart-safe-sprite-supervisor-continuations.md"
  pull_request:
    paths: *continuation_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprite-supervisor-continuation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install review-first dependencies
        run: pnpm install --frozen-lockfile

      - name: Build supervisor and worker dependency closure
        run: pnpm --filter @evavo/art-studio-worker... build

      - name: Typecheck exact supervisor and worker boundaries
        run: |
          pnpm --filter @evavo/art-sprite-supervisor typecheck
          pnpm --filter @evavo/art-studio-worker typecheck

      - name: Run supervisor contract and scheduling tests
        run: pnpm --filter @evavo/art-sprite-supervisor test

      - name: Run continuation recovery and closed-loop runtime attacks
        run: >-
          node --test
          apps/worker/test/sprite-supervisor-continuation-recovery.test.mjs
          apps/worker/test/sprite-supervisor-runtime.test.mjs

      - name: Prove exact source remains clean
        shell: bash
        run: |
          set -euo pipefail
          find packages apps -type d -name dist -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
