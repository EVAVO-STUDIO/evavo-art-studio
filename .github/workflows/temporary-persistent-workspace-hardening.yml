name: Temporary persistent workspace hardening publisher

on:
  push:
    branches:
      - automation/persistent-workspace-hardening-20260811
    paths:
      - ".github/workflows/temporary-persistent-workspace-hardening.yml"

permissions:
  contents: write

concurrency:
  group: persistent-workspace-hardening-publisher
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact Pillow backend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Apply fail-closed path and input hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return source.replace(old, new, 1)

          library_path = Path("scripts/project-art/persistent-workspace.mjs")
          source = library_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              """import { randomUUID } from 'node:crypto';
          import {
            copyFile,
            lstat,
            mkdir,
            readFile,
            realpath,
            rename,
            rm,
            stat,
          } from 'node:fs/promises';
          """,
              """import { randomUUID } from 'node:crypto';
          import { constants as fsConstants } from 'node:fs';
          import {
            copyFile,
            lstat,
            mkdir,
            open,
            realpath,
            rename,
            rm,
          } from 'node:fs/promises';
          """,
              "persistent workspace imports",
          )
          source = replace_once(
              source,
              "  readJsonFileBounded,\n",
              "",
              "retired generic JSON reader import",
          )
          helpers = r'''
          function fileSnapshot(metadata) {
            return {
              device: metadata.dev,
              inode: metadata.ino,
              mode: metadata.mode,
              links: metadata.nlink,
              size: metadata.size,
              modifiedMs: metadata.mtimeMs,
              changedMs: metadata.ctimeMs,
            };
          }

          function sameFileSnapshot(left, right) {
            return Object.keys(left).every((key) => left[key] === right[key]);
          }

          async function readStableJsonFile(filePath, label) {
            const absolute = path.resolve(filePath);
            const pathBefore = await lstat(absolute).catch((error) => {
              fail('PERSISTENT_ARTIST_WORKSPACE_INPUT_INVALID', `${label} could not be inspected: ${error.message}`);
            });
            if (pathBefore.isSymbolicLink() || !pathBefore.isFile()) {
              fail('PERSISTENT_ARTIST_WORKSPACE_INPUT_INVALID', `${label} must be a regular non-symbolic file.`);
            }
            if (pathBefore.nlink !== 1) {
              fail('PERSISTENT_ARTIST_WORKSPACE_INPUT_MULTIPLY_LINKED', `${label} must have exactly one filesystem link.`);
            }
            if (pathBefore.size < 2 || pathBefore.size > MAXIMUM_REQUEST_BYTES) {
              fail('PERSISTENT_ARTIST_WORKSPACE_INPUT_INVALID', `${label} must be 2-${MAXIMUM_REQUEST_BYTES} bytes.`);
            }

            const flags = fsConstants.O_RDONLY | (fsConstants.O_NOFOLLOW ?? 0);
            let handle;
            try {
              handle = await open(absolute, flags);
            } catch (error) {
              if (error?.code === 'ELOOP') {
                fail('PERSISTENT_ARTIST_WORKSPACE_INPUT_INVALID', `${label} became symbolic before it could be opened.`);
              }
              throw error;
            }

            try {
              const handleBefore = await handle.stat();
              if (
                handleBefore.nlink !== 1 ||
                !sameFileSnapshot(fileSnapshot(pathBefore), fileSnapshot(handleBefore))
              ) {
                fail('PERSISTENT_ARTIST_WORKSPACE_REQUEST_CHANGED', `${label} changed before it could be read.`);
              }
              const bytes = await handle.readFile();
              const [handleAfter, pathAfter] = await Promise.all([
                handle.stat(),
                lstat(absolute),
              ]);
              if (
                pathAfter.isSymbolicLink() ||
                pathAfter.nlink !== 1 ||
                !sameFileSnapshot(fileSnapshot(pathBefore), fileSnapshot(handleAfter)) ||
                !sameFileSnapshot(fileSnapshot(pathBefore), fileSnapshot(pathAfter)) ||
                bytes.length !== pathBefore.size
              ) {
                fail('PERSISTENT_ARTIST_WORKSPACE_REQUEST_CHANGED', `${label} changed while it was being read.`);
              }
              let value;
              try {
                const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/u, '');
                value = JSON.parse(text);
              } catch (error) {
                fail('PERSISTENT_ARTIST_WORKSPACE_INPUT_INVALID', `${label} is not valid UTF-8 JSON: ${error.message}`);
              }
              return { value, bytes };
            } finally {
              await handle.close();
            }
          }

          function insideRoot(root, candidate) {
            const relative = path.relative(root, candidate);
            return relative === '' || (!relative.startsWith(`..${path.sep}`) && relative !== '..' && !path.isAbsolute(relative));
          }

          async function safeDirectoryChain(root, relativeDirectory, { create = false, label = 'directory' } = {}) {
            const canonical = canonicalRelativePath(relativeDirectory, label);
            let current = root;
            for (const part of canonical.split('/')) {
              const next = path.join(current, part);
              let metadata;
              try {
                metadata = await lstat(next);
              } catch (error) {
                if (error?.code !== 'ENOENT') throw error;
                if (!create) return next;
                try {
                  await mkdir(next, { recursive: false, mode: 0o700 });
                } catch (createError) {
                  if (createError?.code !== 'EEXIST') throw createError;
                }
                metadata = await lstat(next);
              }
              if (metadata.isSymbolicLink() || !metadata.isDirectory()) {
                fail('PERSISTENT_ARTIST_WORKSPACE_DIRECTORY_INVALID', `${label} contains a symbolic or non-directory component: ${next}`);
              }
              const resolved = await realpath(next);
              if (!insideRoot(root, resolved)) {
                fail('PERSISTENT_ARTIST_WORKSPACE_PATH_INVALID', `${label} escaped the workspace root.`);
              }
              current = resolved;
            }
            return current;
          }

          '''
          source = replace_once(
              source,
              "const MAXIMUM_HANDOFF_ITEMS = 10_000;\n",
              "const MAXIMUM_HANDOFF_ITEMS = 10_000;\n" + helpers,
              "persistent workspace stable-input helpers",
          )
          source = replace_once(
              source,
              "  const { value: manifest } = await readJsonFileBounded(manifestPath, 'persistent workspace manifest');\n",
              "  const { value: manifest } = await readStableJsonFile(manifestPath, 'persistent workspace manifest');\n",
              "workspace manifest stable read",
          )
          source = replace_once(
              source,
              """  const versionDirectory = `versions/${assetId}/${versionId}`;
            const versionPath = `${versionDirectory}/${fileName}`;
            try {
          """,
              """  const versionDirectory = `versions/${assetId}/${versionId}`;
            const versionPath = `${versionDirectory}/${fileName}`;
            await safeDirectoryChain(root, path.posix.dirname(versionDirectory), {
              label: 'version parent',
            });
            try {
          """,
              "snapshot compile parent validation",
          )
          source = replace_once(
              source,
              """  const finalDirectory = path.join(root, ...versionDirectory.split('/'));
            try {
              await lstat(finalDirectory);
              fail('PERSISTENT_ARTIST_WORKSPACE_VERSION_EXISTS', `Version directory already exists: ${versionDirectory}.`);
            } catch (error) {
              if (error?.code !== 'ENOENT') throw error;
            }
            const parent = path.dirname(finalDirectory);
            await mkdir(parent, { recursive: true });
            const staging = path.join(parent, `.${path.basename(finalDirectory)}.staging-${randomUUID()}`);
          """,
              """  const parentRelative = path.posix.dirname(versionDirectory);
            const parent = await safeDirectoryChain(root, parentRelative, {
              create: true,
              label: 'version parent',
            });
            const finalDirectory = path.join(parent, path.posix.basename(versionDirectory));
            const expectedFinalDirectory = path.join(root, ...versionDirectory.split('/'));
            if (path.resolve(finalDirectory) !== path.resolve(expectedFinalDirectory)) {
              fail('PERSISTENT_ARTIST_WORKSPACE_PATH_INVALID', 'Version directory resolved outside its declared workspace path.');
            }
            try {
              await lstat(finalDirectory);
              fail('PERSISTENT_ARTIST_WORKSPACE_VERSION_EXISTS', `Version directory already exists: ${versionDirectory}.`);
            } catch (error) {
              if (error?.code !== 'ENOENT') throw error;
            }
            const staging = path.join(parent, `.${path.basename(finalDirectory)}.staging-${randomUUID()}`);
          """,
              "snapshot execution parent validation",
          )
          source = replace_once(
              source,
              """export async function loadRequestFile(filePath) {
            const absolute = path.resolve(filePath);
            const metadata = await stat(absolute);
            if (!metadata.isFile() || metadata.size < 2 || metadata.size > MAXIMUM_REQUEST_BYTES) {
              fail('PERSISTENT_ARTIST_WORKSPACE_REQUEST_INVALID', `Request file must be 2-${MAXIMUM_REQUEST_BYTES} bytes.`);
            }
            const bytes = await readFile(absolute);
            let value;
            try {
              const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/u, '');
              value = JSON.parse(text);
            } catch (error) {
              fail('PERSISTENT_ARTIST_WORKSPACE_REQUEST_INVALID', `Request file is not valid UTF-8 JSON: ${error.message}`);
            }
            return { value, bytes };
          }

          export async function loadPlanFile(filePath, expectedSchema) {
            const { value } = await readJsonFileBounded(path.resolve(filePath), 'persistent workspace plan');
          """,
              """export async function loadRequestFile(filePath) {
            return readStableJsonFile(filePath, 'persistent workspace request');
          }

          export async function loadPlanFile(filePath, expectedSchema) {
            const { value } = await readStableJsonFile(filePath, 'persistent workspace plan');
          """,
              "stable request and plan readers",
          )
          library_path.write_text(source, encoding="utf-8")

          tests_path = Path("scripts/test-persistent-artist-workspace.mjs")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              """  copyFile,
            lstat,
            mkdir,
          """,
              """  copyFile,
            link,
            lstat,
            mkdir,
          """,
              "test hard-link import",
          )
          linked_input_tests = r'''
            if (process.platform !== 'win32') {
              const requestSymlinkPath = path.join(temporary, 'create-request-symlink.json');
              await symlink(createRequestPath, requestSymlinkPath);
              const requestSymlink = run(process.execPath, [
                'scripts/persistent-artist-workspace.mjs',
                'compile-create',
                '--parent-root',
                parent,
                '--request',
                requestSymlinkPath,
                '--output',
                path.join(temporary, 'request-symlink-plan.json'),
              ], { expectFailure: true });
              assert.match(`${requestSymlink.stderr}\n${requestSymlink.stdout}`, /regular non-symbolic file/iu);

              const requestHardLinkPath = path.join(temporary, 'create-request-hardlink.json');
              await link(createRequestPath, requestHardLinkPath);
              const requestHardLink = run(process.execPath, [
                'scripts/persistent-artist-workspace.mjs',
                'compile-create',
                '--parent-root',
                parent,
                '--request',
                requestHardLinkPath,
                '--output',
                path.join(temporary, 'request-hardlink-plan.json'),
              ], { expectFailure: true });
              assert.match(`${requestHardLink.stderr}\n${requestHardLink.stdout}`, /exactly one filesystem link/iu);
              await rm(requestHardLinkPath);

              const planSymlinkPath = path.join(temporary, 'create-plan-symlink.json');
              await symlink(createPlanPath, planSymlinkPath);
              const planSymlink = run(process.execPath, [
                'scripts/persistent-artist-workspace.mjs',
                'run-create',
                '--plan',
                planSymlinkPath,
              ], { expectFailure: true });
              assert.match(`${planSymlink.stderr}\n${planSymlink.stdout}`, /regular non-symbolic file/iu);

              const planHardLinkPath = path.join(temporary, 'create-plan-hardlink.json');
              await link(createPlanPath, planHardLinkPath);
              const planHardLink = run(process.execPath, [
                'scripts/persistent-artist-workspace.mjs',
                'run-create',
                '--plan',
                planHardLinkPath,
              ], { expectFailure: true });
              assert.match(`${planHardLink.stderr}\n${planHardLink.stdout}`, /exactly one filesystem link/iu);
              await rm(planHardLinkPath);
            }

          '''
          tests = replace_once(
              tests,
              """  assert.equal(createPlan.authority.storageWrite, false);
            assert.equal(createPlan.authority.targetRepositoryMutation, false);

            const runCreate = run(process.execPath, [
          """,
              """  assert.equal(createPlan.authority.storageWrite, false);
            assert.equal(createPlan.authority.targetRepositoryMutation, false);

          """ + linked_input_tests + """  const runCreate = run(process.execPath, [
          """,
              "linked request and plan adversaries",
          )
          nested_symlink_test = r'''
            if (process.platform !== 'win32') {
              const lateRequestPath = path.join(temporary, 'late-link-snapshot-request.json');
              const latePlanPath = path.join(temporary, 'late-link-snapshot-plan.json');
              const lateRequest = {
                ...snapshotRequest,
                assetId: 'late-link',
                versionId: 'v001',
              };
              await writeFile(lateRequestPath, `${JSON.stringify(lateRequest, null, 2)}\n`);
              run(process.execPath, [
                'scripts/persistent-artist-workspace.mjs',
                'compile-snapshot',
                '--workspace-root',
                workspace,
                '--request',
                lateRequestPath,
                '--output',
                latePlanPath,
              ]);
              const outsideVersions = path.join(temporary, 'outside-versions');
              await mkdir(outsideVersions);
              await symlink(outsideVersions, path.join(workspace, 'versions', 'late-link'), 'dir');
              const lateRun = run(process.execPath, [
                'scripts/persistent-artist-workspace.mjs',
                'run-snapshot',
                '--workspace-root',
                workspace,
                '--plan',
                latePlanPath,
              ], { expectFailure: true });
              assert.match(`${lateRun.stderr}\n${lateRun.stdout}`, /symbolic or non-directory component/iu);
              await assert.rejects(
                lstat(path.join(outsideVersions, 'v001')),
                (error) => error?.code === 'ENOENT',
              );
            }

          '''
          tests = replace_once(
              tests,
              """  run(process.execPath, [
              'scripts/persistent-artist-workspace.mjs',
              'run-snapshot',
              '--workspace-root',
              workspace,
              '--plan',
              snapshotPlanPath,
            ], { expectFailure: true });

            const handoffRequestPath = path.join(temporary, 'handoff-request.json');
          """,
              """  run(process.execPath, [
              'scripts/persistent-artist-workspace.mjs',
              'run-snapshot',
              '--workspace-root',
              workspace,
              '--plan',
              snapshotPlanPath,
            ], { expectFailure: true });

          """ + nested_symlink_test + """  const handoffRequestPath = path.join(temporary, 'handoff-request.json');
          """,
              "nested version symlink adversary",
          )
          tests = replace_once(
              tests,
              """  console.log('- duplicate, tampered, escaped and symbolic requests fail closed');
          """,
              """  console.log('- duplicate, tampered, escaped and symbolic requests fail closed');
            console.log('- symbolic and multiply-linked request/plan inputs fail closed');
            console.log('- nested version symlinks cannot redirect append-only writes outside the workspace');
          """,
              "hardening test summary",
          )
          tests_path.write_text(tests, encoding="utf-8")

          guard_path = Path("scripts/check-persistent-artist-workspace.mjs")
          guard = guard_path.read_text(encoding="utf-8")
          guard = replace_once(
              guard,
              """  'PERSISTENT_ARTIST_WORKSPACE_SOURCE_IDENTITY_CHANGED',
            'storageWrite: false',
          """,
              """  'PERSISTENT_ARTIST_WORKSPACE_SOURCE_IDENTITY_CHANGED',
            'PERSISTENT_ARTIST_WORKSPACE_REQUEST_CHANGED',
            'PERSISTENT_ARTIST_WORKSPACE_INPUT_MULTIPLY_LINKED',
            'O_NOFOLLOW',
            'safeDirectoryChain',
            'storageWrite: false',
          """,
              "hardening guard library tokens",
          )
          guard = replace_once(
              guard,
              """  'Persistent Artist Workspace runtime regressions skipped: Pillow unavailable; the dedicated Project Art workflow requires the exact backend.',
          ]);
          """,
              """  'Persistent Artist Workspace runtime regressions skipped: Pillow unavailable; the dedicated Project Art workflow requires the exact backend.',
            'symbolic and multiply-linked request/plan inputs fail closed',
            'nested version symlinks cannot redirect append-only writes outside the workspace',
          ]);
          """,
              "hardening guard test tokens",
          )
          guard = replace_once(
              guard,
              """  'forcePush: true',
          ]);
          """,
              """  'forcePush: true',
            'await mkdir(parent, { recursive: true });',
          ]);
          """,
              "hardening guard forbidden recursive parent creation",
          )
          guard_path.write_text(guard, encoding="utf-8")
          PY

      - name: Run focused persistent workspace validation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          export PROJECT_ART_REQUIRE_PILLOW=1
          node --check scripts/project-art/persistent-workspace.mjs
          node --check scripts/test-persistent-artist-workspace.mjs
          node --check scripts/check-persistent-artist-workspace.mjs
          node scripts/test-persistent-artist-workspace.mjs
          node scripts/check-persistent-artist-workspace.mjs
          node scripts/test-project-art-workspace-mcp.mjs
          node scripts/check-project-art-workbench.mjs
          git diff --check

      - name: Verify exact scope and publish hardening commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-persistent-workspace-hardening.yml
          git diff --check
          git diff --name-only HEAD | sort > /tmp/changed-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/temporary-persistent-workspace-hardening.yml
          scripts/check-persistent-artist-workspace.mjs
          scripts/project-art/persistent-workspace.mjs
          scripts/test-persistent-artist-workspace.mjs
          EOF
          diff -u /tmp/expected-paths.txt /tmp/changed-paths.txt
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add \
            .github/workflows/temporary-persistent-workspace-hardening.yml \
            scripts/check-persistent-artist-workspace.mjs \
            scripts/project-art/persistent-workspace.mjs \
            scripts/test-persistent-artist-workspace.mjs
          git commit -m "fix(project-art): harden persistent workspace paths" -m "Reject symbolic or multiply-linked request, plan and manifest inputs; bind stable file identity across reads; and prevent nested version-path symlinks from redirecting append-only snapshots outside the workspace. Preserve create-only atomic publication, exact Storage handoffs and all existing false-authority boundaries."
          git push origin HEAD:automation/persistent-workspace-hardening-20260811
