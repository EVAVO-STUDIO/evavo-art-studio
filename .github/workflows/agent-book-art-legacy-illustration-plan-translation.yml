name: Apply and verify Book Art legacy illustration plan translation

on:
  push:
    branches:
      - feat/book-art-legacy-illustration-plan-translation-20260803
    paths:
      - .github/workflows/agent-book-art-legacy-illustration-plan-translation.yml

permissions:
  contents: write

concurrency:
  group: agent-book-art-legacy-illustration-plan-translation
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/book-art-legacy-illustration-plan-translation-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact branch and temporary-only input scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          [[ "$(git merge-base HEAD origin/main)" == "$(git rev-parse origin/main)" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          test "$(git diff --name-only origin/main...HEAD)" = ".github/workflows/agent-book-art-legacy-illustration-plan-translation.yml"

      - name: Apply exact legacy illustration-plan surfaces
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path, old, new):
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:120]!r}")
              write(path, source.replace(old, new, 1))

          def append_once(path, marker, text):
              source = read(path)
              if marker in source:
                  raise SystemExit(f"{path}: marker already exists: {marker}")
              write(path, source.rstrip() + "\n\n" + text.strip() + "\n")

          api = "apps/api/src/book-art-api.ts"
          replace_once(
              api,
              '''  BOOK_ART_PROFILE_SCHEMA_VERSION,
  translateLegacyWebsiteBookArtGenerationPlan,
} from "@evavo/art-contracts";''',
              '''  BOOK_ART_PROFILE_SCHEMA_VERSION,
  translateLegacyWebsiteBookArtGenerationPlan,
  translateLegacyWebsiteBookIllustrationGenerationPlan,
} from "@evavo/art-contracts";''',
          )
          replace_once(
              api,
              '''const LEGACY_PLAN_PROTOCOL_PATH = "/v1/book-art/legacy-plan-runtime";
const LEGACY_PLAN_TRANSLATE_PATH = "/v1/book-art/legacy-plans/translate";
const DOCS_RELEASE_PROTOCOL_PATH''',
              '''const LEGACY_PLAN_PROTOCOL_PATH = "/v1/book-art/legacy-plan-runtime";
const LEGACY_PLAN_TRANSLATE_PATH = "/v1/book-art/legacy-plans/translate";
const LEGACY_ILLUSTRATION_PLAN_PROTOCOL_PATH =
  "/v1/book-art/legacy-illustration-plan-runtime";
const LEGACY_ILLUSTRATION_PLAN_TRANSLATE_PATH =
  "/v1/book-art/legacy-illustration-plans/translate";
const DOCS_RELEASE_PROTOCOL_PATH''',
          )
          replace_once(
              api,
              '''    pathname === LEGACY_PLAN_PROTOCOL_PATH ||
    pathname === LEGACY_PLAN_TRANSLATE_PATH ||
    pathname === DOCS_RELEASE_PROTOCOL_PATH ||''',
              '''    pathname === LEGACY_PLAN_PROTOCOL_PATH ||
    pathname === LEGACY_PLAN_TRANSLATE_PATH ||
    pathname === LEGACY_ILLUSTRATION_PLAN_PROTOCOL_PATH ||
    pathname === LEGACY_ILLUSTRATION_PLAN_TRANSLATE_PATH ||
    pathname === DOCS_RELEASE_PROTOCOL_PATH ||''',
          )
          illustration_protocol = '''
          function legacyIllustrationPlanProtocol(): Readonly<Record<string, unknown>> {
            return {
              schemaVersion: BOOK_ART_PROFILE_SCHEMA_VERSION,
              contract: BOOK_ART_PROFILE_CONTRACT,
              translationInputKind:
                "evavo_legacy_website_book_illustration_plan_translation_input",
              translationResultKind:
                "evavo_legacy_website_book_illustration_plan_translation_result",
              requiresCanonicalBookArtBrief: true,
              verifiesExactBriefFingerprint: true,
              verifiesLegacyPlanIdentity: true,
              verifiesCandidateUniqueness: true,
              verifiesArtDirectionDigest: true,
              verifiesStyleAuthorityDigest: true,
              verifiesPageAuthorityDigest: true,
              rawLegacyPromptTrustedAsAuthority: false,
              legacyLayoutTrustedAsArtAuthority: false,
              translationReadOnly: true,
              providerCallPerformed: false,
              runtimeJobSubmitted: false,
              candidateArtifactsWritten: false,
              authoritativeBookWritesPerformed: false,
              selectionPerformed: false,
              promotionPerformed: false,
              bookUseBindingCreated: false,
              runtimeCutoverApproved: false,
              publicationPerformed: false,
            };
          }
          '''
          replace_once(
              api,
              '\nexport async function handleBookArtApiRequest(\n',
              '\n' + illustration_protocol + '\nexport async function handleBookArtApiRequest(\n',
          )
          illustration_routes = '''
            if (
              request.method === "GET" &&
              url.pathname === LEGACY_ILLUSTRATION_PLAN_PROTOCOL_PATH
            ) {
              context.writeJson(
                response,
                200,
                legacyIllustrationPlanProtocol(),
                requestId,
              );
              return true;
            }
            if (
              request.method === "POST" &&
              url.pathname === LEGACY_ILLUSTRATION_PLAN_TRANSLATE_PATH
            ) {
              if (!requireProtectedAccess(context)) return true;
              const body = await context.readJsonBody(
                request,
                context.maximumBodyBytes,
              );
              const result =
                await translateLegacyWebsiteBookIllustrationGenerationPlan(body);
              context.writeJson(
                response,
                result.status === "ready_for_shadow_comparison" ? 200 : 422,
                result,
                requestId,
              );
              return true;
            }

          '''
          replace_once(api, '\n  const postPath =\n', '\n' + illustration_routes + '  const postPath =\n')

          cli = "apps/cli/src/book-art-commands.ts"
          replace_once(
              cli,
              '''  BOOK_ART_PROFILE_SCHEMA_VERSION,
  translateLegacyWebsiteBookArtGenerationPlan,
} from "@evavo/art-contracts";''',
              '''  BOOK_ART_PROFILE_SCHEMA_VERSION,
  translateLegacyWebsiteBookArtGenerationPlan,
  translateLegacyWebsiteBookIllustrationGenerationPlan,
} from "@evavo/art-contracts";''',
          )
          replace_once(
              cli,
              '''  "book-art-legacy-plan-protocol",
  "book-art-legacy-plan-translate",
  "book-art-provider-protocol",''',
              '''  "book-art-legacy-plan-protocol",
  "book-art-legacy-plan-translate",
  "book-art-legacy-illustration-plan-protocol",
  "book-art-legacy-illustration-plan-translate",
  "book-art-provider-protocol",''',
          )
          cli_protocol = illustration_protocol.replace(
              'function legacyIllustrationPlanProtocol(): Readonly<Record<string, unknown>>',
              'function legacyIllustrationPlanProtocol()',
          ).replace('            };', '            } as const;')
          replace_once(
              cli,
              '\nexport async function handleBookArtCommand(\n',
              '\n' + cli_protocol + '\nexport async function handleBookArtCommand(\n',
          )
          cli_handlers = '''
            if (command === "book-art-legacy-illustration-plan-protocol") {
              return { handled: true, value: legacyIllustrationPlanProtocol() };
            }
            if (command === "book-art-legacy-illustration-plan-translate") {
              const inputPath = required(values.input, "--input");
              const result =
                await translateLegacyWebsiteBookIllustrationGenerationPlan(
                  await readInputObject(
                    inputPath,
                    "Legacy Website Book Illustration plan translation input",
                  ),
                );
              return {
                handled: true,
                value: result,
                ...(result.status === "ready_for_shadow_comparison"
                  ? {}
                  : { exitCode: 2 }),
              };
            }
          '''
          replace_once(cli, '\n  const policy = providerPolicy();\n', '\n' + cli_handlers + '  const policy = providerPolicy();\n')

          cli_index = "apps/cli/src/index.ts"
          replace_once(
              cli_index,
              '''  evavo-art book-art-legacy-plan-translate --input legacy-plan-translation.json [--output translated-book-art-work-order.json]

  evavo-art book-art-provider-protocol''',
              '''  evavo-art book-art-legacy-plan-translate --input legacy-plan-translation.json [--output translated-book-art-work-order.json]
  evavo-art book-art-legacy-illustration-plan-protocol [--output book-art-legacy-illustration-plan-protocol.json]
  evavo-art book-art-legacy-illustration-plan-translate --input legacy-illustration-plan-translation.json [--output translated-book-illustration-work-order.json]

  evavo-art book-art-provider-protocol''',
          )
          replace_once(
              cli_index,
              '''Legacy Book Art plan translation requires a canonical fingerprint-valid Docs-owned brief and the exact retained Website plan; it calls no provider, submits no runtime job and does not require provider policy.
Book Art provider commands require''',
              '''Legacy Book Art plan translation requires a canonical fingerprint-valid Docs-owned brief and the exact retained Website plan; it calls no provider, submits no runtime job and does not require provider policy.
Legacy Book Illustration plan translation additionally verifies exact style, page, layout and live-text protection evidence while leaving page layout and text authority in Docs Suite.
Book Art provider commands require''',
          )

          mcp = "apps/mcp/src/book-art-tools.ts"
          replace_once(
              mcp,
              '''  BOOK_ART_PROFILE_SCHEMA_VERSION,
  translateLegacyWebsiteBookArtGenerationPlan,
} from "@evavo/art-contracts";''',
              '''  BOOK_ART_PROFILE_SCHEMA_VERSION,
  translateLegacyWebsiteBookArtGenerationPlan,
  translateLegacyWebsiteBookIllustrationGenerationPlan,
} from "@evavo/art-contracts";''',
          )
          replace_once(
              mcp,
              '\nfunction requiredPolicy(): BookArtProviderAdapterPolicyV1 {\n',
              '\n' + cli_protocol + '\nfunction requiredPolicy(): BookArtProviderAdapterPolicyV1 {\n',
          )
          mcp_tools = '''
            server.registerTool(
              "book_art_legacy_illustration_plan_translation_protocol",
              {
                description:
                  "Report the exact read-only legacy Website Book Illustration plan translation contract. Translation requires a canonical Docs-owned brief plus exact style, page, layout and candidate evidence, while performing no provider call or runtime write.",
                inputSchema: z.object({}),
              },
              async () => textResult(legacyIllustrationPlanProtocol()),
            );

            server.registerTool(
              "translate_legacy_website_book_illustration_plan",
              {
                description:
                  "Validate one canonical Book Art brief and one exact retained Website illustration-generation plan, then translate one candidate into a provider-neutral Art Studio work order for shadow comparison only. Docs Suite retains page layout and live-text authority; this tool calls no provider and writes no runtime job or artifact.",
                inputSchema: z.object({ translation: z.unknown() }),
              },
              async ({ translation }) => {
                try {
                  return textResult(
                    await translateLegacyWebsiteBookIllustrationGenerationPlan(
                      translation,
                    ),
                  );
                } catch (error: unknown) {
                  return toolError(
                    "BOOK_ART_LEGACY_ILLUSTRATION_PLAN_TRANSLATION_REJECTED",
                    error,
                  );
                }
              },
            );

          '''
          replace_once(
              mcp,
              '  server.registerTool(\n    "book_art_docs_release_runtime_protocol",',
              mcp_tools + '  server.registerTool(\n    "book_art_docs_release_runtime_protocol",',
          )

          openapi = "apps/api/openapi.book-art-provider.yaml"
          replace_once(openapi, "  version: 0.4.0", "  version: 0.5.0")
          replace_once(
              openapi,
              "    Exact legacy Website plan translation plus shadow-only Book Art provider job compilation, durable submission,\n",
              "    Exact legacy Website cover and illustration plan translation plus shadow-only Book Art provider job compilation, durable submission,\n",
          )
          openapi_paths = '''
            /v1/book-art/legacy-illustration-plan-runtime:
              get:
                tags: [Book Art Provider Runtime]
                operationId: getLegacyWebsiteBookIllustrationPlanTranslationProtocol
                summary: Read the exact legacy illustration-plan authority boundary
                security: []
                responses:
                  "200":
                    description: Read-only legacy Website Book Illustration plan translation protocol
                    content:
                      application/json:
                        schema:
                          $ref: "#/components/schemas/LegacyWebsiteBookIllustrationPlanTranslationProtocol"
            /v1/book-art/legacy-illustration-plans/translate:
              post:
                tags: [Book Art Provider Runtime]
                operationId: translateLegacyWebsiteBookIllustrationGenerationPlan
                summary: Translate one exact legacy Website illustration candidate for shadow comparison
                description: >-
                  Requires a canonical fingerprint-valid Book Art brief, the exact retained
                  Website illustration plan, exact style and page authorities, and one candidate identity.
                  The operation is authenticated and read-only, trusts neither raw legacy prompts nor
                  legacy layout as Art authority, calls no provider and writes no runtime job or artifact.
                security:
                  - ArtStudioControlToken: []
                requestBody:
                  required: true
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/LegacyWebsiteBookIllustrationPlanTranslationInput"
                responses:
                  "200":
                    description: Provider-neutral illustration work order ready for shadow comparison
                    content:
                      application/json:
                        schema:
                          $ref: "#/components/schemas/LegacyWebsiteBookIllustrationPlanTranslationResult"
                  "401":
                    $ref: "#/components/responses/AuthorizationError"
                  "422":
                    $ref: "#/components/responses/ValidationError"
                  "503":
                    $ref: "#/components/responses/ConfigurationError"
          '''
          replace_once(
              openapi,
              "  /v1/book-art/provider-runtime:\n",
              openapi_paths + "  /v1/book-art/provider-runtime:\n",
          )
          openapi_schemas = '''
              LegacyWebsiteBookIllustrationPlanTranslationInput:
                type: object
                additionalProperties: false
                required: [outputKind, schemaVersion, brief, legacyPlan, candidateId]
                properties:
                  outputKind: { const: evavo_legacy_website_book_illustration_plan_translation_input }
                  schemaVersion: { const: 1 }
                  brief:
                    type: object
                    description: Canonical fingerprint-valid evavo_book_art_brief owned by Docs Suite.
                  legacyPlan:
                    type: object
                    description: Exact retained Website book_illustration_generation_plan_v1.
                  candidateId:
                    type: string
                    minLength: 1
                    maxLength: 200
              LegacyWebsiteBookIllustrationPlanTranslationProtocol:
                type: object
                additionalProperties: false
                required:
                  - schemaVersion
                  - contract
                  - translationInputKind
                  - translationResultKind
                  - requiresCanonicalBookArtBrief
                  - verifiesExactBriefFingerprint
                  - verifiesLegacyPlanIdentity
                  - verifiesCandidateUniqueness
                  - verifiesArtDirectionDigest
                  - verifiesStyleAuthorityDigest
                  - verifiesPageAuthorityDigest
                  - rawLegacyPromptTrustedAsAuthority
                  - legacyLayoutTrustedAsArtAuthority
                  - translationReadOnly
                  - providerCallPerformed
                  - runtimeJobSubmitted
                  - candidateArtifactsWritten
                  - authoritativeBookWritesPerformed
                  - selectionPerformed
                  - promotionPerformed
                  - bookUseBindingCreated
                  - runtimeCutoverApproved
                  - publicationPerformed
                properties:
                  schemaVersion: { const: 1 }
                  contract: { const: evavo_book_art_profile_v1 }
                  translationInputKind: { const: evavo_legacy_website_book_illustration_plan_translation_input }
                  translationResultKind: { const: evavo_legacy_website_book_illustration_plan_translation_result }
                  requiresCanonicalBookArtBrief: { const: true }
                  verifiesExactBriefFingerprint: { const: true }
                  verifiesLegacyPlanIdentity: { const: true }
                  verifiesCandidateUniqueness: { const: true }
                  verifiesArtDirectionDigest: { const: true }
                  verifiesStyleAuthorityDigest: { const: true }
                  verifiesPageAuthorityDigest: { const: true }
                  rawLegacyPromptTrustedAsAuthority: { const: false }
                  legacyLayoutTrustedAsArtAuthority: { const: false }
                  translationReadOnly: { const: true }
                  providerCallPerformed: { const: false }
                  runtimeJobSubmitted: { const: false }
                  candidateArtifactsWritten: { const: false }
                  authoritativeBookWritesPerformed: { const: false }
                  selectionPerformed: { const: false }
                  promotionPerformed: { const: false }
                  bookUseBindingCreated: { const: false }
                  runtimeCutoverApproved: { const: false }
                  publicationPerformed: { const: false }
              LegacyWebsiteBookIllustrationPlanTranslationResult:
                type: object
                additionalProperties: false
                required:
                  - outputKind
                  - schemaVersion
                  - status
                  - identity
                  - legacyEvidence
                  - blockers
                  - warnings
                  - shadowOnly
                  - rawLegacyPromptTrustedAsAuthority
                  - legacyLayoutTrustedAsArtAuthority
                  - authoritativeWritesPerformed
                  - providerCandidateMayBeFinal
                  - promotionRequired
                  - bookUseBindingRequired
                  - artifactBytesRead
                  - artifactBytesRewritten
                  - runtimeCutoverApproved
                  - publicationPerformed
                properties:
                  outputKind: { const: evavo_legacy_website_book_illustration_plan_translation_result }
                  schemaVersion: { const: 1 }
                  status: { enum: [blocked, ready_for_shadow_comparison] }
                  identity: { type: object }
                  workOrder: { type: object }
                  legacyEvidence: { type: object }
                  blockers:
                    type: array
                    items: { type: string }
                  warnings:
                    type: array
                    items: { type: string }
                  shadowOnly: { const: true }
                  rawLegacyPromptTrustedAsAuthority: { const: false }
                  legacyLayoutTrustedAsArtAuthority: { const: false }
                  authoritativeWritesPerformed: { const: false }
                  providerCandidateMayBeFinal: { const: false }
                  promotionRequired: { const: true }
                  bookUseBindingRequired: { const: true }
                  artifactBytesRead: { const: false }
                  artifactBytesRewritten: { const: false }
                  runtimeCutoverApproved: { const: false }
                  publicationPerformed: { const: false }
          '''
          replace_once(
              openapi,
              "    BookArtProviderShadowRequest:\n",
              openapi_schemas + "    BookArtProviderShadowRequest:\n",
          )

          fixture_helpers = r'''
          const illustrationCanonical = (value) => Array.isArray(value)
            ? value.map(illustrationCanonical)
            : value && typeof value === "object"
              ? Object.fromEntries(
                  Object.entries(value)
                    .filter(([, item]) => item !== undefined)
                    .sort(([left], [right]) => left.localeCompare(right))
                    .map(([key, item]) => [key, illustrationCanonical(item)]),
                )
              : value;
          const illustrationHashText = async (value) =>
            [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value)))]
              .map((byte) => byte.toString(16).padStart(2, "0"))
              .join("");
          const illustrationHash = async (value) =>
            illustrationHashText(JSON.stringify(illustrationCanonical(value)));
          const illustrationSeal = async (value, key) => ({
            ...value,
            [key]: await illustrationHash(value),
          });

          async function illustrationBrief() {
            const value = await brief();
            value.identity.requestId = "request-illustration-1";
            value.purpose = "interior_full_page_illustration";
            value.output.minimumPpi = 600;
            value.output.colourIntent = "monochrome";
            value.briefFingerprint = "";
            value.briefFingerprint = await fingerprintBookArtBrief(value);
            return value;
          }

          async function legacyIllustrationTranslationBody() {
            const styleAuthority = await illustrationSeal({
              outputKind: "book_illustration_style_authority",
              version: "book_illustration_style_authority_v1",
              status: "approved_for_page_design",
              projectId: "project-1",
              styleId: "style-1",
              compiledAt: "2026-08-02T00:00:00.000Z",
              styleFamily: "engraved_book_plate",
              colourMode: "one_bit_black",
              paperTone: "white",
              inkLayerMode: "binary_alpha",
              minimumLineWidthPt: 0.25,
              targetLineArtPpi: 600,
              profile: {},
              projectVisualIdentity: "Exact manuscript-grounded line art",
              projectDirectives: [],
              prohibitedTraits: ["pseudo-text"],
              historicalReferenceDigestSha256: sha("1"),
              approvedReviewIds: ["review-1"],
              hardErrors: [],
              warnings: [],
              requiredRevisions: [],
              requiredHumanDecisions: [],
              blockedClaims: [],
            }, "authorityDigestSha256");
            const pageAuthority = await illustrationSeal({
              outputKind: "book_illustrated_page_authority",
              version: "book_illustrated_page_authority_v1",
              status: "ready_for_generation",
              projectId: "project-1",
              pageId: "page-1",
              compiledAt: "2026-08-02T00:00:00.000Z",
              styleAuthorityDigestSha256: styleAuthority.authorityDigestSha256,
              pageRole: "full_page_black_ink_plate",
              narrativeMode: "literal_scene",
              manuscriptAuthorityDigestSha256: sha("2"),
              visualManuscriptAuthorityDigestSha256: sha("3"),
              manuscriptEvidenceSpanIds: ["span-1"],
              directionDigestSha256: sha("d"),
              layoutDigestSha256: sha("4"),
              editionFormats: ["paperback"],
              sharesPageWithLiveText: true,
              protectedTextZoneCount: 2,
              hardErrors: [],
              warnings: [],
              requiredHumanDecisions: [],
              blockedClaims: [],
            }, "authorityDigestSha256");
            const prompt =
              "Create one exact manuscript-grounded black-ink illustrated page candidate with no generated publication text.";
            const candidateId = "page-1-formal_plate";
            const inputSnapshot = {
              projectId: "project-1",
              runId: "illustration-run-1",
              pageId: "page-1",
            };
            const withoutDigest = {
              outputKind: "book_illustration_generation_plan",
              version: "book_illustration_generation_plan_v1",
              status: "ready_to_generate",
              projectId: "project-1",
              runId: "illustration-run-1",
              requestedAt: "2026-08-02T00:00:00.000Z",
              profile: "production",
              styleAuthority,
              pageAuthority,
              providerProfile: {
                adapter: "openai_image_api",
                model: "gpt-image-2-2026-04-21",
                size: "2048x3072",
                quality: "high",
                outputFormat: "png",
                background: "opaque",
                maximumCandidatesPerRun: 4,
                maximumConcurrency: 1,
                automaticProviderRetries: 0,
              },
              maximumRefinementRounds: 3,
              tasks: [{
                candidateId,
                order: 1,
                variation: "formal_plate",
                prompt,
                promptDigestSha256: await illustrationHashText(prompt),
                expectedWidthPx: 2048,
                expectedHeightPx: 3072,
                flattenBackgroundHex: "#ffffff",
                createTransparentInkLayer: false,
                inkLayerMode: "none",
                idempotencyKey: sha("5"),
                state: "ready",
                stopConditions: [],
              }],
              nextCandidateId: candidateId,
              completedCandidateIds: [],
              hardErrors: [],
              warnings: [],
              executionRules: [],
              blockedClaims: [],
              inputSnapshot,
              inputDigestSha256: await illustrationHash(inputSnapshot),
            };
            return {
              outputKind:
                "evavo_legacy_website_book_illustration_plan_translation_input",
              schemaVersion: 1,
              brief: await illustrationBrief(),
              legacyPlan: await illustrationSeal(
                withoutDigest,
                "planDigestSha256",
              ),
              candidateId,
            };
          }
          '''

          api_test = "apps/api/test/book-art-api.test.mjs"
          api_tests = fixture_helpers + r'''
          test("Book Art REST exposes authenticated read-only legacy illustration plan translation", async () => {
            await withServer(
              { allowWrites: true, writeToken: token },
              async (base) => {
                const protocol = await fetch(
                  `${base}/v1/book-art/legacy-illustration-plan-runtime`,
                );
                assert.equal(protocol.status, 200);
                const protocolBody = await protocol.json();
                assert.equal(protocolBody.contract, "evavo_book_art_profile_v1");
                assert.equal(protocolBody.verifiesStyleAuthorityDigest, true);
                assert.equal(protocolBody.verifiesPageAuthorityDigest, true);
                assert.equal(protocolBody.legacyLayoutTrustedAsArtAuthority, false);
                assert.equal(protocolBody.translationReadOnly, true);
                assert.equal(protocolBody.providerCallPerformed, false);
                assert.equal(protocolBody.runtimeJobSubmitted, false);

                const input = await legacyIllustrationTranslationBody();
                const denied = await fetch(
                  `${base}/v1/book-art/legacy-illustration-plans/translate`,
                  {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify(input),
                  },
                );
                assert.equal(denied.status, 401);

                const translated = await fetch(
                  `${base}/v1/book-art/legacy-illustration-plans/translate`,
                  {
                    method: "POST",
                    headers: authorizedHeaders(),
                    body: JSON.stringify(input),
                  },
                );
                const text = await translated.text();
                assert.equal(translated.status, 200, text);
                const body = JSON.parse(text);
                assert.equal(
                  body.status,
                  "ready_for_shadow_comparison",
                  body.blockers.join("\n"),
                );
                assert.equal(body.workOrder.assetClass, "interior_illustration");
                assert.equal(body.legacyEvidence.pageRole, "full_page_black_ink_plate");
                assert.equal(body.legacyEvidence.sharesPageWithLiveText, true);
                assert.equal(body.legacyEvidence.protectedTextZoneCount, 2);
                assert.equal(body.rawLegacyPromptTrustedAsAuthority, false);
                assert.equal(body.legacyLayoutTrustedAsArtAuthority, false);
                assert.equal(body.authoritativeWritesPerformed, false);
                assert.equal(body.runtimeCutoverApproved, false);
                assert.equal(body.publicationPerformed, false);
              },
