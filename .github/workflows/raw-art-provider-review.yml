name: RAW ART provider candidate review

on:
  pull_request:
    paths:
      - "packages/providers/src/**"
      - "packages/runtime/src/**"
      - "packages/artifacts/src/**"
      - "apps/worker/src/provider-handlers.ts"
      - "scripts/raw-art-provider/admission.mjs"
      - "scripts/raw-art-provider/execution.mjs"
      - "scripts/raw-art-provider/review.mjs"
      - "scripts/select-raw-art-provider-runtime-jobs.mjs"
      - "scripts/admit-raw-art-provider-runtime-batch.mjs"
      - "scripts/authorize-raw-art-provider-runtime-execution.mjs"
      - "scripts/run-authorized-raw-art-provider-worker.mjs"
      - "scripts/compile-raw-art-provider-review-plan.mjs"
      - "scripts/check-raw-art-provider-runtime-admission.mjs"
      - "scripts/check-raw-art-provider-runtime-execution.mjs"
      - "scripts/check-raw-art-provider-review.mjs"
      - "docs/RAW_ART_PROVIDER_RUNTIME_ADMISSION.md"
      - "docs/RAW_ART_PROVIDER_RUNTIME_EXECUTION.md"
      - "docs/RAW_ART_PROVIDER_REVIEW_AND_REPAIR.md"
      - "package.json"
      - ".github/workflows/raw-art-provider-runtime-admission.yml"
      - ".github/workflows/raw-art-provider-runtime-execution.yml"
      - ".github/workflows/raw-art-provider-review.yml"
  push:
    branches:
      - main
    paths:
      - "packages/providers/src/**"
      - "packages/runtime/src/**"
      - "packages/artifacts/src/**"
      - "apps/worker/src/provider-handlers.ts"
      - "scripts/raw-art-provider/admission.mjs"
      - "scripts/raw-art-provider/execution.mjs"
      - "scripts/raw-art-provider/review.mjs"
      - "scripts/select-raw-art-provider-runtime-jobs.mjs"
      - "scripts/admit-raw-art-provider-runtime-batch.mjs"
      - "scripts/authorize-raw-art-provider-runtime-execution.mjs"
      - "scripts/run-authorized-raw-art-provider-worker.mjs"
      - "scripts/compile-raw-art-provider-review-plan.mjs"
      - "scripts/check-raw-art-provider-runtime-admission.mjs"
      - "scripts/check-raw-art-provider-runtime-execution.mjs"
      - "scripts/check-raw-art-provider-review.mjs"
      - "docs/RAW_ART_PROVIDER_RUNTIME_ADMISSION.md"
      - "docs/RAW_ART_PROVIDER_RUNTIME_EXECUTION.md"
      - "docs/RAW_ART_PROVIDER_REVIEW_AND_REPAIR.md"
      - "package.json"
      - ".github/workflows/raw-art-provider-runtime-admission.yml"
      - ".github/workflows/raw-art-provider-runtime-execution.yml"
      - ".github/workflows/raw-art-provider-review.yml"

permissions:
  contents: read

concurrency:
  group: raw-art-provider-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build review dependency closure
        run: |
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-worker build
          pnpm --filter @evavo/art-studio-worker typecheck

      - name: Run exact provider execution and candidate review regressions
        run: |
          node scripts/check-raw-art-provider-runtime-batch.mjs
          node scripts/check-raw-art-provider-runtime-admission.mjs
          node scripts/check-raw-art-provider-runtime-execution.mjs
          node scripts/check-raw-art-provider-review.mjs
          node --test apps/worker/test/provider-worker.test.mjs

      - name: Verify permanent review and repair authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RAW_ART_PROVIDER_CANDIDATE_REVIEW_PLAN_SCHEMA' scripts/raw-art-provider/review.mjs
          grep -F 'verifyRawArtProviderReviewEvidence' scripts/raw-art-provider/review.mjs
          grep -F 'requiresFreshAdmission: true' scripts/raw-art-provider/review.mjs
          grep -F 'requiresFreshExecutionAuthorization: true' scripts/raw-art-provider/review.mjs
          grep -F 'independentApprovalPerformed: false' scripts/raw-art-provider/review.mjs
          grep -F 'raw-art:provider-review' package.json
          grep -F 'raw-art:provider-review:check' package.json
          grep -F 'check-raw-art-provider-review.mjs' .github/workflows/raw-art-provider-review.yml
          grep -F 'pnpm check' .github/workflows/raw-art-provider-review.yml
          grep -F 'ComfyUI' docs/RAW_ART_PROVIDER_REVIEW_AND_REPAIR.md
          ! grep -F 'candidateApproval: true' scripts/raw-art-provider/review.mjs
          ! grep -F 'candidatePromotion: true' scripts/raw-art-provider/review.mjs
          ! grep -F 'targetRepositoryMutation: true' scripts/raw-art-provider/review.mjs
          ! grep -F 'publication: true' scripts/raw-art-provider/review.mjs
          ! grep -F 'forcePush: true' scripts/raw-art-provider/review.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
