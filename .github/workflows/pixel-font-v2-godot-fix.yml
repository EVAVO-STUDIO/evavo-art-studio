name: Pixel Font Studio v2.2 Godot headless fix

on:
  push:
    branches:
      - agent/pixel-font-v2-2-godot-fix-bootstrap-7828f32b

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_BASE_SHA: 7828f32bd4210510edb0bca81d44b676b5c656e0
      READY_BRANCH: agent/pixel-font-v2-2-godot-fix-ready-7828f32b
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "1577836800"
      GODOT_VERSION: "4.6.2"
      GODOT_ARCHIVE_SHA256: "30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937"
    steps:
      - name: Check out patch transport
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply reviewed fix to exact current main
        run: |
          set -euo pipefail
          cp .pixel-font-godot-headless.patch "$RUNNER_TEMP/godot-headless.patch"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          git checkout --detach "$EXPECTED_BASE_SHA"
          git switch -c "$READY_BRANCH"
          git apply --check "$RUNNER_TEMP/godot-headless.patch"
          git apply "$RUNNER_TEMP/godot-headless.patch"
          python -m py_compile tools/pixel_font_v2/build.py
          git diff --check

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact TrueType dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Download and verify official Godot 4.6.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "${GODOT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Run complete deterministic and native Godot checks
        env:
          EVAVO_PIXEL_FONT_GODOT: ${{ runner.temp }}/godot/Godot_v4.6.2-stable_linux.x86_64
          EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-studio-v2-check
        run: node scripts/check-pixel-font-studio-v2.mjs

      - name: Commit and publish one-file fix
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add tools/pixel_font_v2/build.py
          test "$(git diff --cached --name-only)" = "tools/pixel_font_v2/build.py"
          git diff --cached --check
          git commit -m "fix(pixel-font): make Godot headless proof deterministic" -m "Replace the open-ended frame_post_draw wait with explicit RenderingServer force_draw and force_sync calls before capture. Retain exact Godot 4.6.2 glyph coverage, binary-pixel and screenshot verification without hanging under the headless display driver."
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          rm -f .pixel-font-godot-headless.patch
          rm -f .github/workflows/pixel-font-v2-godot-fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:refs/heads/$READY_BRANCH"
