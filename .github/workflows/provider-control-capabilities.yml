name: Provider control capabilities

on:
  pull_request:
    paths:
      - "apps/api/openapi.yaml"
      - "apps/api/src/provider-api.ts"
      - "apps/api/test/openapi-contract.test.mjs"
      - "apps/api/test/provider-api.test.mjs"
      - "apps/cli/src/index.ts"
      - "apps/cli/test/provider-cli.test.mjs"
      - "apps/mcp/src/provider-tools.ts"
      - "apps/mcp/test/provider-tools-contract.test.mjs"
      - "apps/web/lib/operator-types.ts"
      - "apps/web/app/operations/runtime-operations-dashboard.tsx"
      - "apps/worker/src/**"
      - "apps/worker/test/**"
      - "packages/runtime/src/**"
      - "packages/runtime/test/**"
      - "packages/book-art-runtime/src/**"
      - "packages/book-art-runtime/test/**"
      - "packages/repair/src/**"
      - "packages/repair/test/**"
      - "packages/sprite-supervisor/package.json"
      - "packages/sprite-supervisor/src/**"
      - "packages/sprite-supervisor/test/**"
      - "packages/sprite-supervisor/tsconfig.json"
      - "examples/runtime-provider-job.json"
      - "docs/durable-runtime-and-artifacts.md"
      - "scripts/check-provider-runtime-capability-profiles.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/providers/src/**"
      - "packages/providers/test/**"
      - "docs/governed-provider-candidates.md"
      - "docs/automatic-sprite-finalization.md"
      - ".github/workflows/provider-control-capabilities.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/openapi.yaml"
      - "apps/api/src/provider-api.ts"
      - "apps/api/test/openapi-contract.test.mjs"
      - "apps/api/test/provider-api.test.mjs"
      - "apps/cli/src/index.ts"
      - "apps/cli/test/provider-cli.test.mjs"
      - "apps/mcp/src/provider-tools.ts"
      - "apps/mcp/test/provider-tools-contract.test.mjs"
      - "apps/web/lib/operator-types.ts"
      - "apps/web/app/operations/runtime-operations-dashboard.tsx"
      - "apps/worker/src/**"
      - "apps/worker/test/**"
      - "packages/runtime/src/**"
      - "packages/runtime/test/**"
      - "packages/book-art-runtime/src/**"
      - "packages/book-art-runtime/test/**"
      - "packages/repair/src/**"
      - "packages/repair/test/**"
      - "packages/sprite-supervisor/package.json"
      - "packages/sprite-supervisor/src/**"
      - "packages/sprite-supervisor/test/**"
      - "packages/sprite-supervisor/tsconfig.json"
      - "examples/runtime-provider-job.json"
      - "docs/durable-runtime-and-artifacts.md"
      - "scripts/check-provider-runtime-capability-profiles.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/providers/src/**"
      - "packages/providers/test/**"
      - "docs/governed-provider-candidates.md"
      - "docs/automatic-sprite-finalization.md"
      - ".github/workflows/provider-control-capabilities.yml"

permissions:
  contents: read

concurrency:
  group: provider-control-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and identify audio media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build provider and control-surface dependency closure
        run: |
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-api build
          pnpm --filter @evavo/art-studio-cli build
          pnpm --filter @evavo/art-studio-mcp build
          pnpm --filter @evavo/art-studio-worker build
          pnpm --filter @evavo/art-studio-web build

      - name: Type-check provider and control-surface boundaries
        run: |
          pnpm --filter @evavo/art-providers typecheck
          pnpm --filter @evavo/art-runtime typecheck
          pnpm --filter @evavo/art-book-runtime typecheck
          pnpm --filter @evavo/art-repair typecheck
          pnpm --filter @evavo/art-sprite-supervisor typecheck
          pnpm --filter @evavo/art-studio-api typecheck
          pnpm --filter @evavo/art-studio-cli typecheck
          pnpm --filter @evavo/art-studio-mcp typecheck
          pnpm --filter @evavo/art-studio-worker typecheck
          pnpm --filter @evavo/art-studio-web typecheck

      - name: Run provider routing and scheduler capability regressions
        run: >-
          node --test
          packages/providers/test/providers.test.mjs
          packages/providers/test/openai-preflight.test.mjs
          packages/providers/test/routing-inspection-security.test.mjs
          packages/providers/test/request-immutability-security.test.mjs
          packages/runtime/test/runtime.test.mjs
          packages/book-art-runtime/test/runtime.test.mjs
          packages/book-art-runtime/test/candidate-set-runtime.test.mjs
          packages/book-art-runtime/test/candidate-set-execution.test.mjs
          packages/repair/test/targeted-repair.test.mjs
          packages/repair/test/provider-canvas-execution.test.mjs
          packages/sprite-supervisor/test/sprite-supervisor.test.mjs
          apps/worker/test/provider-worker.test.mjs
          apps/worker/test/book-art-provider-jobs.test.mjs
          apps/worker/test/book-art-provider-inspection.test.mjs
          apps/worker/test/book-art-provider-parity.test.mjs
          apps/worker/test/repair-registration-contract.test.mjs

      - name: Run API, CLI, MCP and OpenAPI capability regressions
        run: node --test apps/api/test/provider-api.test.mjs apps/api/test/openapi-contract.test.mjs apps/cli/test/provider-cli.test.mjs apps/mcp/test/provider-tools-contract.test.mjs

      - name: Verify permanent capability and routing contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PROVIDER_PROTOCOL_VERSION = "2026-08-07.3"' packages/providers/src/types.ts
          grep -F 'ProviderRoutingInspection' packages/providers/src/types.ts
          grep -F 'freezeNormalizedProviderRequest' packages/providers/src/validation.ts
          grep -F 'providerCallPerformedByInspection: false' packages/providers/src/registry.ts
          grep -F 'snapshotDescriptor' packages/providers/src/registry.ts
          grep -F 'compileProviderExecutionRoutingPlan' packages/providers/src/registry.ts
          grep -F 'Provider routing cannot mark adapter' packages/providers/src/registry.ts
          grep -F 'PROVIDER_ROUTING_INSPECTION_INVALID' packages/providers/src/registry.ts
          grep -F 'must-never-enter-routing-evidence' packages/providers/test/routing-inspection-security.test.mjs
          grep -F 'provider execution uses the exact adapter snapshot recorded by inspection' packages/providers/test/routing-inspection-security.test.mjs
          grep -F 'normalized provider requests are deeply frozen and detached from caller input' packages/providers/test/request-immutability-security.test.mjs
          grep -F 'custom registry and adapter cannot mutate the request between evidence and execution' packages/providers/test/request-immutability-security.test.mjs
          grep -F 'compileProviderExecutionRoutingPlan' packages/providers/src/orchestrator.ts
          grep -F 'routingPlan.eligibleAdapters' packages/providers/src/orchestrator.ts
          grep -F 'routingInspection' packages/providers/src/orchestrator.ts
          grep -F 'requiredAdapterCapabilities' apps/api/src/provider-api.ts
          grep -F 'requiredAdapterCapabilities' apps/cli/src/index.ts
          grep -F 'requiredAdapterCapabilities' apps/mcp/src/provider-tools.ts
          grep -F 'requiredReferenceCapabilities' apps/api/openapi.yaml
          grep -F 'requiredAdapterCapabilities' apps/api/openapi.yaml
          grep -F 'reference.required' packages/providers/src/registry.ts
          grep -F 'unknown capability' packages/providers/src/registry.ts
          grep -F 'before the artifact store is asked to resolve or read any reference' docs/governed-provider-candidates.md
          grep -F 'does **not** declare `pose-control`, `edge-control` or `depth-control`' docs/governed-provider-candidates.md
          grep -F 'requiredCapabilityProfile' packages/runtime/src/types.ts
          grep -F 'capabilityProfiles.some' packages/runtime/src/normalize.ts
          grep -F 'PROVIDER_RUNTIME_CAPABILITY_PROFILE_MISMATCH' apps/worker/src/provider-handlers.ts
          grep -F 'TARGETED_REPAIR_RUNTIME_CAPABILITY_PROFILE_MISMATCH' apps/worker/src/repair-handlers.ts
          grep -F 'requiredCapabilityProfile: providerRequiredCapabilities' packages/book-art-runtime/src/index.ts
          grep -F 'requiredCapabilityProfile: providerRequiredCapabilities' packages/book-art-runtime/src/candidate-set.ts
          grep -F 'SPRITE_SUPERVISOR_PROVIDER_PROFILE_INVALID' packages/sprite-supervisor/src/engine.ts
          node scripts/check-provider-runtime-capability-profiles.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
