name: Provider control capabilities

on:
  pull_request:
    paths:
      - "packages/providers/src/**"
      - "packages/providers/test/**"
      - "packages/repair/test/provider-canvas-execution.test.mjs"
      - "docs/governed-provider-candidates.md"
      - "docs/automatic-sprite-finalization.md"
      - ".github/workflows/provider-control-capabilities.yml"
  push:
    branches:
      - main
    paths:
      - "packages/providers/src/**"
      - "packages/providers/test/**"
      - "packages/repair/test/provider-canvas-execution.test.mjs"
      - "docs/governed-provider-candidates.md"
      - "docs/automatic-sprite-finalization.md"
      - ".github/workflows/provider-control-capabilities.yml"

permissions:
  contents: read

concurrency:
  group: provider-control-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and identify audio media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build provider dependency closure
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-media build
          pnpm --filter @evavo/art-providers build

      - name: Type-check provider capability boundary
        run: pnpm --filter @evavo/art-providers typecheck

      - name: Run provider capability regressions
        run: node --test packages/providers/test/providers.test.mjs packages/providers/test/openai-preflight.test.mjs

      - name: Verify permanent capability contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PROVIDER_PROTOCOL_VERSION = "2026-08-07.2"' packages/providers/src/types.ts
          grep -F '"identity-reference"' packages/providers/src/types.ts
          grep -F '"temporal-reference"' packages/providers/src/types.ts
          grep -F '"pose-control"' packages/providers/src/types.ts
          grep -F '"edge-control"' packages/providers/src/types.ts
          grep -F '"depth-control"' packages/providers/src/types.ts
          grep -F 'PROVIDER_REFERENCE_CAPABILITY_REQUIREMENTS' packages/providers/src/registry.ts
          grep -F 'reference.required' packages/providers/src/registry.ts
          grep -F 'unknown capability' packages/providers/src/registry.ts
          grep -F 'does **not** declare `pose-control`, `edge-control` or `depth-control`' docs/governed-provider-candidates.md

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
