name: Agent Validate Strict Worker Repairs

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: agent-validate-strict-worker-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/book-art-provider-runtime-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact repair boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ "$(git rev-parse HEAD^)" == "91062578ece710115fb15c99dbe46c00753e58c1" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/agent-fix-sprite-supervisor-strictness.yml"

      - name: Reconstruct and apply checksum-bound repair patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          marker_prefix = 'STRICT_WORKER_FIXES_V1_PART_'
          request = Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments?per_page=100",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urlopen(request, timeout=30) as response:
              comments = json.load(response)

          parts = []
          for part in range(1, 6):
              marker = f'{marker_prefix}{part}_OF_5\n'
              matches = [
                  comment.get('body', '')[len(marker):].strip()
                  for comment in comments
                  if comment.get('body', '').startswith(marker)
              ]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one strict-worker patch part {part}; found {len(matches)}.')
              parts.append(matches[0])

          payload = ''.join(parts)
          if len(payload) != 14880:
              raise SystemExit(f'Strict-worker Base64 length mismatch: {len(payload)}.')
          patch = base64.b64decode(payload, validate=True)
          if len(patch) != 11158:
              raise SystemExit(f'Strict-worker patch length mismatch: {len(patch)}.')
          if hashlib.sha256(patch).hexdigest() != '134695636e8da8c42fb2f39a30579a7b75d4cd51ded77eba077add71533bd8b2':
              raise SystemExit('Strict-worker patch SHA-256 mismatch.')
          Path(os.environ['RUNNER_TEMP'], 'strict-worker-fixes.patch').write_bytes(patch)
          PY
          git apply --check "${RUNNER_TEMP}/strict-worker-fixes.patch"
          git apply "${RUNNER_TEMP}/strict-worker-fixes.patch"
          git diff --check
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'PATHS'
          apps/worker/src/adaptive-finalizer-guarded-handlers.ts
          apps/worker/src/adaptive-sprite-family-handlers.ts
          apps/worker/src/mastering-handlers.ts
          apps/worker/test/adaptive-finalizer-source-contract.test.mjs
          apps/worker/test/mastering-worker.test.mjs
          packages/sprite-supervisor/src/automatic-compiler.ts
          PATHS
          sort "${RUNNER_TEMP}/expected-paths.txt" -o "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run complete worker and Book Art provider regressions
        run: pnpm --filter @evavo/art-studio-worker test

      - name: Commit only the validated repair slice
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --check
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'PATHS'
          apps/worker/src/adaptive-finalizer-guarded-handlers.ts
          apps/worker/src/adaptive-sprite-family-handlers.ts
          apps/worker/src/mastering-handlers.ts
          apps/worker/test/adaptive-finalizer-source-contract.test.mjs
          apps/worker/test/mastering-worker.test.mjs
          packages/sprite-supervisor/src/automatic-compiler.ts
          PATHS
          sort "${RUNNER_TEMP}/expected-paths.txt" -o "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"
          git add \
            apps/worker/src/adaptive-finalizer-guarded-handlers.ts \
            apps/worker/src/adaptive-sprite-family-handlers.ts \
            apps/worker/src/mastering-handlers.ts \
            apps/worker/test/adaptive-finalizer-source-contract.test.mjs \
            apps/worker/test/mastering-worker.test.mjs \
            packages/sprite-supervisor/src/automatic-compiler.ts
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^M  ' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): restore strict worker validation'
          git push origin HEAD:refs/heads/agent/book-art-provider-runtime-20260802
