name: Agent Fix Strict Runtime Typing

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-fix-strict-runtime-typing-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/book-art-provider-runtime-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact repair boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ "$(git rev-parse HEAD^)" == "cf7692a2b100c057f598166eb3f61dc8ccc39ec8" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/agent-fix-sprite-supervisor-strictness.yml"

      - name: Apply exact strict-TypeScript repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, before: str, after: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(before) != 1:
                  raise SystemExit(f'Expected repair block exactly once in {path}.')
              path.write_text(text.replace(before, after, 1), encoding='utf-8')

          sprite = Path('packages/sprite-supervisor/src/automatic-compiler.ts')
          replace_once(
              sprite,
              '''  const keys = group.filter((entry) => entry.keyPose);\n  return {\n    previous: [...keys]\n      .reverse()\n      .find((entry) => entry.frameIndex < frame.frameIndex),\n    next: keys.find((entry) => entry.frameIndex > frame.frameIndex),\n  };\n''',
              '''  const keys = group.filter((entry) => entry.keyPose);\n  const previous = [...keys]\n    .reverse()\n    .find((entry) => entry.frameIndex < frame.frameIndex);\n  const next = keys.find((entry) => entry.frameIndex > frame.frameIndex);\n  return {\n    ...(previous === undefined ? {} : { previous }),\n    ...(next === undefined ? {} : { next }),\n  };\n''',
          )
          replace_once(
              sprite,
              '''        phase: identityUnit.phase,\n        frame,\n        clip: identityUnit.clip,\n        direction: frame.direction,\n''',
              '''        phase: identityUnit.phase,\n        frame,\n        ...(identityUnit.clip === undefined ? {} : { clip: identityUnit.clip }),\n        direction: frame.direction,\n''',
          )
          replace_once(
              sprite,
              '''  const includedRoles = layerDecisions.map((entry) => entry.role);\n''',
              '''  const includedRoles = new Set<string>(\n    layerDecisions.map((entry) => entry.role),\n  );\n''',
          )
          replace_once(
              sprite,
              '''        (unit) => unit.frameId === frame.id && includedRoles.includes(unit.layerRole),\n''',
              '''        (unit) => unit.frameId === frame.id && includedRoles.has(unit.layerRole),\n''',
          )

          finalizer = Path('apps/worker/src/adaptive-finalizer-guarded-handlers.ts')
          replace_once(
              finalizer,
              '''import {\n  PermanentRuntimeError,\n  type RuntimeJobHandler,\n} from "@evavo/art-runtime";\n''',
              '''import {\n  PermanentRuntimeError,\n  type RuntimeHandlerResult,\n  type RuntimeJobHandler,\n} from "@evavo/art-runtime";\n''',
          )
          replace_once(
              finalizer,
              '''function outputByRole(\n  artifacts: readonly StoredArtifact[],\n  role: string,\n): StoredArtifact {\n''',
              '''function requireBaseResult(\n  value: RuntimeHandlerResult | void,\n): RuntimeHandlerResult {\n  if (!value) {\n    throw new PermanentRuntimeError(\n      "ADAPTIVE_FINALIZER_BASE_RESULT_MISSING",\n      "The base adaptive finalizer returned no result for a successful candidate.",\n    );\n  }\n  return value;\n}\n\nfunction outputByRole(\n  artifacts: readonly StoredArtifact[],\n  role: string,\n): StoredArtifact {\n''',
          )
          replace_once(
              finalizer,
              '''  baseResult: Awaited<ReturnType<RuntimeJobHandler>>,\n): Promise<Awaited<ReturnType<RuntimeJobHandler>>> {\n  const artifacts = await Promise.all(\n    baseResult.outputArtifacts.map((artifactId) =>\n''',
              '''  baseResult: RuntimeHandlerResult,\n): Promise<RuntimeHandlerResult> {\n  const artifacts = await Promise.all(\n    (baseResult.outputArtifacts ?? []).map((artifactId) =>\n''',
          )
          replace_once(
              finalizer,
              '''      return normalizeSuccessfulLineage(\n        context,\n        sourceId,\n        await base(context),\n      );\n''',
              '''      return normalizeSuccessfulLineage(\n        context,\n        sourceId,\n        requireBaseResult(await base(context)),\n      );\n''',
          )

          family = Path('apps/worker/src/adaptive-sprite-family-handlers.ts')
          replace_once(
              family,
              '''import {\n  PermanentRuntimeError,\n  type RuntimeJobHandler,\n} from "@evavo/art-runtime";\n''',
              '''import {\n  PermanentRuntimeError,\n  type RuntimeHandlerResult,\n  type RuntimeJobHandler,\n} from "@evavo/art-runtime";\n''',
          )
          replace_once(
              family,
              '''function adaptiveRequired(\n  manifest: ReturnType<typeof validateSpriteFamilyManifest>,\n): boolean {\n''',
              '''function requireBaseResult(\n  value: RuntimeHandlerResult | void,\n): RuntimeHandlerResult {\n  if (!value) {\n    throw new PermanentRuntimeError(\n      "ADAPTIVE_FAMILY_BASE_RESULT_MISSING",\n      "The base sprite-family verifier returned no result.",\n    );\n  }\n  return value;\n}\n\nfunction adaptiveRequired(\n  manifest: ReturnType<typeof validateSpriteFamilyManifest>,\n): boolean {\n''',
          )
          replace_once(
              family,
              '''    const baseResult = await base(context);\n    const proofArtifactIds = [\n''',
              '''    const baseResult = requireBaseResult(await base(context));\n    const baseOutputArtifacts = baseResult.outputArtifacts ?? [];\n    const proofArtifactIds = [\n''',
          )
          replace_once(
              family,
              '''      baseOutputArtifactIds: baseResult.outputArtifacts,\n''',
              '''      baseOutputArtifactIds: baseOutputArtifacts,\n''',
          )
          replace_once(
              family,
              '''            ...baseResult.outputArtifacts,\n''',
              '''            ...baseOutputArtifacts,\n''',
          )
          replace_once(
              family,
              '''      outputArtifacts: [...baseResult.outputArtifacts, evidence.artifactId],\n''',
              '''      outputArtifacts: [...baseOutputArtifacts, evidence.artifactId],\n''',
          )
          PY
          git diff --check
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'PATHS'
          apps/worker/src/adaptive-finalizer-guarded-handlers.ts
          apps/worker/src/adaptive-sprite-family-handlers.ts
          packages/sprite-supervisor/src/automatic-compiler.ts
          PATHS
          sort "${RUNNER_TEMP}/expected-paths.txt" -o "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run worker and Book Art provider runtime regressions
        run: pnpm --filter @evavo/art-studio-worker test

      - name: Commit source-only repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --check
          git diff --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'PATHS'
          apps/worker/src/adaptive-finalizer-guarded-handlers.ts
          apps/worker/src/adaptive-sprite-family-handlers.ts
          packages/sprite-supervisor/src/automatic-compiler.ts
          PATHS
          sort "${RUNNER_TEMP}/expected-paths.txt" -o "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"
          git add \
            apps/worker/src/adaptive-finalizer-guarded-handlers.ts \
            apps/worker/src/adaptive-sprite-family-handlers.ts \
            packages/sprite-supervisor/src/automatic-compiler.ts
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^M  \|^A  ' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): harden strict handler and sprite typing'
          git push origin HEAD:refs/heads/agent/book-art-provider-runtime-20260802
