name: Inventory Top Hat And Avatar Artifacts

on:
  push:
    branches:
      - agent/top-hat-real-provider-execution
    paths:
      - "config/production/top-hat-artifact-inventory-trigger-v1.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: inventory-top-hat-avatar-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact inventory revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Inventory bounded Top Hat and avatar workflow artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INVENTORY_PATH: artifacts/top-hat-man/provider-campaign-r2/repository-artifact-inventory.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const inventoryPath = process.env.INVENTORY_PATH;
          if (!repository || !token || !inventoryPath) {
            throw new Error('Artifact inventory environment is incomplete.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'evavo-avatar-artifact-inventory',
          };
          const matching = [];
          let scanned = 0;
          for (let page = 1; page <= 20; page += 1) {
            const response = await fetch(
              `https://api.github.com/repos/${repository}/actions/artifacts?per_page=100&page=${page}`,
              { headers },
            );
            if (!response.ok) {
              throw new Error(`Artifact page ${page} failed with ${response.status}.`);
            }
            const document = await response.json();
            const artifacts = Array.isArray(document.artifacts) ? document.artifacts : [];
            scanned += artifacts.length;
            for (const artifact of artifacts) {
              const name = String(artifact.name ?? '');
              const normalized = name.toLowerCase();
              if (
                !normalized.includes('top-hat') &&
                !normalized.includes('avatar') &&
                !normalized.includes('council') &&
                !normalized.includes('eva')
              ) continue;
              matching.push({
                id: artifact.id,
                name,
                sizeInBytes: artifact.size_in_bytes,
                expired: Boolean(artifact.expired),
                createdAt: artifact.created_at,
                updatedAt: artifact.updated_at,
                expiresAt: artifact.expires_at,
                digest: artifact.digest ?? null,
                workflowRun:
                  artifact.workflow_run == null
                    ? null
                    : {
                        id: artifact.workflow_run.id,
                        repositoryId: artifact.workflow_run.repository_id,
                        headRepositoryId: artifact.workflow_run.head_repository_id,
                        headBranch: artifact.workflow_run.head_branch,
                        headSha: artifact.workflow_run.head_sha,
                      },
              });
            }
            if (artifacts.length < 100) break;
          }
          matching.sort((left, right) => {
            const time = Date.parse(right.createdAt) - Date.parse(left.createdAt);
            return time || Number(right.id) - Number(left.id);
          });
          const inventory = {
            schema: 'evavo.project-art-avatar-actions-artifact-inventory.v1',
            generatedAt: new Date().toISOString(),
            repository,
            scannedArtifactCount: scanned,
            matchingArtifactCount: matching.length,
            unexpiredMatchingArtifactCount: matching.filter((artifact) => !artifact.expired).length,
            artifacts: matching,
            candidateApproval: false,
            publication: false,
            runtimeActivation: false,
          };
          mkdirSync(path.dirname(inventoryPath), { recursive: true });
          writeFileSync(inventoryPath, `${JSON.stringify(inventory, null, 2)}\n`, {
            encoding: 'utf8',
            mode: 0o600,
          });
          NODE

      - name: Publish bounded artifact inventory to execution branch
        shell: bash
        env:
          INVENTORY_PATH: artifacts/top-hat-man/provider-campaign-r2/repository-artifact-inventory.json
          TARGET_BRANCH: agent/top-hat-real-provider-execution
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          git config user.name "EVAVO Artifact Inventory"
          git config user.email "evavo.studio@gmail.com"
          git add -- "${INVENTORY_PATH}"
          git commit -m "chore(top-hat): record avatar artifact inventory"
          git push origin "HEAD:${TARGET_BRANCH}"
