name: Repository toolchain authority

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements-image-pipeline.txt"
      - "evavo.reliability.json"
      - "schemas/repository-owned-reliability-profile.schema.json"
      - "scripts/check-repository-toolchain.mjs"
      - "scripts/test-repository-toolchain.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/repository-toolchain-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-toolchain-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs
      - name: Run adversarial toolchain fixtures
        run: node scripts/test-repository-toolchain.mjs
      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
