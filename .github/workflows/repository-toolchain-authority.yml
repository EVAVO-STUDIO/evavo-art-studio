name: Repository toolchain authority

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements-image-pipeline.txt"
      - "evavo.reliability.json"
      - "schemas/repository-owned-reliability-profile.schema.json"
      - "scripts/check-repository-toolchain.mjs"
      - "scripts/test-repository-toolchain.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/repository-toolchain-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-toolchain-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs
      - name: Run adversarial toolchain fixtures
        run: node scripts/test-repository-toolchain.mjs
      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
