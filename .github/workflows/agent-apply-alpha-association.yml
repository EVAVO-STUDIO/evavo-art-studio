name: Agent apply alpha association integration

on:
  push:
    branches:
      - agent/explicit-alpha-association
    paths:
      - agent-patches/explicit-alpha-association.patch
      - .github/workflows/agent-apply-alpha-association.yml

permissions:
  contents: write

concurrency:
  group: agent-alpha-association-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor == 'EVAVO-STUDIO'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"

      - name: Install exact image backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Apply, validate and publish integration commit
        shell: bash
        env:
          PATCH_PATH: agent-patches/explicit-alpha-association.patch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/explicit-alpha-association"
          git apply --check --whitespace=error-all "${PATCH_PATH}"
          git apply --whitespace=error-all "${PATCH_PATH}"
          rm "${PATCH_PATH}" .github/workflows/agent-apply-alpha-association.yml

          python -m compileall -q \
            tools/run_project_art_sandbox.py \
            tools/project_art_atlas_execution.py \
            scripts/test_project_art_alpha_association.py \
            scripts/test_project_art_atlas_alpha_bleed.py
          python -m unittest \
            scripts.test_project_art_alpha_association \
            scripts.test_project_art_atlas_alpha_bleed \
            -v
          node scripts/check-project-art-workbench.mjs
          git diff --check

          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          git commit -m "feat(project-art): add explicit alpha association"
          git push origin "HEAD:${GITHUB_REF_NAME}"
