name: Critical Media Runtime

on:
  push:
    branches:
      - main
      - agent/critical-media-runtime-gate-20260804
    paths: &critical_media_paths
      - ".github/workflows/critical-media-runtime.yml"
      - "apps/worker/src/sprite-supervisor-guarded-handlers.ts"
      - "apps/worker/src/sprite-supervisor-handlers.ts"
      - "apps/worker/test/sprite-supervisor-continuation-recovery.test.mjs"
      - "apps/worker/test/sprite-supervisor-runtime.test.mjs"
      - "packages/sprite-supervisor/**"
      - "packages/runtime/**"
      - "packages/artifacts/**"
      - "packages/delivery-optimizer/**"
      - "packages/media/**"
      - "docs/restart-safe-sprite-supervisor-continuations.md"
      - "docs/critical-media-runtime-validation.md"
  pull_request:
    paths: *critical_media_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-media-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install review-first dependencies
        run: pnpm install --frozen-lockfile

      - name: Build critical dependency closures
        run: |
          pnpm --filter @evavo/art-studio-worker... build
          pnpm --filter @evavo/art-delivery-optimizer... build

      - name: Typecheck orchestration and delivery boundaries
        run: |
          pnpm --filter @evavo/art-sprite-supervisor typecheck
          pnpm --filter @evavo/art-studio-worker typecheck
          pnpm --filter @evavo/art-delivery-optimizer typecheck

      - name: Run sprite supervisor contract and scheduling tests
        run: pnpm --filter @evavo/art-sprite-supervisor test

      - name: Run continuation recovery and closed-loop runtime attacks
        run: >-
          node --test
          apps/worker/test/sprite-supervisor-continuation-recovery.test.mjs
          apps/worker/test/sprite-supervisor-runtime.test.mjs

      - name: Run complete delivery optimizer suite
        run: pnpm --filter @evavo/art-delivery-optimizer test

      - name: Prove exact source remains clean
        shell: bash
        run: |
          set -euo pipefail
          find packages apps -type d -name dist -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Write bounded validation receipt
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const receipt = {
            schemaVersion: "1.0",
            receiptType: "evavo-critical-media-runtime-validation",
            repository: "EVAVO-STUDIO/evavo-art-studio",
            commitSha: process.env.VALIDATED_SHA,
            workflowRunId: process.env.VALIDATION_RUN_ID,
            workflowRunAttempt: process.env.VALIDATION_ATTEMPT,
            ref: process.env.VALIDATION_REF,
            toolchain: { node: "22.14.0", pnpm: "10.13.1" },
            verified: [
              "sprite-supervisor-build",
              "sprite-supervisor-strict-typecheck",
              "worker-build",
              "worker-strict-typecheck",
              "restart-safe-continuation-attacks",
              "closed-loop-supervisor-attacks",
              "delivery-optimizer-build",
              "delivery-optimizer-strict-typecheck",
              "delivery-optimizer-complete-tests",
              "clean-exact-source"
            ],
            providerCalled: false,
            candidatePixelsMutatedByValidation: false,
            selectionPerformed: false,
            promotionPerformed: false,
            deploymentPerformed: false,
            publicationPerformed: false
          };
          fs.writeFileSync(
            "/tmp/evavo-critical-media-runtime-validation.json",
            `${JSON.stringify(receipt, null, 2)}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Upload bounded validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-media-runtime-${{ github.sha }}
          path: /tmp/evavo-critical-media-runtime-validation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
