name: Artifact descriptor integrity

on:
  pull_request:
    paths:
      - "packages/artifacts/src/local-store.ts"
      - "packages/artifacts/test/descriptor-integrity-security.test.mjs"
      - "packages/artifacts/test/descriptor-input-integrity-security.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/artifact-descriptor-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "packages/artifacts/src/local-store.ts"
      - "packages/artifacts/test/descriptor-integrity-security.test.mjs"
      - "packages/artifacts/test/descriptor-input-integrity-security.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/artifact-descriptor-integrity.yml"

permissions:
  contents: read

concurrency:
  group: artifact-descriptor-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check artifact persistence
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-artifacts typecheck

      - name: Run artifact persistence and hostile descriptor regressions
        run: >-
          node --test
          packages/artifacts/test/artifacts.test.mjs
          packages/artifacts/test/json-canonicalization-security.test.mjs
          packages/artifacts/test/descriptor-integrity-security.test.mjs
          packages/artifacts/test/descriptor-input-integrity-security.test.mjs

      - name: Verify permanent descriptor-integrity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'snapshotDescriptorInput' packages/artifacts/src/local-store.ts
          grep -F 'ARTIFACT_DESCRIPTOR_INPUT_INVALID' packages/artifacts/src/local-store.ts
          grep -F 'const metadataInput = snapshot.metadata' packages/artifacts/src/local-store.ts
          grep -F 'parseDescriptorText' packages/artifacts/src/local-store.ts
          grep -F 'Artifact descriptor artifactId does not match its body.' packages/artifacts/src/local-store.ts
          grep -F 'Artifact descriptor contains a non-canonical storage path.' packages/artifacts/src/local-store.ts
          grep -F 'contentObjectRelativePath(descriptor.contentHash)' packages/artifacts/src/local-store.ts
          grep -F 'artifact descriptor inputs are snapshotted once before validation and hashing' packages/artifacts/test/descriptor-input-integrity-security.test.mjs
          grep -F 'hostile artifact descriptor input access fails closed without leaking errors' packages/artifacts/test/descriptor-input-integrity-security.test.mjs
          grep -F 'tampered artifact descriptors cannot redirect reads outside canonical storage' packages/artifacts/test/descriptor-integrity-security.test.mjs
          grep -F 'stored descriptors fail closed on identity, digest, path and shape tampering' packages/artifacts/test/descriptor-integrity-security.test.mjs
          grep -F 'artifact descriptors are returned as deeply immutable canonical data' packages/artifacts/test/descriptor-integrity-security.test.mjs
          ! grep -F 'STORAGE_CLASSES.has(input.storageClass)' packages/artifacts/src/local-store.ts
          ! grep -F 'path.join(await this.root(), descriptor.objectRelativePath)' packages/artifacts/src/local-store.ts

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
