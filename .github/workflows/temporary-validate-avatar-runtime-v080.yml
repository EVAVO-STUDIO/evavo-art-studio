name: Temporary validate avatar runtime v0.8.0

on:
  push:
    branches:
      - automation/validate-avatar-runtime-v080-20260811
    paths:
      - ".github/workflows/temporary-validate-avatar-runtime-v080.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validation host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Download exact private avatar-runtime candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AVATAR_SHA: e2282de90eba62271b85f19cf9e7a98bf31dfdd6
        run: |
          set -euo pipefail
          mkdir -p /tmp/avatar-runtime
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/EVAVO-STUDIO/evavo-avatar-runtime/tarball/${AVATAR_SHA}" \
            --output /tmp/avatar-runtime.tar.gz
          tar -xzf /tmp/avatar-runtime.tar.gz --strip-components=1 -C /tmp/avatar-runtime
          test "$(node -p "require('/tmp/avatar-runtime/package.json').version")" = "0.8.0"

      - name: Validate exact avatar-runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/avatar-runtime
          node --check src/art-studio-producer.js
          node --check tests/art-studio-producer.test.mjs
          node --check scripts/check-art-studio-producer.mjs
          node --check scripts/check-runtime.mjs
          node --test tests/art-studio-producer.test.mjs
          node scripts/check-art-studio-producer.mjs
          node scripts/check-runtime.mjs
          npm test
          npm run check
          npm pack --dry-run --json > /tmp/avatar-runtime-pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('/tmp/avatar-runtime-pack.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1) throw new Error('npm pack dry-run result is invalid');
          const files = result[0].files.map((entry) => entry.path);
          if (files.some((file) => file.startsWith('assets/'))) throw new Error('raw assets entered npm package');
          if (!files.includes('src/art-studio-producer.js')) throw new Error('Art Studio producer is missing from package');
          NODE
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' README.md docs package.json scripts src tests; then
            echo 'conflict marker found' >&2
            exit 1
          fi
          if grep -RIn $'\r' README.md docs package.json scripts src tests; then
            echo 'CRLF source found' >&2
            exit 1
          fi
          if grep -RInE '[[:blank:]]+$' README.md docs package.json scripts src tests; then
            echo 'trailing whitespace found' >&2
            exit 1
          fi

      - name: Write validation receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const receipt = {
            schema: 'evavo.avatar-runtime-external-validation.v1',
            repository: 'EVAVO-STUDIO/evavo-avatar-runtime',
            candidateSha: 'e2282de90eba62271b85f19cf9e7a98bf31dfdd6',
            packageVersion: '0.8.0',
            artStudioCommit: '570ca03bbd68d66a49b41eb3ab6e9352fd38512e',
            artStudioValidationRunId: 31498231936,
            artStudioValidationArtifactSha256: 'e1006ddc60e016371576ed218f13f5f66f1ccf802a8905780024f20c87e5862b',
            checks: {
              syntax: 'passed',
              focusedProducerTests: 'passed',
              producerGuard: 'passed',
              runtimeGuard: 'passed',
              completeTests: 'passed',
              completeCheck: 'passed',
              packageDryRun: 'passed',
              rawAssetsExcluded: true,
              textIntegrity: 'passed'
            },
            providerExecution: false,
            storageMutation: false,
            repositoryMutation: false,
            deployment: false,
            publication: false,
            forcePush: false
          };
          const canonical = JSON.stringify(receipt);
          receipt.receiptSha256 = crypto.createHash('sha256').update(canonical).digest('hex');
          fs.writeFileSync('/tmp/avatar-runtime-validation.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: avatar-runtime-v080-validation-e2282de90eba62271b85f19cf9e7a98bf31dfdd6
          path: /tmp/avatar-runtime-validation.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary workflow from validation branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-validate-avatar-runtime-v080.yml
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add .github/workflows/temporary-validate-avatar-runtime-v080.yml
          git commit -m "chore: remove temporary avatar runtime validator"
          git push origin HEAD:automation/validate-avatar-runtime-v080-20260811
