name: EVA dense-motion Runtime admission handoff

on:
  pull_request:
    paths:
      - "scripts/project-art/eva-dense-motion-runtime-admission-handoff.mjs"
      - "scripts/run-project-art-eva-dense-motion-runtime-admission-handoff.mjs"
      - "scripts/test-project-art-eva-dense-motion-runtime-admission-handoff.mjs"
      - "scripts/project-art/eva-dense-motion-release-evidence.mjs"
      - "scripts/project-art/eva-dense-motion-alpha-mastering.mjs"
      - "scripts/project-art/eva-dense-motion-identity-continuity.mjs"
      - ".github/workflows/eva-dense-motion-runtime-admission-handoff.yml"
  push:
    branches: [main]
    paths:
      - "scripts/project-art/eva-dense-motion-runtime-admission-handoff.mjs"
      - "scripts/run-project-art-eva-dense-motion-runtime-admission-handoff.mjs"
      - "scripts/test-project-art-eva-dense-motion-runtime-admission-handoff.mjs"
      - "scripts/project-art/eva-dense-motion-release-evidence.mjs"
      - "scripts/project-art/eva-dense-motion-alpha-mastering.mjs"
      - "scripts/project-art/eva-dense-motion-identity-continuity.mjs"
      - ".github/workflows/eva-dense-motion-runtime-admission-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-runtime-admission-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use governed Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Syntax check handoff surface
        run: |
          node --check scripts/project-art/eva-dense-motion-runtime-admission-handoff.mjs
          node --check scripts/run-project-art-eva-dense-motion-runtime-admission-handoff.mjs
          node --check scripts/test-project-art-eva-dense-motion-runtime-admission-handoff.mjs

      - name: Run handoff guard
        run: node scripts/test-project-art-eva-dense-motion-runtime-admission-handoff.mjs

      - name: Import CLI without execution
        run: node -e "import('./scripts/run-project-art-eva-dense-motion-runtime-admission-handoff.mjs')"

      - name: Prove validation leaves source clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
