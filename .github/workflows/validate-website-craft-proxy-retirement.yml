name: Validate exact Website craft proxy hardening

on:
  push:
    branches:
      - validation/website-craft-proxy-hardening-20260805
    paths:
      - ".github/workflows/validate-website-craft-proxy-retirement.yml"
      - ".validation/website-craft-proxy/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-website-craft-proxy-retirement.yml"
      - ".validation/website-craft-proxy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-website-craft-proxy-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prove 14 exact Website Git blobs and retired-source absence
        run: node .validation/website-craft-proxy/verify-exact-blobs.mjs

      - name: Install validation-only compiler and runtime
        run: >-
          npm install --prefix .validation/website-craft-proxy
          --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Compile exact stream client route and permanent attacks
        run: >-
          .validation/website-craft-proxy/node_modules/.bin/tsc
          -p .validation/website-craft-proxy/tsconfig.json

      - name: Run exact streamed transport fingerprint and authority attacks
        run: >-
          .validation/website-craft-proxy/node_modules/.bin/tsx
          .validation/website-craft-proxy/tools/evavo-doc-studio/scripts/check-book-studio-craft-provider-contract.ts

      - name: Run exact public-route streaming and compatibility attacks
        env:
          TSX_TSCONFIG_PATH: .validation/website-craft-proxy/tsconfig.json
        run: >-
          .validation/website-craft-proxy/node_modules/.bin/tsx
          .validation/website-craft-proxy/tools/evavo-doc-studio/scripts/check-book-studio-craft-proxy-route.ts

      - name: Run retained executable route regression test
        env:
          TSX_TSCONFIG_PATH: .validation/website-craft-proxy/tsconfig.json
        run: >-
          .validation/website-craft-proxy/node_modules/.bin/tsx --test
          .validation/website-craft-proxy/tools/evavo-doc-studio/test/website-craft-proxy-route.test.ts

      - name: Run exact repository-wide retirement and hardening scanner
        working-directory: .validation/website-craft-proxy/tools/evavo-doc-studio
        run: ../../node_modules/.bin/tsx scripts/check-book-studio-craft-genome.ts

      - name: Verify no Art Studio production source changed
        shell: bash
        run: |
          set -euo pipefail
          base="57e0623d7de840ec1523cbba271b77595a432661"
          git fetch --no-tags --depth=1 origin "$base"
          unexpected="$(git diff --name-only "$base" HEAD | grep -Ev '^(\.github/workflows/validate-website-craft-proxy-retirement\.yml|\.validation/website-craft-proxy/)' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Write bounded validation receipt
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/website-craft-proxy-hardening-validation.json" <<JSON
          {
            "status": "PASS",
            "websiteRepository": "EVAVO-STUDIO/Website",
            "websiteBase": "9a39372a5d3ee63bf12f1c766828bb38b4d1645f",
            "websiteHead": "af19c0fc7b650319b058c751f0d35c11bdc9882d",
            "mirrorRepository": "EVAVO-STUDIO/evavo-art-studio",
            "mirrorHead": "${GITHUB_SHA}",
            "exactGitBlobs": 14,
            "retiredLocalRuntimeFilesAbsent": 9,
            "strictTypeScript": true,
            "streamedRequestAndResponseLimits": true,
            "strictUtf8": true,
            "originOnlyConfiguration": true,
            "controlCharacterFreeToken": true,
            "remoteValidationStatusPreserved": true,
            "transportFingerprintAndAuthorityAttacks": true,
            "publicRouteStreamingAttacks": true,
            "retainedRouteRegressionTest": true,
            "repositoryWideHiddenReferenceScan": true,
            "artStudioProductionSourceChanged": false,
            "providerCalled": false,
            "canonicalManuscriptMutationPerformed": false,
            "automaticCanonicalAdmissionAllowed": false,
            "publicationPerformed": false
          }
          JSON
          cat "$RUNNER_TEMP/website-craft-proxy-hardening-validation.json"

      - name: Prove clean tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
