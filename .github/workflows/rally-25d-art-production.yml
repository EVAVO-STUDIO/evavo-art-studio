name: Rally 2.5D Art Production Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-25d-art-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate rally art profile, Falcon and forest jobs, program and handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify all game-art production profiles
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/profile-cli.mjs verify \
            | tee /tmp/game-art-profile-verification.json
          grep -F '"status": "passed"' \
            /tmp/game-art-profile-verification.json
          grep -F '"projectId": "isometric-rally-1990s"' \
            /tmp/game-art-profile-verification.json

      - name: Run Rally 2.5D handoff, program, Falcon and forest tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/game-art-production/rally-25d-handoff.test.mjs \
            scripts/game-art-production/rally-25d-program.test.mjs \
            scripts/game-art-production/rally-25d-falcon-jobs.test.mjs \
            scripts/game-art-production/rally-25d-forest-jobs.test.mjs \
            | tee /tmp/rally-25d-art-tests.log

      - name: Compile representative vehicle handoff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-handoff.mjs \
            vehicle \
            falcon-rally \
            falcon-rally-production-v1 \
            "Create the canonical player rally car with readable suspension, detachable damage parts and premium 1990s isometric arcade styling." \
            > /tmp/falcon-rally-art-handoff.json
          grep -F '"schema": "evavo.rally-art-handoff.v1"' \
            /tmp/falcon-rally-art-handoff.json
          grep -F '"sourceProductionProtocolVersion": "2026-08-14.2"' \
            /tmp/falcon-rally-art-handoff.json
          grep -F '"compilerProfile": "rally-vehicle-rig-v1"' \
            /tmp/falcon-rally-art-handoff.json
          grep -F '"automaticPromotion": false' \
            /tmp/falcon-rally-art-handoff.json

      - name: Compile and verify Falcon one-image provider session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-falcon-jobs.mjs compile \
            config/game-art-production/vehicles/falcon-rally-production-v1.json \
            --output /tmp/falcon-rally.provider-session.json \
            > /tmp/falcon-rally.provider-session.stdout.json
          node scripts/game-art-production/rally-25d-falcon-jobs.mjs verify \
            /tmp/falcon-rally.provider-session.json \
            | tee /tmp/falcon-rally.provider-session.verify.json
          grep -F '"schema": "evavo.rally-falcon-provider-job-session.v1"' \
            /tmp/falcon-rally.provider-session.json
          grep -F '"jobs": 12' \
            /tmp/falcon-rally.provider-session.json
          grep -F '"providerExecution": false' \
            /tmp/falcon-rally.provider-session.json

      - name: Compile and verify forest-stage one-image provider session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-forest-jobs.mjs compile \
            config/game-art-production/environments/forest-stage-production-v1.json \
            --output /tmp/forest-stage.provider-session.json \
            > /tmp/forest-stage.provider-session.stdout.json
          node scripts/game-art-production/rally-25d-forest-jobs.mjs verify \
            /tmp/forest-stage.provider-session.json \
            | tee /tmp/forest-stage.provider-session.verify.json
          grep -F '"schema": "evavo.rally-forest-provider-job-session.v1"' \
            /tmp/forest-stage.provider-session.json
          grep -F '"jobs": 14' \
            /tmp/forest-stage.provider-session.json
          grep -F '"images": 14' \
            /tmp/forest-stage.provider-session.json
          grep -F '"materialJobs": 4' \
            /tmp/forest-stage.provider-session.json
          grep -F '"foliageJobs": 3' \
            /tmp/forest-stage.provider-session.json
          grep -F '"providerExecution": false' \
            /tmp/forest-stage.provider-session.json
          grep -F '"downstream3DReady": false' \
            /tmp/forest-stage.provider-session.json

      - name: Compile and verify playable vertical-slice program
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-program.mjs compile \
            config/game-art-production/programs/rally-vertical-slice.v1.json \
            --output /tmp/rally-vertical-slice.art-program.json \
            > /tmp/rally-vertical-slice.art-program.stdout.json
          node scripts/game-art-production/rally-25d-program.mjs verify \
            /tmp/rally-vertical-slice.art-program.json \
            | tee /tmp/rally-vertical-slice.art-program.verify.json
          grep -F '"schema": "evavo.rally-art-program.v1"' \
            /tmp/rally-vertical-slice.art-program.json
          grep -F '"assets": 13' \
            /tmp/rally-vertical-slice.art-program.json
          grep -F '"status": "awaiting-art-production"' \
            /tmp/rally-vertical-slice.art-program.json
          grep -F '"downstreamProductionReady": false' \
            /tmp/rally-vertical-slice.art-program.json
          grep -F '"providerExecution": false' \
            /tmp/rally-vertical-slice.art-program.json

      - name: Prove validation leaves source clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rally-25d-art-production-${{ github.sha }}
          path: |
            /tmp/game-art-profile-verification.json
            /tmp/rally-25d-art-tests.log
            /tmp/falcon-rally-art-handoff.json
            /tmp/falcon-rally.provider-session.json
            /tmp/falcon-rally.provider-session.verify.json
            /tmp/forest-stage.provider-session.json
            /tmp/forest-stage.provider-session.verify.json
            /tmp/rally-vertical-slice.art-program.json
            /tmp/rally-vertical-slice.art-program.verify.json
          if-no-files-found: warn
          retention-days: 7
