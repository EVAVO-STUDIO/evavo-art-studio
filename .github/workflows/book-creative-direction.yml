name: Book Creative Direction

on:
  push:
    branches:
      - main
      - agent/book-creative-direction-runtime-20260807
    paths: &book_creative_direction_paths
      - ".github/workflows/book-creative-direction.yml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "package.json"
      - "packages/contracts/src/book-creative-direction*.ts"
      - "packages/contracts/src/index.ts"
      - "packages/contracts/test/book-creative-direction.test.mjs"
      - "packages/book-art-runtime/package.json"
      - "packages/book-art-runtime/src/creative-candidate-programme*.ts"
      - "packages/book-art-runtime/test/creative-candidate-programme*.test.mjs"
      - "apps/mcp/src/book-creative-direction-tools.ts"
      - "apps/mcp/src/index.ts"
      - "apps/mcp/test/book-creative-direction-tools-contract.test.mjs"
      - "scripts/check-book-creative-direction.mjs"
      - "docs/book-creative-direction.md"
  pull_request:
    branches: [main]
    paths: *book_creative_direction_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-creative-direction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install FFmpeg media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Verify permanent creative boundary
        run: node scripts/check-book-creative-direction.mjs

      - name: Run contracts tests
        run: pnpm --filter @evavo/art-contracts test

      - name: Run strict contracts typecheck
        run: pnpm --filter @evavo/art-contracts typecheck

      - name: Verify MCP creative-direction boundary
        run: node --test apps/mcp/test/book-creative-direction-tools-contract.test.mjs

      - name: Run complete Art Studio verification
        run: pnpm check

      - name: Re-run focused route-aware runtime attacks
        run: node --test packages/book-art-runtime/test/creative-candidate-programme*.test.mjs

      - name: Prove clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
