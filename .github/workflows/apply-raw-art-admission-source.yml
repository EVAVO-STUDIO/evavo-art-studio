name: Apply exact RAW ART admission source

on:
  push:
    branches:
      - agent/raw-art-runtime-admission-20260809
    paths:
      - ".automation/raw-art-admission-source.mjs.gz.b64"
      - ".github/workflows/apply-raw-art-admission-source.yml"

permissions:
  contents: write

concurrency:
  group: apply-raw-art-admission-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact carrier commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Materialise, verify, commit, and remove carrier
        shell: bash
        env:
          EXPECTED_BRANCH: agent/raw-art-runtime-admission-20260809
          EXPECTED_PARENT: 55aff3fce96e25a90021396235334c3f7099db77
          EXPECTED_PAYLOAD_SHA256: 1663cce84e6e67d03230586b39fe930fbe187cbbaf99464c5cfbf57054509ea9
          EXPECTED_SOURCE_BLOB: e6c444cee28f5726b4d623b5520ec6905ff015ec
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(sha256sum .automation/raw-art-admission-source.mjs.gz.b64 | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"

          mkdir -p scripts/raw-art-provider
          base64 --decode .automation/raw-art-admission-source.mjs.gz.b64 \
            | gzip --decompress \
            > scripts/raw-art-provider/admission.mjs.tmp
          test "$(git hash-object scripts/raw-art-provider/admission.mjs.tmp)" = "$EXPECTED_SOURCE_BLOB"
          mv scripts/raw-art-provider/admission.mjs.tmp scripts/raw-art-provider/admission.mjs

          rm .automation/raw-art-admission-source.mjs.gz.b64
          rmdir .automation
          rm .github/workflows/apply-raw-art-admission-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            ".automation/raw-art-admission-source.mjs.gz.b64"
            ".github/workflows/apply-raw-art-admission-source.yml"
            "scripts/raw-art-provider/admission.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!changed[@]}"; do
            test "${changed[$index]}" = "${expected_sorted[$index]}"
          done

          git commit -m "feat(raw-art): admit exact runtime selections"
          test "$(git hash-object scripts/raw-art-provider/admission.mjs)" = "$EXPECTED_SOURCE_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$GITHUB_REF_NAME"
