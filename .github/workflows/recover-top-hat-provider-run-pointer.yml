name: Recover Top Hat Provider Run Pointer

on:
  push:
    branches:
      - agent/top-hat-real-provider-execution
    paths:
      - "config/production/top-hat-provider-recovery-trigger-v1.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-top-hat-provider-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact recovery revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Recover exact provider run and artifact identifiers
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_HEAD_SHA: cf9cf37737566aec9db3fb6338f1221feb20e932
          TARGET_WORKFLOW_NAME: Project Art Top Hat Real Provider Campaign
          POINTER_PATH: artifacts/top-hat-man/provider-campaign-r3/recovered-run-pointer.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const targetHeadSha = process.env.TARGET_HEAD_SHA;
          const targetWorkflowName = process.env.TARGET_WORKFLOW_NAME;
          const pointerPath = process.env.POINTER_PATH;
          if (!repository || !token || !targetHeadSha || !targetWorkflowName || !pointerPath) {
            throw new Error('Recovery environment is incomplete.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'evavo-top-hat-run-recovery',
          };
          const runsUrl = `https://api.github.com/repos/${repository}/actions/runs?head_sha=${encodeURIComponent(targetHeadSha)}&event=push&per_page=100`;
          const runsResponse = await fetch(runsUrl, { headers });
          if (!runsResponse.ok) {
            throw new Error(`Workflow-run lookup failed with ${runsResponse.status}.`);
          }
          const runsDocument = await runsResponse.json();
          const runs = Array.isArray(runsDocument.workflow_runs)
            ? runsDocument.workflow_runs
            : [];
          const matchingRuns = runs
            .filter((run) => run.head_sha === targetHeadSha && run.name === targetWorkflowName)
            .sort((left, right) => Number(right.id) - Number(left.id));
          const run = matchingRuns[0] ?? null;

          let artifacts = [];
          if (run !== null) {
            const artifactsResponse = await fetch(
              `https://api.github.com/repos/${repository}/actions/runs/${run.id}/artifacts?per_page=100`,
              { headers },
            );
            if (!artifactsResponse.ok) {
              throw new Error(`Artifact lookup failed with ${artifactsResponse.status}.`);
            }
            const artifactsDocument = await artifactsResponse.json();
            artifacts = Array.isArray(artifactsDocument.artifacts)
              ? artifactsDocument.artifacts.map((artifact) => ({
                  id: artifact.id,
                  name: artifact.name,
                  sizeInBytes: artifact.size_in_bytes,
                  expired: artifact.expired,
                  createdAt: artifact.created_at,
                  expiresAt: artifact.expires_at,
                  digest: artifact.digest ?? null,
                }))
              : [];
          }

          const pointer = {
            schema: 'evavo.project-art-top-hat-provider-run-pointer.v1',
            recoveredAt: new Date().toISOString(),
            repository,
            targetHeadSha,
            targetWorkflowName,
            status: run === null ? 'run-not-found' : 'run-found',
            run:
              run === null
                ? null
                : {
                    id: run.id,
                    runNumber: run.run_number,
                    runAttempt: run.run_attempt,
                    event: run.event,
                    status: run.status,
                    conclusion: run.conclusion,
                    headBranch: run.head_branch,
                    headSha: run.head_sha,
                    createdAt: run.created_at,
                    updatedAt: run.updated_at,
                    htmlUrl: run.html_url,
                  },
            artifacts,
            candidateApproval: false,
            publication: false,
            runtimeActivation: false,
          };
          mkdirSync(path.dirname(pointerPath), { recursive: true });
          writeFileSync(pointerPath, `${JSON.stringify(pointer, null, 2)}\n`, {
            encoding: 'utf8',
            mode: 0o600,
          });
          NODE

      - name: Publish bounded recovery pointer to execution branch
        shell: bash
        env:
          POINTER_PATH: artifacts/top-hat-man/provider-campaign-r3/recovered-run-pointer.json
          TARGET_BRANCH: agent/top-hat-real-provider-execution
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          git config user.name "EVAVO Provider Run Recovery"
          git config user.email "evavo.studio@gmail.com"
          git add -- "${POINTER_PATH}"
          git commit -m "chore(top-hat): record Runtime-backed provider run pointer"
          git push origin "HEAD:${TARGET_BRANCH}"
