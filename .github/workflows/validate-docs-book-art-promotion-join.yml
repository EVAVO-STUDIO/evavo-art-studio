name: Validate Docs Suite Book Art Promotion Join

on:
  push:
    branches:
      - agent/validate-docs-book-art-promotion-join-20260802
    paths:
      - ".github/workflows/validate-docs-book-art-promotion-join.yml"
      - ".migration-validation/docs-core/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-docs-book-art-promotion-join.yml"
      - ".migration-validation/docs-core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-book-art-promotion-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use governed Node.js runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Prove exact Docs Suite Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-art-contracts.ts)" = "62e0e202d99779a49548852a996ea22a90d0e0c4"
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-art-legacy-compat.ts)" = "c4133a41e64adbb41dc3af615608b5245a8747e1"
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-legacy-art-use-import.ts)" = "5f86fb5897929e285d038de479b079b846cc4622"
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-legacy-art-use-safe.ts)" = "a3a2c161de711639376758d595a705465018243b"
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-legacy-art-use-boundary.ts)" = "d4b67407ae37c20c641ad57872a0a696e68e4f68"
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-legacy-art-use-batch.ts)" = "63072c770981f9e002a056dcea89975f86b2c85c"
          test "$(git hash-object .migration-validation/docs-core/src/book-studio-art-promotion-join.ts)" = "6f9155e4eb0402c97f11936b4934ee53829b4a0f"
          test "$(git hash-object .migration-validation/docs-core/src/index.ts)" = "42333403b5f4063dad96259727a04ddcb0d40d2c"
          test "$(git hash-object .migration-validation/docs-core/test/book-studio-art-promotion-join.test.mjs)" = "2706e423f163303db99d88bfbad6774a521fec8c"
      - name: Compile exact Docs Suite source with strict settings
        run: |
          npm exec --yes --package=typescript@5.9.3 -- tsc \
            --noEmit \
            --target ES2022 \
            --lib ES2022,DOM,DOM.Iterable \
            --module ESNext \
            --moduleResolution Bundler \
            --strict \
            --noUncheckedIndexedAccess \
            --exactOptionalPropertyTypes \
            --skipLibCheck \
            .migration-validation/docs-core/src/book-studio-art-contracts.ts \
            .migration-validation/docs-core/src/book-studio-art-legacy-compat.ts \
            .migration-validation/docs-core/src/book-studio-legacy-art-use-import.ts \
            .migration-validation/docs-core/src/book-studio-legacy-art-use-safe.ts \
            .migration-validation/docs-core/src/book-studio-legacy-art-use-boundary.ts \
            .migration-validation/docs-core/src/book-studio-legacy-art-use-batch.ts \
            .migration-validation/docs-core/src/book-studio-art-promotion-join.ts
      - name: Run exact promotion-chain attacks
        run: npm exec --yes --package=tsx@4.20.3 -- tsx --test .migration-validation/docs-core/test/book-studio-art-promotion-join.test.mjs
