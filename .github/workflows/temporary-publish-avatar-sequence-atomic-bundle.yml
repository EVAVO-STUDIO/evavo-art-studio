name: Temporary publish atomic avatar sequence bundle

on:
  push:
    branches:
      - agent/avatar-sequence-atomic-bundle-20260812
    paths:
      - ".github/avatar-sequence-bundle-payload/**"
      - ".github/workflows/temporary-publish-avatar-sequence-atomic-bundle.yml"

permissions:
  contents: write

concurrency:
  group: temporary-publish-avatar-sequence-atomic-bundle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Restore exact validated source patch
        shell: bash
        env:
          EXPECTED_BASE: e428304ce306703a95efe88b4e86eda589391bc9
          EXPECTED_ARCHIVE_SHA256: f0142923cf9937b07d4c9818a24f228cd80409ba3d25828a68354fdeb760607f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          cat .github/avatar-sequence-bundle-payload/part-* > "$RUNNER_TEMP/payload.b64"
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/avatar-sequence-atomic-bundle.tar.gz"
          echo "$EXPECTED_ARCHIVE_SHA256  $RUNNER_TEMP/avatar-sequence-atomic-bundle.tar.gz" | sha256sum --check --strict
          printf '%s\n' \
            '.github/workflows/project-art-avatar-sequence.yml' \
            'docs/PROJECT_ART_AVATAR_SEQUENCE_MASTERING.md' \
            'package.json' \
            'scripts/build-project-art-avatar-sequence-bundle.mjs' \
            'scripts/check-project-art-avatar-sequence.mjs' \
            'scripts/check-project-art-workbench.mjs' \
            'scripts/project-art/avatar-sequence-bundle.mjs' \
            'scripts/project-art/avatar-sequence-plan.mjs' \
            'scripts/test-project-art-avatar-sequence-bundle.mjs' \
            'scripts/test-project-art-avatar-sequence-mcp.mjs' \
            'scripts/verify-project-art-avatar-sequence-bundle.mjs' \
            'tools/project_art_avatar_sequence_mcp.mjs' > "$RUNNER_TEMP/expected-paths.txt"
          tar -tzf "$RUNNER_TEMP/avatar-sequence-atomic-bundle.tar.gz" | LC_ALL=C sort > "$RUNNER_TEMP/archive-paths.txt"
          LC_ALL=C sort "$RUNNER_TEMP/expected-paths.txt" > "$RUNNER_TEMP/expected-sorted.txt"
          diff -u "$RUNNER_TEMP/expected-sorted.txt" "$RUNNER_TEMP/archive-paths.txt"
          tar -xzf "$RUNNER_TEMP/avatar-sequence-atomic-bundle.tar.gz"
          rm -rf .github/avatar-sequence-bundle-payload
          rm .github/workflows/temporary-publish-avatar-sequence-atomic-bundle.yml
          rm -f .github/workflows/temporary-fix-avatar-sequence-bundle-publisher.yml
          git add -A
          git diff --cached --name-only "$EXPECTED_BASE" | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-sorted.txt" "$RUNNER_TEMP/actual-paths.txt"
          git reset

      - name: Run complete avatar sequence validation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-project-art-avatar-sequence-bundle.mjs
          node --check scripts/verify-project-art-avatar-sequence-bundle.mjs
          node --check scripts/project-art/avatar-sequence-plan.mjs
          node --check scripts/project-art/avatar-sequence-bundle.mjs
          node --check scripts/check-project-art-avatar-sequence.mjs
          node --check scripts/test-project-art-avatar-sequence-bundle.mjs
          node --check scripts/test-project-art-avatar-sequence-mcp.mjs
          node --check tools/project_art_avatar_sequence_mcp.mjs
          node scripts/check-project-art-avatar-sequence.mjs
          node scripts/test-project-art-avatar-sequence.mjs
          node scripts/test-project-art-avatar-sequence-bundle.mjs
          node scripts/test-project-art-avatar-sequence-mcp.mjs
          node scripts/check-project-art-loop-closure.mjs
          node scripts/test-project-art-loop-closure.mjs
          node scripts/check-project-art-workbench.mjs
          node scripts/test-project-art-workbench.mjs
          pnpm run project-art:avatar-sequence:check
          git diff --check

      - name: Commit and push the exact reviewed scope
        shell: bash
        env:
          EXPECTED_BASE: e428304ce306703a95efe88b4e86eda589391bc9
        run: |
          set -euo pipefail
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          printf '%s\n' \
            '.github/workflows/project-art-avatar-sequence.yml' \
            'docs/PROJECT_ART_AVATAR_SEQUENCE_MASTERING.md' \
            'package.json' \
            'scripts/build-project-art-avatar-sequence-bundle.mjs' \
            'scripts/check-project-art-avatar-sequence.mjs' \
            'scripts/check-project-art-workbench.mjs' \
            'scripts/project-art/avatar-sequence-bundle.mjs' \
            'scripts/project-art/avatar-sequence-plan.mjs' \
            'scripts/test-project-art-avatar-sequence-bundle.mjs' \
            'scripts/test-project-art-avatar-sequence-mcp.mjs' \
            'scripts/verify-project-art-avatar-sequence-bundle.mjs' \
            'tools/project_art_avatar_sequence_mcp.mjs' > "$RUNNER_TEMP/expected-paths.txt"
          LC_ALL=C sort "$RUNNER_TEMP/expected-paths.txt" > "$RUNNER_TEMP/expected-sorted.txt"
          git diff --cached --name-only "$EXPECTED_BASE" | LC_ALL=C sort > "$RUNNER_TEMP/staged-paths.txt"
          diff -u "$RUNNER_TEMP/expected-sorted.txt" "$RUNNER_TEMP/staged-paths.txt"
          git diff --cached --check
          git commit -m "feat(project-art): atomically materialize avatar sequence bundles" -m "Materialize one exact avatar-sequence mastering plan into a private, create-only staging directory containing the plan, path-only workspace handoff, inactive runtime draft, finalization requirements, one request per true loop, a content-addressed manifest, and a separately content-addressed receipt. Publish the complete evidence set through one atomic directory rename and independently verify every file, source identity, self-hash, authority boundary, and output path.\n\nExtend the bounded MCP surface with write and read-only verification tools, add focused tamper and stale-source adversaries, and bind the bundle chain into Project Art validation. No image generation, source mutation, workspace-copy application, loop approval, runtime activation, repository mutation, Git publication, deployment, or force push authority is introduced."
          git push origin HEAD:agent/avatar-sequence-atomic-bundle-20260812
