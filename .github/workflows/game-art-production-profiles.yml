name: Game Art Production Profiles

on:
  pull_request:
    paths:
      - "config/game-art-production/**"
      - "scripts/game-art-production/**"
      - "docs/GAME_ART_PRODUCTION_PROFILES.md"
      - ".github/workflows/game-art-production-profiles.yml"
  push:
    branches:
      - main
      - "codex/game-art-*"
      - "codex/hmf-*"
    paths:
      - "config/game-art-production/**"
      - "scripts/game-art-production/**"
      - "docs/GAME_ART_PRODUCTION_PROFILES.md"
      - ".github/workflows/game-art-production-profiles.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: game-art-production-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Check generic profile syntax
        run: |
          find scripts/game-art-production -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Run reusable profile, parity and extensibility tests
        run: |
          node --test scripts/game-art-production/profile-engine.test.mjs
      - name: Compile bounded verification evidence
        run: |
          node scripts/game-art-production/profile-cli.mjs verify > "$RUNNER_TEMP/game-art-production-profile-verification.json"
      - name: Prove source tree remains clean
        run: |
          git diff --exit-code
          STATUS="$(git status --porcelain=v1)"
          if [ -n "$STATUS" ]; then
            printf 'Unexpected validation byproducts:\n%s\n' "$STATUS" >&2
            exit 1
          fi
      - name: Upload compact profile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-art-production-profiles-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/game-art-production-profile-verification.json
