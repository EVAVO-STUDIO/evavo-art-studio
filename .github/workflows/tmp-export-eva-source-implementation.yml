name: Temporary EVA source implementation export

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-export-eva-source-implementation.yml"
      - "scripts/project-art/eva-dense-motion-source-materialization.mjs"
  push:
    branches:
      - agent/eva-source-integrity-follow-up

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Upload exact merged implementation fixture
        uses: actions/upload-artifact@v4
        with:
          name: eva-source-implementation-fixture
          path: |
            scripts/project-art/avatar-final-pass-provider-candidate-common.mjs
            scripts/project-art/eva-dense-motion-source-materialization.mjs
            scripts/project-art/eva-dense-motion-source-preflight.mjs
            scripts/project-art/png-structure-v1.mjs
            scripts/project-art/eva-dense-motion-ten-master-program.mjs
            scripts/project-art/eva-dense-motion-work-order.mjs
            scripts/project-art/eva-dense-motion-work-order-common.mjs
            scripts/project-art/eva-dense-motion-work-order-data.mjs
            scripts/run-project-art-eva-dense-motion-source-materialization.mjs
            scripts/test-project-art-eva-dense-motion-source-materialization.mjs
            scripts/test-project-art-eva-dense-motion-source-materialization-cli.mjs
          if-no-files-found: error
          retention-days: 1
