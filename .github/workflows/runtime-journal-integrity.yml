name: Runtime journal integrity

on:
  pull_request:
    paths:
      - "packages/runtime/src/journal.ts"
      - "packages/runtime/src/journal-integrity.ts"
      - "packages/runtime/test/journal-integrity-security.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-journal-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "packages/runtime/src/journal.ts"
      - "packages/runtime/src/journal-integrity.ts"
      - "packages/runtime/test/journal-integrity-security.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-journal-integrity.yml"

permissions:
  contents: read

concurrency:
  group: runtime-journal-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check runtime journal dependencies
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-runtime build
          pnpm --filter @evavo/art-runtime typecheck

      - name: Run runtime and hostile journal regressions
        run: >-
          node --test
          packages/runtime/test/runtime.test.mjs
          packages/runtime/test/redrive-policy.test.mjs
          packages/runtime/test/journal-integrity-security.test.mjs

      - name: Verify permanent journal-integrity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'parseRuntimeTransactionText' packages/runtime/src/journal.ts
          grep -F 'Runtime job specHash does not match its normalized spec.' packages/runtime/src/journal-integrity.ts
          grep -F 'Runtime idempotency index does not bind canonical job' packages/runtime/src/journal-integrity.ts
          grep -F 'highest immutable transaction must validate or recovery fails closed' packages/runtime/src/journal.ts
          grep -F 'persisted job identity is recomputed before runtime state can be used' packages/runtime/test/journal-integrity-security.test.mjs
          grep -F 'a corrupt highest transaction fails closed instead of rolling runtime state back' packages/runtime/test/journal-integrity-security.test.mjs
          ! grep -F 'lastError' packages/runtime/src/journal.ts

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
