name: Rally 2.5D Guardrail Art Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-25d-guardrail-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Test deterministic guardrail jobs
        run: node --test scripts/game-art-production/rally-25d-guardrail-jobs.test.mjs
      - name: Compile and verify guardrail session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-guardrail-jobs.mjs compile \
            config/game-art-production/props/guardrail-production-v1.json \
            --output "${RUNNER_TEMP}/guardrail.session.json" > "${RUNNER_TEMP}/guardrail.stdout.json"
          node scripts/game-art-production/rally-25d-guardrail-jobs.mjs verify \
            "${RUNNER_TEMP}/guardrail.session.json" | tee "${RUNNER_TEMP}/guardrail.verify.json"
          grep -F '"schema": "evavo.rally-guardrail-provider-job-session.v1"' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"jobs": 12' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"images": 12' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"variants": 4' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"modelingJobs": 4' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"damageJobs": 3' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"providerExecution": false' "${RUNNER_TEMP}/guardrail.session.json"
          grep -F '"downstream3DReady": false' "${RUNNER_TEMP}/guardrail.session.json"
      - name: Prove source remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardrail-art-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guardrail.session.json
            ${{ runner.temp }}/guardrail.verify.json
          if-no-files-found: warn
          retention-days: 7
