name: Validate Docs Authorial Intelligence

on:
  push:
    branches:
      - validation/docs-narrative-craft-20260804
    paths:
      - ".github/workflows/validate-docs-narrative-craft.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-docs-narrative-craft.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-authorial-intelligence-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCS_SOURCE_REPOSITORY: EVAVO-STUDIO/evavo-docs-suite
  DOCS_SOURCE_REF: agent/book-narrative-craft-intelligence-20260804

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out disposable validation host
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out exact Docs Suite branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.DOCS_SOURCE_REPOSITORY }}
          ref: ${{ env.DOCS_SOURCE_REF }}
          path: docs-source
          persist-credentials: false
          fetch-depth: 1

      - name: Record checked Docs source identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'docs-source-sha=%s\n' "$(git -C docs-source rev-parse HEAD)"
          test "$(git -C docs-source branch --show-current)" = "${DOCS_SOURCE_REF}"

      - name: Use exact Docs Suite Node.js runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: docs-source/.nvmrc
          package-manager-cache: false

      - name: Verify permanent authorial contracts
        working-directory: docs-source
        run: |
          node scripts/check-book-studio-narrative-craft.mjs
          node scripts/check-book-studio-authorial-intelligence.mjs

      - name: Install exact Docs Suite workspace
        working-directory: docs-source
        run: corepack pnpm install --frozen-lockfile

      - name: Run strict core and web TypeScript
        working-directory: docs-source
        run: |
          corepack pnpm --filter @evavo-docs/core typecheck
          corepack pnpm --filter @evavo-docs/web typecheck

      - name: Run narrative and authorial adversarial suites
        working-directory: docs-source
        run: >-
          npm exec --yes --package=tsx@4.20.3 -- tsx --test
          packages/core/test/book-studio-narrative-craft.test.mjs
          packages/core/test/book-studio-authorial-intelligence.test.mjs

      - name: Run exact CLI and MCP attacks
        working-directory: docs-source
        run: node --test apps/web/scripts/test-book-studio-narrative-craft-adapters.mjs

      - name: Prove exact Docs source remained clean
        working-directory: docs-source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Prove no Art Studio production source changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          merge_base="$(git merge-base HEAD origin/main)"
          test -n "$merge_base"
          unexpected="$(git diff --name-only "$merge_base" HEAD | grep -Ev '^(\.github/workflows/validate-docs-narrative-craft\.yml|validation/docs-narrative-craft/)' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Record validation boundary
        run: |
          printf '%s\n' \
            'validation=exact-docs-source-checkout' \
            'source-equivalent-claim=false' \
            'voice-metrics=23' \
            'genre-blueprints=20' \
            'idea-criteria=10' \
            'advanced-knowledge-modules=9' \
            'mcp-tools=15' \
            'provider-call-performed=false' \
            'canonical-manuscript-mutation-performed=false' \
            'automatic-canonical-admission-allowed=false' \
            'publication-performed=false'
