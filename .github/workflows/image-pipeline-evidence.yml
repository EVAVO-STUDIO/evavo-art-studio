name: Image pipeline evidence

on:
  pull_request:
    paths:
      - "config/executable-image-pipeline.v1.json"
      - "requirements-image-pipeline.txt"
      - "tools/image_style_features.py"
      - "tools/build_image_style_reference_bank.py"
      - "tools/process_image_work_order.py"
      - "tools/evaluate_image_candidate.py"
      - "tools/verify_image_style_reference_bank.py"
      - "tools/verify_image_pipeline_evidence.py"
      - "tools/verify_image_pipeline_evidence_contract.py"
      - "tools/verify_executable_image_pipeline.py"
      - ".github/workflows/image-pipeline-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-pipeline-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt
      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt
      - name: Verify exact Python image toolchain
        run: |
          python - <<'PY'
          import PIL
          import sys

          assert sys.version_info[:3] == (3, 13, 5), sys.version
          assert PIL.__version__ == "12.2.0", PIL.__version__
          PY
      - name: Compile Python sources
        run: >-
          python -m py_compile
          tools/image_style_features.py
          tools/build_image_style_reference_bank.py
          tools/process_image_work_order.py
          tools/evaluate_image_candidate.py
          tools/verify_image_style_reference_bank.py
          tools/verify_image_pipeline_evidence.py
          tools/verify_image_pipeline_evidence_contract.py
          tools/verify_executable_image_pipeline.py
      - name: Run executable image pipeline regression
        run: python tools/verify_executable_image_pipeline.py
      - name: Run exact evidence-chain regression
        run: python tools/verify_image_pipeline_evidence_contract.py
