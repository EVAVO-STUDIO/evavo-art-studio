name: Image pipeline evidence

on:
  pull_request:
    paths:
      - "config/executable-image-pipeline.v1.json"
      - "requirements-image-pipeline.txt"
      - "tools/image_style_features.py"
      - "tools/build_image_style_reference_bank.py"
      - "tools/process_image_work_order.py"
      - "tools/evaluate_image_candidate.py"
      - "tools/verify_image_style_reference_bank.py"
      - "tools/verify_image_pipeline_evidence.py"
      - "tools/verify_image_pipeline_evidence_contract.py"
      - "tools/verify_executable_image_pipeline.py"
      - ".github/workflows/image-pipeline-evidence.yml"
  push:
    branches:
      - main
    paths:
      - "config/executable-image-pipeline.v1.json"
      - "requirements-image-pipeline.txt"
      - "tools/image_style_features.py"
      - "tools/build_image_style_reference_bank.py"
      - "tools/process_image_work_order.py"
      - "tools/evaluate_image_candidate.py"
      - "tools/verify_image_style_reference_bank.py"
      - "tools/verify_image_pipeline_evidence.py"
      - "tools/verify_image_pipeline_evidence_contract.py"
      - "tools/verify_executable_image_pipeline.py"
      - ".github/workflows/image-pipeline-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-pipeline-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deterministic image backend
        run: python3 -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Compile Python sources
        run: >-
          python3 -m py_compile
          tools/image_style_features.py
          tools/build_image_style_reference_bank.py
          tools/process_image_work_order.py
          tools/evaluate_image_candidate.py
          tools/verify_image_style_reference_bank.py
          tools/verify_image_pipeline_evidence.py
          tools/verify_image_pipeline_evidence_contract.py
          tools/verify_executable_image_pipeline.py

      - name: Run executable image pipeline regression
        run: python3 tools/verify_executable_image_pipeline.py

      - name: Run exact evidence-chain regression
        run: python3 tools/verify_image_pipeline_evidence_contract.py

      - name: Prove clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
