name: Finalize Game Art Intelligence release evidence

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v3-20260805]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: finalize-game-art-intelligence-20260805
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: 5b08bdab285f7e28fd5d4fc2cc3d7d6fb4984ab0
      FEATURE_BRANCH: agent/game-art-intelligence-20260805
      EXPECTED_TITLE: feat(game-art): add project-wide production intelligence
    steps:
      - name: Check out finalization authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact production main and merged pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$FEATURE_BRANCH:refs/remotes/origin/$FEATURE_BRANCH"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          feature_sha="$(git rev-parse refs/remotes/origin/$FEATURE_BRANCH)"
          test "$main_sha" != "$BASE_SHA"
          test "$(git log -1 --format=%s refs/remotes/origin/main)" = "$EXPECTED_TITLE"
          git cat-file -e "$main_sha:packages/game-art-intelligence/package.json"
          git cat-file -e "$main_sha:apps/mcp/src/game-intelligence.ts"
          git cat-file -e "$main_sha:.github/workflows/game-art-intelligence.yml"

          encoded_head="EVAVO-STUDIO%3Aagent%2Fgame-art-intelligence-20260805"
          pulls="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$encoded_head&base=main&per_page=20")"
          node - "$pulls" "$feature_sha" "$main_sha" <<'NODE' > /tmp/pr-number.txt
          const pulls=JSON.parse(process.argv[2]);
          const feature=process.argv[3], main=process.argv[4];
          const matches=pulls.filter(p=>p.merged_at&&p.head?.sha===feature&&(p.merge_commit_sha===main||p.merged===true));
          if(matches.length!==1) process.exit(1);
          process.stdout.write(String(matches[0].number));
          NODE
          printf '%s\n' "$main_sha" > /tmp/main-sha.txt
          printf '%s\n' "$feature_sha" > /tmp/feature-sha.txt

      - name: Dispatch missing exact-main validations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/main-sha.txt)"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")

          find_run() {
            local workflow="$1"
            curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);const r=d.workflow_runs.find(x=>x.head_sha===process.argv[1]);if(r)process.stdout.write(String(r.id))})' "$main_sha"
          }
          ci_run="$(find_run ci.yml)"
          if [ -z "$ci_run" ]; then
            payload="$(node -e 'console.log(JSON.stringify({ref:"main",inputs:{expected_sha:process.argv[1],request_source:"evavo-development-studio"}}))' "$main_sha")"
            curl --fail-with-body --silent --show-error --request POST "${headers[@]}" "$api/actions/workflows/ci.yml/dispatches" --data "$payload"
          fi
          gai_run="$(find_run game-art-intelligence.yml)"
          if [ -z "$gai_run" ]; then
            curl --fail-with-body --silent --show-error --request POST "${headers[@]}" "$api/actions/workflows/game-art-intelligence.yml/dispatches" --data '{"ref":"main"}'
          fi

      - name: Require both exact-main workflows to pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/main-sha.txt)"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
          wait_for_success() {
            local workflow="$1" output="$2"
            for attempt in $(seq 1 100); do
              response="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/workflows/$workflow/runs?branch=main&per_page=50")"
              record="$(node - "$response" "$main_sha" <<'NODE'
          const d=JSON.parse(process.argv[2]), sha=process.argv[3];
          const r=d.workflow_runs.find(x=>x.head_sha===sha);
          if(r) process.stdout.write(`${r.id}|${r.status}|${r.conclusion??""}`);
          NODE
              )"
              if [ -n "$record" ]; then
                IFS='|' read -r run_id status conclusion <<< "$record"
                if [ "$status" = completed ]; then
                  test "$conclusion" = success
                  printf '%s\n' "$run_id" > "$output"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Timed out waiting for $workflow" >&2
            return 1
          }
          wait_for_success ci.yml /tmp/ci-run.txt
          wait_for_success game-art-intelligence.yml /tmp/gai-run.txt
          for pair in "$(cat /tmp/ci-run.txt):/tmp/ci-job.txt" "$(cat /tmp/gai-run.txt):/tmp/gai-job.txt"; do
            IFS=':' read -r run_id output <<< "$pair"
            jobs="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")"
            node -e 'const d=JSON.parse(process.argv[1]);const j=d.jobs.find(x=>x.conclusion==="success");if(!j)process.exit(1);process.stdout.write(String(j.id))' "$jobs" > "$output"
          done

      - name: Write and post final evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs");
          const receipt={
            schemaVersion:"1.0",
            receiptType:"evavo-game-art-intelligence-final",
            repository:process.env.GITHUB_REPOSITORY,
            finalizerRunId:process.env.GITHUB_RUN_ID,
            baseSha:process.env.BASE_SHA,
            featureSha:fs.readFileSync("/tmp/feature-sha.txt","utf8").trim(),
            mainSha:fs.readFileSync("/tmp/main-sha.txt","utf8").trim(),
            pullRequest:Number(fs.readFileSync("/tmp/pr-number.txt","utf8")),
            repositoryValidation:{runId:Number(fs.readFileSync("/tmp/ci-run.txt","utf8")),jobId:Number(fs.readFileSync("/tmp/ci-job.txt","utf8")),conclusion:"success"},
            gameArtValidation:{runId:Number(fs.readFileSync("/tmp/gai-run.txt","utf8")),jobId:Number(fs.readFileSync("/tmp/gai-job.txt","utf8")),conclusion:"success"},
            currentMainAtReceipt:true,
            providerCalled:false,
            runtimeJobSubmitted:false,
            targetRepositoryMutated:false,
            artworkApproved:false,
            selectionPerformed:false,
            promotionPerformed:false,
            publicationPerformed:false
          };
          fs.writeFileSync("/tmp/game-art-intelligence-final.json",`${JSON.stringify(receipt,null,2)}\n`,{mode:0o600});
          const body=`Game Art Intelligence is merged and exact-current-main validation is complete.\n\n- Production main: \`${receipt.mainSha}\`\n- Exact feature: \`${receipt.featureSha}\`\n- Repository validation: run \`${receipt.repositoryValidation.runId}\`, job \`${receipt.repositoryValidation.jobId}\`, success\n- Dedicated Game Art validation: run \`${receipt.gameArtValidation.runId}\`, job \`${receipt.gameArtValidation.jobId}\`, success\n- Finalizer run: \`${receipt.finalizerRunId}\`\n\nNo provider call, game-repository mutation, approval, selection, promotion or publication occurred.`;
          fs.writeFileSync("/tmp/comment.json",JSON.stringify({body}));
          NODE
          pr="$(cat /tmp/pr-number.txt)"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --data-binary @/tmp/comment.json >/dev/null

      - name: Upload final evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-art-intelligence-final-${{ github.run_id }}
          path: /tmp/game-art-intelligence-final.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Remove exact temporary branches
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
          for branch in \
            agent/game-art-intelligence-20260805 \
            automation/bootstrap-game-art-intelligence-20260805 \
            automation/bootstrap-game-art-intelligence-v2-20260805 \
            automation/bootstrap-game-art-intelligence-v3-20260805; do
            code="$(curl --silent --show-error --output /tmp/delete-response --write-out '%{http_code}' --request DELETE "${headers[@]}" "$api/$branch")"
            test "$code" = 204 || test "$code" = 404
          done
