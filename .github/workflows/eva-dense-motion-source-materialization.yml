name: EVA dense-motion source materialization

on:
  pull_request:
    paths:
      - "config/eva-dense-motion-workstation-task-v1.json"
      - "scripts/Invoke-EvaDenseMotionWorkstationValidation.ps1"
      - "scripts/check-eva-dense-motion-workstation-task.mjs"
      - "scripts/project-art/eva-dense-motion-source-preflight.mjs"
      - "scripts/project-art/eva-dense-motion-source-materialization.mjs"
      - "scripts/project-art/eva-dense-motion-ten-master-program.mjs"
      - "scripts/project-art/eva-dense-motion-work-order*.mjs"
      - "scripts/run-project-art-eva-dense-motion-source-materialization.mjs"
      - "scripts/test-eva-dense-motion-workstation-task.mjs"
      - "scripts/test-project-art-eva-dense-motion-source-materialization*.mjs"
      - ".github/workflows/eva-dense-motion-source-materialization.yml"
  push:
    branches: [main]
    paths:
      - "config/eva-dense-motion-workstation-task-v1.json"
      - "scripts/Invoke-EvaDenseMotionWorkstationValidation.ps1"
      - "scripts/check-eva-dense-motion-workstation-task.mjs"
      - "scripts/project-art/eva-dense-motion-source-preflight.mjs"
      - "scripts/project-art/eva-dense-motion-source-materialization.mjs"
      - "scripts/project-art/eva-dense-motion-ten-master-program.mjs"
      - "scripts/project-art/eva-dense-motion-work-order*.mjs"
      - "scripts/run-project-art-eva-dense-motion-source-materialization.mjs"
      - "scripts/test-eva-dense-motion-workstation-task.mjs"
      - "scripts/test-project-art-eva-dense-motion-source-materialization*.mjs"
      - ".github/workflows/eva-dense-motion-source-materialization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-dense-source-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-branch-repair:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/eva-dense-motion-source-materialization'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact Node fs constants correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('scripts/project-art/eva-dense-motion-source-materialization.mjs')
          text = target.read_text(encoding='utf-8')
          old_import = "import {\n  COPYFILE_EXCL,\n  closeSync,"
          new_import = "import {\n  closeSync,"
          old_tail = "  writeFileSync,\n} from 'node:fs';"
          new_tail = "  writeFileSync,\n  constants as fsConstants,\n} from 'node:fs';"
          old_call = "copyFileSync(staged[index], finals[index].absolute, COPYFILE_EXCL);"
          new_call = "copyFileSync(\n        staged[index],\n        finals[index].absolute,\n        fsConstants.COPYFILE_EXCL,\n      );"

          old_counts = [text.count(old_import), text.count(old_tail), text.count(old_call)]
          if old_counts == [1, 1, 1]:
              text = text.replace(old_import, new_import)
              text = text.replace(old_tail, new_tail)
              text = text.replace(old_call, new_call)
              target.write_text(text, encoding='utf-8', newline='\n')
          elif (
              text.count(new_import) == 1
              and text.count(new_tail) == 1
              and text.count(new_call) == 1
              and 'COPYFILE_EXCL,' not in text
              and 'absolute, COPYFILE_EXCL' not in text
          ):
              print('Exact fs constants correction is already present.')
          else:
              raise SystemExit(f'unexpected source state: {old_counts}')
          PY
          node --check scripts/project-art/eva-dense-motion-source-materialization.mjs
          git diff --check

      - name: Commit correction to the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/project-art/eva-dense-motion-source-materialization.mjs; then
            echo "No source correction commit is required."
            exit 0
          fi
          git add scripts/project-art/eva-dense-motion-source-materialization.mjs
          git config user.name "EVAVO governed automation"
          git config user.email "automation@evavo.com.au"
          git commit -m "fix(eva): use Node fs constants namespace"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Syntax-check source materialization surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/project-art/eva-dense-motion-source-preflight.mjs
          node --check scripts/project-art/eva-dense-motion-source-materialization.mjs
          node --check scripts/run-project-art-eva-dense-motion-source-materialization.mjs
          node --check scripts/check-eva-dense-motion-workstation-task.mjs
          node --check scripts/test-eva-dense-motion-workstation-task.mjs
          node --check scripts/test-project-art-eva-dense-motion-source-materialization.mjs
          node --check scripts/test-project-art-eva-dense-motion-source-materialization-cli.mjs

      - name: Run source preflight and workstation adversaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-eva-dense-motion-workstation-task.mjs
          node --test scripts/test-eva-dense-motion-workstation-task.mjs

      - name: Run source materialization regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/test-project-art-eva-dense-motion-source-materialization.mjs \
            scripts/test-project-art-eva-dense-motion-source-materialization-cli.mjs

      - name: Re-run ten-master programme regression
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-project-art-eva-dense-motion-ten-master.mjs

      - name: Confirm validation changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
