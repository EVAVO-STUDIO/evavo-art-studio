name: RAW ART provider runtime execution

on:
  pull_request:
    paths:
      - "packages/providers/src/**"
      - "packages/runtime/src/**"
      - "packages/artifacts/src/**"
      - "apps/worker/src/provider-handlers.ts"
      - "apps/worker/test/provider-worker.test.mjs"
      - "scripts/raw-art-provider/runtime.mjs"
      - "scripts/raw-art-provider/admission.mjs"
      - "scripts/raw-art-provider/execution.mjs"
      - "scripts/compile-raw-art-provider-runtime-batch.mjs"
      - "scripts/select-raw-art-provider-runtime-jobs.mjs"
      - "scripts/admit-raw-art-provider-runtime-batch.mjs"
      - "scripts/authorize-raw-art-provider-runtime-execution.mjs"
      - "scripts/run-authorized-raw-art-provider-worker.mjs"
      - "scripts/check-raw-art-provider-runtime-admission.mjs"
      - "scripts/check-raw-art-provider-runtime-execution.mjs"
      - "docs/RAW_ART_PROVIDER_RUNTIME_ADMISSION.md"
      - "docs/RAW_ART_PROVIDER_RUNTIME_EXECUTION.md"
      - "package.json"
      - ".github/workflows/raw-art-provider-runtime-admission.yml"
      - ".github/workflows/raw-art-provider-runtime-execution.yml"
  push:
    branches:
      - main
    paths:
      - "packages/providers/src/**"
      - "packages/runtime/src/**"
      - "packages/artifacts/src/**"
      - "apps/worker/src/provider-handlers.ts"
      - "apps/worker/test/provider-worker.test.mjs"
      - "scripts/raw-art-provider/runtime.mjs"
      - "scripts/raw-art-provider/admission.mjs"
      - "scripts/raw-art-provider/execution.mjs"
      - "scripts/compile-raw-art-provider-runtime-batch.mjs"
      - "scripts/select-raw-art-provider-runtime-jobs.mjs"
      - "scripts/admit-raw-art-provider-runtime-batch.mjs"
      - "scripts/authorize-raw-art-provider-runtime-execution.mjs"
      - "scripts/run-authorized-raw-art-provider-worker.mjs"
      - "scripts/check-raw-art-provider-runtime-admission.mjs"
      - "scripts/check-raw-art-provider-runtime-execution.mjs"
      - "docs/RAW_ART_PROVIDER_RUNTIME_ADMISSION.md"
      - "docs/RAW_ART_PROVIDER_RUNTIME_EXECUTION.md"
      - "package.json"
      - ".github/workflows/raw-art-provider-runtime-admission.yml"
      - ".github/workflows/raw-art-provider-runtime-execution.yml"

permissions:
  contents: read

concurrency:
  group: raw-art-provider-runtime-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build provider execution dependency closure
        run: |
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-worker build
          pnpm --filter @evavo/art-studio-worker typecheck

      - name: Run isolated admission and authorized fixture execution regressions
        run: |
          node scripts/check-raw-art-provider-runtime-batch.mjs
          node scripts/check-raw-art-provider-runtime-admission.mjs
          node scripts/check-raw-art-provider-runtime-execution.mjs
          node --test apps/worker/test/provider-worker.test.mjs

      - name: Verify permanent execution authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'raw-art.provider.${selectionRunId}' scripts/raw-art-provider/admission.mjs
          grep -F 'raw-art.execution-authorized' scripts/raw-art-provider/admission.mjs
          grep -F 'maximumAttempts: 1' scripts/raw-art-provider/admission.mjs
          grep -F 'validateRawArtProviderRuntimeAdmissionReceipt' scripts/raw-art-provider/admission.mjs
          grep -F 'RAW_ART_PROVIDER_RUNTIME_EXECUTION_AUTHORIZATION_SCHEMA' scripts/raw-art-provider/execution.mjs
          grep -F 'verifyRawArtProviderExecutionRuntimeState' scripts/raw-art-provider/execution.mjs
          grep -F 'assertRawArtProviderExecutionAuthorizationActive' scripts/raw-art-provider/execution.mjs
          grep -F 'createRawArtProviderExecutionAuthorizer' scripts/raw-art-provider/execution.mjs
          grep -F 'requireRawArtExecutionAuthorization' apps/worker/src/provider-handlers.ts
          grep -F 'RAW_ART_PROVIDER_EXECUTION_UNAUTHORIZED' apps/worker/src/provider-handlers.ts
          grep -F 'restrictProviderRegistry' apps/worker/src/provider-handlers.ts
          grep -F 'raw-art:provider-authorize' package.json
          grep -F 'raw-art:provider-execute' package.json
          grep -F 'raw-art:provider-execution:check' package.json
          grep -F 'fixture provider execution retained immutable unapproved candidates' scripts/check-raw-art-provider-runtime-execution.mjs
          ! grep -F 'candidateApproval: true' scripts/raw-art-provider/execution.mjs
          ! grep -F 'candidatePromotion: true' scripts/raw-art-provider/execution.mjs
          ! grep -F 'targetRepositoryMutation: true' scripts/raw-art-provider/execution.mjs
          ! grep -F 'publication: true' scripts/raw-art-provider/execution.mjs
          ! grep -F 'forcePush: true' scripts/raw-art-provider/execution.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
