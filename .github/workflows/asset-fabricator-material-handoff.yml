name: Asset Fabricator material handoff

on:
  push:
    paths:
      - "contracts/asset-fabricator-material-handoff-v1.json"
      - "docs/ASSET_FABRICATOR_MATERIAL_HANDOFF.md"
      - "scripts/game-art-production/asset-fabricator-material-handoff.mjs"
      - "tests/asset-fabricator-material-handoff.test.mjs"
      - ".github/workflows/asset-fabricator-material-handoff.yml"
  pull_request:
    paths:
      - "contracts/asset-fabricator-material-handoff-v1.json"
      - "docs/ASSET_FABRICATOR_MATERIAL_HANDOFF.md"
      - "scripts/game-art-production/asset-fabricator-material-handoff.mjs"
      - "tests/asset-fabricator-material-handoff.test.mjs"
      - ".github/workflows/asset-fabricator-material-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-fabricator-material-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: node --check scripts/game-art-production/asset-fabricator-material-handoff.mjs
      - run: node --test tests/asset-fabricator-material-handoff.test.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('contracts/asset-fabricator-material-handoff-v1.json','utf8'))"
      - run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
