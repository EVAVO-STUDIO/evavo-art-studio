name: Temporary apply avatar sequence finalizer v2

on:
  push:
    branches:
      - automation/apply-avatar-sequence-finalizer-v2-20260811

permissions:
  contents: write

concurrency:
  group: temporary-apply-avatar-sequence-finalizer-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Reconstruct and verify exact reviewed payload
        shell: bash
        env:
          EXPECTED_PARENT: 5f8d11f4f5b55cc30ccb11c44250fa11f4b403ee
          EXPECTED_BASE64_SHA256: e745c695c5b8f6100fc1e9be6b11c99895b5b8a9e3f3c8a5a7c98b7a247477c7
          EXPECTED_PAYLOAD_SHA256: 1b4cc09df4a72b7ce35c1d7b6aa04dbbcf7f7cc7c9364f65b051ab6113f1cec4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          parts=(.evavo/automation/avatar-sequence-finalizer-parts/part-{aa..aq})
          test "${#parts[@]}" -eq 17
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" > "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz.b64" | awk '{print $1}')" = "$EXPECTED_BASE64_SHA256"
          base64 --decode "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz.b64" > "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz" | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          tar -tzf "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz" | sort > "$RUNNER_TEMP/payload-paths.txt"
          cat > "$RUNNER_TEMP/expected-payload-paths.txt" <<'PATHS'
.github/workflows/project-art-avatar-sequence-finalization.yml
.github/workflows/project-art-workbench.yml
config/mcp.project-art-avatar-sequence-finalizer.windows.example.json
docs/PROJECT_ART_AVATAR_SEQUENCE_FINALIZATION.md
package.json
scripts/check-project-art-avatar-sequence-finalization.mjs
scripts/check-project-art-workbench.mjs
scripts/finalize-project-art-avatar-sequence.mjs
scripts/project-art/avatar-sequence-finalization-common.mjs
scripts/project-art/avatar-sequence-finalization-evidence.mjs
scripts/test-project-art-avatar-sequence-finalization.mjs
scripts/test-project-art-avatar-sequence-finalizer-mcp.mjs
tools/project_art_avatar_sequence_finalizer_mcp.mjs
PATHS
          sort -o "$RUNNER_TEMP/expected-payload-paths.txt" "$RUNNER_TEMP/expected-payload-paths.txt"
          diff -u "$RUNNER_TEMP/expected-payload-paths.txt" "$RUNNER_TEMP/payload-paths.txt"

      - name: Apply exact reviewed files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz" -C .
          git rm -rf \
            .evavo/automation/avatar-sequence-finalizer-parts \
            .github/workflows/temporary-apply-avatar-sequence-finalizer-v2.yml
          git add \
            .github/workflows/project-art-avatar-sequence-finalization.yml \
            .github/workflows/project-art-workbench.yml \
            config/mcp.project-art-avatar-sequence-finalizer.windows.example.json \
            docs/PROJECT_ART_AVATAR_SEQUENCE_FINALIZATION.md \
            package.json \
            scripts/check-project-art-avatar-sequence-finalization.mjs \
            scripts/check-project-art-workbench.mjs \
            scripts/finalize-project-art-avatar-sequence.mjs \
            scripts/project-art/avatar-sequence-finalization-common.mjs \
            scripts/project-art/avatar-sequence-finalization-evidence.mjs \
            scripts/test-project-art-avatar-sequence-finalization.mjs \
            scripts/test-project-art-avatar-sequence-finalizer-mcp.mjs \
            tools/project_art_avatar_sequence_finalizer_mcp.mjs
          git diff --cached --check
          mapfile -t actual < <(git diff --cached --name-only | sort)
          {
            printf '%s\n' \
              .github/workflows/project-art-avatar-sequence-finalization.yml \
              .github/workflows/project-art-workbench.yml \
              .github/workflows/temporary-apply-avatar-sequence-finalizer-v2.yml \
              config/mcp.project-art-avatar-sequence-finalizer.windows.example.json \
              docs/PROJECT_ART_AVATAR_SEQUENCE_FINALIZATION.md \
              package.json \
              scripts/check-project-art-avatar-sequence-finalization.mjs \
              scripts/check-project-art-workbench.mjs \
              scripts/finalize-project-art-avatar-sequence.mjs \
              scripts/project-art/avatar-sequence-finalization-common.mjs \
              scripts/project-art/avatar-sequence-finalization-evidence.mjs \
              scripts/test-project-art-avatar-sequence-finalization.mjs \
              scripts/test-project-art-avatar-sequence-finalizer-mcp.mjs \
              tools/project_art_avatar_sequence_finalizer_mcp.mjs
            printf '.evavo/automation/avatar-sequence-finalizer-parts/part-%s\n' {aa..aq}
          } | sort > "$RUNNER_TEMP/expected-changed-paths.txt"
          diff -u "$RUNNER_TEMP/expected-changed-paths.txt" <(printf '%s\n' "${actual[@]}")

      - name: Route Python bytecode outside the repository
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/avatar-sequence-finalizer-pycache"
          mkdir -p "$PYTHON_CACHE_ROOT"
          echo "PYTHONPYCACHEPREFIX=$PYTHON_CACHE_ROOT" >> "$GITHUB_ENV"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact Pillow runtime
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Verify exact Python image toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" == "3.13.5" ]]
          [[ "$(python -c 'import PIL; print(PIL.__version__)')" == "12.2.0" ]]

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Validate affected sequence boundaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-project-art-avatar-sequence.mjs
          node scripts/test-project-art-avatar-sequence.mjs
          node scripts/test-project-art-avatar-sequence-mcp.mjs
          node scripts/check-project-art-avatar-sequence-finalization.mjs
          node scripts/test-project-art-avatar-sequence-finalization.mjs
          node scripts/test-project-art-avatar-sequence-finalizer-mcp.mjs
          node scripts/check-project-art-loop-closure.mjs
          node scripts/test-project-art-loop-closure.mjs
          node scripts/check-project-art-workbench.mjs
          node scripts/test-project-art-workbench.mjs
          node scripts/check-persistent-artist-workspace.mjs
          node scripts/test-persistent-artist-workspace.mjs
          node scripts/check-project-art-mastering-and-motion.mjs
          node scripts/test-project-art-mastering-and-motion.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));'
          git diff --check

      - name: Commit and push reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Studio Automation"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat(project-art): finalize reviewed avatar sequences" -m "Bind exact mastering plans, applied workspace receipts, full loop request-plan-review-receipt chains, reviewed target bytes, and independent art, animation, and runtime approvals into a parser-ready avatar-runtime 0.7.0 candidate. Add a bounded two-phase MCP surface and permanent Project Art validation while keeping activation, release sealing, provider execution, repository mutation, Git publication, deployment, publication, and force-push authority false."
          git push origin "HEAD:${GITHUB_REF_NAME}"
