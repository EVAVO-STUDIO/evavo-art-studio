name: Apply runtime transition clock hardening

on:
  push:
    branches:
      - agent/runtime-transition-clock-integrity-20260808
    paths:
      - ".agent/apply-runtime-transition-clock-integrity.py"
      - ".github/workflows/agent-apply-runtime-transition-clock-integrity.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-runtime-transition-clock-integrity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/runtime-transition-clock-integrity-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Apply exact source and regression changes
        run: python .agent/apply-runtime-transition-clock-integrity.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check runtime dependencies
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-runtime build
          pnpm --filter @evavo/art-runtime typecheck

      - name: Run runtime transition and persistence regressions
        run: >-
          node --test
          packages/runtime/test/runtime.test.mjs
          packages/runtime/test/redrive-policy.test.mjs
          packages/runtime/test/journal-integrity-security.test.mjs
          packages/runtime/test/submission-integrity-security.test.mjs
          packages/runtime/test/worker-options-integrity-security.test.mjs
          packages/runtime/test/control-options-integrity-security.test.mjs
          packages/runtime/test/claim-input-integrity-security.test.mjs
          packages/runtime/test/transition-clock-integrity-security.test.mjs

      - name: Commit validated source to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add \
            packages/runtime/src/local-repository.ts \
            packages/runtime/test/transition-clock-integrity-security.test.mjs
          if git diff --cached --quiet; then
            echo "::error title=No staged hardening changes::The deterministic patch produced no source changes."
            exit 1
          fi
          git commit -m "fix(runtime): snapshot transition clocks"
          git push origin HEAD:agent/runtime-transition-clock-integrity-20260808
