name: Patch CLI provider contract

on:
  push:
    branches:
      - automation/patch-cli-provider-contract-20260808

permissions:
  contents: write

concurrency:
  group: patch-cli-provider-contract-20260808
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_BRANCH: agent/raw-art-provider-runtime-batch-20260808
      EXPECTED_HEAD_SHA: f8736b92bac50507e55034667208adac1b079583
      EXPECTED_MAIN_SHA: ea3385d22af1c29f93bcc0fa05b4afe129da404d
    steps:
      - name: Check out patch authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and check out exact target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD_SHA"
          git switch --force-create "$TARGET_BRANCH" refs/remotes/origin/$TARGET_BRANCH

      - name: Use the canonical provider compiler in CLI
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode(''))"
          git diff --check
          test "$(git diff --name-only)" = "apps/cli/src/index.ts"
          grep -F 'compileProviderCandidateContract' apps/cli/src/index.ts
          ! grep -F 'compileProviderCandidatePrompt' apps/cli/src/index.ts
          ! grep -F 'providerRequestSha256' apps/cli/src/index.ts

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and validate CLI provider contract
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-media build
          pnpm --filter @evavo/art-providers build
          pnpm --filter @evavo/art-studio-cli build
          pnpm --filter @evavo/art-studio-cli typecheck
          node --test apps/cli/test/provider-cli.test.mjs packages/providers/test/compiled-contract.test.mjs
          node scripts/check-raw-art-provider-runtime-batch.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Commit and push bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Automation"
          git config user.email "evavo-automation@users.noreply.github.com"
          git add apps/cli/src/index.ts
          git diff --cached --check
          git commit -m "refactor(providers): use canonical compiled contract in CLI"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$(git rev-parse HEAD)"

      - name: Delete disposable patch branch
        if: success()
        shell: bash
        run: git push origin --delete "$GITHUB_REF_NAME" || echo "::warning::patch branch cleanup deferred"
