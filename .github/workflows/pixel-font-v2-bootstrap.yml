name: Pixel Font Studio v2.2 bootstrap

on:
  push:
    branches:
      - agent/pixel-font-v2-2-bootstrap-db210ee8

permissions:
  contents: write

jobs:
  publish-ready-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: db210ee82495f9b4c2d58b1d5b8be81e875c2b63
      READY_BRANCH: agent/pixel-font-v2-2-ready-db210ee8
      OVERLAY_SHA256: edb7f1a71d0f1618e6d5007a4defa7ddcc9534bf0878d3ee234cb8049fe3bc80
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1577836800"
    steps:
      - name: Check out bootstrap transport
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct and verify reviewed overlay
        run: |
          set -euo pipefail
          cat .pixel-font-bootstrap/part-*.b64 | base64 --decode > "$RUNNER_TEMP/pixel-font-v2.2-overlay.tar.gz"
          echo "$OVERLAY_SHA256  $RUNNER_TEMP/pixel-font-v2.2-overlay.tar.gz" | sha256sum --check --strict

      - name: Create clean ready branch from exact main base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          git checkout --detach "$EXPECTED_BASE_SHA"
          git switch -c "$READY_BRANCH"
          tar -xzf "$RUNNER_TEMP/pixel-font-v2.2-overlay.tar.gz" -C .
          node scripts/integrate-pixel-font-studio-v2.mjs

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact optional TrueType dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Run complete v2.2 deterministic and adversarial checks
        env:
          EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-v2.2-check
        run: node scripts/check-pixel-font-studio-v2.mjs

      - name: Commit only the reviewed production scope
        run: |
          set -euo pipefail
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add \
            .github/workflows/pixel-font-studio-v2.yml \
            config/mcp.pixel-font-studio-v2.example.json \
            config/pixel-font-families/chess-lord-v2 \
            config/pixel-font-studio.v2.json \
            docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md \
            docs/PIXEL_FONT_STUDIO_V2.md \
            requirements/pixel-font-studio-v2.txt \
            scripts/check-pixel-font-studio-v2.mjs \
            scripts/integrate-pixel-font-studio-v2.mjs \
            scripts/pixel-font-studio-v2-mcp.mjs \
            tools/pixel_font_studio_v2.py \
            tools/pixel_font_v2 \
            package.json \
            evavo.reliability.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          allowed_files = {
              ".github/workflows/pixel-font-studio-v2.yml",
              "config/mcp.pixel-font-studio-v2.example.json",
              "config/pixel-font-studio.v2.json",
              "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md",
              "docs/PIXEL_FONT_STUDIO_V2.md",
              "requirements/pixel-font-studio-v2.txt",
              "scripts/check-pixel-font-studio-v2.mjs",
              "scripts/integrate-pixel-font-studio-v2.mjs",
              "scripts/pixel-font-studio-v2-mcp.mjs",
              "tools/pixel_font_studio_v2.py",
              "package.json",
              "evavo.reliability.json",
          }
          allowed_prefixes = (
              "config/pixel-font-families/chess-lord-v2/",
              "tools/pixel_font_v2/",
          )
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).decode().split("\0")
          staged = [name for name in staged if name]
          unexpected = [name for name in staged if name not in allowed_files and not name.startswith(allowed_prefixes)]
          if unexpected:
              raise SystemExit(f"Unexpected staged files: {unexpected}")
          if not staged:
              raise SystemExit("No files staged")
          print(f"Validated {len(staged)} staged files")
          PY
          git commit -m "feat(pixel-font): productionize reusable v2.2 pipeline" -m "Add independently authored Chess Lord UI, text and herald masters; deterministic BMFont/PNG, BDF, atlas JSON, fixed-cell grid and TrueType outputs; guarded ChatGPT/Claude MCP authoring; native-scale specimens; exhaustive collision and confusable QA; and exact Godot 4.6.2 CI verification."
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:refs/heads/$READY_BRANCH"
