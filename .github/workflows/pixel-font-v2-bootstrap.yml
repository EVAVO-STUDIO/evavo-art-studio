name: Pixel Font Studio v2.1 validated bootstrap

on:
  push:
    branches:
      - "agent/pixel-font-v2-1-bootstrap-a558349e-r2"

permissions:
  contents: write

env:
  EXPECTED_BASE_SHA: "2daa6403ffc30fbcef96d5e0a1aa34d54ecba732"
  READY_BRANCH: "agent/pixel-font-v2-1-ready-2daa6403-r2"
  BOOTSTRAP_SHA256: "babdc281c2d24bb3cb27c210fb0ece522f788a24cc2dedf4d4923523d01fa752"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1577836800"
  GODOT_VERSION: "4.6.2"
  GODOT_ARCHIVE_SHA256: "30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937"

jobs:
  validate-and-publish-ready-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact transport commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct and verify reviewed source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pixel-font-v2.1-bootstrap-min.tar.xz"
          {
            cat .pixel-font-bootstrap-min/part-00.b64
            cat .pixel-font-bootstrap-min/part-01.b64
            cat .pixel-font-bootstrap-min-correct/part-02-00.b64
            cat .pixel-font-bootstrap-min-correct/part-02-01.b64
            cat .pixel-font-bootstrap-min-correct/part-02-02.b64
            cat .pixel-font-bootstrap-min/part-03.b64
            cat .pixel-font-bootstrap-min-correct/part-04-00.b64
            cat .pixel-font-bootstrap-min-correct/part-04-01.b64
            cat .pixel-font-bootstrap-min-correct/part-04-02.b64
            cat .pixel-font-bootstrap-min-correct/part-05.b64
          } | base64 --decode > "$archive"
          echo "${BOOTSTRAP_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/pixel-font-bootstrap-min/apply_to_evavo_art_studio.py"
          test -f "$RUNNER_TEMP/pixel-font-bootstrap-min/repo_patch/tools/pixel_font_studio_v2.py"

      - name: Rebase work onto exact current main without history rewriting
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          git switch --force-create main origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Apply the exact reviewed reusable v2.1 source upgrade
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check fonttools==4.63.0
          python "$RUNNER_TEMP/pixel-font-bootstrap-min/apply_to_evavo_art_studio.py" \
            --repo "$GITHUB_WORKSPACE" \
            --allow-newer-head \
            --skip-checks
          git diff --cached --check

      - name: Download verified Godot 4.6.2 and prepare off-screen rendering
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "${GODOT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
          wrapper="$RUNNER_TEMP/godot/godot-xvfb-wrapper"
          cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          real="${GODOT_REAL_EXECUTABLE:?}"
          for argument in "$@"; do
            if [[ "$argument" == "--version" || "$argument" == "--editor" ]]; then
              exec "$real" "$@"
            fi
          done
          filtered=()
          for argument in "$@"; do
            [[ "$argument" == "--headless" ]] && continue
            filtered+=("$argument")
          done
          exec xvfb-run -a -s "-screen 0 1280x1024x24" "$real" "${filtered[@]}" --audio-driver Dummy
          SH
          chmod +x "$wrapper"

      - name: Run complete deterministic, TTF, atlas and native Godot checks
        env:
          GODOT_REAL_EXECUTABLE: ${{ runner.temp }}/godot/Godot_v4.6.2-stable_linux.x86_64
          EVAVO_PIXEL_FONT_GODOT: ${{ runner.temp }}/godot/godot-xvfb-wrapper
          EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-studio-v2-check
        run: |
          set -o pipefail
          node scripts/check-pixel-font-studio-v2.mjs 2>&1 | tee "$RUNNER_TEMP/pixel-font-v2-bootstrap.log"

      - name: Retain exact generated family and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chess-lord-pixel-font-v2-bootstrap-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/pixel-font-v2-bootstrap.log
            ${{ runner.temp }}/pixel-font-studio-v2-check/**

      - name: Commit exact validated source scope and publish ready branch
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          expected="$RUNNER_TEMP/expected-font-files.txt"
          cat > "$expected" <<'EOF'
          .github/workflows/pixel-font-studio-v2.yml
          config/pixel-font-families/chess-lord-v2/ChessLord_Herald.face.json
          config/pixel-font-families/chess-lord-v2/ChessLord_Text.face.json
          config/pixel-font-families/chess-lord-v2/ChessLord_UI.face.json
          config/pixel-font-families/chess-lord-v2/chess-lord.family.json
          config/pixel-font-studio.v2.json
          docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md
          docs/PIXEL_FONT_STUDIO_V2.md
          evavo.reliability.json
          package.json
          scripts/check-pixel-font-studio-v2.mjs
          scripts/pixel-font-studio-v2-mcp.mjs
          tools/pixel_font_studio_v2.py
          EOF
          sed -i 's/^          //' "$expected"
          sort -o "$expected" "$expected"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/observed-font-files.txt"
          diff -u "$expected" "$RUNNER_TEMP/observed-font-files.txt"
          git diff --cached --check
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat(pixel-font): productionize reusable v2.1 pipeline" -m "Add independent per-face pixel masters, variable glyph metrics, full Western game coverage, collision and confusable QA, deterministic PNG/BMFont/Godot delivery, verified optional TTF generation, native specimens, bounded ChatGPT/Claude MCP tools, and exact Godot 4.6.2 import/render evidence."
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:refs/heads/$READY_BRANCH"
