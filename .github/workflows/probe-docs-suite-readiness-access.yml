name: Validate Docs Book Universal Readiness

on:
  push:
    branches:
      - automation/validate-docs-book-universal-readiness-20260804
    paths:
      - ".github/workflows/probe-docs-suite-readiness-access.yml"
      - "validation/docs-book-universal-readiness/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-docs-suite-readiness-access.yml"
      - "validation/docs-book-universal-readiness/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-book-universal-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prove exact Docs Suite source and test blobs
        shell: bash
        run: |
          set -euo pipefail
          project_contracts="$(git hash-object validation/docs-book-universal-readiness/packages/core/src/book-studio-project-contracts.ts)"
          readiness="$(git hash-object validation/docs-book-universal-readiness/packages/core/src/book-studio-universal-readiness.ts)"
          governance="$(git hash-object validation/docs-book-universal-readiness/packages/core/src/book-studio-universal-readiness-governance.ts)"
          readiness_test="$(git hash-object validation/docs-book-universal-readiness/packages/core/test/book-studio-universal-readiness.test.mjs)"
          governance_test="$(git hash-object validation/docs-book-universal-readiness/packages/core/test/book-studio-universal-readiness-governance.test.mjs)"
          printf 'project_contracts=%s\nreadiness=%s\ngovernance=%s\nreadiness_test=%s\ngovernance_test=%s\n' \
            "$project_contracts" "$readiness" "$governance" "$readiness_test" "$governance_test"
          test "$project_contracts" = "fa5fd3bf4ceb314cb4926add4231d22cb82863d6"
          test "$readiness" = "3c348b4969d94f2e81a7a4e8e0f9c2399850e640"
          test "$governance" = "aac0ff806dbfc41259b4925918a96103a5615489"
          test "$readiness_test" = "de9f0e5287cefca3cd13e5455a0ca456bdda645c"
          test "$governance_test" = "b840c94f280ea1280879a0f0a338d8eefad51e57"

      - name: Install validation-only compiler tools
        run: npm install --prefix validation/docs-book-universal-readiness --no-save --package-lock=false --ignore-scripts typescript@5.9.3 tsx@4.20.3

      - name: Compile the readiness boundary strictly
        run: validation/docs-book-universal-readiness/node_modules/.bin/tsc -p validation/docs-book-universal-readiness/tsconfig.json

      - name: Run universal project, governance and edge-case attacks
        run: validation/docs-book-universal-readiness/node_modules/.bin/tsx --test validation/docs-book-universal-readiness/packages/core/test/book-studio-universal-readiness.test.mjs validation/docs-book-universal-readiness/packages/core/test/book-studio-universal-readiness-governance.test.mjs

      - name: Verify no Art Studio production source changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          merge_base="$(git merge-base HEAD origin/main)"
          test -n "$merge_base"
          unexpected="$(git diff --name-only "$merge_base" HEAD | grep -Ev '^(\.github/workflows/probe-docs-suite-readiness-access\.yml|validation/docs-book-universal-readiness/)' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }
