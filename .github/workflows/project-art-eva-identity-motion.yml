name: EVA Identity Motion Release

on:
  push:
    branches: [main]
    paths:
      - "scripts/project-art/eva-identity-motion-release.mjs"
      - "scripts/test-project-art-eva-identity-motion-release.mjs"
      - "docs/PROJECT_ART_EVA_IDENTITY_MOTION.md"
      - ".github/workflows/project-art-eva-identity-motion.yml"
  pull_request:
    paths:
      - "scripts/project-art/eva-identity-motion-release.mjs"
      - "scripts/test-project-art-eva-identity-motion-release.mjs"
      - "docs/PROJECT_ART_EVA_IDENTITY_MOTION.md"
      - ".github/workflows/project-art-eva-identity-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-identity-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use governed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Validate EVA identity motion
        run: node --test scripts/test-project-art-eva-identity-motion-release.mjs
