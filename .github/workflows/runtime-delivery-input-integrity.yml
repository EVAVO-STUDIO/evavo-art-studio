name: Runtime delivery input integrity

on:
  pull_request:
    paths:
      - "packages/runtime/src/pg-boss-delivery.ts"
      - "packages/runtime/test/delivery-input-integrity-security.test.mjs"
      - "packages/runtime/test/runtime.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-delivery-input-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "packages/runtime/src/pg-boss-delivery.ts"
      - "packages/runtime/test/delivery-input-integrity-security.test.mjs"
      - "packages/runtime/test/runtime.test.mjs"
      - "scripts/bootstrap-ci-media-tools.sh"
      - ".github/workflows/runtime-delivery-input-integrity.yml"

permissions:
  contents: read

concurrency:
  group: runtime-delivery-input-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Install and identify media tools
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check runtime delivery dependencies
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-runtime build
          pnpm --filter @evavo/art-runtime typecheck

      - name: Run runtime delivery and persistence regressions
        run: >-
          node --test
          packages/runtime/test/runtime.test.mjs
          packages/runtime/test/redrive-policy.test.mjs
          packages/runtime/test/journal-integrity-security.test.mjs
          packages/runtime/test/submission-integrity-security.test.mjs
          packages/runtime/test/worker-options-integrity-security.test.mjs
          packages/runtime/test/control-options-integrity-security.test.mjs
          packages/runtime/test/claim-input-integrity-security.test.mjs
          packages/runtime/test/transition-clock-integrity-security.test.mjs
          packages/runtime/test/execution-result-input-integrity-security.test.mjs
          packages/runtime/test/read-input-integrity-security.test.mjs
          packages/runtime/test/repository-input-boundary-security.test.mjs
          packages/runtime/test/delivery-input-integrity-security.test.mjs

      - name: Verify permanent runtime delivery contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'snapshotOptions' packages/runtime/src/pg-boss-delivery.ts
          grep -F 'snapshotClient' packages/runtime/src/pg-boss-delivery.ts
          grep -F 'snapshotDeliveryJob' packages/runtime/src/pg-boss-delivery.ts
          grep -F 'snapshotWorkBatch' packages/runtime/src/pg-boss-delivery.ts
          grep -F 'typeof connection === "string"' packages/runtime/src/pg-boss-delivery.ts
          grep -F '#queuePreparations' packages/runtime/src/pg-boss-delivery.ts
          grep -F '#subscriptionOperations' packages/runtime/src/pg-boss-delivery.ts
          grep -F '#inFlight' packages/runtime/src/pg-boss-delivery.ts
          grep -F 'delivery options and client methods are snapshotted exactly once' packages/runtime/test/delivery-input-integrity-security.test.mjs
          grep -F 'publish snapshots job identity and clock before asynchronous queue work' packages/runtime/test/delivery-input-integrity-security.test.mjs
          grep -F 'start and queue preparation are single-flight under concurrency' packages/runtime/test/delivery-input-integrity-security.test.mjs
          grep -F 'subscription registration is atomic and inbound batches are detached' packages/runtime/test/delivery-input-integrity-security.test.mjs
          grep -F 'stop drains in-flight publishes before stopping the client' packages/runtime/test/delivery-input-integrity-security.test.mjs
          grep -F 'delivery command and transport outputs fail closed before client mutation' packages/runtime/test/delivery-input-integrity-security.test.mjs
          ! grep -F 'normalizeJson(job.data)' packages/runtime/src/pg-boss-delivery.ts
          ! grep -F 'enqueuedAt: now.toISOString()' packages/runtime/src/pg-boss-delivery.ts

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
