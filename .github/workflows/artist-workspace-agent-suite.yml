name: Artist Workspace agent suite

# Compatibility anchors retained for the permanent v1 guard:
# tools/project_art_workspace_catalog_mcp.mjs
# tools/project_art_workspace_jobs_mcp.mjs
# scripts/check-persistent-artist-workspace-catalog.mjs
# scripts/check-persistent-artist-workspace-jobs.mjs

on:
  pull_request:
    paths:
      - "config/artist-workspace-agent-suite.v*.json"
      - "config/avatar-final-pass-provider-runtime-outcome.example.json"
      - "config/mcp.project-art-*.json"
      - "config/mcp.persistent-artist-workspace-*.json"
      - "docs/ARTIST_WORKSPACE_AGENT_SUITE.md"
      - "docs/PERSISTENT_ARTIST_WORKSPACE_JOBS.md"
      - "docs/PROJECT_ART_AVATAR_*.md"
      - "scripts/avatar-*.mjs"
      - "scripts/check-artist-workspace-*.mjs"
      - "scripts/check-persistent-artist-workspace-*.mjs"
      - "scripts/check-project-art-avatar-*.mjs"
      - "scripts/project-art/avatar-*.mjs"
      - "scripts/project-art/persistent-workspace-jobs.mjs"
      - "scripts/test-persistent-artist-workspace-jobs.mjs"
      - "scripts/test-project-art-avatar-*.mjs"
      - "scripts/test-project-art-workspace-jobs-mcp.mjs"
      - "tools/project_art_avatar_*.mjs"
      - "tools/project_art_workspace_*.mjs"
      - ".github/workflows/artist-workspace-agent-suite.yml"
  push:
    branches:
      - main
    paths:
      - "config/artist-workspace-agent-suite.v*.json"
      - "config/avatar-final-pass-provider-runtime-outcome.example.json"
      - "config/mcp.project-art-*.json"
      - "config/mcp.persistent-artist-workspace-*.json"
      - "docs/ARTIST_WORKSPACE_AGENT_SUITE.md"
      - "docs/PERSISTENT_ARTIST_WORKSPACE_JOBS.md"
      - "docs/PROJECT_ART_AVATAR_*.md"
      - "scripts/avatar-*.mjs"
      - "scripts/check-artist-workspace-*.mjs"
      - "scripts/check-persistent-artist-workspace-*.mjs"
      - "scripts/check-project-art-avatar-*.mjs"
      - "scripts/project-art/avatar-*.mjs"
      - "scripts/project-art/persistent-workspace-jobs.mjs"
      - "scripts/test-persistent-artist-workspace-jobs.mjs"
      - "scripts/test-project-art-avatar-*.mjs"
      - "scripts/test-project-art-workspace-jobs-mcp.mjs"
      - "tools/project_art_avatar_*.mjs"
      - "tools/project_art_workspace_*.mjs"
      - ".github/workflows/artist-workspace-agent-suite.yml"
  workflow_dispatch:

# Canonical v6 path anchors checked by the integration guard:
# config/artist-workspace-agent-suite.v6.json
# config/mcp.project-art-avatar-sequence-release.windows.example.json
# docs/PROJECT_ART_AVATAR_SEQUENCE_RELEASE.md
# scripts/avatar-sequence-release-cli.mjs
# scripts/check-artist-workspace-avatar-sequence-release-integration.mjs
# scripts/check-project-art-avatar-sequence-release-suite.mjs
# scripts/project-art/avatar-sequence-release*.mjs
# scripts/test-project-art-avatar-sequence-release*.mjs
# tools/project_art_avatar_sequence_release_mcp.mjs

permissions:
  contents: read

concurrency:
  group: artist-workspace-agent-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify canonical agent workspace deployment
        run: node scripts/check-artist-workspace-agent-suite.mjs

      - name: Prove exact source remains clean
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
