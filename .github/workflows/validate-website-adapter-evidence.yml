name: Validate Website Book Studio Adapter Evidence

on:
  push:
    branches:
      - automation/validate-website-adapter-evidence-20260804
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-website-adapter-evidence.yml"
      - "validation/website-adapter-evidence/**"

permissions:
  contents: read

concurrency:
  group: validate-website-adapter-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact validation commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate exact fingerprints, repository heads and authority gates
        run: node validation/website-adapter-evidence/check.mjs
      - name: Verify validation source syntax
        run: node --check validation/website-adapter-evidence/check.mjs
      - name: Prove validation leaves no tracked source changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
