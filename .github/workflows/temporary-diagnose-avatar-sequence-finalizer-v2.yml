name: Temporary diagnose avatar sequence finalizer v2

on:
  push:
    branches:
      - automation/apply-avatar-sequence-finalizer-v2-20260811

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/avatar-finalizer-diagnostics"
          parts=(.evavo/automation/avatar-sequence-finalizer-parts/part-{aa..aq})
          cat "${parts[@]}" > "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz.b64"
          sha256sum "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz.b64" | tee "$RUNNER_TEMP/avatar-finalizer-diagnostics/base64.sha256"
          base64 --decode "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz.b64" > "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz"
          sha256sum "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz" | tee "$RUNNER_TEMP/avatar-finalizer-diagnostics/payload.sha256"
          tar -tzf "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz" | sort > "$RUNNER_TEMP/avatar-finalizer-diagnostics/payload-paths.txt"
          tar -xzf "$RUNNER_TEMP/avatar-sequence-finalizer-files.tar.gz" -C .

      - name: Route Python bytecode outside the repository
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/avatar-sequence-finalizer-pycache"
          mkdir -p "$PYTHON_CACHE_ROOT"
          echo "PYTHONPYCACHEPREFIX=$PYTHON_CACHE_ROOT" >> "$GITHUB_ENV"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact Pillow runtime
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Run diagnostic command matrix
        shell: bash
        run: |
          set -u
          diagnostics="$RUNNER_TEMP/avatar-finalizer-diagnostics"
          : > "$diagnostics/commands.log"
          printf 'node=%s\n' "$(node --version)" >> "$diagnostics/commands.log"
          printf 'python=%s\n' "$(python --version 2>&1)" >> "$diagnostics/commands.log"
          printf 'pillow=%s\n' "$(python -c 'import PIL; print(PIL.__version__)' 2>&1)" >> "$diagnostics/commands.log"
          commands=(
            'node scripts/check-project-art-avatar-sequence.mjs'
            'node scripts/test-project-art-avatar-sequence.mjs'
            'node scripts/test-project-art-avatar-sequence-mcp.mjs'
            'node scripts/check-project-art-avatar-sequence-finalization.mjs'
            'node scripts/test-project-art-avatar-sequence-finalization.mjs'
            'node scripts/test-project-art-avatar-sequence-finalizer-mcp.mjs'
            'node scripts/check-project-art-loop-closure.mjs'
            'node scripts/test-project-art-loop-closure.mjs'
            'node scripts/check-project-art-workbench.mjs'
            'node scripts/test-project-art-workbench.mjs'
            'node scripts/check-persistent-artist-workspace.mjs'
            'node scripts/test-persistent-artist-workspace.mjs'
            'node scripts/check-project-art-mastering-and-motion.mjs'
            'node scripts/test-project-art-mastering-and-motion.mjs'
            'node -e '\''JSON.parse(require("node:fs").readFileSync("package.json", "utf8"));'\'''
          )
          failures=0
          index=0
          for command in "${commands[@]}"; do
            index=$((index + 1))
            log="$diagnostics/command-${index}.log"
            printf '\n[%02d] %s\n' "$index" "$command" | tee -a "$diagnostics/commands.log"
            bash -lc "$command" > "$log" 2>&1
            status=$?
            printf 'exit=%d log=%s\n' "$status" "$(basename "$log")" | tee -a "$diagnostics/commands.log"
            if (( status != 0 )); then failures=$((failures + 1)); fi
          done
          git status --short --untracked-files=all > "$diagnostics/git-status.txt"
          printf 'failures=%d\n' "$failures" | tee -a "$diagnostics/commands.log"
          exit 0

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avatar-sequence-finalizer-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/avatar-finalizer-diagnostics
          if-no-files-found: warn
          retention-days: 1
