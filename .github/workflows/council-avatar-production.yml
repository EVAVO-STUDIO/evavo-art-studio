name: Optional Council avatar production validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: council-avatar-production-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact requested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Route Python bytecode to runner-temporary storage
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/council-avatar-python-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact procedural review backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact provider and worker implementations
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-worker build

      - name: Compile deterministic Council summaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compile-project-art-council-avatar-procedural-review.mjs summary
          node scripts/compile-project-art-council-avatar-procedural-review.mjs capabilities
          node scripts/compile-project-art-council-identity-candidate-campaign.mjs summary
          node scripts/compile-project-art-council-identity-candidate-campaign.mjs capabilities
          node scripts/compile-project-art-council-identity-anchor-admission.mjs summary
          node scripts/compile-project-art-council-identity-anchor-admission.mjs capabilities

      - name: Run procedural renderer and atlas round-trip proofs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/project-art/council-avatar-procedural-renderer.py --self-test
          ATLAS_OUTPUT="${RUNNER_TEMP}/council-avatar-review-atlases"
          rm -rf "${ATLAS_OUTPUT}"
          python scripts/project-art/compile-council-avatar-review-atlases.py \
            --renderer scripts/project-art/council-avatar-procedural-renderer.py \
            --output "${ATLAS_OUTPUT}"
          test -s "${ATLAS_OUTPUT}/atlas-manifest.json"

      - name: Run Council governance regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/test-project-art-council-avatar-production.mjs \
            scripts/test-project-art-council-avatar-procedural-review.mjs \
            scripts/test-project-art-council-avatar-identity-bootstrap.mjs \
            scripts/test-project-art-council-avatar-media-readiness.mjs \
            scripts/test-project-art-council-avatar-animation-suite.mjs \
            scripts/test-project-art-council-identity-candidate-campaign.mjs \
            scripts/test-project-art-council-identity-candidate-campaign-mcp.mjs \
            scripts/test-project-art-council-identity-anchor-admission.mjs \
            scripts/test-project-art-council-identity-anchor-admission-mcp.mjs

      - name: Run governed provider fixture regressions
        env:
          EVAVO_ART_ENABLE_FIXTURE_PROVIDER: "true"
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-project-art-character-identity-provider-runtime.mjs
          node --test \
            scripts/test-project-art-council-identity-anchor-admission.mjs \
            scripts/test-project-art-council-identity-anchor-admission-mcp.mjs

      - name: Confirm validation changed no repository source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
