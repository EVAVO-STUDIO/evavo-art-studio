name: Apply final RAW ART admission fixture correction

on:
  push:
    branches:
      - agent/raw-art-provider-execution-authority-20260809
    paths:
      - ".github/workflows/debug-raw-art-admission-regression.yml"

permissions:
  contents: write

concurrency:
  group: apply-final-raw-art-admission-fixture-correction
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact correction source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind conflict fixture to canonical provider submission
        shell: bash
        env:
          EXPECTED_PARENT: 6c1689ddde1489a1e931ed8cb7179f5bbe35c481
          TARGET_BRANCH: agent/raw-art-provider-execution-authority-20260809
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-raw-art-provider-runtime-admission.mjs')
          source = path.read_text(encoding='utf-8')
          old = """    const conflictSelectionJob = {\n      ...selection.jobs[1],\n      batchEntry: conflictBatch.jobs[1],\n    };\n"""
          new = """    const conflictSelectionJob = {\n      ...selection.jobs[1],\n      batchEntry: {\n        ...conflictBatch.jobs[1],\n        runtimeJob: conflictBatch.jobs[1].contract.runtimeJob,\n      },\n    };\n"""
          if source.count(old) != 1:
              raise SystemExit('expected one legacy conflict fixture')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          node --check scripts/check-raw-art-provider-runtime-admission.mjs
          git diff --check
          test "$(git diff --name-only)" = "scripts/check-raw-art-provider-runtime-admission.mjs"
          test "$(grep -c 'runtimeJob: .*contract.runtimeJob' scripts/check-raw-art-provider-runtime-admission.mjs)" = "2"

          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add scripts/check-raw-art-provider-runtime-admission.mjs
          git commit -m "test(raw-art): bind conflict fixture to provider submission"
          git push origin "HEAD:${TARGET_BRANCH}"
