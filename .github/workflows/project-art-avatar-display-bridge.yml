name: Project Art Avatar Display Bridge

on:
  push:
    branches: [main]
    paths:
      - "scripts/project-art/avatar-display-bridge.mjs"
      - "scripts/test-project-art-avatar-display-bridge.mjs"
      - "docs/PROJECT_ART_AVATAR_DISPLAY_BRIDGE.md"
      - ".github/workflows/project-art-avatar-display-bridge.yml"
  pull_request:
    paths:
      - "scripts/project-art/avatar-display-bridge.mjs"
      - "scripts/test-project-art-avatar-display-bridge.mjs"
      - "docs/PROJECT_ART_AVATAR_DISPLAY_BRIDGE.md"
      - ".github/workflows/project-art-avatar-display-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-art-avatar-display-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Continuous cadence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Verify runner and display bridge
        run: |
          node --version
          node --test scripts/test-project-art-avatar-display-bridge.mjs
