name: Pixel Font Studio

on:
  pull_request:
    paths:
      - "scripts/pixel-font/**"
      - "scripts/pixel-font-studio.mjs"
      - "scripts/pixel-font-studio-mcp.mjs"
      - "scripts/build-brass-brine-pixel-font-family.mjs"
      - "scripts/pixel-font-studio.test.mjs"
      - "scripts/pixel-font-brass-brine.test.mjs"
      - "scripts/check-pixel-font-studio.mjs"
      - "config/pixel-font-studio.v1.json"
      - "config/pixel-font-family.example.v1.json"
      - "config/pixel-font-family.brass-brine.v1.json"
      - "config/mcp.pixel-font-studio.windows.example.json"
      - "docs/PIXEL_FONT_STUDIO.md"
      - "docs/BRASS_BRINE_PIXEL_FONT_FAMILY.md"
      - "evavo.reliability.json"
      - "package.json"
      - ".github/workflows/pixel-font-studio.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/pixel-font/**"
      - "scripts/pixel-font-studio.mjs"
      - "scripts/pixel-font-studio-mcp.mjs"
      - "scripts/build-brass-brine-pixel-font-family.mjs"
      - "scripts/pixel-font-studio.test.mjs"
      - "scripts/pixel-font-brass-brine.test.mjs"
      - "scripts/check-pixel-font-studio.mjs"
      - "config/pixel-font-studio.v1.json"
      - "config/pixel-font-family.example.v1.json"
      - "config/pixel-font-family.brass-brine.v1.json"
      - "config/mcp.pixel-font-studio.windows.example.json"
      - "docs/PIXEL_FONT_STUDIO.md"
      - "docs/BRASS_BRINE_PIXEL_FONT_FAMILY.md"
      - "evavo.reliability.json"
      - "package.json"
      - ".github/workflows/pixel-font-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-font-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"

      - name: Install exact Pixel Font Studio v2 TTF dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pixel Font Studio
        run: pnpm run pixel-font:check

      - name: Build exact Brass & Brine production family
        run: |
          set -euo pipefail
          node scripts/build-brass-brine-pixel-font-family.mjs \
            --output "$RUNNER_TEMP/brass-brine-pixel-font" \
            --plan-output "$RUNNER_TEMP/brass-brine-pixel-font.plan.json"

      - name: Upload exact generated Brass & Brine family
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brass-brine-pixel-font-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/brass-brine-pixel-font/**
            ${{ runner.temp }}/brass-brine-pixel-font.plan.json

      - name: Prove source tree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
