name: Art Studio exact mainline validation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character current main commit SHA
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: art-studio-ci-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ART_STUDIO_EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      ART_STUDIO_REQUEST_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.request_source || 'github-main-push' }}
    steps:
      - name: Validate governed mainline trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ART_STUDIO_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid expected SHA" >&2; exit 1; }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Validation must run from main" >&2; exit 1; }
          [[ "${ART_STUDIO_EXPECTED_SHA}" == "${GITHUB_SHA}" ]] || { echo "Expected SHA must equal the triggered main SHA" >&2; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${ART_STUDIO_REQUEST_SOURCE}" == "evavo-development-studio" ]] || { echo "Unsupported manual request_source" >&2; exit 1; }
          else
            [[ "${GITHUB_EVENT_NAME}" == "push" ]] || { echo "Unsupported workflow event" >&2; exit 1; }
            [[ "${ART_STUDIO_REQUEST_SOURCE}" == "github-main-push" ]] || { echo "Invalid automatic request source" >&2; exit 1; }
          fi

      - name: Check out exact mainline candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ART_STUDIO_EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current mainline candidate and clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${ART_STUDIO_EXPECTED_SHA}" ]]
          git show-ref --verify --quiet refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${ART_STUDIO_EXPECTED_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs

      - name: Run adversarial toolchain fixtures
        run: node scripts/test-repository-toolchain.mjs

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Remove generated lockfile and verify clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Re-prove candidate is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${ART_STUDIO_EXPECTED_SHA}" ]] || { echo "Candidate was superseded before receipt creation" >&2; exit 1; }

      - name: Write bounded validation receipt
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const receipt = {
            "schemaVersion": "1.1",
            "repository": "EVAVO-STUDIO/evavo-art-studio",
            "candidateSha": process.env.ART_STUDIO_EXPECTED_SHA,
            "trigger": process.env.GITHUB_EVENT_NAME,
            "requestSource": process.env.ART_STUDIO_REQUEST_SOURCE,
            "currentMainAtReceipt": true,
            "node": "22.14.0",
            "pnpm": "10.13.1",
            "lockfilePolicy": "review-first",
            "installedWithoutCommittedLockfile": true,
            "validation": "passed",
            "liveProviderRequest": false,
            "artifactPromotion": false,
            "deployment": "disabled"
          };
          const target = path.join(process.env.RUNNER_TEMP, "art-studio-validation-receipt.json");
          fs.writeFileSync(target, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
          NODE

      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: art-studio-validation-${{ env.ART_STUDIO_EXPECTED_SHA }}
          path: ${{ runner.temp }}/art-studio-validation-receipt.json
          if-no-files-found: warn
          retention-days: 14
