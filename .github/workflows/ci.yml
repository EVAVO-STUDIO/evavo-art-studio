name: Art Studio exact mainline validation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character current main commit SHA
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: art-studio-ci-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ART_STUDIO_EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      ART_STUDIO_REQUEST_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.request_source || 'github-main-push' }}
    steps:
      - name: Validate governed mainline trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ART_STUDIO_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid expected SHA" >&2; exit 1; }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Validation must run from main" >&2; exit 1; }
          [[ "${ART_STUDIO_EXPECTED_SHA}" == "${GITHUB_SHA}" ]] || { echo "Expected SHA must equal the triggered main SHA" >&2; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${ART_STUDIO_REQUEST_SOURCE}" == "evavo-development-studio" ]] || { echo "Unsupported manual request_source" >&2; exit 1; }
          else
            [[ "${GITHUB_EVENT_NAME}" == "push" ]] || { echo "Unsupported workflow event" >&2; exit 1; }
            [[ "${ART_STUDIO_REQUEST_SOURCE}" == "github-main-push" ]] || { echo "Invalid automatic request source" >&2; exit 1; }
          fi

      - name: Check out exact mainline candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ART_STUDIO_EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current mainline candidate and clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${ART_STUDIO_EXPECTED_SHA}" ]]
          git show-ref --verify --quiet refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${ART_STUDIO_EXPECTED_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Install and identify audio media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          FFMPEG_PATH="$(command -v ffmpeg)"
          FFPROBE_PATH="$(command -v ffprobe)"
          test -x "${FFMPEG_PATH}"
          test -x "${FFPROBE_PATH}"
          FFMPEG_VERSION="$(${FFMPEG_PATH} -version | head -n 1)"
          FFPROBE_VERSION="$(${FFPROBE_PATH} -version | head -n 1)"
          FFMPEG_SHA256="$(sha256sum "${FFMPEG_PATH}" | awk '{print $1}')"
          FFPROBE_SHA256="$(sha256sum "${FFPROBE_PATH}" | awk '{print $1}')"
          echo "FFMPEG_BIN=${FFMPEG_PATH}" >> "${GITHUB_ENV}"
          echo "FFPROBE_BIN=${FFPROBE_PATH}" >> "${GITHUB_ENV}"
          echo "ART_STUDIO_FFMPEG_VERSION=${FFMPEG_VERSION}" >> "${GITHUB_ENV}"
          echo "ART_STUDIO_FFPROBE_VERSION=${FFPROBE_VERSION}" >> "${GITHUB_ENV}"
          echo "ART_STUDIO_FFMPEG_SHA256=${FFMPEG_SHA256}" >> "${GITHUB_ENV}"
          echo "ART_STUDIO_FFPROBE_SHA256=${FFPROBE_SHA256}" >> "${GITHUB_ENV}"

      - name: Route Python bytecode to runner-temporary storage
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/python-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-image-pipeline.txt

      - name: Install exact image backend
        run: python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt

      - name: Verify exact Python image toolchain
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_VERSION="$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          PILLOW_VERSION="$(python -c 'import PIL; print(PIL.__version__)')"
          [[ "${PYTHON_VERSION}" == "3.13.5" ]]
          [[ "${PILLOW_VERSION}" == "12.2.0" ]]
          echo "ART_STUDIO_PYTHON_VERSION=${PYTHON_VERSION}" >> "${GITHUB_ENV}"
          echo "ART_STUDIO_PILLOW_VERSION=${PILLOW_VERSION}" >> "${GITHUB_ENV}"

      - name: Compile Brass creative evaluation sources
        run: >-
          python -m py_compile
          tools/brass_creative_evaluation.py
          tools/evaluate_brass_creative_candidate.py
          tools/evaluate_brass_animation_sequence.py
          tools/verify_brass_creative_evaluation.py

      - name: Verify Brass exact-byte evidence and create-only publication
        run: python tools/verify_brass_creative_evaluation.py

      - name: Prove Python bytecode remains outside the repository
        shell: bash
        run: |
          set -euo pipefail
          test -d "${PYTHONPYCACHEPREFIX}"
          test ! -e tools/__pycache__
          test -z "$(find tools -type f -name '*.pyc' -print -quit)"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify committed lockfile identity
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- pnpm-lock.yaml
          LOCKFILE_SHA256="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          [[ "${LOCKFILE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          echo "ART_STUDIO_LOCKFILE_SHA256=${LOCKFILE_SHA256}" >> "${GITHUB_ENV}"

      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs

      - name: Run adversarial toolchain fixtures
        run: node scripts/test-repository-toolchain.mjs

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Verify immutable lockfile and clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ART_STUDIO_LOCKFILE_SHA256:-}"
          [[ "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" == "${ART_STUDIO_LOCKFILE_SHA256}" ]]
          test ! -e tools/__pycache__
          test -z "$(find tools -type f -name '*.pyc' -print -quit)"
          git diff --exit-code -- pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Re-prove candidate is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${ART_STUDIO_EXPECTED_SHA}" ]] || { echo "Candidate was superseded before receipt creation" >&2; exit 1; }

      - name: Write bounded validation receipt
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const receipt = {
            "schemaVersion": "1.3",
            "repository": "EVAVO-STUDIO/evavo-art-studio",
            "candidateSha": process.env.ART_STUDIO_EXPECTED_SHA,
            "trigger": process.env.GITHUB_EVENT_NAME,
            "requestSource": process.env.ART_STUDIO_REQUEST_SOURCE,
            "currentMainAtReceipt": true,
            "node": "22.14.0",
            "pnpm": "10.13.1",
            "python": process.env.ART_STUDIO_PYTHON_VERSION,
            "pillow": process.env.ART_STUDIO_PILLOW_VERSION,
            "brassCreativeEvidence": {
              "descriptorBoundSourceReads": true,
              "decodedPixelsFromRetainedSourceBytes": true,
              "singleFrameSourcesOnly": true,
              "atomicCreateOnlyPublication": true,
              "publishedEvidenceByteVerification": true
            },
            "mediaTools": {
              "ffmpeg": {
                "path": process.env.FFMPEG_BIN,
                "version": process.env.ART_STUDIO_FFMPEG_VERSION,
                "sha256": process.env.ART_STUDIO_FFMPEG_SHA256
              },
              "ffprobe": {
                "path": process.env.FFPROBE_BIN,
                "version": process.env.ART_STUDIO_FFPROBE_VERSION,
                "sha256": process.env.ART_STUDIO_FFPROBE_SHA256
              }
            },
            "lockfilePolicy": "committed-frozen",
            "lockfileSha256": process.env.ART_STUDIO_LOCKFILE_SHA256,
            "installedWithoutCommittedLockfile": false,
            "validation": "passed",
            "liveProviderRequest": false,
            "artifactPromotion": false,
            "deployment": "disabled"
          };
          const target = path.join(process.env.RUNNER_TEMP, "art-studio-validation-receipt.json");
          fs.writeFileSync(target, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
          NODE

      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: art-studio-validation-${{ env.ART_STUDIO_EXPECTED_SHA }}
          path: ${{ runner.temp }}/art-studio-validation-receipt.json
          if-no-files-found: warn
          retention-days: 14
