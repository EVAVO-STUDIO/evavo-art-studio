name: Retry avatar provider candidate source transfer

on:
  push:
    branches:
      - agent/avatar-provider-candidate-materialization-v1
    paths:
      - .github/workflows/bootstrap-avatar-provider-candidate-transfer-retry.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: bootstrap-avatar-provider-candidate-retry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact transfer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild verified source without workflow mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, re, stat, tarfile, urllib.request
          from pathlib import Path, PurePosixPath

          repo = "EVAVO-STUDIO/evavo-art-studio"
          issue = 246
          archive_sha = "fad2a2218cfecf83e72fe8ff75a224d0580bd3e35521e4b5677a27268f7bdc15"
          artist_workflow = ".github/workflows/artist-workspace-agent-suite.yml"
          expected = {
            artist_workflow,
            "config/artist-workspace-agent-suite.v4.json",
            "config/mcp.project-art-avatar-final-pass-provider-candidate.windows.example.json",
            "config/mcp.project-art-workspace.windows.example.json",
            "docs/ARTIST_WORKSPACE_AGENT_SUITE.md",
            "docs/PROJECT_ART_AVATAR_FINAL_PASS_PROVIDER_CANDIDATE.md",
            "scripts/avatar-final-pass-provider-candidate-cli.mjs",
            "scripts/check-artist-workspace-agent-suite.mjs",
            "scripts/check-artist-workspace-avatar-provider-candidate-integration.mjs",
            "scripts/check-project-art-avatar-final-pass-provider-candidate-suite.mjs",
            "scripts/check-project-art-avatar-final-pass-provider-candidate.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate-common.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate-constants.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate-fixture.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate-materialize.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate-png.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate-source.mjs",
            "scripts/project-art/avatar-final-pass-provider-candidate.mjs",
            "scripts/test-project-art-avatar-final-pass-provider-candidate-mcp.mjs",
            "scripts/test-project-art-avatar-final-pass-provider-candidate.mjs",
            "tools/project_art_avatar_final_pass_provider_candidate_mcp.mjs",
          }
          request = urllib.request.Request(
            f"https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100",
            headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "evavo-avatar-provider-candidate-bootstrap-retry/1",
            },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
            comments = json.load(response)
          pattern = re.compile(r"^EVAVO_TRANSFER_CHUNK ([1-3])/3\n([A-Za-z0-9+/=]+)$")
          chunks = {}
          for comment in comments:
            match = pattern.fullmatch(comment.get("body", ""))
            if match:
              index = int(match.group(1))
              if index in chunks:
                raise SystemExit(f"duplicate chunk {index}")
              chunks[index] = match.group(2)
          if set(chunks) != {1, 2, 3}:
            raise SystemExit(f"missing transfer chunks: {sorted(chunks)}")
          archive = base64.b64decode("".join(chunks[i] for i in (1, 2, 3)), validate=True)
          if hashlib.sha256(archive).hexdigest() != archive_sha:
            raise SystemExit("transfer archive SHA-256 mismatch")

          files = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as bundle:
            for member in bundle.getmembers():
              name = member.name[2:] if member.name.startswith("./") else member.name
              if name in {"", "."} and member.isdir():
                continue
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or "\\" in name or "\x00" in name:
                raise SystemExit(f"unsafe archive member: {name}")
              if member.isdir():
                continue
              if not member.isfile() or member.issym() or member.islnk() or member.isdev():
                raise SystemExit(f"non-regular archive member: {name}")
              if stat.S_IMODE(member.mode) & 0o022 or name in files:
                raise SystemExit(f"unsafe or duplicate archive member: {name}")
              source = bundle.extractfile(member)
              if source is None:
                raise SystemExit(f"unreadable archive member: {name}")
              files[name] = source.read()

          manifest_raw = files.pop(".evavo-transfer-manifest.json", None)
          if manifest_raw is None:
            raise SystemExit("transfer manifest missing")
          manifest = json.loads(manifest_raw)
          hashes = manifest.get("files")
          if manifest.get("schema") != "evavo.avatar-provider-candidate-transfer.v1":
            raise SystemExit("transfer manifest schema mismatch")
          if not isinstance(hashes, dict) or set(hashes) != expected or set(files) != expected:
            raise SystemExit("transfer path set mismatch")

          root = Path.cwd().resolve()
          for relative in sorted(expected):
            data = files[relative]
            if hashlib.sha256(data).hexdigest() != hashes[relative]:
              raise SystemExit(f"payload SHA-256 mismatch: {relative}")
            target = root.joinpath(*PurePosixPath(relative).parts)
            if not target.resolve(strict=False).is_relative_to(root) or target.is_symlink():
              raise SystemExit(f"unsafe target: {relative}")
            target.parent.mkdir(parents=True, exist_ok=True)
            temporary = target.with_name(f".{target.name}.evavo-transfer")
            temporary.write_bytes(data)
            os.chmod(temporary, 0o644)
            os.replace(temporary, target)
            if hashlib.sha256(target.read_bytes()).hexdigest() != hashes[relative]:
              raise SystemExit(f"post-write SHA-256 mismatch: {relative}")

          Path("/tmp/evavo-avatar-provider-candidate-paths.txt").write_text(
            "\n".join(sorted(expected)) + "\n", encoding="utf-8"
          )
          print(f"Verified and materialized {len(expected)} exact files.")
          PY

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Validate exact candidate source
        run: |
          while IFS= read -r file; do
            case "$file" in
              *.mjs) node --check "$file" ;;
              *.json) node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file" ;;
            esac
          done < /tmp/evavo-avatar-provider-candidate-paths.txt
          node scripts/check-project-art-avatar-final-pass-provider-candidate-suite.mjs
          node scripts/check-artist-workspace-avatar-provider-candidate-integration.mjs
          node scripts/check-artist-workspace-agent-suite.mjs
          git diff --check

      - name: Commit only non-workflow source
        run: |
          git checkout -- .github/workflows/artist-workspace-agent-suite.yml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          expected = set(Path('/tmp/evavo-avatar-provider-candidate-paths.txt').read_text().splitlines())
          expected.remove('.github/workflows/artist-workspace-agent-suite.yml')
          observed = {
            line[3:] for line in subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True, capture_output=True, text=True
            ).stdout.splitlines() if line
          }
          if observed != expected:
            raise SystemExit(f"unexpected working-tree scope: {sorted(observed)}")
          subprocess.run(['git', 'add', '-A', '--', *sorted(expected)], check=True)
          staged = set(subprocess.run(
            ['git', 'diff', '--cached', '--name-only'],
            check=True, capture_output=True, text=True
          ).stdout.splitlines())
          if staged != expected:
            raise SystemExit(f"unexpected staged scope: {sorted(staged)}")
          PY
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat(avatar): materialize verified provider candidates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
