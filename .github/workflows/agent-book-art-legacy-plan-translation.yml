              '      restParity: true,\n',
              '      legacyPlanTranslation: true,\n      legacyPlanTranslationRequiresCanonicalBrief: true,\n      rawLegacyPromptTrustedAsAuthority: false,\n      restParity: true,\n',
          )

          docs = "docs/book-art-provider-runtime.md"
          docs_append = '''
          ## Legacy Website plan translation

          Art Studio exposes the existing exact legacy Website cover-plan translator through all operator surfaces:

          ```text
          GET  /v1/book-art/legacy-plan-runtime
          POST /v1/book-art/legacy-plans/translate

          evavo-art book-art-legacy-plan-protocol
          evavo-art book-art-legacy-plan-translate --input legacy-plan-translation.json

          book_art_legacy_plan_translation_protocol
          translate_legacy_website_book_art_plan
          ```

          Translation requires both the exact retained `book_cover_artwork_generation_plan_v1` and a canonical fingerprint-valid Docs-owned `evavo_book_art_brief`. Art Studio does not manufacture missing workspace, book, edition, manuscript-revision, visual-canon, art-direction, evidence or rights identities from the legacy plan.

          The translator verifies project identity, exact brief fingerprint, art-direction digest, candidate uniqueness, candidate state, territory identity, prompt digest and retained plan digests. The raw legacy prompt is retained only by digest as migration evidence and is never trusted as the provider-neutral authority.

          A successful result is only `ready_for_shadow_comparison`. Translation is read-only: it performs no provider call, submits no runtime job, reads or writes no artwork bytes, selects or promotes no candidate, creates no Book-use binding, approves no cutover and publishes nothing. REST translation requires the Art Studio control token; local CLI and MCP callers use the same shared `translateLegacyWebsiteBookArtGenerationPlan` implementation.
          '''
          append_once(docs, '## Legacy Website plan translation', docs_append)
          PY
          python /tmp/apply.py
          rm /tmp/apply.py

      - name: Parse configuration and run static authority gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          for path in [
              ".github/workflows/book-art-provider-runtime.yml",
              "apps/api/openapi.book-art-provider.yaml",
          ]:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY
          node scripts/check-book-art-provider-runtime.mjs

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Run exact target validation
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-api test
          pnpm --filter @evavo/art-studio-cli test
          pnpm --filter @evavo/art-studio-mcp test
          pnpm check

      - name: Create clean source commit and push branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          rm -f .github/workflows/agent-book-art-legacy-plan-translation.yml
          git diff --check
          test -z "$(git status --porcelain | grep -E '^(\?\?| M|A |D ) (pnpm-lock.yaml|\.art-studio/)' || true)"
          git add -A
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -F '.github/workflows/agent-book-art-legacy-plan-translation.yml'; then
            echo 'temporary workflow would remain in final commit' >&2
            exit 41
          fi
          expected='apps/api/openapi.book-art-provider.yaml
          apps/api/src/book-art-api.ts
          apps/api/test/book-art-api.test.mjs
          apps/api/test/book-art-openapi-contract.test.mjs
          apps/cli/src/book-art-commands.ts
          apps/cli/src/index.ts
          apps/cli/test/book-art-cli.test.mjs
          apps/mcp/src/book-art-tools.ts
          apps/mcp/test/book-art-tools-contract.test.mjs
          docs/book-art-provider-runtime.md
          scripts/check-book-art-provider-runtime.mjs'
          if diff -u <(printf '%s\n' "$expected" | sed 's/^          //' | sort) <(printf '%s\n' "$changed" | sort); then :; else
            echo 'unexpected changed-file scope' >&2
            exit 42
          fi
          git config user.name 'EVAVO Studio Automation'
          git config user.email 'evavo.studio@gmail.com'
          git commit -m 'feat(book-art): expose legacy plan translation'
          git push origin HEAD:feat/book-art-legacy-plan-translation-20260803
