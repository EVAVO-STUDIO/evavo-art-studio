              '    "/v1/book-art/legacy-plan-runtime:",\n    "/v1/book-art/legacy-plans/translate:",\n    "/v1/book-art/provider-runtime:",\n',
          )
          replace_once(
              openapi_test,
              '    "evavo_book_art_provider_shadow_runtime_v1",\n',
              '    "evavo_book_art_profile_v1",\n    "evavo_legacy_website_book_art_plan_translation_input",\n    "evavo_legacy_website_book_art_plan_translation_result",\n    "requiresCanonicalBookArtBrief: { const: true }",\n    "rawLegacyPromptTrustedAsAuthority: { const: false }",\n    "translationReadOnly: { const: true }",\n    "runtimeJobSubmitted: { const: false }",\n    "evavo_book_art_provider_shadow_runtime_v1",\n',
          )

          checker = "scripts/check-book-art-provider-runtime.mjs"
          replace_once(
              checker,
              'const sharedRuntime = read("packages/book-art-runtime/src/index.ts");\n',
              'const productionProfile = read("packages/contracts/src/book-production-profile.ts");\nconst sharedRuntime = read("packages/book-art-runtime/src/index.ts");\n',
          )
          checker_block = '''
          for (const token of [
            "LegacyWebsiteBookArtPlanTranslationInputV1",
            "LegacyWebsiteBookArtPlanTranslationResultV1",
            "translateLegacyWebsiteBookArtGenerationPlan",
            "ready_for_shadow_comparison",
            "rawLegacyPromptTrustedAsAuthority: false",
            "artifactBytesRead: false",
            "artifactBytesRewritten: false",
            "runtimeCutoverApproved: false",
            "publicationPerformed: false",
          ]) {
            assert(
              productionProfile.includes(token),
              `Book Art legacy plan translator is missing ${token}`,
            );
          }

          '''
          replace_once(checker, 'for (const token of [\n  "evavo_book_art_provider_shadow_runtime_v1",', checker_block + 'for (const token of [\n  "evavo_book_art_provider_shadow_runtime_v1",')
          replace_once(
              checker,
              '  "/v1/book-art/provider-runtime",\n',
              '  "/v1/book-art/legacy-plan-runtime",\n  "/v1/book-art/legacy-plans/translate",\n  "translateLegacyWebsiteBookArtGenerationPlan",\n  "requiresCanonicalBookArtBrief: true",\n  "rawLegacyPromptTrustedAsAuthority: false",\n  "translationReadOnly: true",\n  "runtimeJobSubmitted: false",\n  "/v1/book-art/provider-runtime",\n',
          )
          replace_once(
              checker,
              '  "book-art-provider-protocol",\n',
              '  "book-art-legacy-plan-protocol",\n  "book-art-legacy-plan-translate",\n  "translateLegacyWebsiteBookArtGenerationPlan",\n  "requiresCanonicalBookArtBrief: true",\n  "translationReadOnly: true",\n  "book-art-provider-protocol",\n',
          )
          replace_once(
              checker,
              '  "book_art_provider_runtime_protocol",\n',
              '  "book_art_legacy_plan_translation_protocol",\n  "translate_legacy_website_book_art_plan",\n  "translateLegacyWebsiteBookArtGenerationPlan",\n  "requiresCanonicalBookArtBrief: true",\n  "translationReadOnly: true",\n  "book_art_provider_runtime_protocol",\n',
          )
          replace_once(
              checker,
