name: Apply and verify Book Art legacy plan translation surface

on:
  push:
    branches: [feat/book-art-legacy-plan-translation-20260803]
    paths: [.github/workflows/agent-book-art-legacy-plan-translation.yml]

permissions:
  contents: write

concurrency:
  group: agent-book-art-legacy-plan-translation
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact legacy-plan translation surface
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path, old, new):
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:100]!r}")
              write(path, source.replace(old, new, 1))

          def append_once(path, marker, text):
              source = read(path)
              if marker in source:
                  raise SystemExit(f"{path}: marker already exists: {marker}")
              write(path, source.rstrip() + "\n\n" + text.strip() + "\n")

          api = "apps/api/src/book-art-api.ts"
          replace_once(
              api,
              'import type { ArtifactStore } from "@evavo/art-artifacts";\nimport {\n  BOOK_ART_PROVIDER_RUNTIME_CONTRACT,',
              'import type { ArtifactStore } from "@evavo/art-artifacts";\nimport {\n  BOOK_ART_PROFILE_CONTRACT,\n  BOOK_ART_PROFILE_SCHEMA_VERSION,\n  translateLegacyWebsiteBookArtGenerationPlan,\n} from "@evavo/art-contracts";\nimport {\n  BOOK_ART_PROVIDER_RUNTIME_CONTRACT,',
          )
          replace_once(
              api,
              'const PARITY_PATH = "/v1/book-art/provider-jobs/parity";\nconst DOCS_RELEASE_PROTOCOL_PATH',
              'const PARITY_PATH = "/v1/book-art/provider-jobs/parity";\nconst LEGACY_PLAN_PROTOCOL_PATH = "/v1/book-art/legacy-plan-runtime";\nconst LEGACY_PLAN_TRANSLATE_PATH = "/v1/book-art/legacy-plans/translate";\nconst DOCS_RELEASE_PROTOCOL_PATH',
          )
          replace_once(
              api,
              '    pathname === PARITY_PATH ||\n    pathname === DOCS_RELEASE_PROTOCOL_PATH ||',
              '    pathname === PARITY_PATH ||\n    pathname === LEGACY_PLAN_PROTOCOL_PATH ||\n    pathname === LEGACY_PLAN_TRANSLATE_PATH ||\n    pathname === DOCS_RELEASE_PROTOCOL_PATH ||',
          )
          replace_once(
              api,
              '            "Book Art provider submission, inspection and parity require EVAVO_ART_ALLOW_WRITES=true and a server-side control token of at least 32 bytes.",',
              '            "Book Art legacy-plan translation, provider submission, inspection and parity require EVAVO_ART_ALLOW_WRITES=true and a server-side control token of at least 32 bytes.",',
          )
          legacy_protocol = '''
          function legacyPlanProtocol(): Readonly<Record<string, unknown>> {
            return {
              schemaVersion: BOOK_ART_PROFILE_SCHEMA_VERSION,
              contract: BOOK_ART_PROFILE_CONTRACT,
              translationInputKind: "evavo_legacy_website_book_art_plan_translation_input",
              translationResultKind: "evavo_legacy_website_book_art_plan_translation_result",
              requiresCanonicalBookArtBrief: true,
              verifiesExactBriefFingerprint: true,
              verifiesLegacyPlanIdentity: true,
              verifiesCandidateUniqueness: true,
              verifiesArtDirectionDigest: true,
              rawLegacyPromptTrustedAsAuthority: false,
              translationReadOnly: true,
              providerCallPerformed: false,
              runtimeJobSubmitted: false,
              candidateArtifactsWritten: false,
              authoritativeBookWritesPerformed: false,
              selectionPerformed: false,
              promotionPerformed: false,
              bookUseBindingCreated: false,
              runtimeCutoverApproved: false,
              publicationPerformed: false,
            };
          }
          '''
          replace_once(
              api,
              '\nexport async function handleBookArtApiRequest(\n',
              '\n' + legacy_protocol + '\nexport async function handleBookArtApiRequest(\n',
          )
          get_anchor = '''
            if (
              request.method === "GET" &&
              url.pathname === DOCS_RELEASE_PROTOCOL_PATH
            ) {
              context.writeJson(response, 200, docsReleaseProtocol(context), requestId);
              return true;
            }

            const postPath =
          '''
          get_replacement = '''
            if (
              request.method === "GET" &&
              url.pathname === DOCS_RELEASE_PROTOCOL_PATH
            ) {
              context.writeJson(response, 200, docsReleaseProtocol(context), requestId);
              return true;
            }
            if (
              request.method === "GET" &&
              url.pathname === LEGACY_PLAN_PROTOCOL_PATH
            ) {
              context.writeJson(response, 200, legacyPlanProtocol(), requestId);
              return true;
            }
            if (
              request.method === "POST" &&
              url.pathname === LEGACY_PLAN_TRANSLATE_PATH
            ) {
              if (!requireProtectedAccess(context)) return true;
              const body = await context.readJsonBody(request, context.maximumBodyBytes);
              const result = await translateLegacyWebsiteBookArtGenerationPlan(body);
              context.writeJson(
                response,
                result.status === "ready_for_shadow_comparison" ? 200 : 422,
                result,
                requestId,
              );
              return true;
            }

            const postPath =
          '''
          replace_once(api, get_anchor, get_replacement)

          cli = "apps/cli/src/book-art-commands.ts"
          replace_once(
              cli,
              'import { LocalArtifactStore } from "@evavo/art-artifacts";\nimport {',
              'import { LocalArtifactStore } from "@evavo/art-artifacts";\nimport {\n  BOOK_ART_PROFILE_CONTRACT,\n  BOOK_ART_PROFILE_SCHEMA_VERSION,\n  translateLegacyWebsiteBookArtGenerationPlan,\n} from "@evavo/art-contracts";\nimport {',
          )
          replace_once(
              cli,
              '  "book-art-legacy-register",\n  "book-art-provider-protocol",',
              '  "book-art-legacy-register",\n  "book-art-legacy-plan-protocol",\n  "book-art-legacy-plan-translate",\n  "book-art-provider-protocol",',
          )
          cli_protocol = '''
          function legacyPlanProtocol() {
            return {
              schemaVersion: BOOK_ART_PROFILE_SCHEMA_VERSION,
              contract: BOOK_ART_PROFILE_CONTRACT,
              translationInputKind: "evavo_legacy_website_book_art_plan_translation_input",
              translationResultKind: "evavo_legacy_website_book_art_plan_translation_result",
              requiresCanonicalBookArtBrief: true,
              verifiesExactBriefFingerprint: true,
              verifiesLegacyPlanIdentity: true,
              verifiesCandidateUniqueness: true,
              verifiesArtDirectionDigest: true,
              rawLegacyPromptTrustedAsAuthority: false,
              translationReadOnly: true,
              providerCallPerformed: false,
              runtimeJobSubmitted: false,
              candidateArtifactsWritten: false,
              authoritativeBookWritesPerformed: false,
              selectionPerformed: false,
              promotionPerformed: false,
              bookUseBindingCreated: false,
              runtimeCutoverApproved: false,
              publicationPerformed: false,
            } as const;
          }
          '''
          replace_once(
              cli,
              '\nexport async function handleBookArtCommand(\n',
              '\n' + cli_protocol + '\nexport async function handleBookArtCommand(\n',
          )
          replace_once(
              cli,
              '''  const policy = providerPolicy();
            if (command === "book-art-provider-protocol") {''',
              '''  if (command === "book-art-legacy-plan-protocol") {
              return { handled: true, value: legacyPlanProtocol() };
            }
            if (command === "book-art-legacy-plan-translate") {
              const inputPath = required(values.input, "--input");
              const result = await translateLegacyWebsiteBookArtGenerationPlan(
                await readInputObject(inputPath, "Legacy Website Book Art plan translation input"),
              );
              return {
                handled: true,
                value: result,
                ...(result.status === "ready_for_shadow_comparison" ? {} : { exitCode: 2 }),
              };
            }
            const policy = providerPolicy();
            if (command === "book-art-provider-protocol") {''',
          )

          cli_index = "apps/cli/src/index.ts"
          replace_once(
              cli_index,
              '  evavo-art book-art-provider-protocol [--output book-art-provider-protocol.json]\n',
              '  evavo-art book-art-legacy-plan-protocol [--output book-art-legacy-plan-protocol.json]\n  evavo-art book-art-legacy-plan-translate --input legacy-plan-translation.json [--output translated-book-art-work-order.json]\n\n  evavo-art book-art-provider-protocol [--output book-art-provider-protocol.json]\n',
          )
          replace_once(
              cli_index,
              'Book Art provider commands require EVAVO_BOOK_ART_PROVIDER_ADAPTER_IDS;',
              'Legacy Book Art plan translation requires a canonical fingerprint-valid Docs-owned brief and the exact retained Website plan; it calls no provider, submits no runtime job and does not require provider policy.\nBook Art provider commands require EVAVO_BOOK_ART_PROVIDER_ADAPTER_IDS;',
          )

          mcp = "apps/mcp/src/book-art-tools.ts"
          replace_once(
              mcp,
              'import { LocalArtifactStore } from "@evavo/art-artifacts";\nimport {',
              'import { LocalArtifactStore } from "@evavo/art-artifacts";\nimport {\n  BOOK_ART_PROFILE_CONTRACT,\n  BOOK_ART_PROFILE_SCHEMA_VERSION,\n  translateLegacyWebsiteBookArtGenerationPlan,\n} from "@evavo/art-contracts";\nimport {',
          )
          replace_once(
              mcp,
              '\nfunction requiredPolicy(): BookArtProviderAdapterPolicyV1 {',
              '\n' + cli_protocol.replace('function legacyPlanProtocol()', 'function legacyPlanProtocol()') + '\nfunction requiredPolicy(): BookArtProviderAdapterPolicyV1 {',
          )
          mcp_tools = '''
            server.registerTool(
              "book_art_legacy_plan_translation_protocol",
              {
                description:
                  "Report the exact read-only legacy Website Book Art plan translation contract. Translation requires a canonical Docs-owned brief, trusts no raw legacy prompt and performs no provider call or runtime write.",
                inputSchema: z.object({}),
              },
              async () => textResult(legacyPlanProtocol()),
            );

            server.registerTool(
              "translate_legacy_website_book_art_plan",
              {
                description:
                  "Validate one canonical Book Art brief and one exact retained Website cover-generation plan, then translate one candidate into a provider-neutral Art Studio work order for shadow comparison only. This tool calls no provider and writes no runtime job or artifact.",
                inputSchema: z.object({ translation: z.unknown() }),
              },
              async ({ translation }) => {
                try {
                  return textResult(
                    await translateLegacyWebsiteBookArtGenerationPlan(translation),
                  );
                } catch (error: unknown) {
                  return toolError("BOOK_ART_LEGACY_PLAN_TRANSLATION_REJECTED", error);
                }
              },
            );

          '''
          replace_once(
              mcp,
              '  server.registerTool(\n    "book_art_docs_release_runtime_protocol",',
              mcp_tools + '  server.registerTool(\n    "book_art_docs_release_runtime_protocol",',
          )

          openapi = "apps/api/openapi.book-art-provider.yaml"
          replace_once(openapi, "  version: 0.3.0", "  version: 0.4.0")
          replace_once(
              openapi,
              '    Shadow-only Book Art provider job compilation, durable submission,\n',
              '    Exact legacy Website plan translation plus shadow-only Book Art provider job compilation, durable submission,\n',
          )
          openapi_paths = '''
            /v1/book-art/legacy-plan-runtime:
              get:
                tags: [Book Art Provider Runtime]
                operationId: getLegacyWebsiteBookArtPlanTranslationProtocol
                summary: Read the exact legacy-plan translation authority boundary
                security: []
                responses:
                  "200":
                    description: Read-only legacy Website Book Art plan translation protocol
                    content:
                      application/json:
                        schema:
                          $ref: "#/components/schemas/LegacyWebsiteBookArtPlanTranslationProtocol"
            /v1/book-art/legacy-plans/translate:
              post:
                tags: [Book Art Provider Runtime]
                operationId: translateLegacyWebsiteBookArtGenerationPlan
                summary: Translate one exact legacy Website plan candidate for shadow comparison
                description: >-
                  Requires a canonical fingerprint-valid Book Art brief, the exact retained
                  Website generation plan and one candidate identity. The operation is authenticated,
                  read-only, trusts no raw legacy prompt, calls no provider and writes no runtime job or artifact.
                security:
                  - ArtStudioControlToken: []
                requestBody:
                  required: true
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/LegacyWebsiteBookArtPlanTranslationInput"
                responses:
                  "200":
                    description: Provider-neutral Art Studio work order ready for shadow comparison
                    content:
                      application/json:
                        schema:
                          $ref: "#/components/schemas/LegacyWebsiteBookArtPlanTranslationResult"
                  "401":
                    $ref: "#/components/responses/AuthorizationError"
                  "422":
                    $ref: "#/components/responses/ValidationError"
                  "503":
                    $ref: "#/components/responses/ConfigurationError"
          '''
          replace_once(openapi, "paths:\n  /v1/book-art/provider-runtime:", "paths:\n" + openapi_paths + "  /v1/book-art/provider-runtime:")
          openapi_schemas = '''
              LegacyWebsiteBookArtPlanTranslationInput:
                type: object
                additionalProperties: false
                required: [outputKind, schemaVersion, brief, legacyPlan, candidateId]
                properties:
                  outputKind: { const: evavo_legacy_website_book_art_plan_translation_input }
                  schemaVersion: { const: 1 }
                  brief:
                    type: object
                    description: Canonical fingerprint-valid evavo_book_art_brief owned by Docs Suite.
                  legacyPlan:
                    type: object
                    description: Exact retained Website book_cover_artwork_generation_plan_v1.
                  candidateId:
                    type: string
                    minLength: 1
                    maxLength: 200
              LegacyWebsiteBookArtPlanTranslationProtocol:
                type: object
                additionalProperties: false
                required:
                  - schemaVersion
                  - contract
                  - translationInputKind
                  - translationResultKind
                  - requiresCanonicalBookArtBrief
                  - verifiesExactBriefFingerprint
                  - verifiesLegacyPlanIdentity
                  - verifiesCandidateUniqueness
                  - verifiesArtDirectionDigest
                  - rawLegacyPromptTrustedAsAuthority
                  - translationReadOnly
                  - providerCallPerformed
                  - runtimeJobSubmitted
                  - candidateArtifactsWritten
                  - authoritativeBookWritesPerformed
                  - selectionPerformed
                  - promotionPerformed
                  - bookUseBindingCreated
                  - runtimeCutoverApproved
                  - publicationPerformed
                properties:
                  schemaVersion: { const: 1 }
                  contract: { const: evavo_book_art_profile_v1 }
                  translationInputKind: { const: evavo_legacy_website_book_art_plan_translation_input }
                  translationResultKind: { const: evavo_legacy_website_book_art_plan_translation_result }
                  requiresCanonicalBookArtBrief: { const: true }
                  verifiesExactBriefFingerprint: { const: true }
                  verifiesLegacyPlanIdentity: { const: true }
                  verifiesCandidateUniqueness: { const: true }
                  verifiesArtDirectionDigest: { const: true }
                  rawLegacyPromptTrustedAsAuthority: { const: false }
                  translationReadOnly: { const: true }
                  providerCallPerformed: { const: false }
                  runtimeJobSubmitted: { const: false }
                  candidateArtifactsWritten: { const: false }
                  authoritativeBookWritesPerformed: { const: false }
                  selectionPerformed: { const: false }
                  promotionPerformed: { const: false }
                  bookUseBindingCreated: { const: false }
                  runtimeCutoverApproved: { const: false }
                  publicationPerformed: { const: false }
              LegacyWebsiteBookArtPlanTranslationResult:
                type: object
                additionalProperties: false
                required:
                  - outputKind
                  - schemaVersion
                  - status
                  - identity
                  - legacyEvidence
