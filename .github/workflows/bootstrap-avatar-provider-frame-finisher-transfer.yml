name: Bootstrap avatar provider frame finisher source transfer

on:
  push:
    branches:
      - agent/avatar-provider-frame-finisher-v1-transfer
    paths:
      - .github/workflows/bootstrap-avatar-provider-frame-finisher-transfer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-avatar-provider-frame-finisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact transfer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild and verify hash-locked frame-finisher source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import tarfile
          import urllib.request

          REPOSITORY = 'EVAVO-STUDIO/evavo-art-studio'
          BASE_COMMIT = 'e77aba8a7f78c5345b234e9803872723bad8ae43'
          BLOB_SHA = '1e26a35a062e951ae3610ec5696c5e43bb35d031'
          ARCHIVE_SHA256 = '846998d14a455dc52d675f11a49a019465ca5ff6dcce9e6ac091bd8303578587'
          MANIFEST_SCHEMA = 'evavo.avatar-provider-frame-finisher-transfer.v1'
          EXPECTED_PATHS = {
              '.github/workflows/artist-workspace-agent-suite.yml',
              'config/artist-workspace-agent-suite.v5.json',
              'config/mcp.project-art-avatar-final-pass-provider-frame-finisher.windows.example.json',
              'config/mcp.project-art-workspace.windows.example.json',
              'docs/ARTIST_WORKSPACE_AGENT_SUITE.md',
              'docs/PROJECT_ART_AVATAR_FINAL_PASS_PROVIDER_FRAME_FINISHER.md',
              'scripts/avatar-final-pass-provider-frame-finisher-cli.mjs',
              'scripts/check-artist-workspace-agent-suite.mjs',
              'scripts/check-artist-workspace-avatar-provider-frame-finisher-integration.mjs',
              'scripts/check-project-art-avatar-final-pass-provider-frame-finisher-suite.mjs',
              'scripts/check-project-art-avatar-final-pass-provider-frame-finisher.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-common.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-constants.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-execute.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-fixture.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-png.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-review.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher-source.mjs',
              'scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs',
              'scripts/test-project-art-avatar-final-pass-provider-frame-finisher-mcp.mjs',
              'scripts/test-project-art-avatar-final-pass-provider-frame-finisher.mjs',
              'tools/project_art_avatar_final_pass_provider_frame_finisher_mcp.mjs',
          }

          parent = os.popen('git rev-parse HEAD^').read().strip()
          if parent != BASE_COMMIT:
              raise SystemExit(f'transfer parent mismatch: expected {BASE_COMMIT}, got {parent}')

          token = os.environ.get('GH_TOKEN', '')
          if not token:
              raise SystemExit('GH_TOKEN is required')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{REPOSITORY}/git/blobs/{BLOB_SHA}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'evavo-avatar-provider-frame-finisher-bootstrap/1',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          if blob.get('sha') != BLOB_SHA or blob.get('encoding') != 'base64' or blob.get('truncated') is True:
              raise SystemExit('Git blob response is incomplete or mismatched')
          try:
              archive = base64.b64decode(blob['content'], validate=False)
          except Exception as error:
              raise SystemExit(f'transfer blob base64 is invalid: {error}') from error
          actual_archive_sha256 = hashlib.sha256(archive).hexdigest()
          if actual_archive_sha256 != ARCHIVE_SHA256:
              raise SystemExit(
                  f'transfer archive SHA-256 mismatch: expected {ARCHIVE_SHA256}, got {actual_archive_sha256}'
              )

          root = Path.cwd().resolve()
          payloads: dict[str, bytes] = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as bundle:
              seen_members: set[str] = set()
              for member in bundle.getmembers():
                  raw_name = member.name
                  name = raw_name[2:] if raw_name.startswith('./') else raw_name
                  if name in {'', '.'}:
                      if not member.isdir():
                          raise SystemExit('archive root must be a directory')
                      continue
                  posix = PurePosixPath(name)
                  if posix.is_absolute() or '..' in posix.parts or '\\' in name or '\x00' in name:
                      raise SystemExit(f'unsafe archive member: {raw_name!r}')
                  if name in seen_members:
                      raise SystemExit(f'duplicate archive member: {name}')
                  seen_members.add(name)
                  if member.isdir():
                      continue
                  if not member.isfile() or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'archive member is not an ordinary file: {name}')
                  if stat.S_IMODE(member.mode) & 0o022:
                      raise SystemExit(f'archive member is group/world writable: {name}')
                  extracted = bundle.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f'archive member could not be read: {name}')
                  payloads[name] = extracted.read()

          manifest_bytes = payloads.pop('.evavo-transfer-manifest.json', None)
          if manifest_bytes is None:
              raise SystemExit('transfer manifest is missing')
          manifest = json.loads(manifest_bytes.decode('utf-8'))
          if manifest.get('schema') != MANIFEST_SCHEMA or manifest.get('baseCommit') != BASE_COMMIT:
              raise SystemExit('transfer manifest schema or base commit is invalid')
          manifest_files = manifest.get('files')
          if not isinstance(manifest_files, dict) or set(manifest_files) != EXPECTED_PATHS:
              raise SystemExit('transfer manifest path set is invalid')
          if set(payloads) != EXPECTED_PATHS:
              raise SystemExit('archive payload path set is invalid')

          for relative in sorted(EXPECTED_PATHS):
              data = payloads[relative]
              expected = manifest_files[relative]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit(f'manifest hash is invalid for {relative}')
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit(f'payload hash mismatch for {relative}')

              target = root.joinpath(*PurePosixPath(relative).parts)
              if not target.resolve(strict=False).is_relative_to(root):
                  raise SystemExit(f'target path escapes repository: {relative}')
              cursor = root
              for part in PurePosixPath(relative).parts[:-1]:
                  cursor = cursor / part
                  if cursor.is_symlink():
                      raise SystemExit(f'target parent is symbolic: {cursor}')
              if target.exists():
                  metadata = target.lstat()
                  if not stat.S_ISREG(metadata.st_mode) or target.is_symlink() or metadata.st_nlink != 1:
                      raise SystemExit(f'existing target is not a single-link regular file: {relative}')
              target.parent.mkdir(parents=True, exist_ok=True)
              temporary = target.with_name(f'.{target.name}.evavo-transfer')
              if temporary.exists() or temporary.is_symlink():
                  raise SystemExit(f'temporary target already exists: {temporary}')
              temporary.write_bytes(data)
              os.chmod(temporary, 0o644)
              os.replace(temporary, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'post-write hash mismatch for {relative}')

          Path('/tmp/evavo-avatar-frame-finisher-paths.txt').write_text(
              '\n'.join(sorted(EXPECTED_PATHS)) + '\n',
              encoding='utf-8',
          )
          print(f'Verified and materialized {len(EXPECTED_PATHS)} exact source files.')
          PY

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Validate exact frame-finisher source
        run: |
          while IFS= read -r file; do
            case "$file" in
              *.mjs) node --check "$file" ;;
              *.json) node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file" ;;
            esac
          done < /tmp/evavo-avatar-frame-finisher-paths.txt
          node scripts/check-project-art-avatar-final-pass-provider-frame-finisher-suite.mjs
          node scripts/check-artist-workspace-avatar-provider-candidate-integration.mjs
          node scripts/check-artist-workspace-avatar-provider-frame-finisher-integration.mjs
          node scripts/check-artist-workspace-agent-suite.mjs
          git diff --check

      - name: Commit non-workflow frame-finisher source
        run: |
          git restore -- .github/workflows/artist-workspace-agent-suite.yml
          grep -v '^\.github/workflows/artist-workspace-agent-suite\.yml$' \
            /tmp/evavo-avatar-frame-finisher-paths.txt \
            > /tmp/evavo-avatar-frame-finisher-nonworkflow-paths.txt
          git config user.name 'EVAVO-STUDIO'
          git config user.email 'evavo.studio@gmail.com'
          while IFS= read -r file; do
            git add -- "$file"
          done < /tmp/evavo-avatar-frame-finisher-nonworkflow-paths.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = set(Path('/tmp/evavo-avatar-frame-finisher-nonworkflow-paths.txt').read_text().splitlines())
          staged = set(
              subprocess.run(
                  ['git', 'diff', '--cached', '--name-only'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
          )
          if staged != expected:
              raise SystemExit(f'unexpected staged scope: expected {sorted(expected)}, got {sorted(staged)}')
          PY
          git commit -m 'feat(avatar): finish and admit reviewed provider frames'
          git push origin "HEAD:${{ GITHUB_REF_NAME }}"
