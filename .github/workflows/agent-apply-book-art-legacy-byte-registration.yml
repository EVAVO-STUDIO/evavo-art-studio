name: Agent Apply Book Art Legacy Byte Registration

on:
  push:
    branches:
      - agent/book-art-legacy-byte-registration-20260803

permissions:
  contents: write

concurrency:
  group: agent-apply-book-art-legacy-byte-registration
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.ref == 'refs/heads/agent/book-art-legacy-byte-registration-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: e9e96fd54a9e9d9c16bbd8faa2231caebb840c45
      TARGET_BRANCH: agent/book-art-legacy-byte-registration-20260803
      WORKFLOW_PATH: .github/workflows/agent-apply-book-art-legacy-byte-registration.yml
    steps:
      - name: Check out exact bootstrap candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact bootstrap scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git merge-base origin/main HEAD)" == "${BASE_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          git diff --name-only "${BASE_SHA}" HEAD | sort > "${RUNNER_TEMP}/actual-bootstrap-paths.txt"
          cat > "${RUNNER_TEMP}/expected-bootstrap-paths.txt" <<'PATHS'
          .github/agent-payloads/apply-script.gz.b64
          .github/agent-payloads/legacy-registration-payload.part1
          .github/agent-payloads/legacy-registration-payload.part2
          .github/workflows/agent-apply-book-art-legacy-byte-registration.yml
          PATHS
          sort "${RUNNER_TEMP}/expected-bootstrap-paths.txt" -o "${RUNNER_TEMP}/expected-bootstrap-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-bootstrap-paths.txt" "${RUNNER_TEMP}/actual-bootstrap-paths.txt"

      - name: Apply reviewed legacy-byte registration source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agent-payloads/legacy-registration-payload.part1 \
            .github/agent-payloads/legacy-registration-payload.part2 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/legacy-registration-payloads.json
          base64 --decode .github/agent-payloads/apply-script.gz.b64 \
            | gzip --decompress \
            > /tmp/apply_legacy_registration.py
          python /tmp/apply_legacy_registration.py
          git rm -r .github/agent-payloads
          git rm "${WORKFLOW_PATH}"
          git diff --check
          git diff --name-only HEAD | sort > "${RUNNER_TEMP}/actual-working-paths.txt"
          cat > "${RUNNER_TEMP}/expected-working-paths.txt" <<'PATHS'
          .github/agent-payloads/apply-script.gz.b64
          .github/agent-payloads/legacy-registration-payload.part1
          .github/agent-payloads/legacy-registration-payload.part2
          .github/workflows/agent-apply-book-art-legacy-byte-registration.yml
          .github/workflows/book-art-provider-runtime.yml
          apps/cli/src/book-art-commands.ts
          apps/cli/test/book-art-cli-legacy-registration.test.mjs
          docs/book-art-provider-runtime.md
          docs/book-studio-production-handoff.md
          packages/book-art-runtime/package.json
          packages/book-art-runtime/src/legacy-registration.ts
          packages/book-art-runtime/test/legacy-registration.test.mjs
          packages/book-art-runtime/tsconfig.json
          scripts/check-book-art-legacy-registration.mjs
          PATHS
          sort "${RUNNER_TEMP}/expected-working-paths.txt" -o "${RUNNER_TEMP}/expected-working-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-working-paths.txt" "${RUNNER_TEMP}/actual-working-paths.txt"

      - name: Verify legacy-byte registration authority before installation
        run: node scripts/check-book-art-legacy-registration.mjs

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install FFmpeg media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Build complete Art Studio domain
        run: pnpm run build:domain

      - name: Run focused legacy-byte registration regressions
        run: |
          pnpm --filter @evavo/art-book-runtime test
          pnpm --filter @evavo/art-studio-cli test

      - name: Run complete repository validation
        run: pnpm check

      - name: Commit and push validated production source
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          git diff --check
          git fetch --no-tags --prune origin \
            +refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH} \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${BASE_SHA}" ]]
          git add -A
          git diff --cached --name-only "${BASE_SHA}" | sort > "${RUNNER_TEMP}/actual-production-paths.txt"
          cat > "${RUNNER_TEMP}/expected-production-paths.txt" <<'PATHS'
          .github/workflows/book-art-provider-runtime.yml
          apps/cli/src/book-art-commands.ts
          apps/cli/test/book-art-cli-legacy-registration.test.mjs
          docs/book-art-provider-runtime.md
          docs/book-studio-production-handoff.md
          packages/book-art-runtime/package.json
          packages/book-art-runtime/src/legacy-registration.ts
          packages/book-art-runtime/test/legacy-registration.test.mjs
          packages/book-art-runtime/tsconfig.json
          scripts/check-book-art-legacy-registration.mjs
          PATHS
          sort "${RUNNER_TEMP}/expected-production-paths.txt" -o "${RUNNER_TEMP}/expected-production-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-production-paths.txt" "${RUNNER_TEMP}/actual-production-paths.txt"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(book-art): register exact legacy artwork bytes'
          git push origin HEAD:refs/heads/${TARGET_BRANCH}
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Verify published branch source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}
          published="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
          [[ "${published}" == "$(git rev-parse HEAD)" ]]
          git show "${published}:packages/book-art-runtime/src/legacy-registration.ts" \
            | grep -F 'export async function registerLegacyBookArtBytes'
          echo "published candidate: ${published}"
