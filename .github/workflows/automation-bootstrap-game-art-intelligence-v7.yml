name: Validate and publish Game Art Intelligence v7

on:
  push:
    branches: [automation/bootstrap-game-art-intelligence-v7-20260805]

permissions:
  contents: write

concurrency:
  group: game-art-intelligence-v7-current-main
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_MAIN_SHA: 308a368263f74d7bafca6f11abcd982a1f213759
      TARGET_BRANCH: agent/game-art-intelligence-current-main-20260805
      PAYLOAD_ROOT: .github/automation/game-art-intelligence-v2
      ARCHIVE_SHA256: b571a8e0936d8dcb25185f5942f763774e0964b5adead29d280451fc7aa68c37
      PATCH_SHA256: f7c5541dfac45f31736cb98c3b47f2d6f982960ac6850a4666bbc085bee833f3
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve validated carrier scripts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/automation-bootstrap-game-art-intelligence-v6.yml"
          )
          lines = workflow.read_text(encoding="utf-8").splitlines()
          name = "Preserve validated carrier scripts"
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == f"- name: {name}"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one v6 preservation step, found {len(matches)}"
              )
          run_index = next(
              (
                  index
                  for index in range(matches[0] + 1, len(lines))
                  if lines[index].strip() == "run: |"
              ),
              None,
          )
          if run_index is None:
              raise SystemExit("v6 preservation step has no run block")
          run_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
          content_indent = run_indent + 2
          output: list[str] = []
          for line in lines[run_index + 1 :]:
              stripped = line.lstrip()
              indent = len(line) - len(stripped)
              if stripped and indent <= run_indent:
                  break
              output.append(line[content_indent:] if len(line) >= content_indent else "")
          script = "\n".join(output).rstrip() + "\n"
          old_guard = '''    if not script.startswith("set -euo pipefail"):
                  raise SystemExit(f"step {name!r} extraction was not shell-safe")
              return script
          '''
          new_guard = '''    if name == "Write bounded receipt":
                  if not script.startswith("node <<'NODE'"):
                      raise SystemExit(
                          f"step {name!r} was not the expected bounded Node receipt"
                      )
              elif not script.startswith("set -euo pipefail"):
                  raise SystemExit(f"step {name!r} extraction was not shell-safe")
              return script
          '''
          if script.count(old_guard) != 1:
              raise SystemExit(
                  f"expected one v6 shell-safety guard, found {script.count(old_guard)}"
              )
          script = script.replace(old_guard, new_guard)
          target = Path("/tmp/preserve-game-art-scripts.sh")
          target.write_text(script, encoding="utf-8")
          target.chmod(0o700)
          PY
          bash -n /tmp/preserve-game-art-scripts.sh
          bash /tmp/preserve-game-art-scripts.sh

      - name: Reconstruct, rebase and repair exact source
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/game-art-step-01.sh
          bash /tmp/game-art-step-02.sh
          bash /tmp/game-art-step-03.sh
          python <<'PY'
          from pathlib import Path

          planner = Path("packages/sprite-planner/src/directions-clips.ts")
          lines = planner.read_text(encoding="utf-8").splitlines()
          coverage_matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == 'if (request.coverage !== "core") {'
          ]
          if len(coverage_matches) != 1:
              raise SystemExit(
                  f"expected one coverage block, found {len(coverage_matches)}"
              )
          coverage_index = coverage_matches[0]
          feature_matches = [
              index
              for index in range(coverage_index + 1, min(coverage_index + 12, len(lines)))
              if "for (const feature of request.features)" in lines[index]
          ]
          if len(feature_matches) != 1:
              raise SystemExit(
                  f"expected one coverage-gated explicit feature line, found {len(feature_matches)}"
              )
          feature_index = feature_matches[0]
          del lines[feature_index]
          closing_index = next(
              (
                  index
                  for index in range(coverage_index + 1, len(lines))
                  if lines[index].strip() == "}"
              ),
              None,
          )
          if closing_index is None:
              raise SystemExit("could not find the coverage block closing brace")
          outer_indent = lines[coverage_index][
              : len(lines[coverage_index]) - len(lines[coverage_index].lstrip())
          ]
          body_indent = f"{outer_indent}  "
          lines[closing_index + 1 : closing_index + 1] = [
              f"{outer_indent}for (const feature of request.features) {{",
              f"{body_indent}for (const id of FEATURE_CLIPS[feature] ?? []) selected.add(id);",
              f"{outer_indent}}}",
          ]
          planner.write_text("\n".join(lines) + "\n", encoding="utf-8")

          tests = Path("packages/sprite-planner/test/sprite-planner.test.mjs")
          test_lines = tests.read_text(encoding="utf-8").splitlines()
          anchor_matches = [
              index
              for index, line in enumerate(test_lines)
              if line.strip() == "assert.ok(plan.totals.runtimeFrames > 500);"
          ]
          if len(anchor_matches) != 1:
              raise SystemExit(
                  f"expected one runtime-frame test anchor, found {len(anchor_matches)}"
              )
          anchor_index = anchor_matches[0]
          closing_test_index = next(
              (
                  index
                  for index in range(anchor_index + 1, min(anchor_index + 5, len(test_lines)))
                  if test_lines[index].strip() == "});"
              ),
              None,
          )
          if closing_test_index is None:
              raise SystemExit("could not find the first test closing line")
          new_test = [
              "",
              'test("honours explicit feature requests at core coverage without widening defaults", () => {',
              "  const plan = compileSpriteProductionPlan(request({",
              '    coverage: "core",',
              '    includeFeatures: ["melee", "ranged", "interact"],',
              "  }));",
              '  for (const id of ["attack-light", "attack-ranged", "interact"]) {',
              "    assert.ok(plan.clips.some((clip) => clip.id === id));",
              "  }",
              '  assert.equal(plan.clips.some((clip) => clip.id === "reload"), false);',
              "});",
          ]
          test_lines[closing_test_index + 1 : closing_test_index + 1] = new_test
          tests.write_text("\n".join(test_lines) + "\n", encoding="utf-8")
          PY
          git add \
            packages/game-art-intelligence/src/compiler.ts \
            packages/game-art-intelligence/src/geometry-palette.ts \
            packages/game-art-intelligence/test/game-art-intelligence.test.mjs \
            packages/sprite-planner/src/directions-clips.ts \
            packages/sprite-planner/test/sprite-planner.test.mjs
          git commit --amend --no-edit
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          git diff --check HEAD^ HEAD
          node --check scripts/check-game-art-intelligence.mjs
          node scripts/check-game-art-intelligence.mjs
          sha256sum \
            packages/game-art-intelligence/src/compiler.ts \
            packages/game-art-intelligence/src/geometry-palette.ts \
            packages/game-art-intelligence/test/game-art-intelligence.test.mjs \
            packages/sprite-planner/src/directions-clips.ts \
            packages/sprite-planner/test/sprite-planner.test.mjs \
            > /tmp/compatibility-source-sha256.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install FFmpeg and dependencies review-first
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          bash /tmp/game-art-step-05.sh

      - name: Validate focused sprite and Game Art implementation
        shell: bash
        run: bash /tmp/game-art-step-06.sh

      - name: Validate complete repository
        shell: bash
        run: bash /tmp/game-art-step-07.sh

      - name: Publish ordinary source files
        shell: bash
        run: bash /tmp/game-art-step-08.sh

      - name: Write bounded receipt
        shell: bash
        run: bash /tmp/game-art-step-09.sh

      - name: Upload bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-art-intelligence-current-main-bootstrap-${{ github.run_id }}
          path: |
            /tmp/game-art-intelligence-current-main-bootstrap.json
            /tmp/game-art-intelligence.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
