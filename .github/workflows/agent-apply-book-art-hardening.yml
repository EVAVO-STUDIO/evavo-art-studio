name: Agent Apply Book Art Hardening

on:
  push:
    branches:
      - agent/book-candidate-set-quality-20260806
    paths:
      - ".github/workflows/agent-apply-book-art-hardening.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-book-art-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate-set branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/book-candidate-set-quality-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-book-art-hardening.patch
          git apply .github/agent-book-art-hardening.patch
          git diff --check

      - name: Install exact workspace
        run: pnpm install --no-frozen-lockfile

      - name: Verify permanent boundaries and mutation-free Python syntax
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-book-art-candidate-set.mjs
          node scripts/check-image-processing-recipes.mjs
          test ! -d tools/__pycache__

      - name: Build exact Art Studio domain dependencies
        run: pnpm run build:domain

      - name: Run candidate-set, runtime and provider attacks
        run: |
          node --test packages/contracts/test/book-art-candidate-set.test.mjs
          node --test packages/book-art-runtime/test/candidate-set-runtime.test.mjs
          node --test packages/providers/test/providers.test.mjs

      - name: Run strict affected-package typechecks
        run: |
          pnpm --filter @evavo/art-contracts typecheck
          pnpm --filter @evavo/art-book-runtime typecheck
          pnpm --filter @evavo/art-providers typecheck

      - name: Commit verified source and remove temporary agent files
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          test ! -d tools/__pycache__
          git rm -- .github/agent-book-art-hardening.patch .github/workflows/agent-apply-book-art-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(book-art): harden candidate-set quality gates"
          git push origin HEAD:refs/heads/agent/book-candidate-set-quality-20260806
