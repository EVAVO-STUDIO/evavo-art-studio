name: Recover Website Book Studio Carrier

on:
  push:
    branches:
      - diagnostic/recover-website-book-studio-carrier-20260803
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnostic-recover-website-book-studio-carrier.yml

permissions:
  contents: read

concurrency:
  group: diagnostic-recover-website-book-studio-carrier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    if: github.repository == 'EVAVO-STUDIO/evavo-art-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_BASE_SHA: 9eab30022726808a06d1c10221527bad347293b8
      BACKUP_URL: https://res.cloudinary.com/dntogqtey/raw/upload/v1785569873/bf8ed43af3f2520ccb1bae71c3be2704cddb56f2
      EXPECTED_BACKUP_BYTES: '939123'
    steps:
      - name: Check out exact diagnostic commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact workflow-only scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git merge-base origin/main HEAD)" == "${EXPECTED_BASE_SHA}" ]]
          [[ "$(git rev-parse origin/main)" == "${EXPECTED_BASE_SHA}" ]]
          [[ "$(git diff --name-only "${EXPECTED_BASE_SHA}" HEAD)" == '.github/workflows/diagnostic-recover-website-book-studio-carrier.yml' ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Download exact signed backup and inspect carrier
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/website-book-studio-carrier"
          mkdir -p "${out}"
          curl --fail --location --retry 3 --retry-all-errors \
            "${BACKUP_URL}" \
            --output "${out}/reviewed-carrier.bin"
          [[ "$(stat -c '%s' "${out}/reviewed-carrier.bin")" == "${EXPECTED_BACKUP_BYTES}" ]]
          file "${out}/reviewed-carrier.bin" | tee "${out}/file-types.txt"
          sha256sum "${out}/reviewed-carrier.bin" > "${out}/SHA256SUMS"
          cat > "${out}/recovery-metadata.json" <<JSON
          {
            "schemaVersion": "1.0",
            "sourceAssetId": "35d8442662e10be3dcb8ea0b6a1fb09d",
            "sourceVersionId": "65185fdd2b572832bc43b84ec67dc209",
            "sourceBytes": ${EXPECTED_BACKUP_BYTES},
            "diagnosticHeadSha": "$(git rev-parse HEAD)",
            "productionBaseSha": "${EXPECTED_BASE_SHA}"
          }
          JSON

      - name: Upload bounded recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-book-studio-reviewed-carrier
          path: ${{ runner.temp }}/website-book-studio-carrier
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
