name: Rally 2.5D Timber Bridge Art Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-25d-timber-bridge-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Test deterministic one-image bridge jobs
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/game-art-production/rally-25d-timber-bridge-jobs.test.mjs \
            | tee "${RUNNER_TEMP}/timber-bridge-tests.log"
      - name: Compile and verify provider session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/game-art-production/rally-25d-timber-bridge-jobs.mjs compile \
            config/game-art-production/structures/timber-bridge-production-v1.json \
            --output "${RUNNER_TEMP}/timber-bridge.session.json" \
            > "${RUNNER_TEMP}/timber-bridge.stdout.json"
          node scripts/game-art-production/rally-25d-timber-bridge-jobs.mjs verify \
            "${RUNNER_TEMP}/timber-bridge.session.json" \
            | tee "${RUNNER_TEMP}/timber-bridge.verify.json"
          grep -F '"schema": "evavo.rally-timber-bridge-provider-job-session.v1"' "${RUNNER_TEMP}/timber-bridge.session.json"
          grep -F '"jobs": 10' "${RUNNER_TEMP}/timber-bridge.session.json"
          grep -F '"images": 10' "${RUNNER_TEMP}/timber-bridge.session.json"
          grep -F '"modelingJobs": 4' "${RUNNER_TEMP}/timber-bridge.session.json"
          grep -F '"damageJobs": 3' "${RUNNER_TEMP}/timber-bridge.session.json"
          grep -F '"providerExecution": false' "${RUNNER_TEMP}/timber-bridge.session.json"
          grep -F '"downstream3DReady": false' "${RUNNER_TEMP}/timber-bridge.session.json"
      - name: Prove source remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timber-bridge-art-${{ github.sha }}
          path: |
            ${{ runner.temp }}/timber-bridge-tests.log
            ${{ runner.temp }}/timber-bridge.session.json
            ${{ runner.temp }}/timber-bridge.verify.json
          if-no-files-found: warn
          retention-days: 7
