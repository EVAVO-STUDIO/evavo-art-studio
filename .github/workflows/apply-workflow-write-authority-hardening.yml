name: Apply workflow write-authority hardening

on:
  push:
    branches:
      - fix/workflow-write-authority-20260817
    paths:
      - ".github/workflows/apply-workflow-write-authority-hardening.yml"
      - "scripts/apply-workflow-write-authority-hardening.mjs"

permissions:
  contents: write

concurrency:
  group: apply-workflow-write-authority-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact hardening source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Verify exact bounded source scope
        shell: bash
        env:
          CURRENT_MAIN_SHA: 6584bde1b95cfe460604d4be949daa0cda3603c9
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/fix/workflow-write-authority-20260817"
          git merge-base --is-ancestor "${CURRENT_MAIN_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          mapfile -t OBSERVED < <(
            git diff --name-only "${CURRENT_MAIN_SHA}" HEAD -- | LC_ALL=C sort
          )
          EXPECTED=(
            ".github/workflows/apply-workflow-write-authority-hardening.yml"
            "scripts/apply-workflow-write-authority-hardening.mjs"
            "scripts/test-ci-media-tool-workflow-write-authority.mjs"
          )
          diff -u \
            <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${OBSERVED[@]}")
          git diff --check "${CURRENT_MAIN_SHA}" HEAD --
          node --check scripts/apply-workflow-write-authority-hardening.mjs
          node --check scripts/test-ci-media-tool-workflow-write-authority.mjs

      - name: Materialize manual-only repository writers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-workflow-write-authority-hardening.mjs \
            > "${RUNNER_TEMP}/workflow-write-authority-hardening.json"

          rm -f \
            .github/workflows/apply-workflow-write-authority-hardening.yml \
            scripts/apply-workflow-write-authority-hardening.mjs

          test ! -e .github/workflows/apply-workflow-write-authority-hardening.yml
          test ! -e scripts/apply-workflow-write-authority-hardening.mjs

      - name: Validate exact final authority boundary
        shell: bash
        env:
          CURRENT_MAIN_SHA: 6584bde1b95cfe460604d4be949daa0cda3603c9
        run: |
          set -euo pipefail
          node --check scripts/test-ci-media-tool-workflow-write-authority.mjs
          node --test scripts/test-ci-media-tool-*.mjs

          ! grep -Eq '^  push:' .github/workflows/finalize-pixel-typography-review.yml
          ! grep -Eq '^  push:' .github/workflows/repair-pixel-typography-review.yml
          grep -F 'FINALIZE_PIXEL_TYPOGRAPHY_REVIEW' \
            .github/workflows/finalize-pixel-typography-review.yml
          grep -F 'RECONCILE_PIXEL_TYPOGRAPHY_REVIEW' \
            .github/workflows/repair-pixel-typography-review.yml
          grep -F 'ref: ${{ inputs.expected_sha }}' \
            .github/workflows/finalize-pixel-typography-review.yml
          grep -F 'ref: ${{ inputs.expected_sha }}' \
            .github/workflows/repair-pixel-typography-review.yml

          git diff --check "${CURRENT_MAIN_SHA}" --
          mapfile -t FINAL_CHANGED < <(
            git diff --name-only "${CURRENT_MAIN_SHA}" -- | LC_ALL=C sort
          )
          EXPECTED_FINAL=(
            ".github/workflows/finalize-pixel-typography-review.yml"
            ".github/workflows/repair-pixel-typography-review.yml"
            "scripts/test-ci-media-tool-workflow-write-authority.mjs"
          )
          diff -u \
            <(printf '%s\n' "${EXPECTED_FINAL[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${FINAL_CHANGED[@]}")

      - name: Commit exact final hardening
        id: commit
        shell: bash
        env:
          CURRENT_MAIN_SHA: 6584bde1b95cfe460604d4be949daa0cda3603c9
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check

          mapfile -t STAGED < <(
            git diff --cached --name-only "${CURRENT_MAIN_SHA}" -- | LC_ALL=C sort
          )
          EXPECTED=(
            ".github/workflows/finalize-pixel-typography-review.yml"
            ".github/workflows/repair-pixel-typography-review.yml"
            "scripts/test-ci-media-tool-workflow-write-authority.mjs"
          )
          diff -u \
            <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${STAGED[@]}")

          git commit \
            -m "fix(ci): make repository writers manual-only" \
            -m "Remove automatic main-push triggers from the two native Pixel Typography publishers, require exact current-main SHA and typed confirmation inputs, bind checkout to the authorized SHA, and permanently govern every workflow write, secret, persisted-credential and mutation surface."

          HARDENED_SHA="$(git rev-parse HEAD)"
          echo "hardened_sha=${HARDENED_SHA}" >> "${GITHUB_OUTPUT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload objects and advance when authorized
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARDENED_SHA: ${{ steps.commit.outputs.hardened_sha }}
        run: |
          set -euo pipefail
          BRANCH="fix/workflow-write-authority-20260817"
          REMOTE_BEFORE="$(
            git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}'
          )"
          test "${REMOTE_BEFORE}" = "${GITHUB_SHA}"

          AUTHORIZATION="$(
            printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0
          )"
          set +e
          PUSH_OUTPUT="$(
            git \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTHORIZATION}" \
              push origin "HEAD:refs/heads/${BRANCH}" 2>&1
          )"
          PUSH_STATUS=$?
          set -e
          printf '%s\n' "${PUSH_OUTPUT}"

          if [ "${PUSH_STATUS}" -eq 0 ]; then
            REMOTE_AFTER="$(
              git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}'
            )"
            test "${REMOTE_AFTER}" = "${HARDENED_SHA}"
            echo "Branch advanced directly." >> "${GITHUB_STEP_SUMMARY}"
          else
            grep -F 'without `workflows` permission' <<< "${PUSH_OUTPUT}"
            git cat-file -e "${HARDENED_SHA}^{commit}"
            echo "Validated commit uploaded; connector ref promotion required." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo
            echo "- Validated hardening commit: \`${HARDENED_SHA}\`"
            echo "- Final files: 3"
            echo "- Automatic repository-writing triggers removed: 2"
            echo "- Manual SHA confirmations added: 2"
          } >> "${GITHUB_STEP_SUMMARY}"
