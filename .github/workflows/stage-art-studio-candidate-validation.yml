name: Stage exact Art Studio candidate validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage-art-studio-candidate-6658be8
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/stage-art-studio-6658be8-20260802
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "6658be8f44d1a0567d13186b879675c90d660644" ]]
          mapfile -t changed < <(git diff --name-only 6658be8f44d1a0567d13186b879675c90d660644..HEAD)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == ".github/workflows/stage-art-studio-candidate-validation.yml" ]]
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Build domain packages
        run: pnpm run build:domain
      - name: Run every TypeScript check
        run: pnpm typecheck
      - name: Remove generated lockfile and verify clean source
        if: always()
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"

  app-tests:
    name: test ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@evavo/art-studio-api"
          - "@evavo/art-studio-cli"
          - "@evavo/art-studio-mcp"
          - "@evavo/art-studio-worker"
          - "@evavo/art-studio-web"
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/stage-art-studio-6658be8-20260802
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "6658be8f44d1a0567d13186b879675c90d660644" ]]
          mapfile -t changed < <(git diff --name-only 6658be8f44d1a0567d13186b879675c90d660644..HEAD)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == ".github/workflows/stage-art-studio-candidate-validation.yml" ]]
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Build domain packages
        run: pnpm run build:domain
      - name: Run exact application test suite
        run: pnpm --filter "${{ matrix.package }}" test
      - name: Remove generated lockfile and verify clean source
        if: always()
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"

  full-tests:
    name: complete workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/stage-art-studio-6658be8-20260802
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "6658be8f44d1a0567d13186b879675c90d660644" ]]
          mapfile -t changed < <(git diff --name-only 6658be8f44d1a0567d13186b879675c90d660644..HEAD)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == ".github/workflows/stage-art-studio-candidate-validation.yml" ]]
      - name: Install audio media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          test -x "$(command -v ffmpeg)"
          test -x "$(command -v ffprobe)"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Build domain packages
        run: pnpm run build:domain
      - name: Run complete workspace test stage
        run: pnpm test
      - name: Remove generated lockfile and verify clean source
        if: always()
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"

  production-build:
    name: complete production build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/stage-art-studio-6658be8-20260802
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "6658be8f44d1a0567d13186b879675c90d660644" ]]
          mapfile -t changed < <(git diff --name-only 6658be8f44d1a0567d13186b879675c90d660644..HEAD)
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == ".github/workflows/stage-art-studio-candidate-validation.yml" ]]
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Install review-first dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Build domain packages
        run: pnpm run build:domain
      - name: Run complete recursive production build
        run: pnpm build
      - name: Remove generated lockfile and verify clean source
        if: always()
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"
