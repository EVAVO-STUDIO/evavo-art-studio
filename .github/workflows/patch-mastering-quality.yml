name: Apply exact mastering quality patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/fix-art-studio-full-validation-20260802
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact source head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "257b28cd1aa1c3db051629edf1676b7aed963c2f" ]]

      - name: Apply reviewed structural replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/worker/src/mastering-handlers.ts")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          transparency_matches = [
              index
              for index, line in enumerate(lines)
              if line.strip()
              == 'const transparency = mode === "opaque-preserve" ? "opaque" : "alpha-required";'
          ]
          matte_matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "knownMatteColours: ["
          ]
          if len(transparency_matches) != 1:
              raise SystemExit(
                  f"expected one transparency assignment, found {len(transparency_matches)}"
              )
          if len(matte_matches) != 1:
              raise SystemExit(
                  f"expected one knownMatteColours assignment, found {len(matte_matches)}"
              )

          transparency_index = transparency_matches[0]
          indentation = lines[transparency_index][
              : len(lines[transparency_index]) - len(lines[transparency_index].lstrip())
          ]
          lines[transparency_index + 1 : transparency_index + 1] = [
              f"{indentation}const knownMatteColours = [\n",
              f"{indentation}  ...(matteColour ? [matteColour] : []),\n",
              f"{indentation}  ...existingMattes,\n",
              f"{indentation}];\n",
          ]

          matte_index = matte_matches[0] + 4
          matte_indentation = lines[matte_index][
              : len(lines[matte_index]) - len(lines[matte_index].lstrip())
          ]
          expected = [
              "knownMatteColours: [",
              "...(matteColour ? [matteColour] : []),",
              "...existingMattes,",
              "],",
          ]
          actual = [line.strip() for line in lines[matte_index : matte_index + 4]]
          if actual != expected:
              raise SystemExit(
                  f"knownMatteColours block drifted: expected {expected!r}, found {actual!r}"
              )
          lines[matte_index : matte_index + 4] = [
              f"{matte_indentation}...(knownMatteColours.length ? {{ knownMatteColours }} : {{}}),\n"
          ]
          path.write_text("".join(lines), encoding="utf-8")
          PY
          git diff --check
          git diff -- apps/worker/src/mastering-handlers.ts

      - name: Commit and push exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO validation automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add apps/worker/src/mastering-handlers.ts
          git commit -m "fix: omit empty mastering matte expectations"
          git push origin HEAD:agent/fix-art-studio-full-validation-20260802
