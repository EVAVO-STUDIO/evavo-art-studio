name: Agent Validate Docs Writing Art Link

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-validate-docs-writing-art-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/validate-docs-link-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact disposable validation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove validation scope and exact mirrored production blobs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          unexpected="$(git diff --name-only "${BASE_SHA}"...HEAD | grep -Ev '^(.github/workflows/agent-validate-docs-writing-art-link.yml|validation/docs-writing-art/)' || true)"
          [[ -z "${unexpected}" ]] || {
            echo "Disposable validator changed production paths:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          }

          [[ "$(git hash-object validation/docs-writing-art/src/book-studio-art-brief-exact.ts)" == "f543cdb600edee575c34b7764565b5f3fb617433" ]]
          [[ "$(git hash-object validation/docs-writing-art/src/book-studio-website-manuscript-cas.ts)" == "de78a790ba9e72912f4cd50a66718fcd30fe6ace" ]]
          [[ "$(git hash-object validation/docs-writing-art/src/book-studio-writing-art-link.ts)" == "6639d954077307d95417ee2930cfaf823a3f3c14" ]]
          [[ "$(git hash-object validation/docs-writing-art/src/book-studio-writing-art-release.ts)" == "6bff651fc25d0221c824be8c332c993999f937e5" ]]

      - name: Use Docs Suite Node.js runtime
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Strictly compile mirrored production modules
        run: npm exec --yes --package=typescript@5.9.3 -- tsc -p validation/docs-writing-art/tsconfig.json

      - name: Run mirrored cross-repository adversarial harness
        run: npm exec --yes --package=tsx@4.20.3 -- tsx --test validation/docs-writing-art/test.mjs

      - name: Verify disposable validation left source clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
