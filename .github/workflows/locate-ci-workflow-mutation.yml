name: Locate CI workflow mutation

on:
  push:
    branches:
      - automation/locate-ci-workflow-mutation-20260806

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 3de1fe91db5b2067de478303666a8a6bf1f51485
    steps:
      - name: Check out diagnostic carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact current main
        shell: bash
        run: |
          set -euxo pipefail
          git show-ref --verify refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach refs/remotes/origin/main
          git status --porcelain=v1 --untracked-files=all
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          node scripts/check-repository-toolchain.mjs
          node scripts/test-repository-toolchain.mjs
          pnpm install --no-frozen-lockfile
          rm -f pnpm-lock.yaml
          pnpm run build:domain
          git diff --exit-code -- .github/workflows/ci.yml

      - name: Run workspace tests one package at a time
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/ci.yml
          baseline="$(sha256sum "$workflow" | awk '{print $1}')"
          tested=0

          check_workflow() {
            local label="$1"
            local current
            current="$(sha256sum "$workflow" | awk '{print $1}')"
            if [[ "$current" != "$baseline" ]]; then
              echo "::error title=Workflow mutation detected::$label changed $workflow"
              echo "mutating_package=$label"
              git status --short
              git diff -- "$workflow"
              exit 42
            fi
            echo "workflow unchanged after: $label"
          }

          while IFS= read -r manifest; do
            directory="${manifest%/package.json}"
            if ! node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.test ? 0 : 1)' "$manifest"; then
              continue
            fi
            package_name="$(node -p 'require(process.argv[1]).name || process.argv[1]' "$manifest")"
            tested=$((tested + 1))
            echo "::group::workspace test $tested - $package_name"
            pnpm --dir "$directory" run test
            echo "::endgroup::"
            check_workflow "$package_name ($directory)"
          done < <(find packages apps -mindepth 2 -maxdepth 2 -name package.json -print | LC_ALL=C sort)

          echo "tested_packages=$tested"
          rm -f pnpm-lock.yaml
          check_workflow "all sequential workspace tests"
