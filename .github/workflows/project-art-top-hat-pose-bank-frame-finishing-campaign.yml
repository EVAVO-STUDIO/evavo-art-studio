name: Project Art Top Hat Pose Bank Frame Finishing Campaign

on:
  pull_request:
    paths:
      - "packages/artifacts/src/**"
      - "packages/media/src/**"
      - "packages/providers/src/**"
      - "packages/runtime/src/**"
      - "apps/worker/src/provider-handlers.ts"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher-preflight.mjs"
      - "scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs"
      - "scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs"
      - "scripts/project-art/top-hat-pose-slot-provider-runtime-foundation.mjs"
      - "scripts/run-project-art-top-hat-pose-bank-frame-finishing-campaign.mjs"
      - "scripts/test-project-art-avatar-frame-finisher-preflight.mjs"
      - "scripts/test-project-art-top-hat-pose-bank-frame-finishing-campaign.mjs"
      - "docs/PROJECT_ART_TOP_HAT_POSE_BANK_FRAME_FINISHING_CAMPAIGN.md"
      - ".github/workflows/project-art-top-hat-pose-bank-frame-finishing-campaign.yml"
  push:
    branches: [main]
    paths:
      - "packages/artifacts/src/**"
      - "packages/media/src/**"
      - "packages/providers/src/**"
      - "packages/runtime/src/**"
      - "apps/worker/src/provider-handlers.ts"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher.mjs"
      - "scripts/project-art/avatar-final-pass-provider-frame-finisher-preflight.mjs"
      - "scripts/project-art/top-hat-pose-bank-candidate-materialization-campaign.mjs"
      - "scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs"
      - "scripts/project-art/top-hat-pose-slot-provider-runtime-foundation.mjs"
      - "scripts/run-project-art-top-hat-pose-bank-frame-finishing-campaign.mjs"
      - "scripts/test-project-art-avatar-frame-finisher-preflight.mjs"
      - "scripts/test-project-art-top-hat-pose-bank-frame-finishing-campaign.mjs"
      - "docs/PROJECT_ART_TOP_HAT_POSE_BANK_FRAME_FINISHING_CAMPAIGN.md"
      - ".github/workflows/project-art-top-hat-pose-bank-frame-finishing-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-art-top-hat-pose-bank-frame-finishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact campaign dependency closure
        run: |
          pnpm run build:domain
          pnpm --filter @evavo/art-studio-worker build
          pnpm --filter @evavo/art-studio-worker typecheck

      - name: Run real frame-finisher shadow-preflight regressions
        run: node --test scripts/test-project-art-avatar-frame-finisher-preflight.mjs

      - name: Run six-slot frame-finishing campaign regressions
        run: node --test scripts/test-project-art-top-hat-pose-bank-frame-finishing-campaign.mjs

      - name: Import production CLI without execution
        run: node -e "import('./scripts/run-project-art-top-hat-pose-bank-frame-finishing-campaign.mjs')"

      - name: Verify finishing authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "shadowPreflightAllSlotsBeforeFirstWrite: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "exactPreflightHashReproductionRequired: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "deterministicPixelFinishing: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "creativeReview: false" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "candidateApproval: false" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "candidatePromotion: false" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "sequenceRelease: false" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "publication: false" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          grep -F "runtimeActivation: false" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          ! grep -F "processAvatarFinalPassProviderFrameReviewFiles" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          ! grep -F "admitProjectArtTopHatPoseSlotCandidate" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          ! grep -F "creativeReview: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          ! grep -F "candidateApproval: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          ! grep -F "sequenceRelease: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs
          ! grep -F "runtimeActivation: true" scripts/project-art/top-hat-pose-bank-frame-finishing-campaign.mjs

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
