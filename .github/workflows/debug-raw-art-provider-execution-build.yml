name: Apply RAW ART admission fixture correction

on:
  push:
    branches:
      - agent/raw-art-provider-execution-authority-20260809
    paths:
      - ".github/workflows/debug-raw-art-provider-execution-build.yml"

permissions:
  contents: write

concurrency:
  group: apply-raw-art-admission-fixture-correction
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact correction source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact canonical-provider-submission fixture correction
        shell: bash
        env:
          EXPECTED_PARENT: d839514c007ded4b741ad0e4696584a4e12e4e65
          TARGET_BRANCH: agent/raw-art-provider-execution-authority-20260809
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-raw-art-provider-runtime-admission.mjs')
          source = path.read_text(encoding='utf-8')
          old = """      const selected = {\n        ...selection.jobs[index],\n        batchEntry: entry,\n      };\n"""
          new = """      const selected = {\n        ...selection.jobs[index],\n        batchEntry: {\n          ...entry,\n          runtimeJob: entry.contract.runtimeJob,\n        },\n      };\n"""
          if source.count(old) != 1:
              raise SystemExit('expected one legacy direct-helper fixture')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          node --check scripts/check-raw-art-provider-runtime-admission.mjs
          git diff --check
          test "$(git diff --name-only)" = "scripts/check-raw-art-provider-runtime-admission.mjs"
          grep -F 'runtimeJob: entry.contract.runtimeJob' scripts/check-raw-art-provider-runtime-admission.mjs

          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add scripts/check-raw-art-provider-runtime-admission.mjs
          git commit -m "test(raw-art): bind admission fixture to provider submission"
          git push origin "HEAD:${TARGET_BRANCH}"
