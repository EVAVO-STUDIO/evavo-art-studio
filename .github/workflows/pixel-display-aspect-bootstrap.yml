name: Apply Pixel Typography display-aspect upgrade

on:
  push:
    branches:
      - "work/pixel-typography-display-aspect-v1"
    paths:
      - ".github/workflows/pixel-display-aspect-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: pixel-display-aspect-bootstrap
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1577836800"
  UPGRADE_SHA256: "df7678ac6dcbf1b7452a63ade7e583c18f3f91f4fa495d57843a8006e7920ce3"

jobs:
  apply-validate-publish-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: "pip"
          cache-dependency-path: requirements/pixel-font-universal.txt

      - name: Reassemble and verify reviewed upgrade
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pixel-display-upgrade.zip"
          cat .pixel-display-bootstrap/part-*.txt | base64 --decode > "$archive"
          printf '%s  %s\n' "$UPGRADE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pixel-display-upgrade"
          unzip -q "$archive" -d "$RUNNER_TEMP/pixel-display-upgrade"
          python -m py_compile \
            "$RUNNER_TEMP/pixel-display-upgrade/apply.py" \
            "$RUNNER_TEMP/pixel-display-upgrade/display.py"

      - name: Apply exact fail-closed source patch
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/pixel-display-upgrade/apply.py" "$GITHUB_WORKSPACE"

      - name: Install exact optional TTF backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-universal.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Validate syntax and complete typography stack
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pixel-typography.mjs
          node --check scripts/check-pixel-typography-cli.mjs
          node --check scripts/pixel-typography-review-mcp.mjs
          node --check scripts/check-pixel-typography-review-mcp.mjs
          python -m py_compile \
            tools/pixel_typography_review.py \
            tools/pixel_typography_review_engine.py \
            tools/pixel_typography_review_lib/*.py \
            tools/check_pixel_typography_review.py
          node scripts/check-pixel-typography-cli.mjs
          node scripts/pixel-typography.mjs check

      - name: Validate retained display-aspect evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("pixel-typography-review-check-report.json")
          report = json.loads(report_path.read_text("utf-8"))
          assert report["schema"] == "evavo.pixel-typography-review-check.v1"
          assert report["engineVersion"] == "1.1.0"
          assert report["status"] == "passed"
          assert report["displayCorrectedPageCount"] == 2
          assert report["pixelWidthToHeightRatio"] == {"numerator": 5, "denominator": 6}
          report_path.unlink()

          universal_path = Path("universal-pixel-font-check-report.json")
          if universal_path.exists():
              universal = json.loads(universal_path.read_text("utf-8"))
              assert universal["status"] == "passed"
              universal_path.unlink()
          PY

      - name: Remove transport and verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pixel-display-bootstrap
          git restore --source="$GITHUB_SHA" -- .github/workflows/pixel-font-repository-delivery-contract.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          git add --all
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-scope.txt"
          cat > "$RUNNER_TEMP/expected-scope.txt" <<'EOF'
          .pixel-display-bootstrap/part-000.txt
          .pixel-display-bootstrap/part-001.txt
          .pixel-display-bootstrap/part-002.txt
          config/pixel-typography-review.v1.json
          docs/PIXEL_TYPOGRAPHY_AUTOMATION.md
          docs/PIXEL_TYPOGRAPHY_REVIEW.md
          examples/pixel-typography-review/vga-dos-320x200.review.json
          scripts/check-pixel-typography-cli.mjs
          scripts/check-pixel-typography-review-mcp.mjs
          scripts/pixel-typography-review-mcp.mjs
          scripts/pixel-typography.mjs
          tools/check_pixel_typography_review.py
          tools/pixel_typography_review_lib/build.py
          tools/pixel_typography_review_lib/common.py
          tools/pixel_typography_review_lib/display.py
          tools/pixel_typography_review_lib/validate.py
          tools/pixel_typography_review_lib/validate_pages.py
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-scope.txt" "$RUNNER_TEMP/expected-scope.txt"
          diff -u "$RUNNER_TEMP/expected-scope.txt" "$RUNNER_TEMP/actual-scope.txt"

      - name: Commit and normally push reviewed source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git diff --cached --check
          git commit -m "feat(pixel-typography): add display-aspect review evidence" -m "Preserve exact native pages while adding deterministic aspect-corrected display previews, reduced native/display/pixel ratio evidence, exact integer-scale enlargements, independent reconstruction, guarded MCP discovery and updated examples. Creative approval, repository mutation, Git publication and force push remain outside the review engine."
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf '{"status":"published","branch":"%s","commit":"%s","tree":"%s","parent":"%s"}\n' \
            "$GITHUB_REF_NAME" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" \
            "$(git rev-parse 'HEAD^')" \
            | tee "$RUNNER_TEMP/pixel-display-aspect-publication.json"

      - name: Retain branch publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixel-display-aspect-publication-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/pixel-display-aspect-publication.json
