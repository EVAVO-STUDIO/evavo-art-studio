name: CI media tool bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "scripts/test-ci-media-tool-bootstrap.mjs"
      - "scripts/test-ci-media-tool-workflows.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/bootstrap-ci-media-tools.sh"
      - "scripts/test-ci-media-tool-bootstrap.mjs"
      - "scripts/test-ci-media-tool-workflows.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ci-media-tool-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route Python bytecode to runner-temporary storage
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_ROOT="${RUNNER_TEMP}/media-bootstrap-python-pycache"
          mkdir -p "${PYTHON_CACHE_ROOT}"
          echo "PYTHONPYCACHEPREFIX=${PYTHON_CACHE_ROOT}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            requirements-image-pipeline.txt
            requirements/pixel-font-studio-v2.txt

      - name: Install exact Python validation backends
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-image-pipeline.txt
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import PIL
          import fontTools
          assert PIL.__version__ == "12.2.0", PIL.__version__
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Run bounded media bootstrap and workflow regressions
        run: node --test scripts/test-ci-media-tool-*.mjs

      - name: Bootstrap real media tools with bounded fallback
        run: bash scripts/bootstrap-ci-media-tools.sh

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify permanent bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-ci-media-tools.sh
          grep -F 'CI_MEDIA_APT_UPDATE_TIMEOUT_SECONDS:-120' scripts/bootstrap-ci-media-tools.sh
          grep -F 'CI_MEDIA_APT_INSTALL_TIMEOUT_SECONDS:-180' scripts/bootstrap-ci-media-tools.sh
          grep -F -- '--kill-after=15s' scripts/bootstrap-ci-media-tools.sh
          grep -F 'Acquire::Retries=3' scripts/bootstrap-ci-media-tools.sh
          grep -F 'bash scripts/bootstrap-ci-media-tools.sh' .github/workflows/ci.yml
          grep -F 'bash scripts/bootstrap-ci-media-tools.sh' .github/workflows/book-art-provider-runtime.yml
          grep -F 'critical workflows permanently use the bounded bootstrap contract' scripts/test-ci-media-tool-bootstrap.mjs
          grep -F 'workflows never perform unbounded apt or direct FFmpeg installation' scripts/test-ci-media-tool-workflows.mjs
          grep -F 'media bootstrap fails after the configured bounded attempts' scripts/test-ci-media-tool-bootstrap.mjs
          node --test scripts/test-ci-media-tool-*.mjs

      - name: Run complete Art Studio validation
        run: pnpm check

      - name: Prove exact source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PYTHONPYCACHEPREFIX:-}"
          test -d "${PYTHONPYCACHEPREFIX}"
          test -z "$(find . -path './.git' -prune -o -type d -name '__pycache__' -print -quit)"
          test -z "$(find . -path './.git' -prune -o -type f -name '*.pyc' -print -quit)"
          git diff --exit-code
          SOURCE_STATUS="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "${SOURCE_STATUS}" ]]; then
            printf '%s\n' "${SOURCE_STATUS}" >&2
            exit 1
          fi
