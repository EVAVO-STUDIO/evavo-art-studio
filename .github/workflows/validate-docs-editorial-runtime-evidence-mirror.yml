name: Validate Docs Editorial Runtime Evidence Mirror

on:
  push:
    branches:
      - validation/docs-editorial-runtime-evidence-mirror-20260807
    paths:
      - ".github/workflows/validate-docs-editorial-runtime-evidence-mirror.yml"
      - "validation/docs-editorial-consensus/**"
      - "validation/docs-editorial-runtime-evidence/**"
      - "validation/docs-narrative-craft/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-editorial-runtime-evidence-mirror-${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact validation mirror
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use current LTS Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Run exact source-equivalent editorial mirror
        shell: bash
        run: bash validation/docs-editorial-runtime-evidence/run-focused-validation.sh

      - name: Prove validation-only isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          merge_base="$(git merge-base HEAD origin/main)"
          unexpected="$(git diff --name-only "$merge_base" HEAD | grep -Ev '^(.github/workflows/validate-docs-editorial-runtime-evidence-mirror.yml|validation/docs-editorial-consensus/|validation/docs-editorial-runtime-evidence/|validation/docs-narrative-craft/)' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            exit 1
          }
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Record authority boundary
        if: success()
        run: |
          printf '%s\n' \
            'validation=byte-exact-source-equivalent-editorial-runtime-evidence-mirror' \
            'docs-source=4ec7490ba8d2916ea8d6454b3baece8a25b4198d' \
            'provider-authentication-claimed=false' \
            'provider-call-performed=false' \
            'canonical-manuscript-mutation-performed=false' \
            'automatic-canonical-admission-allowed=false' \
            'art-studio-production-source-changed=false' \
            'publication-performed=false'
