# Permanent trigger only. Mirror source remains confined to validation PRs.
name: Validate Docs Editorial Runtime Evidence Mirror

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "validation/docs-editorial-consensus/**"
      - "validation/docs-editorial-runtime-evidence/**"
      - "validation/docs-narrative-craft/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-docs-editorial-runtime-evidence-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-mirror:
    if: startsWith(github.head_ref, 'validation/docs-editorial-runtime-evidence-mirror-')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use current LTS Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Run the exact source-equivalent mirror
        shell: bash
        run: bash validation/docs-editorial-runtime-evidence/run-focused-validation.sh
