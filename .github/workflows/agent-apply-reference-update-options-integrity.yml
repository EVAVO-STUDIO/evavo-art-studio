name: Apply reference update option hardening

on:
  push:
    branches:
      - agent/reference-update-options-integrity-20260808
    paths:
      - ".agent/apply-reference-update-options-integrity.py"
      - ".github/workflows/agent-apply-reference-update-options-integrity.yml"

permissions:
  contents: write

concurrency:
  group: agent-apply-reference-update-options-integrity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/reference-update-options-integrity-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Set up pnpm 10.13.1
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Limit deterministic patch to source authority
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path(".agent/apply-reference-update-options-integrity.py")
          text = path.read_text(encoding="utf-8")
          marker = '\nworkflow = WORKFLOW_PATH.read_text(encoding="utf-8")\n'
          if text.count(marker) != 1:
              raise RuntimeError(
                  f"expected one workflow patch boundary, found {text.count(marker)}"
              )
          source_only = text.split(marker, 1)[0].rstrip() + "\n"
          path.write_text(source_only, encoding="utf-8")
          PY

      - name: Apply exact source and regression changes
        run: python .agent/apply-reference-update-options-integrity.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and type-check artifact package
        run: |
          pnpm --filter @evavo/art-artifacts build
          pnpm --filter @evavo/art-artifacts typecheck

      - name: Run focused artifact integrity regressions
        run: >-
          node --test
          packages/artifacts/test/artifacts.test.mjs
          packages/artifacts/test/json-canonicalization-security.test.mjs
          packages/artifacts/test/descriptor-integrity-security.test.mjs
          packages/artifacts/test/descriptor-input-integrity-security.test.mjs
          packages/artifacts/test/reference-integrity-security.test.mjs
          packages/artifacts/test/reference-update-input-integrity-security.test.mjs

      - name: Commit validated source to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO-STUDIO"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error title=No staged hardening changes::The deterministic patch produced no source changes."
            exit 1
          fi
          git commit -m "fix(artifacts): snapshot reference update options"
          git push origin HEAD:agent/reference-update-options-integrity-20260808
