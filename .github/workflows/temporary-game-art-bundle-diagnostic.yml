name: Temporary game art bundle diagnostic

on:
  push:
    branches:
      - agent/project-art-review-studio-20260809
    paths:
      - ".github/workflows/temporary-game-art-bundle-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Report exact retained payload bytes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '--- attributes ---'
          git check-attr --all -- config/game-art-campaign.four-games.v1.payload.b64.part-*
          printf '%s\n' '--- worktree eol ---'
          git ls-files --eol -- config/game-art-campaign.four-games.v1.payload.b64.part-*
          printf '%s\n' '--- worktree sizes and hashes ---'
          for file in config/game-art-campaign.four-games.v1.payload.b64.part-*; do
            printf '%s bytes=' "$file"
            wc -c < "$file"
            sha256sum "$file"
            printf 'last-bytes='
            tail -c 8 "$file" | od -An -tx1
          done
          printf '%s\n' '--- repository blob sizes and hashes ---'
          for file in config/game-art-campaign.four-games.v1.payload.b64.part-*; do
            printf '%s blob-bytes=' "$file"
            git cat-file -s "HEAD:$file"
            git show "HEAD:$file" | sha256sum
          done
          printf '%s\n' '--- wrapper ---'
          cat config/game-art-campaign.four-games.v1.json
