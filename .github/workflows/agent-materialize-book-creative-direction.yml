name: Agent Materialize Book Creative Direction

on:
  push:
    branches:
      - agent/book-creative-direction-intelligence-20260807
    paths:
      - ".github/workflows/agent-materialize-book-creative-direction.yml"
      - ".github/agent-book-creative-direction.payload.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-materialize-book-creative-direction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/book-creative-direction-intelligence-20260807
          fetch-depth: 1
          persist-credentials: true

      - name: Use repository pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Use repository Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Reconstruct checksum-verified source release
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-book-creative-direction.payload.00 \
              .github/agent-book-creative-direction.payload.01 \
              .github/agent-book-creative-direction.payload.02 \
              > /tmp/book-creative-direction.tar.gz.b64
          base64 --decode /tmp/book-creative-direction.tar.gz.b64 \
              > /tmp/book-creative-direction.tar.gz
          test "$(sha256sum /tmp/book-creative-direction.tar.gz | awk '{print $1}')" \
              = "d518cbd8f75301deaeed484d5b2af0d748bb9a406000c05b3e80f0627896212b"
          rm -rf /tmp/book-creative-direction-release
          mkdir -p /tmp/book-creative-direction-release
          tar -xzf /tmp/book-creative-direction.tar.gz \
              -C /tmp/book-creative-direction-release
          cp /tmp/book-creative-direction-release/packages/contracts/src/book-art-creative-direction.ts \
             packages/contracts/src/book-art-creative-direction.ts
          cp /tmp/book-creative-direction-release/packages/contracts/src/index.ts \
             packages/contracts/src/index.ts
          cp /tmp/book-creative-direction-release/packages/contracts/test/book-art-creative-direction.test.mjs \
             packages/contracts/test/book-art-creative-direction.test.mjs
          cp /tmp/book-creative-direction-release/scripts/check-book-art-creative-direction.mjs \
             scripts/check-book-art-creative-direction.mjs
          cp /tmp/book-creative-direction-release/docs/book-art-creative-direction.md \
             docs/book-art-creative-direction.md
          test "$(sha256sum packages/contracts/src/book-art-creative-direction.ts | awk '{print $1}')" \
              = "6f20f96ad9197099d93489718301fd8fa00ccb2957ce156ca077091b94ff5251"
          test "$(sha256sum packages/contracts/test/book-art-creative-direction.test.mjs | awk '{print $1}')" \
              = "a9e4fb1939493447bbb23080471ff50def1bc3822d1097ce022272a10f7ad69f"
          test "$(sha256sum packages/contracts/src/index.ts | awk '{print $1}')" \
              = "56a661255ba7515d17c721eb55d725120a421628ebc448b1ca049b5b3c524d1"
          test "$(sha256sum scripts/check-book-art-creative-direction.mjs | awk '{print $1}')" \
              = "4c31396e7812ad1c52e92d88f7835beb6c78649e0e04fc05d8581f1f65d221a"
          test "$(sha256sum docs/book-art-creative-direction.md | awk '{print $1}')" \
              = "8d2912b2bd68b06821a83c58135b95ad4d1afbc82fd5993099592cf694abf32c"

      - name: Install exact workspace
        run: pnpm install --frozen-lockfile

      - name: Run permanent boundary checker
        run: node scripts/check-book-art-creative-direction.mjs

      - name: Build and test Art contracts
        run: pnpm --filter @evavo/art-contracts test

      - name: Run strict contracts typecheck
        run: pnpm --filter @evavo/art-contracts typecheck

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/contracts/src/book-art-creative-direction.ts \
            packages/contracts/src/index.ts \
            packages/contracts/test/book-art-creative-direction.test.mjs \
            scripts/check-book-art-creative-direction.mjs \
            docs/book-art-creative-direction.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(book-art): compile evidence-bound creative direction"
          git push origin HEAD:refs/heads/agent/book-creative-direction-intelligence-20260807
