name: Agent Monitor Rebased Legacy Book Art Registration

on:
  pull_request:
    branches:
      - agent/book-art-legacy-byte-registration-rebased-20260803
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-monitor-rebased-legacy-book-art-registration
  cancel-in-progress: true

jobs:
  monitor:
    if: >-
      github.repository == 'EVAVO-STUDIO/evavo-art-studio' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/book-art-legacy-byte-registration-rebased-20260803
      WORKFLOW_FILE: agent-apply-book-art-legacy-byte-registration.yml
      EXPECTED_BOOTSTRAP_SHA: 367a6233484418c6511903108a39fb15a7f4e5a3
    steps:
      - name: Check out exact observed bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_BOOTSTRAP_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact observer input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_BOOTSTRAP_SHA}" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          git show "${EXPECTED_BOOTSTRAP_SHA}:.github/workflows/${WORKFLOW_FILE}" \
            | grep -F 'PAYLOAD_SHA256: 03fc1fc796035582fb8f734dde0490c33e668a33a6d0ae4b7307040044da94b7'

      - name: Wait for exact bootstrap run and report result
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 60); do
            run_id="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${TARGET_BRANCH}&event=push&per_page=30" \
                --jq ".workflow_runs[] | select(.head_sha == \"${EXPECTED_BOOTSTRAP_SHA}\") | .id" \
                | head -n 1
            )"
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          [[ -n "${run_id}" ]] || { echo 'Exact bootstrap workflow run was not found.' >&2; exit 1; }
          echo "bootstrap_run_id=${run_id}"

          for _ in $(seq 1 720); do
            status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            [[ "${status}" == 'completed' ]] && break
            sleep 5
          done
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{status,conclusion,head_sha,event,run_attempt,created_at,updated_at}'
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion,steps:[.steps[] | {number,name,status,conclusion}]}'
          conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
          if [[ "${conclusion}" != 'success' ]]; then
            echo '--- bounded failed-log tail ---'
            gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 \
              | tail -n 260
            exit 1
          fi

      - name: Prove production source replaced bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}
          published="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
          [[ "${published}" != "${EXPECTED_BOOTSTRAP_SHA}" ]]
          git show "${published}:packages/book-art-runtime/src/legacy-registration.ts" \
            | grep -F 'export async function registerLegacyBookArtBytes'
          git show "${published}:scripts/check-book-art-legacy-registration.mjs" \
            | grep -F 'legacy byte registration'
          ! git cat-file -e "${published}:.github/agent-payloads/apply-script.gz.b64"
          git cat-file -e "${published}:.github/workflows/${WORKFLOW_FILE}"
          git diff --exit-code "e6c2613b1598a53b13e7fd91ebe622607fb2c09e" "${published}" -- .github/workflows/book-art-provider-runtime.yml
          echo "published non-workflow candidate: ${published}"
