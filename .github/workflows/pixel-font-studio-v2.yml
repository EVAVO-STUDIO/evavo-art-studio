name: Pixel Font Studio v2

on:
  pull_request:
    paths:
      - "tools/pixel_font_studio_v2.py"
      - "tools/pixel_font_v2/**"
      - "scripts/pixel-font-studio-v2-mcp.mjs"
      - "scripts/check-pixel-font-studio-v2.mjs"
      - "scripts/integrate-pixel-font-studio-v2.mjs"
      - "config/pixel-font-studio.v2.json"
      - "config/mcp.pixel-font-studio-v2.example.json"
      - "config/pixel-font-families/chess-lord-v2/**"
      - "docs/PIXEL_FONT_STUDIO_V2.md"
      - "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md"
      - "requirements/pixel-font-studio-v2.txt"
      - "package.json"
      - "evavo.reliability.json"
      - ".github/workflows/pixel-font-studio-v2.yml"
  push:
    branches:
      - main
    paths:
      - "tools/pixel_font_studio_v2.py"
      - "tools/pixel_font_v2/**"
      - "scripts/pixel-font-studio-v2-mcp.mjs"
      - "scripts/check-pixel-font-studio-v2.mjs"
      - "scripts/integrate-pixel-font-studio-v2.mjs"
      - "config/pixel-font-studio.v2.json"
      - "config/mcp.pixel-font-studio-v2.example.json"
      - "config/pixel-font-families/chess-lord-v2/**"
      - "docs/PIXEL_FONT_STUDIO_V2.md"
      - "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md"
      - "requirements/pixel-font-studio-v2.txt"
      - "package.json"
      - "evavo.reliability.json"
      - ".github/workflows/pixel-font-studio-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-font-studio-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1577836800"
  GODOT_VERSION: "4.6.2"
  GODOT_ARCHIVE_SHA256: "30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact optional TTF dependency for v2.2
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Verify native virtual-display runtime
        shell: bash
        run: |
          set -euo pipefail
          XVFB_RUN="$(command -v xvfb-run)"
          XAUTH="$(command -v xauth)"
          test -x "${XVFB_RUN}"
          test -x "${XAUTH}"
          echo "EVAVO_PIXEL_FONT_XVFB_RUN=${XVFB_RUN}" >> "${GITHUB_ENV}"
          xvfb-run -a -s "-screen 0 640x480x24 -nolisten tcp" sh -c 'test -n "${DISPLAY:-}"'

      - name: Download and verify official Godot 4.6.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "${GODOT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Run complete reusable font pipeline and Godot verification
        env:
          EVAVO_PIXEL_FONT_GODOT: ${{ runner.temp }}/godot/Godot_v4.6.2-stable_linux.x86_64
          EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-studio-v2-check
        run: node scripts/check-pixel-font-studio-v2.mjs

      - name: Upload exact Chess Lord family and verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chess-lord-pixel-font-v2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/pixel-font-studio-v2-check/**

      - name: Prove source tree remains clean
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CACHE_RESIDUE="$(
            find tools \
              \( -type d -name '__pycache__' -o -type f -name '*.pyc' \) \
              -print -quit
          )"
          if [[ -n "${PYTHON_CACHE_RESIDUE}" ]]; then
            echo "Python cache residue found in source: ${PYTHON_CACHE_RESIDUE}" >&2
            exit 1
          fi
          git diff --exit-code
          SOURCE_STATUS="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "${SOURCE_STATUS}" ]]; then
            printf '%s\n' "${SOURCE_STATUS}" >&2
            exit 1
          fi
