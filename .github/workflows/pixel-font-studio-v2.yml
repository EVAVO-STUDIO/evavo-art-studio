name: Pixel Font Studio v2

on:
  pull_request:
    paths:
      - "tools/pixel_font_studio_v2.py"
      - "scripts/pixel-font-studio-v2-mcp.mjs"
      - "scripts/check-pixel-font-studio-v2.mjs"
      - "config/pixel-font-studio.v2.json"
      - "config/mcp.pixel-font-studio-v2.example.json"
      - "config/pixel-font-families/chess-lord-v2/**"
      - "docs/PIXEL_FONT_STUDIO_V2.md"
      - "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md"
      - "requirements/pixel-font-studio-v2.txt"
      - "package.json"
      - "evavo.reliability.json"
      - ".github/workflows/pixel-font-studio-v2.yml"
  push:
    branches:
      - main
    paths:
      - "tools/pixel_font_studio_v2.py"
      - "scripts/pixel-font-studio-v2-mcp.mjs"
      - "scripts/check-pixel-font-studio-v2.mjs"
      - "config/pixel-font-studio.v2.json"
      - "config/mcp.pixel-font-studio-v2.example.json"
      - "config/pixel-font-families/chess-lord-v2/**"
      - "docs/PIXEL_FONT_STUDIO_V2.md"
      - "docs/CHESS_LORD_PIXEL_FONT_FAMILY_V2.md"
      - "requirements/pixel-font-studio-v2.txt"
      - "package.json"
      - "evavo.reliability.json"
      - ".github/workflows/pixel-font-studio-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-font-studio-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1577836800"
  GODOT_VERSION: "4.6.2"
  GODOT_ARCHIVE_SHA256: "30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install exact optional TTF dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/pixel-font-studio-v2.txt
          python - <<'PY'
          import fontTools
          assert fontTools.__version__ == "4.63.0", fontTools.__version__
          PY

      - name: Download and verify official Godot 4.6.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          echo "${GODOT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Install Xvfb and create exact Godot render wrapper
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          wrapper="$RUNNER_TEMP/godot/godot-xvfb-wrapper"
          cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          real="${GODOT_REAL_EXECUTABLE:?}"
          for argument in "$@"; do
            if [[ "$argument" == "--version" || "$argument" == "--editor" ]]; then
              exec "$real" "$@"
            fi
          done
          filtered=()
          for argument in "$@"; do
            [[ "$argument" == "--headless" ]] && continue
            filtered+=("$argument")
          done
          exec xvfb-run -a -s "-screen 0 1280x1024x24" "$real" "${filtered[@]}" --audio-driver Dummy
          SH
          chmod +x "$wrapper"

      - name: Run complete reusable font pipeline and Godot verification
        env:
          GODOT_REAL_EXECUTABLE: ${{ runner.temp }}/godot/Godot_v4.6.2-stable_linux.x86_64
          EVAVO_PIXEL_FONT_GODOT: ${{ runner.temp }}/godot/godot-xvfb-wrapper
          EVAVO_PIXEL_FONT_CHECK_OUTPUT: ${{ runner.temp }}/pixel-font-studio-v2-check
        run: node scripts/check-pixel-font-studio-v2.mjs

      - name: Upload exact Chess Lord family and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chess-lord-pixel-font-v2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/pixel-font-studio-v2-check/**

      - name: Prove source tree remains clean
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
